version: "2"
sql:
  - engine: "sqlite"
    queries: "db/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "db"
        out: "generated/db"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          # Millisecond-floored, canonical-layout DATETIME types (#303). These
          # type-keyed entries retype every DATETIME param and result column;
          # the column-keyed enum overrides below take precedence where they
          # apply. The db_type matches the raw schema decltype text verbatim,
          # so the spelling is the uppercase "DATETIME" used in the migrations.
          - db_type: "DATETIME"
            go_type:
              import: "github.com/leapmux/leapmux/internal/util/sqltime"
              type: "SQLiteTime"
          - db_type: "DATETIME"
            nullable: true
            go_type:
              import: "github.com/leapmux/leapmux/internal/util/sqltime"
              type: "SQLiteNullTime"
          # Workspace section enums
          - column: "workspace_sections.section_type"
            go_type:
              import: "github.com/leapmux/leapmux/generated/proto/leapmux/v1"
              type: "SectionType"
          - column: "workspace_sections.sidebar"
            go_type:
              import: "github.com/leapmux/leapmux/generated/proto/leapmux/v1"
              type: "Sidebar"
          # Workspace tab enum
          # sqlc SILENTLY ignores an override whose table does not exist, so this
          # entry must specify the column the schema actually declares. One entry
          # here specified `workspace_tabs`, a table the store removed, and it did
          # nothing at all: the real columns stayed int64, and workspace_tab_index.go
          # went on hand-casting them in both directions.
          - column: "workspace_tab_owned.tab_type"
            go_type:
              import: "github.com/leapmux/leapmux/generated/proto/leapmux/v1"
              type: "TabType"
          # The enum columns that store a proto ordinal. Retyping them here
          # deletes the int64() cast every call site wrote in both directions,
          # and it makes a mixed-up pair a COMPILE error rather than a wrong
          # ordinal a CHECK still admits.
          - column: "revocation_events.kind"
            go_type:
              import: "github.com/leapmux/leapmux/generated/proto/leapmux/v1"
              type: "RevocationEventKind"
          - column: "oauth_clients.registration_source"
            go_type:
              import: "github.com/leapmux/leapmux/generated/proto/leapmux/v1"
              type: "AppRegistrationSource"
          - column: "oauth_providers.provider_type"
            go_type:
              import: "github.com/leapmux/leapmux/generated/proto/leapmux/v1"
              type: "IdentityProviderType"
          - column: "oauth_providers.response_mode"
            go_type:
              import: "github.com/leapmux/leapmux/generated/proto/leapmux/v1"
              type: "OAuthResponseMode"
          - column: "lifecycle_outbox.op_type"
            go_type:
              import: "github.com/leapmux/leapmux/generated/proto/leapmux/v1"
              type: "WorkspaceLifecycleOp"
          - column: "api_tokens.issuance"
            go_type:
              import: "github.com/leapmux/leapmux/generated/proto/leapmux/v1"
              type: "ApiTokenIssuance"
          - column: "oauth_authorization_codes.step_up_kind"
            go_type:
              import: "github.com/leapmux/leapmux/generated/proto/leapmux/v1"
              type: "CredentialRefKind"
              pointer: true
          - column: "oauth_authorization_codes.redemption_kind"
            go_type:
              import: "github.com/leapmux/leapmux/generated/proto/leapmux/v1"
              type: "RedemptionKind"
              pointer: true
          # Encrypted-at-rest columns (39 columns across 17 tables).
          # Retyping them to opaque keystore.Ciphertext / NullCiphertext makes
          # forgetting to seal on write or open on read a compile error.
          # Kept in sync with sqlutil.PersistentEncryptedTables and
          # sqlutil.TransientEncryptedTables by TestEncryptedRegistryMatchesSqlcOverrides.
          - column: "layout_event_heads.cursor_key"
            go_type:
              import: "github.com/leapmux/leapmux/internal/hub/keystore"
              type: "Ciphertext"
          - column: "layout_event_entries.fact"
            go_type:
              import: "github.com/leapmux/leapmux/internal/hub/keystore"
              type: "Ciphertext"
          - column: "users.password_hash"
            go_type:
              import: "github.com/leapmux/leapmux/internal/hub/keystore"
              type: "Ciphertext"
          - column: "users.prefs"
            go_type:
              import: "github.com/leapmux/leapmux/internal/hub/keystore"
              type: "NullCiphertext"
          - column: "users.prefs"
            nullable: true
            go_type:
              import: "github.com/leapmux/leapmux/internal/hub/keystore"
              type: "NullCiphertext"
          - column: "users.pending_email_token"
            go_type:
              import: "github.com/leapmux/leapmux/internal/hub/keystore"
              type: "NullCiphertext"
          - column: "users.pending_email_token"
            nullable: true
            go_type:
              import: "github.com/leapmux/leapmux/internal/hub/keystore"
              type: "NullCiphertext"
          - column: "user_sessions.user_agent"
            go_type:
              import: "github.com/leapmux/leapmux/internal/hub/keystore"
              type: "Ciphertext"
          - column: "user_sessions.ip_address"
