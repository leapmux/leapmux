              type: "Ciphertext"
          - column: "oauth_clients.client_name"
            go_type:
              import: "github.com/leapmux/leapmux/internal/hub/keystore"
              type: "Ciphertext"
          - column: "oauth_clients.icon_blob"
            go_type:
              import: "github.com/leapmux/leapmux/internal/hub/keystore"
