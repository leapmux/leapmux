name: Docker

on:
  push:
    branches: [main]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    uses: ./.github/workflows/publish-container.yaml
    # Hold the package until all per-architecture uploads, tags, and cleanup finish.
    concurrency:
      group: publish-container
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
      actions: write
