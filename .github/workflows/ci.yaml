name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # RUNNER IMAGES: UBUNTU_RUNNER, MACOS_RUNNER and WINDOWS_RUNNER in
    # versions.env own every runs-on label in the workflows. GitHub evaluates
    # runs-on before any step can populate $GITHUB_ENV, so `task sync-versions`
    # writes each label, and `task lint` rejects a label that differs. Edit
    # versions.env, not a label.
    #
    # Distinct from UBUNTU_IMAGE in versions.env, which is the Docker base
    # image that the container is built FROM, not the runner it is built ON.
    # The two track the same release today but are not the same knob.
    runs-on: ubuntu-24.04${{ matrix.runner_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner_suffix: ''
          - arch: arm64
            runner_suffix: '-arm'
    permissions:
      contents: read
      actions: write
      # The resource monitor publishes its samples to a check run.
      checks: write
    concurrency:
      group: compiled-go-native-linux-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Hugo reads Git history in the canonical site check.
          fetch-depth: ${{ matrix.arch == 'amd64' && '0' || '1' }}

      - name: Setup build toolchain
        id: setup
        uses: ./.github/actions/setup-build
        with:
          rust-components: clippy,rustfmt
          # Only push-to-main saves the compiled caches; see the input's docs.
          save-build-caches: ${{ github.ref == 'refs/heads/main' }}
          monitor-resources: ${{ vars.CI_RESOURCE_MONITOR == 'true' }}

      - name: Generate code (proto + sqlc)
        run: task generate

      - name: Validate the locked site tools
        if: matrix.arch == 'amd64'
        run: task validate-site-tools

      - name: Install the pinned Renovate packages
        if: matrix.arch == 'amd64'
        run: task install-renovate-packages

      - name: Setup Node.js for Renovate
        if: matrix.arch == 'amd64'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The pinned Renovate release supports Node 24, while the app toolchain is testing Node 26.
          node-version: 24

      - name: Select Renovate Node.js
        if: matrix.arch == 'amd64'
        run: |
          renovate_node="$(command -v node)"
          echo "RENOVATE_NODE=$renovate_node" >> "$GITHUB_ENV"

      # Restore the compiled RE2 engine only after the package install: bun install replaces
      # a package directory that it installs anew, with the restored output in it. The archive
      # also holds the Task checksum and the task-state record of build-renovate-re2 (the record
      # file name is the SHA-256 of the task name). So the task accepts the engine only when its
      # sources, toolchain, and recipe match, and rebuilds it otherwise.
      - name: Compute the Renovate RE2 snapshot key
        id: re2-key
        if: matrix.arch == 'amd64'
        env:
          CACHE_HASH: ${{ hashFiles('.github/renovate/bun.lock') }}-${{ hashFiles('Taskfile.yaml', 'scripts/task-state.mjs') }}
        run: |
          key="$(node scripts/cache-snapshot.mjs key --kind renovate-re2 --hash "$CACHE_HASH" --week "$CACHE_WEEK")"
          restore_keys="$(node scripts/cache-snapshot.mjs restore-keys --kind renovate-re2 --hash "$CACHE_HASH")"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "restore-keys=$restore_keys" >> "$GITHUB_OUTPUT"

      - name: Restore the compiled Renovate RE2 engine
        # The archive holds the outputs of the task, its Task checksum, and
        # its task-state record, so the task accepts the engine only when
        # its sources, toolchain, and recipe match, and rebuilds otherwise.
        # A writer on main publishes through the explicit save below, after
        # the extraction validated the engine; it passes no fallback.
        id: re2-restore
        if: matrix.arch == 'amd64'
        uses: ./.github/actions/build-output-cache
        with:
          kind: renovate-re2
          key: ${{ steps.re2-key.outputs.key }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && steps.re2-key.outputs.restore-keys || '' }}
          writer: ${{ github.ref == 'refs/heads/main' }}

      - name: Validate Renovate dependency extraction
        if: matrix.arch == 'amd64'
        run: task renovate-extract

      - name: Save the compiled Renovate RE2 engine
        if: github.ref == 'refs/heads/main' && matrix.arch == 'amd64' && steps.re2-restore.outputs.save-required == 'true'
        uses: ./.github/actions/save-cache-snapshot
        with:
          kind: renovate-re2
          key: ${{ steps.re2-key.outputs.key }}

      - name: Restore project Node.js
        if: matrix.arch == 'amd64'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: task prepare-frontend

      - name: Build
        id: build
        run: task build

      - name: Check the unchanged native build
        run: task check-build-cache

      - name: Verify native CLI service lifecycle
        run: node scripts/native-cli-ci.mjs

      - name: Save the Tauri tool snapshot
        # The packaging build completed; the trimmed tool cache is ready to
        # publish. Linux and Windows publish; macOS has no Tauri cache.
        if: runner.os != 'macOS' && steps.setup.outputs.tauri-save-required == 'true'
        uses: ./.github/actions/save-cache-snapshot
        with:
          kind: tauri-tools
          key: ${{ steps.setup.outputs.tauri-cache-key }}

      - name: Save the spinner source snapshot
        # The packaging build ran `task generate-spinners`, so the consumed
        # spinners/ subtree is complete.
        if: steps.setup.outputs.spinner-save-required == 'true'
        uses: ./.github/actions/save-cache-snapshot
        with:
          kind: spinners
          key: ${{ steps.setup.outputs.spinner-cache-key }}

      - name: Diagnose linuxdeploy (on failure)
        # Tauri discards linuxdeploy output on failure and reports only "failed to run linuxdeploy".
        # Run the wrapper and extracted AppRun directly to retain their diagnostics.
        # Run these diagnostics only after a native build failure. Cache-check failures have their own complete logs.
        if: failure() && steps.build.outcome == 'failure'
        run: bash scripts/diagnose-linuxdeploy.sh

      - name: Lint (full)
        if: matrix.arch == 'amd64'
        run: task lint

      - name: Build and validate the documentation site
        if: matrix.arch == 'amd64'
        run: task site

      - name: Test (full)
        if: matrix.arch == 'amd64'
        # `task test` tests every module. amd64 is the canonical
        # runner, so it runs the full suite, which includes the Docker-backed
        # storage backends (postgres/mysql/cockroachdb/tidb/yugabytedb).
        run: task test

      - name: Test native modules and cross-platform Go analysis
        if: matrix.arch == 'arm64'
        # Keep architecture-dependent tests and Go lint/vet on arm64.
        # Linux amd64 owns application frontend tests and portable validation,
        # including Docker-backed storage tests.
        run: task test-native-linux

      - name: Save the Go build outputs snapshot
        # The job completed all required validation, so the trimmed build
        # outputs may publish. The saves precede the pruner, which verifies
        # the stored replacement before it deletes older archives. A
        # capacity skip publishes nothing and keeps the job successful.
        id: go-cache-save
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.go-save-required == 'true'
        uses: ./.github/actions/save-cache-snapshot
        with:
          kind: native-go
          key: ${{ steps.setup.outputs.cache-key }}

      - name: Save the Rust build outputs snapshot
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.rust-save-required == 'true'
        uses: ./.github/actions/save-cache-snapshot
        with:
          kind: native-rust
          key: ${{ steps.setup.outputs.rust-cache-key }}

      - name: Replace older Go build caches
        # A capacity skip published nothing, so it must not request a remote
        # deletion. The pruner verifies the stored replacement again before
        # its post step deletes anything.
        if: github.ref == 'refs/heads/main' && steps.go-cache-save.outputs.result == 'ready'
        uses: ./.github/actions/prune-build-cache
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          prefix: ${{ steps.setup.outputs.cache-prefix }}

      - name: Stop the resource monitor
        if: always() && vars.CI_RESOURCE_MONITOR == 'true'
        uses: ./.github/actions/ci-resource-monitor
        with:
          mode: stop

  macos:
    runs-on: macos-26
    permissions:
      contents: read
      actions: write
      # The resource monitor publishes its samples to a check run.
      checks: write
    concurrency:
      group: compiled-go-native-macos-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup build toolchain
        id: setup
        uses: ./.github/actions/setup-build
        with:
          # Native validation includes Clippy for platform-specific Rust code.
          rust-components: clippy
          save-build-caches: ${{ github.ref == 'refs/heads/main' }}
          monitor-resources: ${{ vars.CI_RESOURCE_MONITOR == 'true' }}

      - name: Test native modules
        # Linux amd64 owns portable validation. Keep Go and Rust tests here
        # because filesystem, process, IPC and desktop behavior depend on the OS.
        run: task test-native

      - name: Build
        # MACOS_CODESIGN_IDENTITY is intentionally unset here.
        # build-desktop-darwin in Taskfile.yaml signs the .app with an ad-hoc
        # identity, so the test job builds cleanly without secrets. The
        # desktop-artifacts reusable workflow produces the release artifacts
        # (signed and notarized DMG). The desktop-artifacts job below invokes
        # it only on push-to-main.
        run: task build

      - name: Check the unchanged native build
        run: task check-build-cache

      - name: Verify native CLI service lifecycle
        run: node scripts/native-cli-ci.mjs

      - name: Save the Tauri tool snapshot
        # The packaging build completed; the trimmed tool cache is ready to
        # publish. Linux and Windows publish; macOS has no Tauri cache.
        if: runner.os != 'macOS' && steps.setup.outputs.tauri-save-required == 'true'
        uses: ./.github/actions/save-cache-snapshot
        with:
          kind: tauri-tools
          key: ${{ steps.setup.outputs.tauri-cache-key }}

      - name: Save the spinner source snapshot
        # The packaging build ran `task generate-spinners`, so the consumed
        # spinners/ subtree is complete.
        if: steps.setup.outputs.spinner-save-required == 'true'
        uses: ./.github/actions/save-cache-snapshot
        with:
          kind: spinners
          key: ${{ steps.setup.outputs.spinner-cache-key }}

      - name: Save the Go build outputs snapshot
        # The job completed all required validation, so the trimmed build
        # outputs may publish. The saves precede the pruner, which verifies
        # the stored replacement before it deletes older archives. A
        # capacity skip publishes nothing and keeps the job successful.
        id: go-cache-save
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.go-save-required == 'true'
        uses: ./.github/actions/save-cache-snapshot
        with:
          kind: native-go
          key: ${{ steps.setup.outputs.cache-key }}

      - name: Save the Rust build outputs snapshot
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.rust-save-required == 'true'
        uses: ./.github/actions/save-cache-snapshot
        with:
          kind: native-rust
          key: ${{ steps.setup.outputs.rust-cache-key }}

      - name: Replace older Go build caches
        # A capacity skip published nothing, so it must not request a remote
        # deletion. The pruner verifies the stored replacement again before
        # its post step deletes anything.
        if: github.ref == 'refs/heads/main' && steps.go-cache-save.outputs.result == 'ready'
        uses: ./.github/actions/prune-build-cache
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          prefix: ${{ steps.setup.outputs.cache-prefix }}

      - name: Stop the resource monitor
        if: always() && vars.CI_RESOURCE_MONITOR == 'true'
        uses: ./.github/actions/ci-resource-monitor
        with:
          mode: stop

  windows:
    # WINDOWS_RUNNER pins the Visual Studio version with the image, because
    # Visual Studio builds the desktop app (see RUNNER IMAGES above).
    #
    # An earlier pin to windows-2022 blamed windows-latest for runners that
    # GitHub lost during the Go tests. The image was not the cause: the tests
    # killed winlogon.exe, which recorded a parent PID that a test's process had
    # taken. util/procutil now links no process that started before its
    # recorded parent.
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
      actions: write
      # The resource monitor publishes its samples to a check run.
      checks: write
    concurrency:
      group: compiled-go-native-windows-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup build toolchain
        id: setup
        uses: ./.github/actions/setup-build
        with:
          # Native validation includes Clippy for platform-specific Rust code.
          rust-components: clippy
          save-build-caches: ${{ github.ref == 'refs/heads/main' }}
          monitor-resources: ${{ vars.CI_RESOURCE_MONITOR == 'true' }}

      - name: Test native modules
        # Run under pwsh to preserve the MSVC PATH. Git Bash prepends /usr/bin, whose link.exe
        # shadows the MSVC linker. That prevents task test-native from running Cargo tests
        # correctly.
        shell: pwsh
        run: task test-native

      - name: Build all modules
        # Run under pwsh rather than bash. Git Bash prepends /usr/bin to
        # PATH, and /usr/bin/link.exe (a Unix hard-link utility shipped
        # with Git for Windows) shadows MSVC's link.exe. The Rust/Tauri
        # build then fails with "/usr/bin/link: extra operand".
        shell: pwsh
        run: task build

      - name: Check the unchanged native build
        shell: pwsh
        run: task check-build-cache

      - name: Verify native CLI service lifecycle
        shell: pwsh
        run: node scripts/native-cli-ci.mjs

      - name: Save the Tauri tool snapshot
        # The packaging build completed; the trimmed tool cache is ready to
        # publish. Linux and Windows publish; macOS has no Tauri cache.
        if: runner.os != 'macOS' && steps.setup.outputs.tauri-save-required == 'true'
        uses: ./.github/actions/save-cache-snapshot
        with:
          kind: tauri-tools
          key: ${{ steps.setup.outputs.tauri-cache-key }}

      - name: Save the spinner source snapshot
        # The packaging build ran `task generate-spinners`, so the consumed
        # spinners/ subtree is complete.
        if: steps.setup.outputs.spinner-save-required == 'true'
        uses: ./.github/actions/save-cache-snapshot
        with:
          kind: spinners
          key: ${{ steps.setup.outputs.spinner-cache-key }}

      - name: Save the Go build outputs snapshot
        # The job completed all required validation, so the trimmed build
        # outputs may publish. The saves precede the pruner, which verifies
        # the stored replacement before it deletes older archives. A
        # capacity skip publishes nothing and keeps the job successful.
        id: go-cache-save
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.go-save-required == 'true'
        uses: ./.github/actions/save-cache-snapshot
        with:
          kind: native-go
          key: ${{ steps.setup.outputs.cache-key }}

      - name: Save the Rust build outputs snapshot
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.rust-save-required == 'true'
        uses: ./.github/actions/save-cache-snapshot
        with:
          kind: native-rust
          key: ${{ steps.setup.outputs.rust-cache-key }}

      - name: Replace older Go build caches
        # A capacity skip published nothing, so it must not request a remote
        # deletion. The pruner verifies the stored replacement again before
        # its post step deletes anything.
        if: github.ref == 'refs/heads/main' && steps.go-cache-save.outputs.result == 'ready'
        uses: ./.github/actions/prune-build-cache
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          prefix: ${{ steps.setup.outputs.cache-prefix }}

      - name: Stop the resource monitor
        if: always() && vars.CI_RESOURCE_MONITOR == 'true'
        uses: ./.github/actions/ci-resource-monitor
        with:
          mode: stop

  docker:
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, ubuntu]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker build
        id: setup
        uses: ./.github/actions/setup-docker-build
        with:
          variant: ${{ matrix.variant }}
          arch: amd64

      # The pull-request job is a reader: it may restore a fallback snapshot
      # but never exports or saves one, and no pruning runs.
      - name: Restore the Docker Go build outputs
        id: go-cache
        uses: ./.github/actions/build-output-cache
        with:
          kind: docker-go
          key: ${{ steps.setup.outputs.cache-key }}
          restore-keys: ${{ steps.setup.outputs.cache-prefix }}
          writer: ${{ steps.setup.outputs.writes-shared }}

      # Load and test the image without publishing it or writing shared caches.
      - name: Build and test Docker image
        uses: ./.github/actions/build-docker-image
        with:
          variant: ${{ matrix.variant }}
          arch: amd64
          builder: ${{ steps.setup.outputs.builder }}
          go-modcache: ${{ steps.setup.outputs.go-modcache }}
          cache-path: ${{ steps.setup.outputs.cache-path }}
          writes-shared: ${{ steps.setup.outputs.writes-shared }}
          write-snapshot: ${{ steps.go-cache.outputs.save-required }}
          build-args: ${{ steps.setup.outputs.build-args }}

  dependency-age:
    # Renovate checks the release age only for the version that it selects, while
    # bun install and cargo update resolve the rest of a lockfile, for Renovate and for a
    # person alike. This job rejects a pull request whose lockfiles add a version younger
    # than the minimum release age. A push passes in seconds.
    # The judge, its Taskfile, the Renovate tree, and the tool pins come from the base
    # commit, which a worktree holds, and the judge reads the lockfiles of the PR by
    # revision only. A PR can change the Renovate tree, and code from that tree must never
    # judge the lockfile that adds it. The workspace holds the merge commit, so every
    # local action and script that sets up the job resolves against one commit.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # A security branch exempts only the fixes of the packages that open Dependabot
      # alerts report.
      vulnerability-alerts: read
    steps:
      - name: Select pull requests
        id: scope
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: echo "checked=$PULL_REQUEST" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.checked == 'true'
        with:
          # The PR merge commit and its first parent, the main commit that it merges into.
          fetch-depth: 2
          persist-credentials: false

      - name: Check out the base commit
        # Load tool versions reads versions.env from the workspace, so the
        # workspace holds the base commit until the pins are loaded.
        if: steps.scope.outputs.checked == 'true'
        run: |
          pr_merge_sha="$(git rev-parse HEAD)"
          echo "PR_MERGE_SHA=$pr_merge_sha" >> "$GITHUB_ENV"
          git checkout --quiet --detach HEAD^1

      # The check needs only Bun, Go, and Task, and Node.js runs the Task installer.
      # setup-build would also install Rust and buf, and download every dependency of the
      # lockfiles that the PR changes.
      - name: Load tool versions
        if: steps.scope.outputs.checked == 'true'
        uses: ./.github/actions/load-versions

      - name: Return to the merge commit and keep the base in a worktree
        # GitHub resolves each local action and script against the workspace
        # when its step starts. The workspace returns to the merge commit, so
        # the Task installer and its cache actions come from one commit. The
        # judge runs from the base worktree.
        if: steps.scope.outputs.checked == 'true'
        run: |
          base_checkout="$RUNNER_TEMP/base"
          git worktree add --quiet --detach "$base_checkout" HEAD
          echo "BASE_CHECKOUT=$base_checkout" >> "$GITHUB_ENV"
          git checkout --quiet --detach "$PR_MERGE_SHA"

      - name: Setup Go
        if: steps.scope.outputs.checked == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          cache: false

      - name: Setup Bun
        if: steps.scope.outputs.checked == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        if: steps.scope.outputs.checked == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Task
        if: steps.scope.outputs.checked == 'true'
        uses: ./.github/actions/setup-cli-tools
        with:
          tools: task

      - name: Check the release age of new lockfile versions
        if: steps.scope.outputs.checked == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # In the base worktree, HEAD is the base commit.
        run: task -d "$BASE_CHECKOUT" check-dependency-age -- --base HEAD --head "$PR_MERGE_SHA" --head-ref "$HEAD_REF"

  required-ci:
    name: Required CI
    if: always()
    needs: [linux, macos, windows, docker, dependency-age]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Check required results
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); for (const [job, value] of Object.entries(jobs)) { if (value.result !== "success" && !(job === "docker" && process.env.EVENT_NAME === "push" && value.result === "skipped")) { console.error(`${job}: ${value.result}`); process.exitCode = 1; } }'

  desktop-artifacts:
    # Build, sign, and notarize the binaries that get attached to the
    # auto-generated prerelease. Runs only on push-to-main; PR runs do not
    # trigger this and therefore never request the apple-signing environment
    # secrets that the macos-app-sign job needs.
    #
    # `secrets: inherit` is required so the macos-app-sign job in the called
    # workflow can read the apple-signing environment secrets. Without it,
    # `${{ secrets.X }}` in the called workflow resolves to empty even for
    # env-scoped secrets. `security import` then fails with errSecParam on
    # an empty .p12. Env scoping still holds: only jobs that declare
    # `environment: apple-signing` can read those secrets.
    needs: [linux, macos, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/desktop-artifacts.yaml
    with:
      ref: ${{ github.sha }}
      sign_macos: true
    secrets: inherit

  prerelease:
    needs: desktop-artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so `git log <prev-prerelease>..HEAD` can
          # build the changelog block in the release notes below.
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: Compute tag and write release notes
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # UTC timestamp (YYYYMMDD-HHMMSS) sorts lexicographically the same
          # as chronologically, so GitHub's name-descending release list
          # shows the newest pre-release at the top.
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          SHORT_SHA=${GITHUB_SHA::7}
          . ./versions.env
          TAG="prerelease-${TIMESTAMP}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          RELEASE_URL="${REPO_URL}/releases/download/${TAG}"

          # Find the most recent auto-generated pre-release tag to limit
          # the changelog. Use the same filter as the prune step, so stable
          # `vX.Y.Z` releases are ignored.
          PREV_TAG=$(gh release list --limit 100 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease) | select(.tagName | startswith("prerelease-"))] | sort_by(.createdAt) | reverse | .[0].tagName // empty')

          # Write the static part of the release notes. The unquoted heredoc
          # expands ${VERSION}/${GITHUB_SHA}/${REPO_URL}/${RELEASE_URL}.
          # Backticks are escaped, so they stay literal in the markdown and
          # no tool re-parses them. Each filename is wrapped in a markdown
          # link to its download URL on this release.
          cat > release-notes.md <<EOF
          Pre-release from commit [\`${SHORT_SHA}\`](${REPO_URL}/commit/${GITHUB_SHA}).

          ## Artifacts

          - LeapMux Desktop
            - macOS
              - [\`LeapMuxDesktop_${VERSION}_arm64.dmg\`](${RELEASE_URL}/LeapMuxDesktop_${VERSION}_arm64.dmg)
            - Windows
              - [\`LeapMuxDesktop_${VERSION}_x64.msi\`](${RELEASE_URL}/LeapMuxDesktop_${VERSION}_x64.msi)
            - Linux
              - [\`leapmux-desktop_${VERSION}_x86_64.AppImage\`](${RELEASE_URL}/leapmux-desktop_${VERSION}_x86_64.AppImage)
              - [\`leapmux-desktop_${VERSION}_aarch64.AppImage\`](${RELEASE_URL}/leapmux-desktop_${VERSION}_aarch64.AppImage)
              - [\`leapmux-desktop_${VERSION}_amd64.deb\`](${RELEASE_URL}/leapmux-desktop_${VERSION}_amd64.deb)
              - [\`leapmux-desktop_${VERSION}_arm64.deb\`](${RELEASE_URL}/leapmux-desktop_${VERSION}_arm64.deb)
          - LeapMux Server
            - macOS
              - [\`leapmux_${VERSION}_darwin_arm64.tar.gz\`](${RELEASE_URL}/leapmux_${VERSION}_darwin_arm64.tar.gz)
            - Windows
              - [\`leapmux_${VERSION}_windows_amd64.zip\`](${RELEASE_URL}/leapmux_${VERSION}_windows_amd64.zip)
            - Linux
              - [\`leapmux_${VERSION}_linux_amd64.tar.gz\`](${RELEASE_URL}/leapmux_${VERSION}_linux_amd64.tar.gz)
              - [\`leapmux_${VERSION}_linux_arm64.tar.gz\`](${RELEASE_URL}/leapmux_${VERSION}_linux_arm64.tar.gz)
          EOF

          # Append the changelog. Append the `git log` output raw, so no
          # second round of shell parsing reads the commit subjects. Subjects
          # with backticks or dollar signs then stay intact in the rendered
          # markdown. Each abbreviated hash is wrapped in a markdown link to
          # the commit on this repo (with the full %H SHA in the URL).
          {
            echo
            if [ -n "$PREV_TAG" ] && git rev-parse --verify "$PREV_TAG" >/dev/null 2>&1; then
              echo "## Changes since \`${PREV_TAG}\`"
              echo
              git log --pretty=format:"- [\`%h\`](${REPO_URL}/commit/%H) %s" "${PREV_TAG}..HEAD"
              echo
            else
              echo "## Recent changes"
              echo
              git log --pretty=format:"- [\`%h\`](${REPO_URL}/commit/%H) %s" -20
              echo
            fi
          } >> release-notes.md

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "${{ steps.meta.outputs.tag }}" \
            --notes-file release-notes.md \
            artifacts/*.tar.gz \
            artifacts/*.zip \
            artifacts/*.AppImage \
            artifacts/*.deb \
            artifacts/*.dmg \
            artifacts/*.msi

      - name: Prune old pre-releases (keep latest 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Filter to auto-generated prereleases (isPrerelease=true AND tag
          # starts with `prerelease-`), so manual releases from the
          # `Release` workflow (tags like `v1.2.3`) are never touched.
          # Sort newest first, drop the first 3, delete the rest
          # (tag + release).
          gh release list --limit 100 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease) | select(.tagName | startswith("prerelease-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | while read -r tag; do
                [ -n "$tag" ] || continue
                echo "Deleting old pre-release: $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
