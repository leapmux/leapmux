name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # UBUNTU VERSION: `runs-on` is evaluated before any step can populate
    # $GITHUB_ENV, so this runner label cannot come from versions.env the way
    # every other pin does. It is spelled out here and in four sibling
    # workflows (desktop-artifacts.yaml, notice.yaml, publish-site.yaml, and
    # the arm64 runner of docker.yaml / release.yaml). Moving to a newer
    # Ubuntu means editing all of them. This is the only occurrence in THIS
    # workflow.
    #
    # Distinct from UBUNTU_IMAGE in versions.env, which is the Docker base
    # image that the container is built FROM, not the runner it is built ON.
    # The two track the same release today but are not the same knob.
    runs-on: ubuntu-24.04${{ matrix.runner_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner_suffix: ''
          - arch: arm64
            runner_suffix: '-arm'
    permissions:
      contents: read
      actions: write
    concurrency:
      group: compiled-go-native-linux-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Hugo reads Git history in the canonical site check.
          fetch-depth: ${{ matrix.arch == 'amd64' && '0' || '1' }}

      - name: Setup build toolchain
        id: setup
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rust-components: clippy
          # Only push-to-main saves the compiled caches; see the input's docs.
          save-build-caches: ${{ github.ref == 'refs/heads/main' }}

      # Keep these post contexts separate. A prune failure must stop the save.
      - name: Cache Go build outputs
        id: go-cache
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/build-output-cache
        with:
          path: |
            ${{ steps.setup.outputs.go-cache }}
            ${{ steps.setup.outputs.lint-cache }}
          key: ${{ steps.setup.outputs.cache-key }}
          restore-keys: ${{ steps.setup.outputs.cache-prefix }}
          save: 'true'

      - name: Replace older Go build caches
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prune-build-cache
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          prefix: ${{ steps.setup.outputs.cache-prefix }}

      - name: Generate code (proto + sqlc)
        run: task generate

      - name: Validate standalone dependency tools
        if: matrix.arch == 'amd64'
        run: task validate-standalone-tools

      - name: Validate Renovate dependency extraction
        if: matrix.arch == 'amd64'
        run: task renovate-extract

      - name: Install frontend dependencies
        run: task prepare-frontend

      - name: Build
        id: build
        run: task build

      - name: Check the unchanged native build
        run: task check-build-cache

      - name: Diagnose linuxdeploy (on failure)
        # Tauri discards linuxdeploy output on failure and reports only "failed to run linuxdeploy".
        # Run the wrapper and extracted AppRun directly to retain their diagnostics.
        # Run these diagnostics only after a native build failure. Cache-check failures have their own complete logs.
        if: failure() && steps.build.outcome == 'failure'
        run: bash scripts/diagnose-linuxdeploy.sh

      - name: Lint (full)
        if: matrix.arch == 'amd64'
        run: task lint

      - name: Build and validate the documentation site
        if: matrix.arch == 'amd64'
        run: task site

      - name: Test (full)
        if: matrix.arch == 'amd64'
        # `task test` tests every module. amd64 is the canonical
        # runner, so it runs the full suite, which includes the Docker-backed
        # storage backends (postgres/mysql/cockroachdb/tidb/yugabytedb).
        run: task test

      - name: Test (no Docker-backed storage)
        if: matrix.arch == 'arm64'
        # testcontainers-backed tests for postgres/mysql/cockroachdb/tidb/
        # yugabytedb test the SQL-dialect code, not the runner architecture.
        # Skip them on arm64 (and macOS/Windows) to save minutes and to avoid
        # flaky failures. amd64 still runs the full suite every commit.
        run: task test-no-docker

  macos:
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    concurrency:
      group: compiled-go-native-macos-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup build toolchain
        id: setup
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # `task test-no-docker` reaches `cargo clippy` through test-desktop ->
          # lint-desktop, and rust-toolchain installs the minimal profile.
          rust-components: clippy
          save-build-caches: ${{ github.ref == 'refs/heads/main' }}

      # Keep these post contexts separate. A prune failure must stop the save.
      - name: Cache Go build outputs
        id: go-cache
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/build-output-cache
        with:
          path: |
            ${{ steps.setup.outputs.go-cache }}
            ${{ steps.setup.outputs.lint-cache }}
          key: ${{ steps.setup.outputs.cache-key }}
          restore-keys: ${{ steps.setup.outputs.cache-prefix }}
          save: 'true'

      - name: Replace older Go build caches
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prune-build-cache
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          prefix: ${{ steps.setup.outputs.cache-prefix }}

      - name: Generate code (proto + sqlc)
        run: task generate

      - name: Install frontend dependencies
        run: task prepare-frontend

      - name: Test (no Docker-backed storage)
        # `task test-no-docker` lints and tests frontend/backend/desktop
        # without the Docker-backed storage backends. amd64 Linux still runs
        # the full suite on every commit.
        run: task test-no-docker

      - name: Build
        # MACOS_CODESIGN_IDENTITY is intentionally unset here.
        # build-desktop-darwin in Taskfile.yaml signs the .app with an ad-hoc
        # identity, so the test job builds cleanly without secrets. The
        # desktop-artifacts reusable workflow produces the release artifacts
        # (signed and notarized DMG). The desktop-artifacts job below invokes
        # it only on push-to-main.
        run: task build

      - name: Check the unchanged native build
        run: task check-build-cache

  windows:
    # windows-2022, NOT windows-latest. Since 2026-10-13 ~17:00Z the latest
    # image's fleet degrades mid-run. Every spawned process starts failing
    # with STATUS_DLL_INIT_FAILED (0xC0000142) late in the suite. The runner
    # then loses communication and uploads no logs. Six consecutive attempts
    # showed this. The same suite content passed green on that image earlier
    # that day. Unpin back to windows-latest only after the image stabilizes.
    runs-on: windows-2022
    permissions:
      contents: read
      actions: write
    concurrency:
      group: compiled-go-native-windows-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup build toolchain
        id: setup
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # See the macos job: test-no-docker lints the Rust crate too.
          rust-components: clippy
          save-build-caches: ${{ github.ref == 'refs/heads/main' }}

      # Keep these post contexts separate. A prune failure must stop the save.
      - name: Cache Go build outputs
        id: go-cache
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/build-output-cache
        with:
          path: |
            ${{ steps.setup.outputs.go-cache }}
            ${{ steps.setup.outputs.lint-cache }}
          key: ${{ steps.setup.outputs.cache-key }}
          restore-keys: ${{ steps.setup.outputs.cache-prefix }}
          save: 'true'

      - name: Replace older Go build caches
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prune-build-cache
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          prefix: ${{ steps.setup.outputs.cache-prefix }}

      - name: Test (no Docker-backed storage)
        # Run under pwsh to preserve the MSVC PATH. Git Bash prepends /usr/bin, whose link.exe
        # shadows the MSVC linker. That prevents task test-desktop from running Cargo tests
        # correctly.
        shell: pwsh
        run: task test-no-docker

      - name: Build all modules
        # Run under pwsh rather than bash. Git Bash prepends /usr/bin to
        # PATH, and /usr/bin/link.exe (a Unix hard-link utility shipped
        # with Git for Windows) shadows MSVC's link.exe. The Rust/Tauri
        # build then fails with "/usr/bin/link: extra operand".
        shell: pwsh
        run: task build

      - name: Check the unchanged native build
        shell: pwsh
        run: task check-build-cache

  docker:
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, ubuntu]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker build
        id: setup
        uses: ./.github/actions/setup-docker-build
        with:
          variant: ${{ matrix.variant }}
          arch: amd64

      # Separate job steps make extraction and pruning failures stop the save.
      - name: Cache Docker Go build outputs
        id: go-cache
        uses: ./.github/actions/build-output-cache
        with:
          path: ${{ steps.setup.outputs.cache-path }}
          key: ${{ steps.setup.outputs.cache-key }}
          restore-keys: ${{ steps.setup.outputs.cache-prefix }}
          save: ${{ steps.setup.outputs.writes-shared }}

      - name: Replace older Docker Go build caches
        if: steps.setup.outputs.writes-shared == 'true' && steps.go-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prune-build-cache
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          prefix: ${{ steps.setup.outputs.cache-prefix }}

      # A dry run only reads the caches. It writes none: the composite
      # exports nothing with the default `outputs` and `save-caches`.
      - name: Docker build (dry run)
        uses: ./.github/actions/build-docker-image
        with:
          variant: ${{ matrix.variant }}
          arch: amd64
          builder: ${{ steps.setup.outputs.builder }}
          go-modcache: ${{ steps.setup.outputs.go-modcache }}
          cache-path: ${{ steps.setup.outputs.cache-path }}
          writes-shared: ${{ steps.setup.outputs.writes-shared }}
          go-cache-hit: ${{ steps.go-cache.outputs.cache-hit }}
          build-args: ${{ steps.setup.outputs.build-args }}

  required-ci:
    name: Required CI
    if: always()
    needs: [linux, macos, windows, docker]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check required results
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); for (const [job, value] of Object.entries(jobs)) { if (value.result !== "success" && !(job === "docker" && process.env.EVENT_NAME === "push" && value.result === "skipped")) { console.error(`${job}: ${value.result}`); process.exitCode = 1; } }'

  desktop-artifacts:
    # Build, sign, and notarize the binaries that get attached to the
    # auto-generated prerelease. Runs only on push-to-main; PR runs do not
    # trigger this and therefore never request the apple-signing environment
    # secrets that the macos-app-sign job needs.
    #
    # `secrets: inherit` is required so the macos-app-sign job in the called
    # workflow can read the apple-signing environment secrets. Without it,
    # `${{ secrets.X }}` in the called workflow resolves to empty even for
    # env-scoped secrets. `security import` then fails with errSecParam on
    # an empty .p12. Env scoping still holds: only jobs that declare
    # `environment: apple-signing` can read those secrets.
    needs: [linux, macos, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/desktop-artifacts.yaml
    with:
      ref: ${{ github.sha }}
      sign_macos: true
    secrets: inherit

  prerelease:
    needs: desktop-artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so `git log <prev-prerelease>..HEAD` can
          # build the changelog block in the release notes below.
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: Compute tag and write release notes
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # UTC timestamp (YYYYMMDD-HHMMSS) sorts lexicographically the same
          # as chronologically, so GitHub's name-descending release list
          # shows the newest pre-release at the top.
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          SHORT_SHA=${GITHUB_SHA::7}
          . ./versions.env
          TAG="prerelease-${TIMESTAMP}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          RELEASE_URL="${REPO_URL}/releases/download/${TAG}"

          # Find the most recent auto-generated pre-release tag to limit
          # the changelog. Use the same filter as the prune step, so stable
          # `vX.Y.Z` releases are ignored.
          PREV_TAG=$(gh release list --limit 100 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease) | select(.tagName | startswith("prerelease-"))] | sort_by(.createdAt) | reverse | .[0].tagName // empty')

          # Write the static part of the release notes. The unquoted heredoc
          # expands ${VERSION}/${GITHUB_SHA}/${REPO_URL}/${RELEASE_URL}.
          # Backticks are escaped, so they stay literal in the markdown and
          # no tool re-parses them. Each filename is wrapped in a markdown
          # link to its download URL on this release.
          cat > release-notes.md <<EOF
          Pre-release from commit [\`${SHORT_SHA}\`](${REPO_URL}/commit/${GITHUB_SHA}).

          ## Artifacts

          - LeapMux Desktop
            - macOS
              - [\`LeapMuxDesktop_${VERSION}_arm64.dmg\`](${RELEASE_URL}/LeapMuxDesktop_${VERSION}_arm64.dmg)
            - Windows
              - [\`LeapMuxDesktop_${VERSION}_x64.msi\`](${RELEASE_URL}/LeapMuxDesktop_${VERSION}_x64.msi)
            - Linux
              - [\`leapmux-desktop_${VERSION}_x86_64.AppImage\`](${RELEASE_URL}/leapmux-desktop_${VERSION}_x86_64.AppImage)
              - [\`leapmux-desktop_${VERSION}_aarch64.AppImage\`](${RELEASE_URL}/leapmux-desktop_${VERSION}_aarch64.AppImage)
              - [\`leapmux-desktop_${VERSION}_amd64.deb\`](${RELEASE_URL}/leapmux-desktop_${VERSION}_amd64.deb)
              - [\`leapmux-desktop_${VERSION}_arm64.deb\`](${RELEASE_URL}/leapmux-desktop_${VERSION}_arm64.deb)
          - LeapMux Server
            - macOS
              - [\`leapmux_${VERSION}_darwin_arm64.tar.gz\`](${RELEASE_URL}/leapmux_${VERSION}_darwin_arm64.tar.gz)
            - Windows
              - [\`leapmux_${VERSION}_windows_amd64.zip\`](${RELEASE_URL}/leapmux_${VERSION}_windows_amd64.zip)
            - Linux
              - [\`leapmux_${VERSION}_linux_amd64.tar.gz\`](${RELEASE_URL}/leapmux_${VERSION}_linux_amd64.tar.gz)
              - [\`leapmux_${VERSION}_linux_arm64.tar.gz\`](${RELEASE_URL}/leapmux_${VERSION}_linux_arm64.tar.gz)
          EOF

          # Append the changelog. Append the `git log` output raw, so no
          # second round of shell parsing reads the commit subjects. Subjects
          # with backticks or dollar signs then stay intact in the rendered
          # markdown. Each abbreviated hash is wrapped in a markdown link to
          # the commit on this repo (with the full %H SHA in the URL).
          {
            echo
            if [ -n "$PREV_TAG" ] && git rev-parse --verify "$PREV_TAG" >/dev/null 2>&1; then
              echo "## Changes since \`${PREV_TAG}\`"
              echo
              git log --pretty=format:"- [\`%h\`](${REPO_URL}/commit/%H) %s" "${PREV_TAG}..HEAD"
              echo
            else
              echo "## Recent changes"
              echo
              git log --pretty=format:"- [\`%h\`](${REPO_URL}/commit/%H) %s" -20
              echo
            fi
          } >> release-notes.md

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "${{ steps.meta.outputs.tag }}" \
            --notes-file release-notes.md \
            artifacts/*.tar.gz \
            artifacts/*.zip \
            artifacts/*.AppImage \
            artifacts/*.deb \
            artifacts/*.dmg \
            artifacts/*.msi

      - name: Prune old pre-releases (keep latest 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Filter to auto-generated prereleases (isPrerelease=true AND tag
          # starts with `prerelease-`), so manual releases from the
          # `Release` workflow (tags like `v1.2.3`) are never touched.
          # Sort newest first, drop the first 3, delete the rest
          # (tag + release).
          gh release list --limit 100 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease) | select(.tagName | startswith("prerelease-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | while read -r tag; do
                [ -n "$tag" ] || continue
                echo "Deleting old pre-release: $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
