name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z format, e.g. 1.0.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    # Two independent checks. The apple-signing environment used by the
    # desktop-artifacts call below already restricts secrets to runs that
    # target `main`. The `if` below refuses to dispatch any sensitive job
    # from a non-main ref, so no feature branch can run the release pipeline.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version format
        # The input reaches `run` through the environment, never through the
        # template. `[[ =~ ]]` matches the whole value: `grep` matches line
        # by line, so it accepts a multi-line value. After this check, the
        # value is one safe line, so the later steps may interpolate it.
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ ! $VERSION_INPUT =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be in X.Y.Z format (e.g. 1.0.0), got '$VERSION_INPUT'"
            exit 1
          fi

      - name: Derive next development version
        id: next
        run: |
          IFS='.' read -r major minor patch <<< "${{ inputs.version }}"
          echo "dev_version=${major}.${minor}.$((patch + 1))-dev" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set release version
        run: |
          sed -i -E 's|^VERSION=.*|VERSION=${{ inputs.version }}|' versions.env
          git add versions.env
          git commit -m "chore: release v${{ inputs.version }}"

      - name: Create tag
        run: git tag "v${{ inputs.version }}"

      - name: Push release commit and tag
        run: git push origin HEAD "v${{ inputs.version }}"

      - name: Create GitHub Release (draft)
        # Create the release as a draft, so that users do not see a release
        # with missing assets while these jobs still run:
        # * the desktop builds;
        # * the signing and the notarization;
        # * the Docker pushes.
        # The publish-release job below sets draft=false only after all
        # artifacts are attached and all images are pushed.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            --draft

      - name: Bump to next development version
        run: |
          sed -i -E 's|^VERSION=.*|VERSION=${{ steps.next.outputs.dev_version }}|' versions.env
          git add versions.env
          git commit -m "chore: bump version to ${{ steps.next.outputs.dev_version }}"
          git push origin HEAD

  desktop-artifacts:
    # Build, sign, and notarize the desktop binaries that get attached to
    # the v<version> stable release. Reuses the same workflow ci.yaml uses
    # for prereleases so prerelease and stable end up with identical asset
    # sets. Apple secrets are scoped to the apple-signing environment used
    # only by the macos-app-sign job inside this reusable workflow.
    #
    # See ci.yaml's matching call site for why `secrets: inherit` is
    # required. Without it, env-scoped secrets do not flow into a
    # `workflow_call` target, even for jobs that declare the environment.
    needs: release
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/desktop-artifacts.yaml
    with:
      ref: v${{ inputs.version }}
      version: ${{ inputs.version }}
      sign_macos: true
    secrets: inherit

  attach-desktop-artifacts:
    # Upload the built+signed binaries to the (still draft) release.
    needs: desktop-artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ inputs.version }}" \
            artifacts/*.tar.gz \
            artifacts/*.zip \
            artifacts/*.AppImage \
            artifacts/*.deb \
            artifacts/*.dmg \
            artifacts/*.msi \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  docker:
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, ubuntu]
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (per-arch)
        id: build
        uses: ./.github/actions/build-docker-image
        with:
          variant: ${{ matrix.variant }}
          arch: ${{ matrix.arch }}
          version-override: ${{ inputs.version }}
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true
          # The release pipeline runs only from main.
          save-caches: 'true'

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/${{ matrix.variant }}
          echo "${{ steps.build.outputs.digest }}" > "${{ runner.temp }}/digests/${{ matrix.variant }}/${{ matrix.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.variant }}/
          retention-days: 1

  docker-merge:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: alpine
            suffix: ''
          - variant: ubuntu
            suffix: '-ubuntu'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-digest-${{ matrix.variant }}-*
          path: ${{ runner.temp }}/digests/${{ matrix.variant }}
          merge-multiple: true

      - name: Derive major version tag
        id: tags
        run: |
          IFS='.' read -r major _minor _patch <<< "${{ inputs.version }}"
          echo "major=${major}" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifests
        run: |
          DIGESTS=()
          for f in ${{ runner.temp }}/digests/${{ matrix.variant }}/*; do
            DIGESTS+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$(cat "$f")")
          done
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SUFFIX="${{ matrix.suffix }}"
          docker buildx imagetools create \
            -t "${IMAGE}:${{ inputs.version }}${SUFFIX}" \
            -t "${IMAGE}:${{ steps.tags.outputs.major }}${SUFFIX}" \
            -t "${IMAGE}:latest${SUFFIX}" \
            "${DIGESTS[@]}"

  publish-release:
    # Flip the v<version> release from draft to published only after BOTH
    # desktop binaries are attached AND multi-arch container images are
    # pushed. If either side fails, the release stays draft so users never
    # see a half-shipped tag.
    needs: [attach-desktop-artifacts, docker-merge]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ inputs.version }}" --draft=false --repo "${GITHUB_REPOSITORY}"
