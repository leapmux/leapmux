name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z format, e.g. 1.0.0)'
        required: true
        type: string

# Keep each release active through its final image and artifact publication.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    # The job condition filters other refs. The first step checks the exact
    # branch spelling because GitHub expression equality ignores case.
    # The apple-signing environment independently restricts its secrets.
    if: github.ref == 'refs/heads/main'
    environment: release-admin
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Validate release branch
        shell: bash
        run: |
          if [ "${GITHUB_REF:-}" != 'refs/heads/main' ]; then
            echo "::error::Release requires the main branch."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version format
        # MSI versions permit major and minor values through 255, and patch
        # values through 65535. Reserve one patch value for the next dev build.
        # Check canonical decimal text before arithmetic to exclude octal and overflow.
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ ! $VERSION_INPUT =~ ^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,4})$ ]]; then
            echo "::error::Release version must use canonical X.Y.Z decimal components."
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$VERSION_INPUT"
          if (( major > 255 || minor > 255 || patch > 65534 )); then
            echo "::error::Release version must fit MSI limits and leave room for the next patch version."
            exit 1
          fi

      - name: Derive next development version
        id: next
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          IFS='.' read -r major minor patch <<< "$VERSION_INPUT"
          echo "dev_version=${major}.${minor}.$((patch + 1))-dev" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set release version
        run: |
          sed -i -E 's|^VERSION=.*|VERSION=${{ inputs.version }}|' versions.env
          git add versions.env
          git commit -m "chore: Release v${{ inputs.version }}"

      - name: Create tag
        run: git tag "v${{ inputs.version }}"

      - name: Bump to next development version
        run: |
          sed -i -E 's|^VERSION=.*|VERSION=${{ steps.next.outputs.dev_version }}|' versions.env
          git add versions.env
          git commit -m "chore: Bump version to ${{ steps.next.outputs.dev_version }}"

      - name: Push version commits and release tag
        env:
          RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
        # Supply the administrator credential only to this atomic push.
        run: |
          : "${RELEASE_ADMIN_TOKEN:?The release-admin environment requires RELEASE_ADMIN_TOKEN.}"
          auth=$(printf 'x-access-token:%s' "$RELEASE_ADMIN_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --atomic origin HEAD:refs/heads/main "refs/tags/v${{ inputs.version }}"

      - name: Create GitHub Release (draft)
        # Create the release as a draft, so that users do not see a release
        # with missing assets while these jobs still run:
        # * the desktop builds;
        # * the signing and the notarization;
        # * the Docker pushes.
        # The publish-release job sets draft=false after the jobs attach every
        # artifact and push every image.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            --draft

  desktop-artifacts:
    # Build, sign, and notarize the desktop binaries that get attached to
    # the v<version> stable release. Reuses the same workflow ci.yaml uses
    # for prereleases so prerelease and stable end up with identical asset
    # sets. Apple secrets are scoped to the apple-signing environment used
    # only by the macos-app-sign job inside this reusable workflow.
    #
    # See ci.yaml's matching call site for why `secrets: inherit` is
    # required. Without it, env-scoped secrets do not flow into a
    # `workflow_call` target, even for jobs that declare the environment.
    needs: release
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/desktop-artifacts.yaml
    with:
      ref: v${{ inputs.version }}
      version: ${{ inputs.version }}
      sign_macos: true
    secrets: inherit

  attach-desktop-artifacts:
    # Upload the built+signed binaries to the (still draft) release.
    needs: desktop-artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ inputs.version }}" \
            artifacts/*.tar.gz \
            artifacts/*.zip \
            artifacts/*.AppImage \
            artifacts/*.deb \
            artifacts/*.dmg \
            artifacts/*.msi \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  docker:
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
    permissions:
      contents: read
      packages: write
      actions: write

    concurrency:
      group: compiled-go-docker-${{ matrix.variant }}-${{ matrix.arch }}
      cancel-in-progress: false
      queue: max

    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, ubuntu]
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}

      - name: Setup Docker build
        id: setup
        uses: ./.github/actions/setup-docker-build
        with:
          variant: ${{ matrix.variant }}
          arch: ${{ matrix.arch }}
          save-caches: 'true'
          version-override: ${{ inputs.version }}

      # Separate job steps make extraction and pruning failures stop the save.
      - name: Cache Docker Go build outputs
        id: go-cache
        uses: ./.github/actions/build-output-cache
        with:
          path: ${{ steps.setup.outputs.cache-path }}
          key: ${{ steps.setup.outputs.cache-key }}
          restore-keys: ${{ steps.setup.outputs.cache-prefix }}
          save: ${{ steps.setup.outputs.writes-shared }}

      - name: Replace older Docker Go build caches
        if: steps.setup.outputs.writes-shared == 'true' && steps.go-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prune-build-cache
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          prefix: ${{ steps.setup.outputs.cache-prefix }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (per-arch)
        id: build
        uses: ./.github/actions/build-docker-image
        with:
          variant: ${{ matrix.variant }}
          arch: ${{ matrix.arch }}
          builder: ${{ steps.setup.outputs.builder }}
          go-modcache: ${{ steps.setup.outputs.go-modcache }}
          cache-path: ${{ steps.setup.outputs.cache-path }}
          writes-shared: ${{ steps.setup.outputs.writes-shared }}
          go-cache-hit: ${{ steps.go-cache.outputs.cache-hit }}
          build-args: ${{ steps.setup.outputs.build-args }}
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true
          # The release pipeline runs only from main.
          save-caches: 'true'

      - name: Upload image digest
        uses: ./.github/actions/upload-docker-digest
        with:
          digest: ${{ steps.build.outputs.digest }}
          variant: ${{ matrix.variant }}
          arch: ${{ matrix.arch }}
          artifact-name: release-digest-${{ matrix.variant }}-${{ matrix.arch }}

  docker-merge:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: alpine
            suffix: ''
          - variant: ubuntu
            suffix: '-ubuntu'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-digest-${{ matrix.variant }}-*
          path: ${{ runner.temp }}/digests/${{ matrix.variant }}
          merge-multiple: true

      - name: Derive major version tag
        id: tags
        run: |
          IFS='.' read -r major _minor _patch <<< "${{ inputs.version }}"
          echo "major=${major}" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifests
        run: |
          DIGESTS=()
          for f in ${{ runner.temp }}/digests/${{ matrix.variant }}/*; do
            DIGESTS+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$(cat "$f")")
          done
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SUFFIX="${{ matrix.suffix }}"
          docker buildx imagetools create \
            -t "${IMAGE}:${{ inputs.version }}${SUFFIX}" \
            -t "${IMAGE}:${{ steps.tags.outputs.major }}${SUFFIX}" \
            -t "${IMAGE}:latest${SUFFIX}" \
            "${DIGESTS[@]}"

  publish-release:
    # Flip the v<version> release from draft to published only after BOTH
    # desktop binaries are attached AND multi-arch container images are
    # pushed. If either side fails, the release stays draft so users never
    # see a half-shipped tag.
    needs: [attach-desktop-artifacts, docker-merge]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ inputs.version }}" --draft=false --repo "${GITHUB_REPOSITORY}"
