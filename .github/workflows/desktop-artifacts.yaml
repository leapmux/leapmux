name: Build desktop artifacts

# This reusable workflow builds desktop apps and CLI archives for GitHub releases.
# These workflows call it:
# - .github/workflows/ci.yaml creates prerelease-<ts> releases on pushes to main.
# - .github/workflows/release.yaml creates v<version> releases through workflow_dispatch.
#
# The macos-app-sign and macos-cli-sign jobs read Apple signing and notarization secrets.
# Both declare the apple-signing environment, whose deployment rules restrict secret access to main.
# Other jobs declare no environment and cannot read those secrets.
# The secrets: inherit setting preserves this restriction at each job that uses the secrets.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (sha or tag) to check out and build from.
        required: true
        type: string
      version:
        description: Version override (e.g. for tag-triggered runs). Empty → use versions.env.
        required: false
        type: string
        default: ''
      sign_macos:
        description: When true, run macos-app-sign to produce a Developer ID + notarized DMG.
        required: false
        type: boolean
        default: true

jobs:
  linux:
    runs-on: ubuntu-24.04${{ matrix.runner_suffix }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner_suffix: ''
          - arch: arm64
            runner_suffix: '-arm'
    steps:
      # The called workflow receives the caller GitHub context. Its default checkout can select
      # the dispatch commit before the release-version commit.
      # Use inputs.ref so every artifact uses the release tag tree. The version override alone
      # would hide the wrong tree by supplying the expected VERSION string.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup build toolchain
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-override: ${{ inputs.version }}
          rust-components: clippy

      - name: Generate code (proto + sqlc)
        run: task generate

      - name: Install frontend dependencies
        run: task prepare-frontend

      - name: Build
        id: build
        run: task build

      - name: Check the unchanged native build
        run: task check-build-cache

      - name: Diagnose linuxdeploy (on failure)
        # Tauri discards linuxdeploy output on failure and reports only "failed to run linuxdeploy".
        # Run the wrapper and extracted AppRun directly to retain their diagnostics, as ci.yaml does.
        # Run these diagnostics only after a native build failure. Cache-check failures have their own complete logs.
        if: failure() && steps.build.outcome == 'failure'
        run: bash scripts/diagnose-linuxdeploy.sh

      - name: Package CLI server tarball
        run: |
          DIR="leapmux_${VERSION}_linux_${{ matrix.arch }}"
          mkdir -p "dist/${DIR}"
          cp leapmux LICENSE.md NOTICE.md "dist/${DIR}/"
          tar -czf "${DIR}.tar.gz" -C dist "${DIR}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: |
            leapmux_*_linux_${{ matrix.arch }}.tar.gz
            leapmux-desktop*.AppImage
            leapmux-desktop*.deb
          if-no-files-found: error
          retention-days: 7

  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      # See the linux job: a called workflow's default checkout is the
      # caller's ref, not this workflow's `ref` input.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup build toolchain
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-override: ${{ inputs.version }}
          rust-components: clippy

      - name: Generate code (proto + sqlc)
        run: task generate

      - name: Install frontend dependencies
        run: task prepare-frontend

      - name: Build
        # MACOS_CODESIGN_IDENTITY is intentionally unset here.
        # build-desktop-darwin in Taskfile.yaml signs the .app with an ad-hoc
        # identity, so this job builds cleanly without secrets. The
        # macos-app-sign job below downloads the unsigned .app and signs it
        # again with the Developer ID identity.
        run: task build

      - name: Check the unchanged native build
        run: task check-build-cache

      - name: Tar unsigned .app for the signing job
        # tar preserves symlinks/permissions inside the .app bundle that
        # actions/upload-artifact's zipping does not. Name does NOT start
        # with `desktop-` so prerelease/release downloads (pattern: desktop-*)
        # skip this intermediate.
        run: tar -cf macos-app-unsigned.tar "LeapMux Desktop.app"

      - name: Upload unsigned .app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app-unsigned
          path: macos-app-unsigned.tar
          if-no-files-found: error
          retention-days: 1

      - name: Upload unsigned CLI binary
        # The macos-cli-sign job re-signs this with Developer ID, notarizes
        # it, and assembles the final tarball with LICENSE/NOTICE bundled
        # alongside. Name does NOT start with `desktop-` so prerelease/
        # release downloads (pattern: desktop-*) skip this intermediate.
        # actions/upload-artifact@v7 preserves the executable bit on Unix,
        # but the signing job re-asserts `chmod 0755` before tarring just
        # in case.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-cli-unsigned
          path: leapmux
          if-no-files-found: error
          retention-days: 1

  macos-app-sign:
    needs: macos
    if: ${{ inputs.sign_macos }}
    runs-on: macos-latest
    environment: apple-signing
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Load tool versions
        uses: ./.github/actions/load-versions
        with:
          version-override: ${{ inputs.version }}

      - name: Setup Node.js
        # create-dmg.sh's generate-dsstore.mjs needs Node + the macos-alias
        # native module rebuilt for this runner.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          # Authenticate the action's GitHub API calls, which list releases
          # and download assets. Without the token, the calls share the 60/hr
          # unauthenticated rate limit of the runner's IP, and they fail
          # intermittently on Windows.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore dependency caches
        # Fill the Bun package cache that `task prepare-dmg-tools` installs
        # into. Go is off: this job runs no Go tool.
        uses: ./.github/actions/dependency-caches
        with:
          go: 'false'
          bun: 'true'
          populate: 'true'

      - name: Prepare disk image tools
        # Use the same dependency installation and pinned node-gyp version as the native build.
        # A native-module build failure must stop signing and retain its diagnostics.
        run: task prepare-dmg-tools

      - name: Setup Apple signing
        uses: ./.github/actions/apple-signing-setup
        with:
          certificate-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
          keychain-password: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          codesign-identity: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          api-key-base64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-key-issuer-id: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}

      - name: Download unsigned .app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-app-unsigned
          path: .

      - name: Untar unsigned .app
        run: |
          tar -xf macos-app-unsigned.tar
          rm -f macos-app-unsigned.tar

      - name: Sign and notarize
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
        run: task sign-and-notarize-darwin-app

      - name: Upload signed DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-dmg-signed
          path: LeapMuxDesktop_*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup
        if: always()
        run: bash scripts/cleanup-apple-signing.sh

  macos-cli-sign:
    # This job signs and notarizes the CLI independently of the app signing job. Both depend on
    # macos and use the apple-signing environment. Separate runners let their signing work
    # overlap. Total signing time follows the slower job instead of adding both durations.
    needs: macos
    if: ${{ inputs.sign_macos }}
    runs-on: macos-latest
    environment: apple-signing
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Load tool versions
        uses: ./.github/actions/load-versions
        with:
          version-override: ${{ inputs.version }}

      - name: Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          # Authenticate the action's GitHub API calls, which list releases
          # and download assets. Without the token, the calls share the 60/hr
          # unauthenticated rate limit of the runner's IP, and they fail
          # intermittently on Windows.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Apple signing
        uses: ./.github/actions/apple-signing-setup
        with:
          certificate-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
          keychain-password: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          codesign-identity: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          api-key-base64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-key-issuer-id: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}

      - name: Download unsigned CLI binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-cli-unsigned
          path: .

      - name: Restore executable permission on the CLI binary
        # actions/upload-artifact@v7 preserves Unix mode bits, but
        # re-assert 0755 here so a future regression in upload/download
        # behavior could not silently produce a non-executable tarball.
        run: chmod 0755 leapmux

      - name: Sign and notarize CLI
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
        run: task sign-and-notarize-darwin-cli

      - name: Upload signed CLI tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-cli
          path: leapmux_*_darwin_*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup
        if: always()
        run: bash scripts/cleanup-apple-signing.sh

  windows:
    # windows-2022, the same image that ci.yaml's windows job tests on. The
    # compiled caches are keyed by the runner image, so the two jobs share
    # them only on the same image. See ci.yaml for the reason to avoid
    # windows-latest.
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      # See the linux job: a called workflow's default checkout is the
      # caller's ref, not this workflow's `ref` input.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup build toolchain
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-override: ${{ inputs.version }}
          rust-components: clippy

      - name: Build all modules
        # Run under pwsh: Git Bash prepends /usr/bin to PATH, and
        # /usr/bin/link.exe (a Unix hard-link utility) shadows MSVC's
        # link.exe and breaks the Tauri build.
        shell: pwsh
        run: task build

      - name: Check the unchanged native build
        shell: pwsh
        run: task check-build-cache

      - name: Package CLI server zip
        shell: pwsh
        run: |
          $dir = "leapmux_${env:VERSION}_windows_amd64"
          New-Item -ItemType Directory -Path "dist/$dir" -Force | Out-Null
          Copy-Item leapmux.exe,LICENSE.md,NOTICE.md "dist/$dir"
          Compress-Archive -Path "dist/$dir" -DestinationPath "${dir}.zip" -Force

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows
          path: |
            leapmux_*_windows_amd64.zip
            LeapMuxDesktop_*.msi
          if-no-files-found: error
          retention-days: 7
