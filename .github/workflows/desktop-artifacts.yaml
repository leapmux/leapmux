name: Build desktop artifacts

# Reusable build pipeline for the desktop app + CLI server tarballs that get
# attached to GitHub releases. Called by:
#   - .github/workflows/ci.yaml      (push to main → prerelease-<ts> release)
#   - .github/workflows/release.yaml (workflow_dispatch → v<version> release)
#
# The macos-app-sign job is the only place Apple signing/notarization secrets are
# read. It declares `environment: apple-signing`, whose deployment-branch
# protection limits secret access to runs targeting `main`. Other jobs do not
# declare an environment, so they cannot read the Apple secrets even though
# the caller passes `secrets: inherit` — env-scoping still gates the secrets
# at the consuming job, not at the workflow_call boundary.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (sha or tag) to check out and build from.
        required: true
        type: string
      version:
        description: Version override (e.g. for tag-triggered runs). Empty → use versions.env.
        required: false
        type: string
        default: ''
      sign_macos:
        description: When true, run macos-app-sign to produce a Developer ID + notarized DMG.
        required: false
        type: boolean
        default: true

env:
  # Match ci.yaml: trim dev-profile debuginfo so the cached desktop/rust
  # `target/` stays small. This value is hashed into the rust-cache key, so
  # it MUST equal ci.yaml's setting or the `shared-key: desktop` cache the
  # two workflows share would split in two. Reusable workflows don't inherit
  # caller env, so it's redeclared here. See ci.yaml for the full rationale.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  linux:
    runs-on: ubuntu-24.04${{ matrix.runner_suffix }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner_suffix: ''
          - arch: arm64
            runner_suffix: '-arm'
    steps:
      # `ref` is not optional here: the `github` context in a called workflow
      # is the CALLER's, so a bare checkout takes main as of dispatch -- which,
      # on the release path, is the commit BEFORE `chore: release vX.Y.Z`. The
      # artifacts would then be built from a different tree than the tag they
      # ship under, and nothing would error, because version-override supplies
      # the right VERSION string either way.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup build toolchain
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-override: ${{ inputs.version }}
          rust-components: clippy
          rust-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate code (proto + sqlc)
        run: task generate

      - name: Install frontend dependencies
        run: task prepare-frontend

      - name: Build
        run: task build

      - name: Diagnose linuxdeploy (on failure)
        # Tauri captures linuxdeploy's stdout/stderr and silently discards
        # them on failure, leaving only "failed to run linuxdeploy" in the
        # log. Re-run the wrapper and the extracted AppRun directly so
        # their real output surfaces in the CI log. Runs only if a
        # preceding step failed, so the success path stays quiet. Mirrors
        # the matching step in ci.yaml's linux job — desktop-artifacts and
        # CI share the same Tauri linuxdeploy build path, so they share
        # the same flake surface.
        if: failure()
        run: |
          set +e
          echo "=== ~/.cache/tauri contents ==="
          ls -la ~/.cache/tauri/
          echo
          echo "=== Tauri's AppImage bundle dir ==="
          ls -la desktop/rust/target/release/bundle/appimage/ 2>/dev/null
          echo
          echo "=== linuxdeploy wrapper --version (exit=?) ==="
          ~/.cache/tauri/linuxdeploy-$(uname -m).AppImage --version
          echo "wrapper exit=$?"
          echo
          echo "=== extracted AppRun --list-plugins (exit=?) ==="
          ~/.cache/tauri/linuxdeploy-extracted/AppRun --list-plugins
          echo "AppRun exit=$?"
          echo
          echo "=== Re-run linuxdeploy against Tauri's partial AppDir ==="
          appdir="$(ls -d desktop/rust/target/release/bundle/appimage/*.AppDir 2>/dev/null | head -1)"
          if [ -n "$appdir" ]; then
            echo "appdir=$appdir"
            ~/.cache/tauri/linuxdeploy-$(uname -m).AppImage \
              --appdir "$appdir" \
              --output appimage \
              --plugin gtk 2>&1 | tail -80
            echo "direct linuxdeploy exit=${PIPESTATUS[0]}"
          else
            echo "No AppDir found — Tauri didn't reach the linuxdeploy step."
          fi
          echo
          echo "=== Go sidecar linkage (source copy) ==="
          src_sidecar="$(ls desktop/go/bin/leapmux-desktop-service-* 2>/dev/null | head -1)"
          if [ -n "$src_sidecar" ]; then
            echo "path=$src_sidecar"
            file "$src_sidecar"
            echo "--- readelf -l | grep INTERP ---"
            readelf -l "$src_sidecar" 2>&1 | grep -E 'INTERP|interpreter' || echo "(no INTERP segment — static binary)"
            echo "--- ldd output ---"
            ldd "$src_sidecar" 2>&1
            echo "ldd exit=$?"
          else
            echo "No sidecar found under desktop/go/bin/"
          fi
          echo
          echo "=== Go sidecar linkage (AppDir copy) ==="
          ad_sidecar="$(find "$appdir" -name 'leapmux-desktop-service-*' 2>/dev/null | head -1)"
          if [ -n "$ad_sidecar" ]; then
            echo "path=$ad_sidecar"
            file "$ad_sidecar"
            ldd "$ad_sidecar" 2>&1
            echo "ldd exit=$?"
          else
            echo "No sidecar found inside AppDir."
          fi
          echo
          echo "=== Toolchain sanity ==="
          echo "gcc: $(command -v gcc) $(gcc --version 2>/dev/null | head -1)"
          echo "CGO_ENABLED (go env): $(go env CGO_ENABLED)"
          echo "/lib/ld-linux-aarch64.so.1: $(ls -la /lib/ld-linux-aarch64.so.1 2>&1 || true)"

      - name: Package CLI server tarball
        run: |
          DIR="leapmux_${VERSION}_linux_${{ matrix.arch }}"
          mkdir -p "dist/${DIR}"
          cp leapmux LICENSE.md NOTICE.md "dist/${DIR}/"
          tar -czf "${DIR}.tar.gz" -C dist "${DIR}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: |
            leapmux_*_linux_${{ matrix.arch }}.tar.gz
            leapmux-desktop*.AppImage
            leapmux-desktop*.deb
          if-no-files-found: error
          retention-days: 7

  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      # See the linux job: a called workflow's default checkout is the
      # caller's ref, not this workflow's `ref` input.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup build toolchain
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-override: ${{ inputs.version }}
          rust-components: clippy
          rust-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate code (proto + sqlc)
        run: task generate

      - name: Install frontend dependencies
        run: task prepare-frontend

      - name: Build
        # MACOS_CODESIGN_IDENTITY is intentionally unset here. The .app gets
        # ad-hoc signed by Taskfile.yaml's build-desktop-darwin so it builds
        # cleanly without secrets; the macos-app-sign job below downloads the
        # unsigned .app and re-signs it with the Developer ID identity.
        run: task build

      - name: Tar unsigned .app for the signing job
        # tar preserves symlinks/permissions inside the .app bundle that
        # actions/upload-artifact's zipping does not. Name does NOT start
        # with `desktop-` so prerelease/release downloads (pattern: desktop-*)
        # skip this intermediate.
        run: tar -cf macos-app-unsigned.tar "LeapMux Desktop.app"

      - name: Upload unsigned .app
        uses: actions/upload-artifact@v7
        with:
          name: macos-app-unsigned
          path: macos-app-unsigned.tar
          if-no-files-found: error
          retention-days: 1

      - name: Upload unsigned CLI binary
        # The macos-cli-sign job re-signs this with Developer ID, notarizes
        # it, and assembles the final tarball with LICENSE/NOTICE bundled
        # alongside. Name does NOT start with `desktop-` so prerelease/
        # release downloads (pattern: desktop-*) skip this intermediate.
        # actions/upload-artifact@v7 preserves the executable bit on Unix,
        # but the signing job re-asserts `chmod 0755` before tarring just
        # in case.
        uses: actions/upload-artifact@v7
        with:
          name: macos-cli-unsigned
          path: leapmux
          if-no-files-found: error
          retention-days: 1

  macos-app-sign:
    needs: macos
    if: ${{ inputs.sign_macos }}
    runs-on: macos-latest
    environment: apple-signing
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Load tool versions
        uses: ./.github/actions/load-versions
        with:
          version-override: ${{ inputs.version }}

      - name: Setup Node.js
        # create-dmg.sh's generate-dsstore.mjs needs Node + the macos-alias
        # native module rebuilt for this runner.
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies (for create-dmg.sh)
        run: cd frontend && bun install --frozen-lockfile

      - name: Rebuild macos-alias native module
        run: cd frontend/node_modules/macos-alias && npx --yes node-gyp rebuild 2>/dev/null || true

      - name: Setup Task
        uses: arduino/setup-task@v3
        with:
          version: ${{ env.TASK_VERSION }}
          # Authenticate the action's GitHub API calls (listing releases,
          # downloading assets) so it doesn't hit the 60/hr unauthenticated
          # rate limit on shared-IP runners — has been failing intermittently
          # on Windows without it.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Apple signing
        uses: ./.github/actions/apple-signing-setup
        with:
          certificate-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
          keychain-password: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          codesign-identity: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          api-key-base64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-key-issuer-id: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}

      - name: Download unsigned .app
        uses: actions/download-artifact@v8
        with:
          name: macos-app-unsigned
          path: .

      - name: Untar unsigned .app
        run: |
          tar -xf macos-app-unsigned.tar
          rm -f macos-app-unsigned.tar

      - name: Sign and notarize
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
        run: task sign-and-notarize-darwin-app

      - name: Upload signed DMG
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-dmg-signed
          path: LeapMuxDesktop_*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -e "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          if [ -n "${APPLE_API_KEY_P8_PATH:-}" ]; then
            rm -f "$APPLE_API_KEY_P8_PATH"
          fi

  macos-cli-sign:
    # Re-signs and notarizes the leapmux Go CLI binary in parallel with
    # macos-app-sign. Both depend on `macos`, both use the apple-signing
    # environment, and both run on independent macos-latest runners so
    # the wall-clock for the signing phase is max(.app, .dmg notarizations,
    # CLI notarization) rather than the sum.
    needs: macos
    if: ${{ inputs.sign_macos }}
    runs-on: macos-latest
    environment: apple-signing
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Load tool versions
        uses: ./.github/actions/load-versions
        with:
          version-override: ${{ inputs.version }}

      - name: Setup Task
        uses: arduino/setup-task@v3
        with:
          version: ${{ env.TASK_VERSION }}
          # Authenticate the action's GitHub API calls (listing releases,
          # downloading assets) so it doesn't hit the 60/hr unauthenticated
          # rate limit on shared-IP runners — has been failing intermittently
          # on Windows without it.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Apple signing
        uses: ./.github/actions/apple-signing-setup
        with:
          certificate-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
          keychain-password: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          codesign-identity: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          api-key-base64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-key-issuer-id: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}

      - name: Download unsigned CLI binary
        uses: actions/download-artifact@v8
        with:
          name: macos-cli-unsigned
          path: .

      - name: Restore executable permission on the CLI binary
        # actions/upload-artifact@v7 preserves Unix mode bits, but
        # re-assert 0755 here so a future regression in upload/download
        # behavior could not silently produce a non-executable tarball.
        run: chmod 0755 leapmux

      - name: Sign and notarize CLI
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
        run: task sign-and-notarize-darwin-cli

      - name: Upload signed CLI tarball
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-cli
          path: leapmux_*_darwin_*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -e "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          if [ -n "${APPLE_API_KEY_P8_PATH:-}" ]; then
            rm -f "$APPLE_API_KEY_P8_PATH"
          fi

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # See the linux job: a called workflow's default checkout is the
      # caller's ref, not this workflow's `ref` input.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup build toolchain
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-override: ${{ inputs.version }}
          rust-components: clippy
          rust-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build all modules
        # Run under pwsh: Git Bash prepends /usr/bin to PATH, and
        # /usr/bin/link.exe (a Unix hard-link utility) shadows MSVC's
        # link.exe and breaks the Tauri build.
        shell: pwsh
        run: task build

      - name: Package CLI server zip
        shell: pwsh
        run: |
          $dir = "leapmux_${env:VERSION}_windows_amd64"
          New-Item -ItemType Directory -Path "dist/$dir" -Force | Out-Null
          Copy-Item leapmux.exe,LICENSE.md,NOTICE.md "dist/$dir"
          Compress-Archive -Path "dist/$dir" -DestinationPath "${dir}.zip" -Force

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: |
            leapmux_*_windows_amd64.zip
            LeapMuxDesktop_*.msi
          if-no-files-found: error
          retention-days: 7
