name: NOTICE

# NOTICE.md and NOTICE.html are committed artifacts. No normal build regenerates them. The README
# requires manual regeneration after dependency changes.
# If a dependency changes without regeneration, the distributed legal notice can become stale.
# The path filter covers dependency manifests and the notice generator.
# It includes the generated notices so direct artifact edits still require validation.
# go.work controls the workspace module list that the generator reads.
# Metadata downloads can take minutes on a cold cache, so unrelated commits skip this workflow.
on:
  push:
    branches: [main]
    paths: &notice-inputs
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - 'desktop/rust/Cargo.toml'
      - 'desktop/rust/Cargo.lock'
      - 'frontend/package.json'
      - 'frontend/bun.lock'
      - 'scripts/generate-notice.mjs'
      - 'scripts/license-overrides/**'
      - 'Taskfile.yaml'
      - 'NOTICE.md'
      - 'NOTICE.html'
      - '.github/workflows/notice.yaml'
      - '.github/actions/setup-build/action.yaml'
      - '.github/actions/build-output-cache/action.yaml'
      - '.github/actions/dependency-caches/action.yaml'
      - '.github/actions/load-versions/action.yaml'
  # An administrator can push directly to main or merge without checks. A pull-request-only
  # workflow would miss those changes.
  pull_request:
    branches: [main]
    paths: *notice-inputs

concurrency:
  group: notice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup build toolchain
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # This job reads dependency metadata without building the desktop app. It skips these
          # desktop prerequisites:
          # - Tauri system packages.
          # - The linuxdeploy download cache.
          # - The approximately 1.3 GB Rust target cache.
          # It still installs the tools that prepare-frontend requires. That target generates
          # protobuf code and spinner assets. It installs Bun dependencies also.
          setup-desktop: 'false'

      - name: Regenerate NOTICE
        run: task generate-notice

      - name: Fail if NOTICE is stale
        run: |
          if ! git diff --exit-code --stat NOTICE.md NOTICE.html; then
            echo
            echo "NOTICE.md/NOTICE.html do not match the current dependencies."
            echo "Run \`task generate-notice\` and commit the result."
            exit 1
          fi
