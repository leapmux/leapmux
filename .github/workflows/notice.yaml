name: NOTICE

# NOTICE.md and NOTICE.html are committed artifacts that no build target
# produces. README documents their regeneration as a manual step after a
# dependency change. They are therefore the one thing in the tree that can go
# stale with no message. They are also a legal artifact. When a dependency is
# added, removed or relicensed without a regeneration, the release ships a
# notice that no longer matches what the project distributes.
#
# The path filter is the whole design. Licenses can change only when a
# manifest or the generator changes, so this workflow runs on exactly those
# changes, not on every push. Each run does these downloads, which take
# minutes on a cold cache:
# * `cargo fetch`;
# * `go mod download`;
# * `bun install`.
# The dependency caches make a repeat run cheap. A run on a docs-only commit
# would still find nothing.
#
# The filter must cover two inputs that are easy to miss:
# * `go.work` is a real input, not only a workspace convenience.
#   generate-notice reads its `use (...)` list and runs
#   `go list -m -json all` across the workspace. A member that is added or
#   dropped therefore changes the module set that NOTICE describes.
# * NOTICE.md and NOTICE.html themselves. A filter that lists only the inputs
#   would let a PR edit the protected artifact by hand and match nothing.
on:
  push:
    branches: [main]
    paths: &notice-inputs
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - 'desktop/rust/Cargo.toml'
      - 'desktop/rust/Cargo.lock'
      - 'frontend/package.json'
      - 'frontend/bun.lock'
      - 'scripts/generate-notice.mjs'
      - 'scripts/license-overrides/**'
      - 'Taskfile.yaml'
      - 'NOTICE.md'
      - 'NOTICE.html'
      - '.github/workflows/notice.yaml'
      - '.github/actions/setup-build/action.yaml'
      - '.github/actions/dependency-caches/action.yaml'
      - '.github/actions/load-versions/action.yaml'
  # Commits reach main outside a PR (an admin push, a merge landed with checks
  # bypassed), and a check that only runs on pull_request would never see them.
  pull_request:
    branches: [main]
    paths: *notice-inputs

concurrency:
  group: notice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup build toolchain
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # This job reads dependency metadata and compiles nothing, so it
          # skips the Tauri system packages, the linuxdeploy download cache and
          # the ~1.3 GB Rust target cache. It still needs Go, Rust, Bun, buf
          # and Task: `task generate-notice` depends on prepare-frontend, which
          # runs `buf generate`, the spinner clone and `bun install`.
          compile: 'false'

      - name: Regenerate NOTICE
        run: task generate-notice

      - name: Fail if NOTICE is stale
        run: |
          if ! git diff --exit-code --stat NOTICE.md NOTICE.html; then
            echo
            echo "NOTICE.md/NOTICE.html do not match the current dependencies."
            echo "Run \`task generate-notice\` and commit the result."
            exit 1
          fi
