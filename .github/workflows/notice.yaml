name: NOTICE

# Always report NOTICE. Select expensive generation inside the job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: notice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: NOTICE
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load tool versions
        uses: ./.github/actions/load-versions

      - name: Setup Bun for selection
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Select NOTICE inputs
        id: inputs
        run: bun scripts/notice-inputs.mjs

      - name: Setup build toolchain
        if: steps.inputs.outputs.needed == 'true'
        uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # This job reads dependency metadata without building the desktop app. It skips these
          # desktop prerequisites:
          # - Tauri system packages.
          # - The linuxdeploy download cache.
          # - The approximately 1.3 GB Rust target cache.
          # It still installs the tools that prepare-frontend requires. That target generates
          # protobuf code and spinner assets. It installs Bun dependencies also.
          setup-desktop: 'false'

      - name: Regenerate NOTICE
        if: steps.inputs.outputs.needed == 'true'
        run: task generate-notice

      - name: Fail if NOTICE is stale
        if: steps.inputs.outputs.needed == 'true'
        run: |
          if ! git diff --exit-code --stat NOTICE.md NOTICE.html; then
            echo
            echo "NOTICE.md/NOTICE.html do not match the current dependencies."
            echo "Run \`task generate-notice\` and commit the result."
            exit 1
          fi
