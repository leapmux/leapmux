name: Publish site

# This workflow builds the Hugo and Hextra site under site/. It deploys the result to the
# leapmux-site Cloudflare Worker after relevant main-branch changes.
# The Worker uses Static Assets, not Pages. The wrangler deploy command reads
# site/wrangler.jsonc. That file specifies the Worker and its public assets directory.

# The cloudflare-publish environment supplies these secrets:
# - CLOUDFLARE_API_TOKEN with the Workers Scripts: Edit permission.
# - CLOUDFLARE_ACCOUNT_ID for the Cloudflare account.
on:
  push:
    branches: [main]
    # Deploy when a site input or this workflow changes.
    paths:
      - "site/**"
      - "icons/agents/**"
      - "frontend/tests/e2e/feature-matrix/**"
      - "versions.env"
      - ".github/actions/load-versions/action.yaml"
      - ".github/workflows/publish-site.yaml"
  workflow_dispatch:

# One deploy at a time; let an in-flight deploy finish rather than cancelling it.
concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: cloudflare-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so Hugo's enableGitInfo derives accurate per-file
          # last-modified dates. A shallow clone dates every page with the
          # latest commit.
          fetch-depth: 0

      - name: Load tool versions
        uses: ./.github/actions/load-versions

      - name: Derive the cache week
        # The weekly epoch of the site snapshots. Setup-build is not used
        # here, so this job derives the week itself.
        run: |
          cache_week="$(date -u +%G-W%V)"
          echo "CACHE_WEEK=$cache_week" >> "$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          # The built-in cache combines the module and build directories and
          # cannot exclude inherited files, so the site snapshots replace it.
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Locate the site Go build cache
        run: |
          gocache="$(go env GOCACHE)"
          echo "GOCACHE=$gocache" >> "$GITHUB_ENV"

      - name: Restore the site module downloads
        uses: ./.github/actions/dependency-caches
        with:
          go: 'true'
          go-scope: site
          bun: 'false'
          populate: 'true'

      - name: Compute the site snapshot key
        id: site-key
        env:
          CACHE_HASH: ${{ hashFiles('site/go.mod', 'site/go.sum') }}
        run: |
          key="$(node scripts/cache-snapshot.mjs key --kind site-go --hash "$CACHE_HASH" --week "$CACHE_WEEK")"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore the site build outputs
        # This workflow runs only on main, so every job is a writer and
        # passes no fallback: a missed exact key builds the site from an
        # empty Go build cache, and the save below publishes only this
        # build's outputs.
        id: site-go-restore
        uses: ./.github/actions/build-output-cache
        with:
          kind: site-go
          key: ${{ steps.site-key.outputs.key }}
          writer: 'true'

      - name: Build site
        # GOWORK=off isolates the site module from the root go.work (which lists
        # only ./backend and ./desktop/go). Hugo is a `go tool` dependency in
        # site/go.mod, so there is nothing extra to install.
        working-directory: site
        run: GOWORK=off go tool hugo --gc --minify

      - name: Save the site build outputs snapshot
        # Saved before the deploy step receives the Cloudflare token, so a
        # failed or skipped deploy cannot withhold a complete snapshot.
        if: steps.site-go-restore.outputs.save-required == 'true'
        uses: ./.github/actions/save-cache-snapshot
        with:
          kind: site-go
          key: ${{ steps.site-key.outputs.key }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install the locked site tools
        # site/bun.lock locks wrangler and its whole tree, and the release-age check of
        # Required CI covers that lockfile. Install scripts stay disabled in the job that
        # holds the Cloudflare token.
        working-directory: site
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Deploy to Cloudflare Workers
        # Run wrangler in site/ so it picks up site/wrangler.jsonc, whose ./public assets
        # dir resolves relative to that file. This is a Workers Static Assets deploy, so the
        # command is `wrangler deploy`, not `pages deploy`.
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: ./node_modules/.bin/wrangler deploy
