name: Native CLI services

on:
  schedule:
    # Monday 18:43 UTC is Tuesday 03:43 Asia/Seoul.
    - cron: '43 18 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: native-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04${{ matrix.runner_suffix }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner_suffix: ['', '-arm']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          setup-desktop: 'false'
          save-build-caches: 'false'
      - name: Verify native CLI service configuration
        run: node scripts/native-cli-ci.mjs

  macos:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          setup-desktop: 'false'
          save-build-caches: 'false'
      - name: Verify native CLI service configuration
        run: node scripts/native-cli-ci.mjs

  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        # Preserve the MSVC linker instead of Git Bash's link.exe.
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          setup-desktop: 'false'
          save-build-caches: 'false'
      - name: Verify native CLI service configuration
        run: node scripts/native-cli-ci.mjs
