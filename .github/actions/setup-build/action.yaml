name: Setup build toolchain
description: >
  Install every toolchain a LeapMux build needs (Node, Go, Rust, Bun, buf,
  protoc, Task) and restore the caches around them. Shared by ci.yaml and
  desktop-artifacts.yaml so an action-version bump is one edit instead of one
  per job.

# The OS differences live here rather than in the caller: whether apt runs,
# where Tauri caches, whether protoc and the MSVC environment are needed, and
# which shell reads versions.env are all functions of `runner.os`, so the caller
# does not have to know them. What callers DO vary -- a release version
# override, whether this job may write the Rust cache, whether it needs clippy
# -- are inputs.
#
# Checkout is deliberately NOT here: a composite action can only run once its
# own file is on disk, so the caller must check out first.
inputs:
  github-token:
    description: >
      Token for the actions that call the GitHub API (buf, Task, protoc).
      Without it they share the runner's IP against a 60/hr unauthenticated
      rate limit, which fails intermittently on hosted macOS runners.
    required: true
  version-override:
    description: >
      Value to write over VERSION from versions.env. Used by the release path,
      which builds a tagged version rather than the checked-in dev default.
    required: false
    default: ''
  rust-components:
    description: Extra rustup components, comma-separated (e.g. "clippy").
    required: false
    default: ''
  rust-save-if:
    description: >
      Whether this job may WRITE the shared Rust cache. Only push-to-main
      should: otherwise every PR saves its own ~1.3 GB blob under the shared
      `desktop` key and they evict each other against the 10 GB repo limit.
      PRs still restore main's cache.
    required: false
    default: 'false'
  compile:
    description: >
      Whether this job COMPILES anything. The three heaviest steps exist only
      for the Tauri build -- the ~20 WebKitGTK/GStreamer -dev packages, the
      linuxdeploy download cache, and restoring the ~1.3 GB Rust target cache
      -- and a job that only reads dependency metadata (`cargo fetch`,
      `cargo metadata`, `go list`) needs none of them. Set 'false' there.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup MSVC environment
      # Before anything that compiles: Rust's MSVC toolchain and the Go
      # sidecar both need cl.exe/link.exe on PATH.
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Derive cache epoch
      shell: bash
      run: echo "CACHE_WEEK=$(date -u +%G-W%V)" >> "$GITHUB_ENV"

    - name: Load tool versions
      # Shared with the macOS signing jobs, which need the env splat and none
      # of the toolchains below it.
      uses: ./.github/actions/load-versions
      with:
        version-override: ${{ inputs.version-override }}

    - name: Cache APT packages
      if: runner.os == 'Linux' && inputs.compile == 'true'
      uses: actions/cache@v6
      with:
        path: .apt-cache
        # Hash only this action: the package list lives here now, so hashing
        # the two callers as well rotated the key on every unrelated workflow
        # edit and minted a near-duplicate archive each time.
        key: apt-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_WEEK }}-${{ hashFiles('.github/actions/setup-build/action.yaml') }}
        # Fall back past the weekly epoch, as the Tauri cache below does.
        # Pinning the fallback to CACHE_WEEK meant every Linux job re-downloaded
        # the whole apt set cold each Monday.
        restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-

    - name: Configure APT cache directories
      if: runner.os == 'Linux' && inputs.compile == 'true'
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/.apt-cache/archives/partial"
        mkdir -p "$GITHUB_WORKSPACE/.apt-cache/lists/partial"
        sudo rm -f /etc/apt/apt.conf.d/docker-clean
        cat <<EOF | sudo tee /etc/apt/apt.conf.d/99github-cache
        Binary::apt::APT::Keep-Downloaded-Packages "true";
        Dir::Cache::archives "$GITHUB_WORKSPACE/.apt-cache/archives";
        Dir::State::lists "$GITHUB_WORKSPACE/.apt-cache/lists";
        EOF

    - name: Install Tauri system dependencies
      if: runner.os == 'Linux' && inputs.compile == 'true'
      shell: bash
      # GStreamer dev + runtime plugins are required for AppImages built
      # with `bundle.linux.appimage.bundleMediaFramework: true`. Without
      # them the AppImage launches to a blank window and logs
      # "GStreamer element autoaudiosink not found".
      # See https://github.com/tauri-apps/tauri/issues/4642 and
      # https://gstreamer.freedesktop.org/documentation/installing/on-linux.html.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libssl-dev \
          libsoup-3.0-dev \
          protobuf-compiler \
          xdg-utils \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libgstreamer-plugins-bad1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          gstreamer1.0-plugins-bad \
          gstreamer1.0-plugins-ugly \
          gstreamer1.0-libav \
          gstreamer1.0-tools \
          gstreamer1.0-x \
          gstreamer1.0-alsa \
          gstreamer1.0-gl \
          gstreamer1.0-gtk3 \
          gstreamer1.0-pulseaudio

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GOLANG_VERSION }}
        cache-dependency-path: |
          backend/go.sum
          desktop/go/go.sum

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: ${{ inputs.rust-components }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ env.BUN_VERSION }}

    - name: Cache Bun dependencies
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache Cargo dependencies
      # Swatinem/rust-cache replaces a raw actions/cache for desktop/rust/
      # target: it splits the key by rustc + target triple automatically, only
      # stores fingerprinted artifacts that match the current Cargo.lock, and
      # prunes stale outputs before save -- so the saved blob stays tight and a
      # RUST_VERSION bump rotates the key cleanly instead of restoring 1+ GB of
      # artifacts cargo then discards. `shared-key: desktop` keeps ci.yaml and
      # desktop-artifacts.yaml on the same key so push-to-main's
      # desktop-artifacts run reuses the cache CI just populated.
      #
      # Skipped when `compile: false`: the archive under the shared key holds
      # `target/`, so a job that only runs `cargo fetch` and `cargo metadata`
      # would pay a ~1.3 GB restore for the `~/.cargo` fraction of it.
      if: inputs.compile == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: desktop/rust
        shared-key: desktop
        save-if: ${{ inputs.rust-save-if == 'true' }}

    - name: Cache Tauri downloads
      # On Linux the cached contents (linuxdeploy AppImage, the extracted
      # AppRun, the linuxdeploy-plugin-* scripts) are post-processed by
      # desktop/rust/scripts/patch-linuxdeploy.sh, which also installs a
      # compiled wrapper built from linuxdeploy-wrapper.c. That script is
      # idempotent on a clean download but skips patches it has already left
      # behind, so on a cache hit a changed patch input would silently keep the
      # old patches until the weekly rotation -- hence hashing both inputs into
      # the Linux key. macOS and Windows caches hold unrelated tooling those
      # scripts never touch, so their key is just the weekly epoch.
      #
      # Skipped when `compile: false`: every cached artifact here is Tauri
      # bundling tooling, which only a build invokes.
      if: inputs.compile == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ runner.os == 'Linux' && '~/.cache/tauri' || runner.os == 'macOS' && '~/Library/Caches/tauri' || '~/AppData/Local/tauri' }}
        key: tauri-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_WEEK }}${{ runner.os == 'Linux' && format('-{0}', hashFiles('desktop/rust/scripts/patch-linuxdeploy.sh', 'desktop/rust/scripts/linuxdeploy-wrapper.c')) || '' }}
        # Fall back to last week's cache at the Monday CACHE_WEEK rotation
        # boundary so we don't redownload the linuxdeploy AppImage + GTK
        # plugins every Monday.
        restore-keys: tauri-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache awesome-claude-spinners
      # Spinner JSON files are fetched by `task generate-spinners` with a fresh
      # git clone every run. Caching the generated directory keyed on
      # CACHE_WEEK skips the clone within an ISO week while still refreshing
      # weekly (matching the Tauri policy above). The content is pure JSON,
      # identical across every OS/arch, so the key omits both.
      #
      # `enableCrossOsArchive` is what makes that sharing real: actions/cache
      # derives its cache *version* from the saving runner's compression tool,
      # so without it a Windows job can neither restore what Linux saved nor
      # offer what it saves. Sharing is across RUNS, not within one -- the
      # linux/macos/windows jobs carry no `needs:` and start concurrently.
      uses: actions/cache@v6
      with:
        path: frontend/src/spinners
        key: spinners-${{ env.CACHE_WEEK }}
        enableCrossOsArchive: true

    - name: Setup protoc
      # Tauri's prost-build needs protoc. Linux gets it from apt above.
      if: runner.os != 'Linux'
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ inputs.github-token }}

    - name: Setup buf
      uses: bufbuild/buf-setup-action@v1
      with:
        version: ${{ env.BUF_VERSION }}
        github_token: ${{ inputs.github-token }}

    - name: Setup Task
      uses: arduino/setup-task@v3
      with:
        version: ${{ env.TASK_VERSION }}
        repo-token: ${{ inputs.github-token }}
