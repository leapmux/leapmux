name: Setup build toolchain
description: |
  Install the build toolchains and restore their caches:
  - Node.js.
  - Go.
  - Rust.
  - Bun.
  - buf.
  - protoc.
  - Task.
  CI and artifact jobs share this setup. The NOTICE job uses it also.

# The OS differences live here, not in the caller. Each of these is a
# function of `runner.os`, so the caller does not have to know them:
# * whether apt runs;
# * where Tauri caches;
# * whether the MSVC environment is needed;
# * which shell reads versions.env.
#
# What the callers DO vary are inputs:
# * a release version override;
# * whether this job may save the compiled caches;
# * whether it needs clippy;
# * whether the optional resource monitor starts here.
#
# Checkout is deliberately NOT here: a composite action can only run once its
# own file is on disk, so the caller must check out first.
#
# A dependency archive contains downloads and uses a lockfile key. Any job can
# populate it on a miss from an isolated directory. See
# dependency-caches/action.yaml.
# A tool archive holds the pinned protoc, buf and Task binaries, keyed by the
# requested tool set and the pins of those tools. See
# setup-cli-tools/action.yaml.
# A compiled archive contains build outputs. Its key includes the toolchain and
# runner image. Only the main-branch CI platform jobs save it, and they do so
# through explicit save-cache-snapshot steps at the end of the job, after all
# required validation. The callers register the compiled-cache pruner after
# those saves.
inputs:
  version-override:
    description: >
      Value to write over VERSION from versions.env. Used by the release path,
      which builds a tagged version rather than the checked-in dev default.
    required: false
    default: ''
  rust-components:
    description: Extra rustup components, comma-separated (e.g. "clippy").
    required: false
    default: ''
  save-build-caches:
    description: >
      Whether this job may save the COMPILED caches (Go build output and the
      Rust dependency outputs). Only the ci.yaml platform jobs may: each
      completes the full build and validation for its runner on main. A subset
      job must not save, because actions/cache never replaces an existing key,
      so the first saver's partial archive would stay.
      The job ends with explicit save-cache-snapshot steps after all required
      validation, and registers the compiled-cache pruner after those saves.
    required: false
    default: 'false'
  setup-desktop:
    description: >
      Prepare desktop system dependencies and caches. Set 'false' for a job
      that reads dependency metadata without a desktop build. Go setup and
      its build cache remain active because prepare-backend compiles sqlc.
    required: false
    default: 'true'
  monitor-resources:
    description: >
      Start the optional CI resource monitor inside this setup, before the
      APT installation and every project snapshot restoration, so it observes their
      disk use. Requires Bun, which the steps above install first.
    required: false
    default: 'false'

outputs:
  go-cache:
    description: The directory of compiled Go objects.
    value: ${{ steps.go-build.outputs.gocache }}
  lint-cache:
    description: The directory of Go lint results.
    value: ${{ steps.go-build.outputs.lint-cache }}
  go-save-required:
    description: Whether this writer may publish a new snapshot.
    value: ${{ steps.go-restore.outputs.save-required }}
  go-cache-hit:
    description: Whether the restored Go output archive matched the exact key.
    value: ${{ steps.go-restore.outputs.cache-hit }}
  cache-key:
    description: The exact weekly Go output key.
    value: ${{ steps.go-build.outputs.key }}
  cache-prefix:
    description: The Go output partition used for restore and replacement.
    value: ${{ steps.go-build.outputs.restore-prefix }}
  rust-save-required:
    description: Whether this writer may publish a new snapshot.
    value: ${{ steps.rust-restore.outputs.save-required }}
  rust-cache-hit:
    description: Whether the restored Rust output archive matched the exact key.
    value: ${{ steps.rust-restore.outputs.cache-hit }}
  rust-cache-key:
    description: The exact Rust output key.
    value: ${{ steps.rust-build.outputs.key }}
  tauri-save-required:
    description: Whether this writer may publish a new snapshot.
    value: ${{ steps.tauri-restore.outputs.save-required }}
  tauri-cache-hit:
    description: Whether the restored Tauri tool archive matched the exact key.
    value: ${{ steps.tauri-restore.outputs.cache-hit }}
  tauri-cache-key:
    description: The exact Tauri tool key, which rotates with the resolved Tauri CLI version.
    value: ${{ steps.tauri-restore.outputs['cache-key'] }}
  spinner-save-required:
    description: Whether this writer may publish a new snapshot.
    value: ${{ steps.spinners-restore.outputs.save-required }}
  spinner-cache-hit:
    description: Whether the restored spinner archive matched the exact key.
    value: ${{ steps.spinners-restore.outputs.cache-hit }}
  spinner-cache-key:
    description: The exact weekly spinner key.
    value: ${{ steps.spinners-restore.outputs['cache-key'] }}

runs:
  using: composite
  steps:
    - name: Setup MSVC environment
      # Before anything that compiles: Rust's MSVC toolchain and the Go
      # sidecar both need cl.exe/link.exe on PATH.
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    - name: Derive cache key inputs
      # Runner variables are not in the `env` expression context, so this step
      # writes them where the later key expressions can read them.
      # CACHE_WEEK identifies the UTC week for every rotating cache, including Go outputs.
      # CACHE_IMAGE separates compiled caches by runner image family.
      shell: bash
      run: |
        cache_week="$(date -u +%G-W%V)"
        echo "CACHE_WEEK=$cache_week" >> "$GITHUB_ENV"
        echo "CACHE_IMAGE=${ImageOS:-unknown}" >> "$GITHUB_ENV"

    - name: Load tool versions
      # Shared with the macOS signing jobs, which need the env splat and none
      # of the toolchains below it.
      uses: ./.github/actions/load-versions
      with:
        version-override: ${{ inputs.version-override }}

    - name: Setup Bun
      # Before the monitor and the caches: the monitor runs `bun`, and the
      # Bun setup owns the installer cache, which no project snapshot touches.
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ env.BUN_VERSION }}

    - name: Start the resource monitor
      # GitHub keeps no log for a runner that it loses. The monitor publishes
      # the runner's memory, processes, disk and network to a check run,
      # which stays readable after such a loss. It starts before the APT
      # installation and every project snapshot restoration, so it observes their disk
      # use; the caller keeps the final always() stop step.
      if: inputs.monitor-resources == 'true'
      uses: ./.github/actions/ci-resource-monitor
      with:
        mode: start

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Compute tool snapshot keys
      id: tool-keys
      shell: bash
      env:
        APT_CACHE_HASH: ${{ hashFiles('.github/actions/setup-build/action.yaml') }}
      run: |
        apt="$(node scripts/cache-snapshot.mjs key --kind apt-packages --hash "$APT_CACHE_HASH" --week "$CACHE_WEEK")"
        # The Tauri CLI decides which bundler tools Tauri downloads into its
        # cache, so the resolved CLI version keys the tool archive.
        tauri_cli_hash="$(node scripts/tauri-cli-version.mjs --hash)"
        tauri="$(node scripts/cache-snapshot.mjs key --kind tauri-tools --hash "$tauri_cli_hash")"
        spinners="$(node scripts/cache-snapshot.mjs key --kind spinners --week "$CACHE_WEEK")"
        {
          echo "apt=$apt"
          echo "tauri=$tauri"
          echo "spinners=$spinners"
        } >> "$GITHUB_OUTPUT"

    - name: Prepare the APT package cache
      # Keep the downloaded .deb files after each install, and let the
      # snapshot restore into the archive directory. apt keeps only partial/
      # owned by _apt, and `lock` belongs to root.
      if: runner.os == 'Linux' && inputs.setup-desktop == 'true'
      shell: bash
      run: |
        sudo rm -f /etc/apt/apt.conf.d/docker-clean
        echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloaded-packages > /dev/null
        sudo chown "$(id -u):$(id -g)" /var/cache/apt/archives

    - name: Restore the APT package snapshot
      # Only the package files. The `lock` file and `partial/` belong to root
      # and _apt, and `tar` failed with "Permission denied" on them, so the
      # whole archive never saved. Any Linux desktop job may publish a
      # replacement, because the trim rule selects exactly the packages of
      # the successful installation. Every job is therefore a writer and
      # passes no fallback: a missed exact key downloads the package set
      # again, which the weekly key already accepted as its cost.
      id: apt-restore
      if: runner.os == 'Linux' && inputs.setup-desktop == 'true'
      uses: ./.github/actions/build-output-cache
      with:
        kind: apt-packages
        key: ${{ steps.tool-keys.outputs.apt }}
        writer: 'true'

    - name: Install Tauri system dependencies
      if: runner.os == 'Linux' && inputs.setup-desktop == 'true'
      shell: bash
      # GStreamer dev + runtime plugins are required for AppImages built
      # with `bundle.linux.appimage.bundleMediaFramework: true`. Without
      # them the AppImage launches to a blank window and logs
      # "GStreamer element autoaudiosink not found".
      # See https://github.com/tauri-apps/tauri/issues/4642 and
      # https://gstreamer.freedesktop.org/documentation/installing/on-linux.html.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libssl-dev \
          libsoup-3.0-dev \
          xdg-utils \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libgstreamer-plugins-bad1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          gstreamer1.0-plugins-bad \
          gstreamer1.0-plugins-ugly \
          gstreamer1.0-libav \
          gstreamer1.0-tools \
          gstreamer1.0-x \
          gstreamer1.0-alsa \
          gstreamer1.0-gl \
          gstreamer1.0-gtk3 \
          gstreamer1.0-pulseaudio

    - name: Save the APT package snapshot
      if: runner.os == 'Linux' && inputs.setup-desktop == 'true' && steps.apt-restore.outputs.save-required == 'true'
      uses: ./.github/actions/save-cache-snapshot
      with:
        kind: apt-packages
        key: ${{ steps.apt-restore.outputs.cache-key }}

    - name: Setup Go
      # The built-in cache is off because it combines GOMODCACHE and GOCACHE. Its post step
      # cannot repair an archive that another job saved with only some sources. Separate archives
      # preserve independent dependency and build-output ownership.
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GOLANG_VERSION }}
        cache: false

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: ${{ inputs.rust-components }}

    - name: Remove ambient Rust toolchains
      # Keep exactly the project toolchain so the compiled Rust key changes
      # only with RUST_VERSION, and so rustc fingerprints of the restored
      # snapshot match the compiler that rebuilds with them.
      if: inputs.setup-desktop == 'true'
      shell: bash
      run: |
        rustup default "$RUST_VERSION"
        while read -r toolchain; do
          toolchain="${toolchain%$'\r'}"
          [ -n "$toolchain" ] || continue
          case "$toolchain" in
            "$RUST_VERSION"|"$RUST_VERSION"-*) ;;
            *) rustup toolchain uninstall "$toolchain" ;;
          esac
        done < <(rustup toolchain list --quiet)
        remaining="$(rustup toolchain list --quiet | tr -d '\r' | grep -c .)"
        if [ "$remaining" -ne 1 ]; then
          echo "::error::Expected exactly one Rust toolchain, found $remaining" >&2
          rustup toolchain list
          exit 1
        fi

    - name: Restore the dependency caches
      id: deps
      # After the tool installs above: each fill step downloads with the tool
      # that step installed. Any job may fill and save these archives,
      # because their content is the lockfile's file set and nothing else.
      uses: ./.github/actions/dependency-caches
      with:
        populate: 'true'
        go: 'true'
        bun: 'true'

    - name: Locate the Go build caches
      id: go-build
      # golangci-lint caches in os.UserCacheDir()/golangci-lint. Do not derive
      # it with `dirname`: that splits `C:\` paths at the wrong place.
      shell: bash
      run: |
        gocache="$(go env GOCACHE)"
        case "$RUNNER_OS" in
          Windows) lint_cache="$LOCALAPPDATA\\golangci-lint" ;;
          macOS) lint_cache="$HOME/Library/Caches/golangci-lint" ;;
          *) lint_cache="${XDG_CACHE_HOME:-$HOME/.cache}/golangci-lint" ;;
        esac
        echo "GOCACHE=$gocache" >> "$GITHUB_ENV"
        echo "GOLANGCI_LINT_CACHE=$lint_cache" >> "$GITHUB_ENV"
        prefix="$(node scripts/cache-snapshot.mjs prefix --kind native-go)"
        key="$(node scripts/cache-snapshot.mjs key --kind native-go --hash '${{ hashFiles('go.work', 'backend/go.mod', 'backend/go.sum', 'desktop/go/go.mod', 'desktop/go/go.sum', 'tools/*/go.mod', 'tools/*/go.sum') }}' --week "$CACHE_WEEK")"
        {
          echo "gocache=$gocache"
          echo "lint-cache=$lint_cache"
          echo "key=$key"
          echo "restore-prefix=${prefix}"
        } >> "$GITHUB_OUTPUT"

    - name: Restore the Go build outputs
      # A writer passes no fallback: a missed exact key starts from empty
      # owned roots. A reader may fall back across dependency changes within
      # the week but never saves the resulting directory. Writers publish
      # through explicit save-cache-snapshot steps at the end of the job.
      id: go-restore
      uses: ./.github/actions/build-output-cache
      with:
        kind: native-go
        key: ${{ steps.go-build.outputs.key }}
        restore-keys: ${{ inputs.save-build-caches != 'true' && steps.go-build.outputs.restore-prefix || '' }}
        writer: ${{ inputs.save-build-caches }}

    - name: Set the Cargo debug information level
      if: inputs.setup-desktop == 'true'
      # Keep file and line numbers in panic reports. Omit variable and type
      # details to reduce the compiled archive. Every caller uses this value,
      # so the Rust cache key cannot differ through duplicated settings.
      shell: bash
      run: echo 'CARGO_PROFILE_DEV_DEBUG=line-tables-only' >> "$GITHUB_ENV"

    - name: Locate the Rust build caches
      id: rust-build
      # The key carries no weekly epoch: the trimming rule bounds the archive
      # growth, and a weekly rotation would cold-build every dependency tree
      # each Monday. The prefix separates this generation from the archives
      # of the replaced combined upstream cache.
      if: inputs.setup-desktop == 'true'
      shell: bash
      run: |
        prefix="$(node scripts/cache-snapshot.mjs prefix --kind native-rust)"
        key="$(node scripts/cache-snapshot.mjs key --kind native-rust --hash '${{ hashFiles('desktop/rust/Cargo.lock', 'desktop/rust/Cargo.toml', 'desktop/rust/.cargo/config.toml') }}')"
        {
          echo "key=$key"
          echo "restore-prefix=${prefix}"
        } >> "$GITHUB_OUTPUT"

    - name: Restore the Rust build outputs
      # The snapshot holds the trimmed dependency outputs of every profile
      # and feature configuration, the extracted -sys sources, and the Git
      # checkouts that their reuse requires. Writers publish through an
      # explicit save-cache-snapshot step at the end of the job.
      id: rust-restore
      if: inputs.setup-desktop == 'true'
      uses: ./.github/actions/build-output-cache
      with:
        kind: native-rust
        key: ${{ steps.rust-build.outputs.key }}
        restore-keys: ${{ inputs.save-build-caches != 'true' && steps.rust-build.outputs.restore-prefix || '' }}
        writer: ${{ inputs.save-build-caches }}

    - name: Restore the Cargo registry downloads
      # The compiled Rust snapshot carries sources and checkouts but not the
      # registry index and cache or the Git database; this archive holds
      # them. A population runs whenever the exact lockfile archive is
      # absent, including for a fallback Rust hit from an older lockfile.
      if: inputs.setup-desktop == 'true'
      uses: ./.github/actions/dependency-caches
      with:
        go: 'false'
        bun: 'false'
        cargo: 'true'
        populate: 'true'

    - name: Restore the Tauri tool downloads
      # The archive holds the bundler tools that the Tauri CLI downloads
      # into its cache: an AppRun, a linuxdeploy AppImage and its plugins on
      # Linux, and WiX on Windows. The CLI version decides that set, so it
      # keys the archive. An exact hit never publishes again, so the
      # appimage plugin from Tauri's `continuous` tag stays at its first
      # download until the CLI version changes.
      # macOS creates no Tauri cache directory, so this step skips there.
      # Every non-macOS job may publish a replacement after a complete
      # packaging build, so every job is a writer and passes no fallback:
      # a missed exact key means the Tauri CLI changed (or the archive is
      # gone), and downloading the tools again is the accepted cost.
      id: tauri-restore
      if: inputs.setup-desktop == 'true' && runner.os != 'macOS'
      uses: ./.github/actions/build-output-cache
      with:
        kind: tauri-tools
        key: ${{ steps.tool-keys.outputs.tauri }}
        writer: 'true'

    - name: Restore the spinner sources
      # `task generate-spinners` clones into ~/.cache/awesome-claude-spinners
      # and consumes the spinners/ subtree (see SPINNERS_CACHE_DIR in
      # Taskfile.yaml). Keyed on CACHE_WEEK to refresh weekly, with no
      # fallback: a missed key re-clones. Every job may publish a
      # replacement after a successful generation; the job registers the
      # save after its build.
      id: spinners-restore
      if: inputs.setup-desktop == 'true'
      uses: ./.github/actions/build-output-cache
      with:
        kind: spinners
        key: ${{ steps.tool-keys.outputs.spinners }}
        writer: 'true'

    - name: Setup protoc, buf and Task
      # The pinned binaries come from the cli-tools snapshot: a hit restores
      # them, a miss downloads the pinned release assets once and publishes
      # the archive for every later job.
      uses: ./.github/actions/setup-cli-tools
