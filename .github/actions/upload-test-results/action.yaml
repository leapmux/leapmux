name: Upload test results
description: Compress available test reports and logs into one downloadable archive.

runs:
  using: composite
  steps:
    - name: Compress test results
      id: archive
      if: always()
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      working-directory: ${{ github.workspace }}
      env:
        TEST_RESULTS_ARCHIVE_NAME: test-results-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ strategy.job-index || '0' }}-attempt-${{ github.run_attempt }}.tar.gz
      run: node scripts/archive-test-results.mjs

    - name: Upload the compressed archive
      if: always() && steps.archive.outcome == 'success' && steps.archive.outputs.archive != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ${{ steps.archive.outputs.archive }}
        # The file is already compressed. Upload it directly, using its filename as the artifact name.
        archive: false
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
