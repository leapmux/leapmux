name: Build Docker image
description: Build one prepared native Docker image and export its Go cache.
# setup-docker-build supplies the builder and inputs; the restore-only cache
# action runs before this composite. This action injects dependency downloads,
# imports the Go snapshot, builds and tests the image, then exports the Go
# cache mount of the current build for a writer that missed
# its exact key. The caller trims and saves the exported snapshot through
# save-cache-snapshot and registers the pruner after that save, so a failed
# build, test, or export prevents the publication.
# The tools stage uses mode=max. Final images use mode=min to exclude changing builder layers.
# Layer-cache transport failures must not block image publication.
inputs:
  variant:
    description: The alpine or ubuntu image variant.
    required: true
  arch:
    description: The amd64 or arm64 native architecture.
    required: true
  builder:
    description: The Buildx builder from setup-docker-build.
    required: true
  go-modcache:
    description: The restored Go module directory from setup-docker-build.
    required: true
  cache-path:
    description: The host directory for Docker Go build outputs.
    required: true
  writes-shared:
    description: Whether this build may save the shared Go and tools caches.
    default: 'false'
  write-snapshot:
    description: Whether the validated restore permits publication under an unoccupied key.
    default: 'false'
  build-args:
    description: The complete Docker build arguments from setup-docker-build.
    required: true
  outputs:
    description: Optional buildx exports in addition to the local image used by the runtime tests.
    default: ''
  save-caches:
    description: Whether this main-branch build may export its final-image cache.
    default: 'false'
outputs:
  digest:
    description: The digest of the built image.
    value: ${{ steps.image.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Inject the dependency downloads
      # The block scalar keeps the cache map as a JSON string. A bare mapping would become a YAML
      # object that the runner rejects.
      # The CI jobs own dependency archives, so this step performs no extraction.
      # A cold Go module download took about 155 seconds. A cold Bun install took 3.7 seconds.
      # Inject only the Go modules because a Bun cache-dance build costs more than that install.
      uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
      with:
        builder: ${{ inputs.builder }}
        cache-map: |
          {"${{ inputs.go-modcache }}": "/go/pkg/mod"}
        skip-extraction: true
        scratch-dir: ${{ runner.temp }}/cache-dance-deps

    - name: Import the Go build outputs
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        builder: ${{ inputs.builder }}
        context: .
        file: docker/Dockerfile
        target: go-cache-import
        platforms: linux/${{ inputs.arch }}
        # Importing the mount needs the tools stage before the image build
        # imports its layers. Reuse the shared tool layers at this step too.
        cache-from: type=gha,scope=tools-${{ inputs.arch }}
        build-contexts: go-cache-input=${{ inputs.cache-path }}
        build-args: |
          ${{ inputs.build-args }}
          GO_CACHE_IMPORT_TOKEN=${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.variant }}-${{ inputs.arch }}
        outputs: type=cacheonly
        push: false
      env:
        DOCKER_BUILD_SUMMARY: 'false'
        DOCKER_BUILD_RECORD_UPLOAD: 'false'

    - name: Build the tools stage
      # `mode=max` exports every layer of the tools stage, which does not
      # change with each commit. A job that only reads needs no such step:
      # the image build below imports the same scope.
      if: inputs.writes-shared == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        builder: ${{ inputs.builder }}
        context: .
        file: docker/Dockerfile
        target: tools
        platforms: linux/${{ inputs.arch }}
        outputs: type=cacheonly
        push: false
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha,scope=tools-${{ inputs.arch }}
        cache-to: type=gha,mode=max,ignore-error=true,scope=tools-${{ inputs.arch }}
      env:
        DOCKER_BUILD_SUMMARY: 'false'
        DOCKER_BUILD_RECORD_UPLOAD: 'false'

    - name: Build the image
      # `mode=min` exports only the final-image layers, so the per-commit
      # builder layers stay out of the cache. An empty `cache-to` exports
      # nothing.
      id: image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        builder: ${{ inputs.builder }}
        context: .
        file: docker/Dockerfile
        platforms: linux/${{ inputs.arch }}
        push: false
        load: true
        outputs: ${{ inputs.outputs }}
        build-args: ${{ inputs.build-args }}
        cache-from: |
          type=gha,scope=tools-${{ inputs.arch }}
          type=gha,scope=${{ inputs.variant }}-${{ inputs.arch }}
        cache-to: ${{ inputs.save-caches == 'true' && format('type=gha,mode=min,ignore-error=true,scope={0}-{1}', inputs.variant, inputs.arch) || '' }}

    - name: Setup Node.js for image tests
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup Task for image tests
      uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      with:
        version: ${{ env.TASK_VERSION }}
        repo-token: ${{ github.token }}

    - name: Test the image
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.imageid }}
      run: task test-docker IMAGE="$IMAGE"

    - name: Export the Go build cache
      # Only a writer that missed its exact key exports a replacement
      # snapshot, and only after the image passed its runtime tests. The
      # export lands in the active root that the snapshot preparation reads.
      # A stage-local token reruns the export while retaining the cache mount.
      if: inputs.writes-shared == 'true' && inputs.write-snapshot == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        builder: ${{ inputs.builder }}
        context: .
        file: docker/Dockerfile
        build-args: |
          ${{ inputs.build-args }}
          GO_CACHE_EXPORT_TOKEN=${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.variant }}-${{ inputs.arch }}
        target: go-cache-files
        platforms: linux/${{ inputs.arch }}
        outputs: type=local,dest=${{ inputs.cache-path }}
        push: false
      env:
        DOCKER_BUILD_SUMMARY: 'false'
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
