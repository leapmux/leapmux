name: Dependency caches
description: |
  Restore dependency archives and optionally populate each missing archive
  from an isolated directory:
  - Go modules (workspace scope or site scope).
  - Bun packages.
  - Cargo registry files.

# Dependency-cache policy, shared by every job that downloads dependencies:
#
# * The key is the lockfile hash only, under the generation prefix of the
#   policy registry (scripts/cache-policy.mjs). No compiler or toolchain
#   version is in the key, because a toolchain change does not change what
#   the lockfile lists.
# * On a miss, the download runs with the tool's cache pointed at an EMPTY
#   isolated payload directory, so the archive can only hold files of the
#   current dependency declarations. The payload is copied into the active
#   downloads without removing them, saved immediately, and the staging is
#   cleaned in every publication outcome.
# * There are no restore keys. An archive holds exactly the current
#   declarations' file set, so it cannot grow with a stale prefix match.
# * Each archive is per OS. @actions/cache stores each path relative to the
#   workspace. Windows places the workspace on D: and the home directory on
#   C:. An archive from another operating system would restore paths to the
#   wrong drive. The Linux architectures share Go archives because their
#   path strings match. Bun archives remain per architecture because Bun
#   installs platform-specific packages.
# Callers must check out first, because hashFiles reads the workspace
# lockfiles, and setup Node.js first, because the policy CLI runs on node.
inputs:
  go:
    description: Restore the Go module downloads.
    required: false
    default: 'true'
  go-scope:
    description: The workspace modules or the site modules.
    required: false
    default: 'workspace'
  bun:
    description: Restore the Bun package downloads.
    required: false
    default: 'true'
  cargo:
    description: >
      Restore the Cargo registry downloads. Requires `cargo` and `CARGO_HOME`
      in the environment for a population, which Setup Rust supplies.
    required: false
    default: 'false'
  populate:
    description: >
      On a restore miss, run the full download into an isolated directory for
      each selected ecosystem and save the archive at once. Requires that
      ecosystem's tool. With 'false', this action only restores and returns
      an empty usable directory on a miss.
    required: false
    default: 'false'

outputs:
  go-modcache:
    description: The Go module cache directory that holds `cache/download`.
    value: ${{ steps.paths.outputs.go-modcache }}
  bun-cache:
    description: The Bun install cache directory.
    value: ${{ steps.paths.outputs.bun-cache }}

runs:
  using: composite
  steps:
    - name: Set the dependency cache locations
      id: paths
      # Write the tools' own defaults explicitly, so that each cache path and
      # each tool cannot disagree about where the downloads live. The payload
      # roots and the keys come from the policy registry, so no workflow text
      # spells a cache layout.
      shell: bash
      env:
        GO_SCOPE: ${{ inputs.go-scope }}
        GO_WORKSPACE_HASH: ${{ hashFiles('go.work', 'backend/go.mod', 'backend/go.sum', 'desktop/go/go.mod', 'desktop/go/go.sum', 'tools/*/go.mod', 'tools/*/go.sum') }}
        GO_SITE_HASH: ${{ hashFiles('site/go.mod', 'site/go.sum') }}
        BUN_HASH: ${{ hashFiles('frontend/bun.lock') }}
        CARGO_HASH: ${{ hashFiles('desktop/rust/Cargo.lock') }}
      run: |
        case "$GO_SCOPE" in
          site) go_kind=site-go-modules; go_hash="$GO_SITE_HASH"; go_directory=site; go_work=off ;;
          workspace) go_kind=go-modules; go_hash="$GO_WORKSPACE_HASH"; go_directory=.; go_work='' ;;
          *) echo "Invalid go-scope: $GO_SCOPE" >&2; exit 1 ;;
        esac
        gomodcache="$(node scripts/cache-snapshot.mjs active-path --kind "$go_kind" --root gomod)"
        bun_cache="$(node scripts/cache-snapshot.mjs active-path --kind bun-packages --root bun-cache)"
        {
          echo "GOMODCACHE=$gomodcache"
          echo "BUN_INSTALL_CACHE_DIR=$bun_cache"
        } >> "$GITHUB_ENV"
        {
          echo "go-modcache=$gomodcache"
          echo "bun-cache=$bun_cache"
          echo "go-kind=$go_kind"
          echo "go-directory=$go_directory"
          echo "go-work=$go_work"
          echo "go-key=$(node scripts/cache-snapshot.mjs key --kind "$go_kind" --hash "$go_hash")"
          echo "go-payload=$(node scripts/cache-snapshot.mjs payload-path --kind "$go_kind" --root gomod)"
          echo "bun-key=$(node scripts/cache-snapshot.mjs key --kind bun-packages --hash "$BUN_HASH")"
          echo "bun-payload=$(node scripts/cache-snapshot.mjs payload-path --kind bun-packages --root bun-cache)"
          echo "cargo-key=$(node scripts/cache-snapshot.mjs key --kind cargo-downloads --hash "$CARGO_HASH")"
          echo "cargo-payload=$(node scripts/cache-snapshot.mjs payload-path --kind cargo-downloads --root cargo-home)"
        } >> "$GITHUB_OUTPUT"

    # --- Go modules -----------------------------------------------------

    - name: Restore the Go module downloads
      id: go
      if: inputs.go == 'true'
      uses: ./.github/actions/build-output-cache
      with:
        kind: ${{ steps.paths.outputs.go-kind }}
        key: ${{ steps.paths.outputs.go-key }}
        writer: ${{ inputs.populate }}

    - name: Download the Go modules into the isolated payload
      # Populate the workspace and each isolated tool graph in the same payload.
      # The site scope downloads only its own graph with GOWORK=off.
      if: inputs.go == 'true' && inputs.populate == 'true' && steps.go.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ steps.paths.outputs.go-directory }}
      env:
        GOMODCACHE: ${{ steps.paths.outputs.go-payload }}
        GOWORK: ${{ steps.paths.outputs.go-work }}
        GO_SCOPE: ${{ inputs.go-scope }}
      run: |
        if [ "$GO_SCOPE" = 'site' ]; then
          go mod download
        else
          node scripts/download-go-modules.mjs
        fi

    - name: Publish the Go module downloads to the active cache
      if: inputs.go == 'true' && inputs.populate == 'true' && steps.go.outputs.cache-hit != 'true'
      shell: bash
      env:
        LEAPMUX_CACHE_KIND: ${{ steps.paths.outputs.go-kind }}
        LEAPMUX_CACHE_KEY: ${{ steps.paths.outputs.go-key }}
      run: node scripts/cache-snapshot.mjs publish-dependency --kind "$LEAPMUX_CACHE_KIND" --key "$LEAPMUX_CACHE_KEY"

    - name: Save the Go module archive
      if: inputs.go == 'true' && inputs.populate == 'true' && steps.go.outputs.save-required == 'true'
      uses: ./.github/actions/save-cache-snapshot
      with:
        kind: ${{ steps.paths.outputs.go-kind }}
        key: ${{ steps.paths.outputs.go-key }}

    - name: Clean the Go module staging
      # A restore-only caller or an exact hit never saves, so the restored
      # staging payload has no future after activation copied it.
      if: always() && inputs.go == 'true' && steps.paths.outcome == 'success'
      shell: bash
      run: node scripts/cache-snapshot.mjs cleanup --kind "${{ steps.paths.outputs.go-kind }}"

    # --- Bun packages ---------------------------------------------------

    - name: Restore the Bun package downloads
      id: bun
      if: inputs.bun == 'true'
      uses: ./.github/actions/build-output-cache
      with:
        kind: bun-packages
        key: ${{ steps.paths.outputs.bun-key }}
        writer: ${{ inputs.populate }}

    - name: Install the Bun packages into the isolated payload
      if: inputs.bun == 'true' && inputs.populate == 'true' && steps.bun.outputs.cache-hit != 'true'
      shell: bash
      working-directory: frontend
      env:
        BUN_INSTALL_CACHE_DIR: ${{ steps.paths.outputs.bun-payload }}
      run: bun install --frozen-lockfile --ignore-scripts

    - name: Publish the Bun packages to the active cache
      if: inputs.bun == 'true' && inputs.populate == 'true' && steps.bun.outputs.cache-hit != 'true'
      shell: bash
      env:
        LEAPMUX_CACHE_KIND: bun-packages
        LEAPMUX_CACHE_KEY: ${{ steps.paths.outputs.bun-key }}
      run: node scripts/cache-snapshot.mjs publish-dependency --kind "$LEAPMUX_CACHE_KIND" --key "$LEAPMUX_CACHE_KEY"

    - name: Save the Bun package archive
      if: inputs.bun == 'true' && inputs.populate == 'true' && steps.bun.outputs.save-required == 'true'
      uses: ./.github/actions/save-cache-snapshot
      with:
        kind: bun-packages
        key: ${{ steps.paths.outputs.bun-key }}

    - name: Clean the Bun package staging
      if: always() && inputs.bun == 'true' && steps.paths.outcome == 'success'
      shell: bash
      run: node scripts/cache-snapshot.mjs cleanup --kind bun-packages

    # --- Cargo registry -------------------------------------------------

    - name: Restore the Cargo registry downloads
      id: cargo
      if: inputs.cargo == 'true'
      uses: ./.github/actions/build-output-cache
      with:
        kind: cargo-downloads
        key: ${{ steps.paths.outputs.cargo-key }}
        writer: ${{ inputs.populate }}

    - name: Fetch the Cargo registry into the isolated payload
      # Without `--target`, `cargo fetch` reads the lockfile and fetches the
      # crates for every platform. The isolated CARGO_HOME keeps the Rust
      # toolchain installation outside the download directory.
      if: inputs.cargo == 'true' && inputs.populate == 'true' && steps.cargo.outputs.cache-hit != 'true'
      shell: bash
      working-directory: desktop/rust
      env:
        CARGO_HOME: ${{ steps.paths.outputs.cargo-payload }}
      run: cargo fetch --locked

    - name: Publish the Cargo registry to the active cache
      if: inputs.cargo == 'true' && inputs.populate == 'true' && steps.cargo.outputs.cache-hit != 'true'
      shell: bash
      env:
        LEAPMUX_CACHE_KIND: cargo-downloads
        LEAPMUX_CACHE_KEY: ${{ steps.paths.outputs.cargo-key }}
      run: node scripts/cache-snapshot.mjs publish-dependency --kind "$LEAPMUX_CACHE_KIND" --key "$LEAPMUX_CACHE_KEY"

    - name: Save the Cargo registry archive
      if: inputs.cargo == 'true' && inputs.populate == 'true' && steps.cargo.outputs.save-required == 'true'
      uses: ./.github/actions/save-cache-snapshot
      with:
        kind: cargo-downloads
        key: ${{ steps.paths.outputs.cargo-key }}

    - name: Clean the Cargo registry staging
      if: always() && inputs.cargo == 'true' && steps.paths.outcome == 'success'
      shell: bash
      run: node scripts/cache-snapshot.mjs cleanup --kind cargo-downloads
