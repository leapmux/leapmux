name: Setup cached CLI tools
description: |
  Install the pinned protoc, buf and Task binaries from versions.env through
  the cli-tools cache snapshot: a hit restores them from the archive, a miss
  downloads the pinned release assets once and publishes the archive for
  every later job. The tools directory joins the PATH for the following
  steps.

# Callers check out first (the download and cache scripts live in the tree),
# run load-versions first (the pins live in versions.env), and set up Node.js
# with the NODE_VERSION pin first (the steps run those scripts with node).
#
# A job that runs only Task passes `tools: task` and never downloads protoc
# or buf. The archive key covers the requested tool set, the pinned versions
# of exactly those tools, and the download recipe (the installer and its
# table of pinned asset digests), so each archive holds exactly the binaries
# that its key declares and a pin of one tool never rotates the archive of a
# job that installs only another.
#
# Every tool set restores into the same tools directory, so a job runs this
# action for one tool set only. A second call with another tool set would
# replace the first set's binaries; the Locate step refuses it.
#
# Every job that restores is also a writer: actions/cache never replaces an
# existing key, so the first job to save publishes the archive and every
# later job hits it. A missed exact key means that the tool set, a pin or
# the download recipe changed, or that the archive is gone; downloading the
# release assets again is the accepted cost.
inputs:
  tools:
    description: >
      Comma-separated tool subset to install. Any of protoc, buf and task.
    required: false
    default: 'protoc,buf,task'

runs:
  using: composite
  steps:
    - name: Locate the tool snapshot
      id: tools
      shell: bash
      env:
        LEAPMUX_CLI_TOOLS: ${{ inputs.tools }}
        DOWNLOAD_RECIPE_HASH: ${{ hashFiles('scripts/download-cli-tools.mjs', 'scripts/cli-tools.sha256') }}
      run: |
        # The key carries two hash segments: the download recipe, and the
        # requested tool set with its pins. An empty recipe hash fails the
        # key validation instead of producing a key that never rotates.
        identity_hash="$(node scripts/download-cli-tools.mjs --tools "$LEAPMUX_CLI_TOOLS" --identity)"
        key="$(node scripts/cache-snapshot.mjs key --kind cli-tools --hash "$DOWNLOAD_RECIPE_HASH-$identity_hash")"
        bin_dir="$(node scripts/download-cli-tools.mjs --bin-dir)"
        if [ -n "${LEAPMUX_CLI_TOOLS_KEY:-}" ] && [ "$LEAPMUX_CLI_TOOLS_KEY" != "$key" ]; then
          echo "::error::setup-cli-tools already installed another tool set in this job. Every tool set uses the same tools directory, so request every tool that the job needs in one call."
          exit 1
        fi
        echo "LEAPMUX_CLI_TOOLS_KEY=$key" >> "$GITHUB_ENV"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        # The directory joins the PATH of the following steps only, so the
        # entry is in place before the restore or the download fills it.
        echo "$bin_dir" >> "$GITHUB_PATH"

    - name: Restore the tool snapshot
      id: tools-restore
      uses: ./.github/actions/build-output-cache
      with:
        kind: cli-tools
        key: ${{ steps.tools.outputs.key }}
        writer: 'true'

    - name: Download the pinned tools
      if: steps.tools-restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        LEAPMUX_CLI_TOOLS: ${{ inputs.tools }}
      run: node scripts/download-cli-tools.mjs --tools "$LEAPMUX_CLI_TOOLS"

    - name: Save the tool snapshot
      if: steps.tools-restore.outputs.save-required == 'true'
      uses: ./.github/actions/save-cache-snapshot
      with:
        kind: cli-tools
        key: ${{ steps.tools.outputs.key }}
