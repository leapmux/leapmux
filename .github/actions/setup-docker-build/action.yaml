name: Setup Docker build
description: Prepare the native Docker builder and cache inputs.
inputs:
  variant:
    description: The alpine or ubuntu image variant.
    required: true
  arch:
    description: The amd64 or arm64 native architecture.
    required: true
  version-override:
    description: An optional release version that replaces VERSION from versions.env.
    default: ''
  save-caches:
    description: Permit cache writes for a main-branch push or release.
    default: 'false'
outputs:
  builder:
    description: The Buildx builder name.
    value: ${{ steps.buildx.outputs.name }}
  go-modcache:
    description: The restored Go module directory.
    value: ${{ steps.deps.outputs.go-modcache }}
  cache-path:
    description: The host directory for Docker Go build outputs.
    value: ${{ steps.plan.outputs.cache-path }}
  cache-key:
    description: The weekly Docker Go output key.
    value: ${{ steps.plan.outputs.key }}
  cache-prefix:
    description: The Docker Go output partition used for restore and replacement.
    value: ${{ steps.plan.outputs.restore-prefix }}
  writes-shared:
    description: Whether this variant may save the shared Go and tools caches.
    value: ${{ steps.plan.outputs.writes-shared }}
  build-args:
    description: The complete Docker build arguments.
    value: ${{ steps.plan.outputs.build-args }}
runs:
  using: composite
  steps:
    - name: Validate the inputs
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        VARIANT: ${{ inputs.variant }}
      run: |
        case "$VARIANT" in
          alpine|ubuntu) ;;
          *)
            echo "::error::variant must be alpine or ubuntu, got '$VARIANT'" >&2
            exit 1
            ;;
        esac
        case "$RUNNER_ARCH" in
          X64) native=amd64 ;;
          ARM64) native=arm64 ;;
          *)
            echo "::error::Unsupported RUNNER_ARCH: $RUNNER_ARCH" >&2
            exit 1
            ;;
        esac
        if [ "$ARCH" != "$native" ]; then
          echo "::error::arch must match the runner architecture ($native), got '$ARCH'" >&2
          exit 1
        fi

    - name: Load tool versions
      uses: ./.github/actions/load-versions
      with:
        version-override: ${{ inputs.version-override }}

    - name: Write git metadata
      shell: bash
      run: |
        echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
        echo "COMMIT_TIME=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

    - name: Setup Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Restore dependency caches
      # Restore only because this job runs no Go tool and cannot populate the archive.
      # Bun caching is off. A cold Docker build installed 991 npm packages in 3.7 seconds. The
      # extra cache-dance build would cost more than it saves.
      # buildkit-cache-dance deletes the host source directory after injection. No later step may
      # read steps.deps.outputs.go-modcache.
      id: deps
      uses: ./.github/actions/dependency-caches
      with:
        go: 'true'
        bun: 'false'
        populate: 'false'

    - name: Define the build inputs
      id: plan
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        SAVE_CACHES: ${{ inputs.save-caches }}
        VARIANT: ${{ inputs.variant }}
      run: |
        if [ "$VARIANT" = "alpine" ]; then
          base_image="$ALPINE_IMAGE"
        else
          base_image="$UBUNTU_IMAGE"
        fi
        if [ "$SAVE_CACHES" = "true" ]; then
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::Docker cache writes require the main branch.' >&2
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo '::error::This event cannot write Docker caches.' >&2; exit 1 ;;
          esac
        fi
        writes_shared=false
        if [ "$SAVE_CACHES" = "true" ] && [ "$VARIANT" = "alpine" ]; then
          writes_shared=true
        fi
        hash='${{ hashFiles('go.work', 'backend/go.mod', 'backend/go.sum', 'desktop/go/go.mod', 'desktop/go/go.sum') }}'
        week="$(date -u +%G-W%V)"
        prefix="docker-go-build-${ARCH}-go${GOLANG_VERSION}-"
        {
          echo "writes-shared=$writes_shared"
          echo "key=${prefix}${hash}-${week}"
          echo "restore-prefix=${prefix}"
          echo "cache-path=$RUNNER_TEMP/docker-go-build"
          echo "build-args<<LEAPMUX_BUILD_ARGS"
          echo "BASE_IMAGE=$base_image"
          echo "BUF_VERSION=$BUF_VERSION"
          echo "TASK_VERSION=$TASK_VERSION"
          echo "S6_OVERLAY_VERSION=$S6_OVERLAY_VERSION"
          echo "BUN_VERSION=$BUN_VERSION"
          echo "NODE_VERSION=$NODE_VERSION"
          echo "GOLANG_VERSION=$GOLANG_VERSION"
          echo "VERSION=$VERSION"
          echo "COMMIT_HASH=$COMMIT_HASH"
          echo "COMMIT_TIME=$COMMIT_TIME"
          echo "LEAPMUX_BUILD_ARGS"
        } >> "$GITHUB_OUTPUT"
