name: Upload end-to-end failure reports
description: Retain Playwright reports and launcher logs from failed tests.

runs:
  using: composite
  steps:
    - name: Upload reports and logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: e2e-failure-reports-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-attempt-${{ github.run_attempt }}
        # Passing launcher tests remove their fixtures. Retained fixtures identify outer test failures,
        # including a cleanup failure after Playwright passes. Select evidence explicitly: the fixture's
        # frontend directory contains a node_modules junction, and other .tmp directories hold command environments.
        path: |
          .tmp/e2e-launcher-fixture-*/retained-artifacts/
          .tmp/e2e-launcher-fixture-*/launcher-artifacts/
          .tmp/e2e-launcher-fixture-*/launcher-console-*.log
          .tmp/e2e-launcher-fixture-*/*.json
          .tmp/e2e-launcher-fixture-*/records/
          frontend/test-results/
          frontend/playwright-report/
          frontend/blob-report/
        # .tmp and Playwright's last-run state are hidden paths.
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
