syntax = "proto3";
package leapmux.desktop.v1;

// --- Top-level wire message ---

message Frame {
  oneof message {
    Request request = 1;
    Response response = 2;
    Event event = 3;
  }
}

// --- Requests (Rust → Go) ---

message Request {
  uint64 id = 1;
  oneof method {
    GetConfigRequest get_config = 10;
    SetWindowSizeRequest set_window_size = 11;
    GetBuildInfoRequest get_build_info = 12;
    CheckFullDiskAccessRequest check_full_disk_access = 13;
    GetSidecarInfoRequest get_sidecar_info = 14;
    GetStartupInfoRequest get_startup_info = 15;
    OpenFullDiskAccessSettingsRequest open_full_disk_access_settings = 16;
    ConnectSoloRequest connect_solo = 17;
    ConnectDistributedRequest connect_distributed = 18;
    ProxyHttpRequest proxy_http = 19;
    OpenChannelRelayRequest open_channel_relay = 20;
    SendChannelMessageRequest send_channel_message = 21;
    CloseChannelRelayRequest close_channel_relay = 22;
    SwitchModeRequest switch_mode = 23;
    CreateTunnelRequest create_tunnel = 24;
    DeleteTunnelRequest delete_tunnel = 25;
    ListTunnelsRequest list_tunnels = 26;
    ShutdownRequest shutdown = 27;
    ListEditorsRequest list_editors = 28;
    OpenInEditorRequest open_in_editor = 29;
    // UserEvents relay: the webview cannot directly dial the
    // unix-socket hub for /ws/userevents, so the sidecar opens the WS
    // on its behalf and proxies inbound frames as Tauri events.
    // Mirrors the OpenChannelRelay / CloseChannelRelay pattern but
    // is read-only — the frontend never writes to /ws/userevents.
    OpenUserEventsRelayRequest open_user_events_relay = 30;
    CloseUserEventsRelayRequest close_user_events_relay = 31;
    CliPathStatusRequest cli_path_status = 32;
    CliInstallSymlinkRequest cli_install_symlink = 33;
    // Tear down every tunnel and its pooled E2EE channels WITHOUT dropping the
    // sidecar<->Hub connection. The frontend fires this on a logout / auth
    // change so a distributed-mode user switch cannot leave the previous user's
    // tunnels relaying (or their cached channels reusable) under the old
    // identity -- the sidecar has no identity of its own to key that on.
    ResetTunnelsRequest reset_tunnels = 34;
    // Cache the resolved Desktop preferences on this device. See
    // SetDesktopBehaviorRequest below for why the shell needs a copy at all.
    SetDesktopBehaviorRequest set_desktop_behavior = 35;
  }
}

// Parameterless requests
message GetConfigRequest {}
message GetBuildInfoRequest {}
message GetStartupInfoRequest {}
message CheckFullDiskAccessRequest {}
message GetSidecarInfoRequest {}
message OpenFullDiskAccessSettingsRequest {}
message ConnectSoloRequest {}
// relay_id names WHICH relay the caller means (both for the channel relay below and
// for the user-events relay further down). The frontend already tracks a
// per-wrapper id to decide who owns the relay, but that decision was made in JS and
// never crossed the wire, so the sidecar had to infer the caller's intent from the
// order its requests arrived in.
//
// It cannot: RPCSession dispatches every request on its own goroutine with no
// ordering (see desktop/go/rpc.go), so a close sent for relay A can execute AFTER a
// later open adopted the relay as B -- tearing down the relay B just took ownership
// of. The teardown cancels the relay context before the read loop can emit, so no
// channel:close event ever reaches the frontend: the socket stays readyState=OPEN
// forever, ensureWebSocket keeps early-returning, and every worker call fails until
// the page is reloaded.
//
// Carrying the id lets the sidecar compare against the current owner and ignore a
// stale close, which makes the ordering mechanical rather than a property of the
// Go scheduler.
message OpenChannelRelayRequest {
  uint64 relay_id = 1;
}
message CloseChannelRelayRequest {
  uint64 relay_id = 1;
}
message SwitchModeRequest {}
message ListTunnelsRequest {}
message ResetTunnelsRequest {}
message ShutdownRequest {}
message CliPathStatusRequest {}

// CliInstallSymlinkRequest creates the on-PATH symlink for the bundled
// `leapmux` CLI. `force` controls overwriting an existing entry at the
// symlink destination: when false (default), a regular (non-symlink) file
// at the destination causes RESULT_ALREADY_EXISTS_REAL_FILE so the UI can
// confirm with the user before clobbering it. When true, any existing file
// or symlink is removed before the new symlink is created. Either way, a
// dangling/outdated symlink is silently replaced — the prompt only guards
// against clobbering a real file the user explicitly put there.
message CliInstallSymlinkRequest {
  bool force = 1;
}

// OpenUserEventsRelay names the user subscription the sidecar should
// establish. `workspace_ids` is empty for the standard "all my
// workspaces" subscription; non-empty narrows the filter exactly
// like the URL-query equivalent on the direct WebSocket path.
//
// relay_id carries the same ownership claim as the channel relay's (see above), and
// additionally orders the OPENS: the sidecar force-restarts the user-events relay on
// every open, so an open that ran late must abandon its own dial rather than restart
// over a newer one. The frontend hands out ids in dispatch order, which is the only
// order that reflects the caller's intent.
message OpenUserEventsRelayRequest {
  uint64 relay_id = 1;
  repeated string workspace_ids = 2;
  // Resume cursor for a reconnecting client: the last-applied canonical HLC
  // ("<physical>.<logical>.<client_id>") plus the epoch it was seen under. The
  // sidecar threads these into the /ws/userevents URL so the hub can ship a
  // ResumeDelta instead of a full snapshot. Both are strings (Tauri IPC +
  // protobuf-over-sidecar carry no bigint); absent on a first connect, which
  // the hub treats as a full-snapshot connect.
  optional string resume_hlc = 3;
  optional string resume_epoch = 4;
}

message CloseUserEventsRelayRequest {
  uint64 relay_id = 1;
}

message ListEditorsRequest {
  // When true, bypass the cached detection result and re-probe the
  // filesystem. Used by the "Refresh editor list" UI action.
  bool refresh = 1;
}

// Parameterized requests
message SetWindowSizeRequest {
  int32 width = 1;
  int32 height = 2;
  WindowMode mode = 3;
}

// SetDesktopBehavior caches the resolved Desktop account preferences on this
// device. The shell must decide tray creation and the initial window state
// BEFORE the webview exists, and it can read neither the browser's storage nor
// the account blob at that point -- so the webview pushes the resolved values
// down and the sidecar keeps them beside the window geometry.
//
// The cache flows ONE WAY. The account setting is the source of truth and
// every push rewrites the whole set; nothing here is ever read back into a
// preference. `start_on_login` is deliberately absent: the operating system's
// login-item registration is that setting's state, the shell never needs to
// read it back, and a copy would be a second authority over a fact the OS owns.
message SetDesktopBehaviorRequest {
  bool tray_enabled = 1;
  TrayOnClose tray_on_close = 2;
  TrayOnMinimize tray_on_minimize = 3;
  StartMinimized start_minimized = 4;
}

message ConnectDistributedRequest {
  string hub_url = 1;
}

message ProxyHttpRequest {
  string method = 1;
  string path = 2;
  map<string, string> headers = 3;
  bytes body = 4;
}

message SendChannelMessageRequest {
  bytes data = 1;
}

message CreateTunnelRequest {
  TunnelConfig config = 1;
}

message DeleteTunnelRequest {
  string tunnel_id = 1;
}

message OpenInEditorRequest {
  string editor_id = 1;
  string path = 2;
}

// --- Responses (Go → Rust) ---

message Response {
  uint64 id = 1;
  string error = 2;
  oneof result {
    DesktopConfig config = 10;
    SetWindowSizeResponse set_window_size = 11;
    BuildInfo build_info = 12;
    BoolValue bool_value = 13;
    LifecycleResult lifecycle = 14;
    ProxyHttpResponse proxy_http = 15;
    CreateTunnelResponse create_tunnel = 16;
    ListTunnelsResponse list_tunnels = 17;
    StartupInfo startup_info = 18;
    SidecarInfo sidecar_info = 19;
    ListEditorsResponse list_editors = 20;
    CliPathStatusResponse cli_path_status = 21;
    CliInstallSymlinkResponse cli_install_symlink = 22;
    SetDesktopBehaviorResponse set_desktop_behavior = 23;
  }
}

// --- CLI PATH integration (macOS) ---
//
// CliPathStatusResponse classifies whether the `leapmux` CLI shipped inside
// the desktop app bundle is discoverable on the user's PATH. Used by the
// frontend to offer a one-click symlink install at /usr/local/bin/leapmux.
// On non-darwin builds the sidecar always returns STATE_UNAVAILABLE.
message CliPathStatusResponse {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_OK = 1;          // leapmux on PATH and (realpath or sha256) matches the bundled binary
    STATE_MISSING = 2;     // leapmux not on PATH; symlink target reported in `target`
    STATE_MISMATCH = 3;    // leapmux on PATH but is a different binary (different content); path reported in `resolved`
    STATE_UNAVAILABLE = 4; // not applicable (non-macOS, or bundled binary absent — dev runs)
  }
  // TargetKind describes what (if anything) currently exists at the
  // install destination (`target` below). The UI uses this to decide
  // upfront whether the Install button needs a "replaces existing file"
  // warning and whether to send `force=true` — without it, MISSING +
  // non-exec real file at the destination requires a two-click flow
  // (Install → ALREADY_EXISTS_REAL_FILE → Replace).
  enum TargetKind {
    TARGET_KIND_UNSPECIFIED = 0;  // permission error or unclassifiable; clients should treat as REGULAR_FILE (safer prompt)
    TARGET_KIND_ABSENT = 1;       // nothing at target path
    TARGET_KIND_SYMLINK = 2;      // any symlink (valid, dangling, points elsewhere)
    TARGET_KIND_REGULAR_FILE = 3; // user-placed file (non-symlink)
  }
  State state = 1;
  string bundled = 2;    // absolute path to the bundled leapmux inside the .app
  string resolved = 3;   // absolute on-PATH path; only set when state = STATE_MISMATCH
  string target = 4;     // suggested install destination; only set when state = STATE_MISSING
  TargetKind target_kind = 5; // populated for every state; describes what's at `target` (or cliSymlinkDst when target is empty)
}

// CliInstallSymlinkResponse reports the outcome of attempting to create the
// symlink at /usr/local/bin/leapmux. NEEDS_SUDO surfaces the exact sudo
// command for the UI to display; PARENT_MISSING fires when /usr/local/bin
// itself is absent (clean Apple Silicon without Homebrew).
message CliInstallSymlinkResponse {
  enum Result {
    RESULT_UNSPECIFIED = 0;
    RESULT_OK = 1;
    RESULT_NEEDS_SUDO = 2;
    RESULT_ALREADY_EXISTS_REAL_FILE = 3;
    RESULT_PARENT_MISSING = 4;
    RESULT_IO_ERROR = 5;
  }
  Result result = 1;
  string command = 2; // populated for NEEDS_SUDO / PARENT_MISSING (suggested sudo command)
  string path = 3;    // populated for ALREADY_EXISTS_REAL_FILE / PARENT_MISSING
  string message = 4; // populated for IO_ERROR
}

message SetWindowSizeResponse {}
message SetDesktopBehaviorResponse {}
message BoolValue { bool value = 1; }
message LifecycleResult {
  SidecarInfo sidecar_info = 1;
  // Cleanup failures are post-commit warnings. Top-level Response.error means
  // the requested lifecycle transition did not commit.
  repeated string cleanup_errors = 2;
}

message HeaderValues {
  repeated string values = 1;
}

message ProxyHttpResponse {
  int32 status = 1;
  map<string, HeaderValues> headers = 2;
  bytes body = 3;
}

message CreateTunnelResponse {
  TunnelInfo info = 1;
}

message ListTunnelsResponse {
  repeated TunnelInfo tunnels = 1;
}

message ListEditorsResponse {
  repeated DetectedEditor editors = 1;
}

message DetectedEditor {
  string id = 1;
  string display_name = 2;
}

message StartupInfo {
  DesktopConfig config = 1;
  BuildInfo build_info = 2;
}

enum SidecarShellMode {
  SIDECAR_SHELL_MODE_UNSPECIFIED = 0;
  SIDECAR_SHELL_MODE_LAUNCHER = 1;
  SIDECAR_SHELL_MODE_SOLO = 2;
  SIDECAR_SHELL_MODE_DISTRIBUTED = 3;
}

message SidecarInfo {
  string protocol_version = 1;
  string binary_hash = 2;
  int64 pid = 3;
  SidecarShellMode shell_mode = 4;
  bool connected = 5;
  string hub_url = 6;
}

// --- Events (Go → Rust) ---

message Event {
  oneof payload {
    ChannelMessageEvent channel_message = 1;
    ChannelCloseEvent channel_close = 2;
    SidecarLogEvent sidecar_log = 3;
    // UserEventsMessage carries an already-framed WatchUserEvent proto
    // payload (the same length-prefixed bytes the direct WebSocket
    // path would deliver). The frontend's useUserEvents hook treats
    // these identically to native WebSocket message frames.
    UserEventsMessageEvent user_events_message = 4;
    // UserEventsClose signals the sidecar's relay to the hub has
    // terminated; the frontend resets its bootstrap state in the
    // same way it does on a native WebSocket `close` event.
    UserEventsCloseEvent user_events_close = 5;
  }
}

message ChannelMessageEvent {
  bytes data = 1;
}

message ChannelCloseEvent {
  uint32 code = 1;
  string reason = 2;
  bool was_clean = 3;
}

message UserEventsMessageEvent {
  bytes data = 1;
}

message UserEventsCloseEvent {
  uint32 code = 1;
  string reason = 2;
  bool was_clean = 3;
}

message SidecarLogEvent {
  string level = 1;
  string time = 2;
  string message = 3;
  repeated string attrs = 4;
}

// --- Shared types ---

// WindowMode is the top-level display state of the desktop window. The three
// states are mutually exclusive: a window is windowed, macOS-zoomed, or in
// native fullscreen -- never a combination. window_width/height on
// DesktopConfig always hold the last *windowed* geometry so exiting
// maximized/fullscreen returns to a sensible size.
enum WindowMode {
  WINDOW_MODE_UNSPECIFIED = 0; // treated as NORMAL (fresh config default)
  WINDOW_MODE_NORMAL = 1;
  WINDOW_MODE_MAXIMIZED = 2;
  WINDOW_MODE_FULLSCREEN = 3;
}

// The three Desktop window-behaviour choices, as the device cache stores them.
// Each UNSPECIFIED maps to that setting's documented default, exactly the way
// WINDOW_MODE_UNSPECIFIED maps to NORMAL, so a config written before this
// change -- or by a shell that never pushed -- reads as the built-in default
// rather than as a third state. The string tokens the account setting and the
// webview use live in contracts/desktop.json; these enums are the Rust<->Go
// spelling and the two are bridged in rpc.go and in the shell.
enum TrayOnClose {
  TRAY_ON_CLOSE_UNSPECIFIED = 0; // treated as TRAY
  TRAY_ON_CLOSE_TRAY = 1;
  TRAY_ON_CLOSE_QUIT = 2;
}

enum TrayOnMinimize {
  TRAY_ON_MINIMIZE_UNSPECIFIED = 0; // treated as TASKBAR
  TRAY_ON_MINIMIZE_TRAY = 1;
  TRAY_ON_MINIMIZE_TASKBAR = 2;
}

enum StartMinimized {
  START_MINIMIZED_UNSPECIFIED = 0; // treated as WINDOW
  START_MINIMIZED_WINDOW = 1;
  START_MINIMIZED_MINIMIZED = 2;
}

message DesktopConfig {
  string mode = 1;
  string hub_url = 2;
  int32 window_width = 3;
  int32 window_height = 4;
  WindowMode window_mode = 5;
  // The device-local cache of the Desktop preferences. See
  // SetDesktopBehaviorRequest for the direction of flow and for why
  // start_on_login is not among them.
  //
  // The cache belongs to the OPERATING-SYSTEM user, while the preference
  // belongs to a LeapMux account. A machine that two accounts sign in on holds
  // whichever signed in last, so its next login launch follows that account's
  // choice. Keying the cache by account is not possible: the shell reads it
  // before it knows who will sign in, which is the whole reason the cache
  // exists.
  bool tray_enabled = 6;
  TrayOnClose tray_on_close = 7;
  TrayOnMinimize tray_on_minimize = 8;
  StartMinimized start_minimized = 9;
}

message BuildInfo {
  string version = 1;
  string commit_hash = 2;
  string commit_time = 3;
  string build_time = 4;
  string branch = 5; // Optional git ref (branch or tag) injected at build time; empty for detached HEAD
}

message TunnelConfig {
  string worker_id = 1;
  string type = 2;
  string target_addr = 3;
  int32 target_port = 4;
  string bind_addr = 5;
  int32 bind_port = 6;
}

message TunnelInfo {
  string id = 1;
  string worker_id = 2;
  string type = 3;
  string bind_addr = 4;
  int32 bind_port = 5;
  string target_addr = 6;
  int32 target_port = 7;
}
