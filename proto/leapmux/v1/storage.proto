syntax = "proto3";
package leapmux.v1;

// The storage vocabularies of the hub and the worker: each enum numbers a
// column of their own tables. No message or RPC lives here.

// ControlDeliveryKind identifies the operation that owns a durable delivery.
enum ControlDeliveryKind {
  CONTROL_DELIVERY_KIND_UNSPECIFIED = 0;
  CONTROL_DELIVERY_KIND_CONTROL_RESPONSE = 1;
  CONTROL_DELIVERY_KIND_AUTO_REVIEW_APPROVAL = 2;
}

// ControlDeliveryState records delivery separately from operation-specific recording.
// Pending and uncertain deliveries both prevent another send after a restart.
enum ControlDeliveryState {
  CONTROL_DELIVERY_STATE_UNSPECIFIED = 0;
  CONTROL_DELIVERY_STATE_PENDING = 1;
  CONTROL_DELIVERY_STATE_UNCERTAIN = 2;
  CONTROL_DELIVERY_STATE_DELIVERED = 3;
  CONTROL_DELIVERY_STATE_COMPLETED = 4;
}

// Storage vocabularies for the hub's and the worker's own tables.
//
// Each enum defines one storage vocabulary in internal/hub/store or internal/worker/db.
// These values do not appear in public protocol messages.
// Go constants and SQL constraints use the same proto numbering.
// A payload table can restrict a kind to the value that identifies its payload type.
//
// The rule that puts them here is in AGENTS.md, under "Enum columns store proto
// enum ordinals". The short form: a closed set of values in a database column
// is an enum, and an enum takes its numbering from proto -- whether or not it
// also crosses a language boundary. Crossing one is what adds a CONTRACT entry
// on top, which none of these needs.
//
// UNSPECIFIED is 0 in each enum, as proto3 requires.
// No column that these enums number stores 0: each CHECK starts at 1, so an
// unset Go field cannot become a stored state.

// RevocationEventKind is what one row of the durable revocation stream
// announces. Numbers revocation_events.kind.
enum RevocationEventKind {
  REVOCATION_EVENT_KIND_UNSPECIFIED = 0;
  // One session's own credential changed.
  REVOCATION_EVENT_KIND_SESSION = 1;
  // One session was revoked. This is the one kind with its own partial index,
  // because the session-close path seeks it by subject.
  REVOCATION_EVENT_KIND_SESSION_REVOKED = 2;
  REVOCATION_EVENT_KIND_API_TOKEN = 3;
  REVOCATION_EVENT_KIND_API_TOKEN_ROTATION = 4;
  REVOCATION_EVENT_KIND_DELEGATION_TOKEN = 5;
  // Every credential of one user, at once.
  REVOCATION_EVENT_KIND_USER_TOKENS = 6;
  // Not a revocation: the user's own profile changed, and a cache that copied
  // it must read again. It rides this stream because it needs the same gapless
  // ordering and the same cross-process delivery.
  REVOCATION_EVENT_KIND_USER_INFO = 7;
}

// AppRegistrationSource is who put an OAuth app registration in the table.
// Numbers oauth_clients.registration_source.
enum AppRegistrationSource {
  APP_REGISTRATION_SOURCE_UNSPECIFIED = 0;
  // A constant of the build, reconciled on every store open by SeedBuiltIns.
  APP_REGISTRATION_SOURCE_BUILTIN = 1;
  // An administrator registered it for the whole hub.
  APP_REGISTRATION_SOURCE_ADMIN = 2;
  // A user registered it as their own private app.
  APP_REGISTRATION_SOURCE_USER = 3;
  // The app registered itself through RFC 7591 dynamic registration. Nobody
  // vouched for it, which is what keeps it out of the hub-wide catalogue.
  APP_REGISTRATION_SOURCE_DYNAMIC = 4;
}

// IdentityProviderType is the protocol an administrator-configured identity
// provider speaks. Numbers oauth_providers.provider_type.
//
// It is NOT the preset a user picked. Four presets (github, google, apple,
// oidc) map onto these two protocols, and the preset name stays a string on the
// admin RPC because it names a configuration rather than a behaviour.
enum IdentityProviderType {
  IDENTITY_PROVIDER_TYPE_UNSPECIFIED = 0;
  IDENTITY_PROVIDER_TYPE_OIDC = 1;
  IDENTITY_PROVIDER_TYPE_GITHUB = 2;
}

// WorkspaceLifecycleOp is what one row of the transactional lifecycle outbox
// asks the per-user manager to do after the transaction commits. Numbers
// lifecycle_outbox.op_type.
enum WorkspaceLifecycleOp {
  WORKSPACE_LIFECYCLE_OP_UNSPECIFIED = 0;
  WORKSPACE_LIFECYCLE_OP_CREATE = 1;
  WORKSPACE_LIFECYCLE_OP_RENAME = 2;
  WORKSPACE_LIFECYCLE_OP_DELETE = 3;
}

// ApiTokenIssuance records which ceremony issued an app credential.
// api_tokens.issuance stores the ordinal. The Hub offers the device-code
// step-up only to a credential that was issued without a browser.
enum ApiTokenIssuance {
  API_TOKEN_ISSUANCE_UNSPECIFIED = 0;
  // The authorization-code grant: a browser on the credential's own machine.
  API_TOKEN_ISSUANCE_AUTHORIZATION_CODE = 1;
  // The RFC 8628 device-code grant: no browser on that machine.
  API_TOKEN_ISSUANCE_DEVICE_CODE = 2;
  // AdminUserService.IssueAPIToken: issued out of band.
  API_TOKEN_ISSUANCE_ADMIN = 3;
}

// CredentialRefKind is the kind of credential a reference identifies. Numbers
// oauth_authorization_codes.step_up_kind.
//
// The reference is one pair of columns -- a kind and an id -- so a row identifies
// exactly one credential or none. NULL (this enum's UNSPECIFIED, which no
// column stores) means no target: the CHECK range starts at 1, and the tie
// keeps the id empty exactly then.
enum CredentialRefKind {
  CREDENTIAL_REF_KIND_UNSPECIFIED = 0;
  // A user_sessions row.
  CREDENTIAL_REF_KIND_SESSION = 1;
  // An api_tokens row.
  CREDENTIAL_REF_KIND_TOKEN = 2;
}

// RedemptionKind is what an authorization code redeems into: the fork the
// consent page decided and the token stage must read from the row rather than
// re-derive. Numbers oauth_authorization_codes.redemption_kind.
//
// NULL means a step-up code, which redeems into an elevation and mints
// nothing. A tie CHECK makes one code verify XOR redeem, so the column never
// stores 0 and a forgotten write cannot pass for a token redemption.
enum RedemptionKind {
  REDEMPTION_KIND_UNSPECIFIED = 0;
  // A Hub session, the desktop's browser handoff.
  REDEMPTION_KIND_SESSION = 1;
  // An app credential.
  REDEMPTION_KIND_TOKEN = 2;
}

// AgentInputQueuePauseOwner records which cause created the pause that still
// holds, so only that cause lifts it again. Numbers
// agent_input_queue_state.pause_owner.
//
// A new pause records its cause as the owner. pauseAndEndTurn keeps an
// existing pause's owner, except that it takes over a pause a planned restart
// owns. An archive resume, or the end of a planned restart, then leaves a pause
// that a later crash or the user created.
//
// The worker column is nullable with CHECK (pause_owner BETWEEN 1 AND 6): NULL
// means that nobody owns a pause, and the column never stores 0.
//
// It is NOT AgentInputQueuePauseReason. The reason is the SENTENCE the pause
// banner shows the reader and travels to the browser; the owner is who may lift
// the pause and never leaves the worker.
enum AgentInputQueuePauseOwner {
  AGENT_INPUT_QUEUE_PAUSE_OWNER_UNSPECIFIED = 0;
  AGENT_INPUT_QUEUE_PAUSE_OWNER_MANUAL = 1;
  AGENT_INPUT_QUEUE_PAUSE_OWNER_ARCHIVE = 2;
  AGENT_INPUT_QUEUE_PAUSE_OWNER_PLANNED_RESTART = 3;
  AGENT_INPUT_QUEUE_PAUSE_OWNER_DELIVERY = 4;
  AGENT_INPUT_QUEUE_PAUSE_OWNER_AGENT_STOPPED = 5;
  AGENT_INPUT_QUEUE_PAUSE_OWNER_RECOVERY = 6;
}

// TabCreationState is the durable outcome of a Worker-owned creation operation.
enum TabCreationState {
  TAB_CREATION_STATE_UNSPECIFIED = 0;
  TAB_CREATION_STATE_PENDING = 1;
  TAB_CREATION_STATE_COMMITTED = 2;
  TAB_CREATION_STATE_REJECTED = 3;
  TAB_CREATION_STATE_CANCEL_REQUESTED = 4;
  TAB_CREATION_STATE_CANCELED = 5;
  // Hub publication committed; startup still needs its recovery inputs.
  TAB_CREATION_STATE_PUBLISHED = 6;
}
