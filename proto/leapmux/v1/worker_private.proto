syntax = "proto3";
package leapmux.v1;

import "leapmux/v1/common.proto";
import "leapmux/v1/workspace.proto";

// WorkerPrivateService is a worker-side service whose RPCs travel
// only over an E2EE channel. It carries content the hub deliberately
// doesn't see (tab titles, file-tab paths). Frontends and the CLI
// subscribe once per worker that hosts any of their tabs; titles and
// paths never traverse the hub.
service WorkerPrivateService {
  // WatchWorkerPrivateEvents streams the calling user's private events
  // from this worker.
  //
  // There is no workspace argument. A worker serves exactly one user and
  // stores no workspace id, so the stream is keyed by worker alone and a
  // single subscription covers every workspace the user holds tabs in --
  // including one created after the channel opened, which a per-workspace
  // subscription could not reach without an out-of-band announcement.
  //
  // The worker emits a one-shot bootstrap reply at subscribe time: one
  // FileTabPathRegistered per row in worker_file_tabs owned by the caller,
  // followed by live events.
  rpc WatchWorkerPrivateEvents(WatchWorkerPrivateEventsRequest)
      returns (stream WorkerPrivateEvent);

  // RegisterFileTabPath persists (tab_id, path, working dir) on the
  // worker (user is implied by the authenticated principal). Path is
  // plaintext on the wire -- this RPC must travel via E2EE. Emits
  // FileTabPathRegistered.
  rpc RegisterFileTabPath(RegisterFileTabPathRequest) returns (RegisterFileTabPathResponse);

  // GetFileTabPath returns the worker-stored path and working dir for a
  // tab. Used by late-joining clients that received a TabRecord via the
  // CRDT before the corresponding FileTabPathRegistered event.
  rpc GetFileTabPath(GetFileTabPathRequest) returns (GetFileTabPathResponse);

  // RevokeFileTabPath deletes the worker-stored path. Emits
  // FileTabPathRevoked.
  //
  // Mirrors the CloseAgent / CloseTerminal contract: the request
  // carries a WorktreeAction, the response carries a CloseTabResult,
  // and the worker drives the same closeTabCommon path so worktree
  // removal stays consistent across tab types.
  rpc RevokeFileTabPath(RevokeFileTabPathRequest) returns (RevokeFileTabPathResponse);
}

// WatchWorkerPrivateEventsRequest is deliberately empty: the worker the
// channel reaches and the authenticated principal together name
// everything the subscription is scoped to.
message WatchWorkerPrivateEventsRequest {}

message WorkerPrivateEvent {
  oneof event {
    TabRenamed              tab_renamed                = 1;
    FileTabPathRegistered   file_tab_path_registered   = 2;
    FileTabPathRevoked      file_tab_path_revoked      = 3;
  }
}

message TabRenamed {
  string tab_id = 1;
  TabType tab_type = 2;
  string title = 3;
  string origin_client_id = 4;
}

message FileTabPathRegistered {
  string tab_id    = 1;
  string file_path = 2;
  // Working dir the worker resolved for this tab (see
  // RegisterFileTabPathRequest.working_dir). Carried so a client that
  // learns about the tab from this event -- a peer, or a late joiner
  // replaying the bootstrap -- puts it in the same branch group as the
  // client that opened it, instead of inferring one from the path.
  string working_dir = 3;
}

message FileTabPathRevoked {
  string tab_id = 1;
}

// --- File-tab path RPC payloads ---

message RegisterFileTabPathRequest {
  string tab_id    = 1;
  string file_path = 2;
  // Working dir of the tab the file was opened FROM -- the agent or
  // terminal whose context the new file tab inherits (title bar, file
  // tree root, branch group). It becomes the file tab's authoritative
  // git working directory on the worker, which is what makes a FILE tab
  // answerable to the same branch-context operations as the other two
  // tab types: last-tab close inspection, the sibling-on-this-branch
  // scan, and PushBranch.
  //
  // Optional. A caller with no originating tab to name -- `leapmux
  // remote tab open --type=file` run from a plain shell rather than
  // from inside a LeapMux tab -- leaves it empty, and the worker falls
  // back to the file's own directory.
  string working_dir = 3;
}

message RegisterFileTabPathResponse {}

message GetFileTabPathRequest {
  string tab_id = 1;
}

message GetFileTabPathResponse {
  string file_path = 1;
  // See FileTabPathRegistered.working_dir -- this is the same value on
  // the one-shot read path a client takes when a TabRecord arrives
  // before the private-event stream has replayed its bootstrap.
  string working_dir = 2;
}

message RevokeFileTabPathRequest {
  string tab_id = 1;
  // Worktree disposition chosen by the user when the file tab was the
  // last tab on a tracked worktree. UNSPECIFIED / KEEP leaves the
  // worktree in place; REMOVE asks the worker to `git worktree remove`
  // once no other tabs reference it. Mirrors CloseAgentRequest.
  WorktreeAction worktree_action = 2;
}

// RevokeFileTabPathResponse reports the outcome of the close. See
// CloseTabResult for why partial failures are returned in-band rather
// than as RPC errors.
message RevokeFileTabPathResponse {
  CloseTabResult result = 1;
}
