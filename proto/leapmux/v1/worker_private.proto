syntax = "proto3";
package leapmux.v1;

import "leapmux/v1/common.proto";
import "leapmux/v1/workspace.proto";

// WorkerPrivateService is a worker-side service whose RPCs travel
// only over an E2EE channel. It carries content the hub deliberately
// doesn't see (tab titles, tab payloads). Frontends and the CLI
// subscribe once per worker that hosts any of their tabs; titles and
// payloads never traverse the hub.
service WorkerPrivateService {
  // WatchWorkerPrivateEvents streams the calling user's private events
  // from this worker.
  //
  // There is no workspace argument. A worker serves exactly one user and
  // stores no workspace id, so the stream is keyed by worker alone and a
  // single subscription covers every workspace the user holds tabs in --
  // including one created after the channel opened, which a per-workspace
  // subscription could not reach without an out-of-band announcement.
  //
  // The worker emits a one-shot bootstrap reply at subscribe time: one
  // TabPayloadRegistered per row in worker_tab_payloads owned by the caller,
  // followed by live events.
  rpc WatchWorkerPrivateEvents(WatchWorkerPrivateEventsRequest)
      returns (stream WorkerPrivateEvent);

  // RegisterTabPayload persists (tab_id, payload) on the worker (user is
  // implied by the authenticated principal). The payload is plaintext on the
  // wire -- this RPC must travel via E2EE. Emits TabPayloadRegistered.
  rpc RegisterTabPayload(RegisterTabPayloadRequest) returns (RegisterTabPayloadResponse);

  // GetTabPayload returns the worker-stored payload for a tab. Used by
  // late-joining clients that received a TabRecord via the CRDT before the
  // corresponding TabPayloadRegistered event.
  rpc GetTabPayload(GetTabPayloadRequest) returns (GetTabPayloadResponse);

  // RevokeTabPayload deletes the worker-stored payload. Emits
  // TabPayloadRevoked.
  //
  // Mirrors the CloseAgent / CloseTerminal contract: the request
  // carries a WorktreeAction, the response carries a CloseTabResult,
  // and the worker drives the same closeTabCommon path so worktree
  // removal stays consistent across tab types.
  rpc RevokeTabPayload(RevokeTabPayloadRequest) returns (RevokeTabPayloadResponse);
}

// WatchWorkerPrivateEventsRequest is deliberately empty: the worker the
// channel reaches and the authenticated principal together name
// everything the subscription is scoped to.
message WatchWorkerPrivateEventsRequest {}

message WorkerPrivateEvent {
  oneof event {
    TabRenamed           tab_renamed            = 1;
    TabPayloadRegistered tab_payload_registered = 2;
    TabPayloadRevoked    tab_payload_revoked    = 3;
  }
}

message TabRenamed {
  string tab_id = 1;
  TabType tab_type = 2;
  string title = 3;
  string origin_client_id = 4;
}

// TabPayload is everything a tab needs to resolve WHAT IT SHOWS, and that the
// hub must therefore never see. `TabRecord` in the CRDT carries placement only
// -- tab type, id, tile, position, worker -- so this is the other half of a
// tab, and it lives on the worker behind the E2EE channel.
//
// One message for both kinds rather than one mechanism per kind: a FILE tab's
// path and an IMAGE tab's message reference are the same class of secret, they
// are registered, replayed, re-read and revoked at exactly the same points in
// a tab's life, and every reader below the oneof (the worktree link, the
// branch group, the orphan reconciler) treats them identically.
message TabPayload {
  // The tab's git working directory, and the reason such a tab is a
  // first-class git citizen rather than a type shared code routes around.
  // agents.working_dir / terminals.working_dir are what every branch-context
  // operation resolves a tab through -- last-tab close inspection, the
  // sibling-on-this-branch scan, push -- and this is that tab's entry in the
  // same lookup.
  //
  // It is the ORIGINATING tab's working dir, forwarded by the client that
  // opened this one, not something derived from the payload. Optional: a
  // caller with no originating tab to name leaves it empty and the worker
  // falls back (for a FILE tab, to the file's own directory).
  string working_dir = 1;

  oneof kind {
    FileTabPayload  file  = 2;
    ImageTabPayload image = 3;
  }
}

message FileTabPayload {
  // Absolute. The worker refuses a relative path rather than normalizing it:
  // the worker's own CWD is the only base available and it is never the
  // client's.
  string file_path = 1;
}

// ImageTabPayload addresses an image the agent returned inside one chat
// message, so the tab can re-fetch it without ever storing the pixels.
//
// Storing the base64 here would put a screenshot in the tab layer, and
// re-fetching costs one GetAgentMessage the scroll rail already makes for its
// own previews. The three fields together are what the hub must not learn:
// message seqs are worker-local, and which one a user opened is a fact about
// their reading, not about the transcript.
message ImageTabPayload {
  // The agent whose transcript holds the message. GetAgentMessage is scoped to
  // it, so a payload naming another user's agent resolves to nothing.
  string agent_id = 1;
  // Per-agent message seq -- the same addressing the scroll rail's mark
  // previews use.
  int64 seq = 2;
  // Which image of that message, as the provider's `toolResultImages` orders
  // them. Both the row that rendered the image and this tab run that one
  // function, so the index cannot mean two things.
  int32 image_index = 3;
  // Display name for the tab strip. Derived once at open time from whatever
  // the provider knew (a tool name, a file basename); there is nothing on the
  // resolve path that could recover it.
  string title = 4;
}

message TabPayloadRegistered {
  string tab_id = 1;
  TabPayload payload = 2;
}

message TabPayloadRevoked {
  string tab_id = 1;
}

// --- Tab payload RPC messages ---

message RegisterTabPayloadRequest {
  string tab_id = 1;
  TabPayload payload = 2;
}

message RegisterTabPayloadResponse {}

message GetTabPayloadRequest {
  string tab_id = 1;
}

message GetTabPayloadResponse {
  // Always set on a successful response: a tab with no row answers NOT_FOUND
  // rather than OK with an unset payload, so a reader that sees this field
  // absent is reading a payload branch its build does not know.
  TabPayload payload = 1;
}

message RevokeTabPayloadRequest {
  string tab_id = 1;
  // Worktree disposition chosen by the user when this tab was the last tab on
  // a tracked worktree. UNSPECIFIED / KEEP leaves the worktree in place;
  // REMOVE asks the worker to `git worktree remove` once no other tabs
  // reference it. Mirrors CloseAgentRequest.
  WorktreeAction worktree_action = 2;
}

// RevokeTabPayloadResponse reports the outcome of the close. See
// CloseTabResult for why partial failures are returned in-band rather
// than as RPC errors.
message RevokeTabPayloadResponse {
  CloseTabResult result = 1;
}
