syntax = "proto3";
package leapmux.v1;

import "leapmux/v1/agent.proto";
import "leapmux/v1/common.proto";
import "leapmux/v1/terminal.proto";

// TabType identifies the kind of workspace tab.
enum TabType {
  TAB_TYPE_UNSPECIFIED = 0;
  TAB_TYPE_AGENT = 1;
  TAB_TYPE_TERMINAL = 2;
  TAB_TYPE_FILE = 3;
}

// WorkspaceService manages workspace metadata + read-only tab views.
// Layout / tab mutations live on UserCRDT (see user_ops.proto). The
// WorkspaceCreated / WorkspaceRenamed / WorkspaceDeleted lifecycle
// events are broadcast on the `/ws/userevents` WebSocket subscription
// (see backend/internal/hub/service/ws_userevents.go).
service WorkspaceService {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  rpc RenameWorkspace(RenameWorkspaceRequest) returns (RenameWorkspaceResponse);
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);
  // ListTabs returns the materialized tab list across one or more
  // workspaces. Reads `workspace_tab_rendered`.
  rpc ListTabs(ListTabsRequest) returns (ListTabsResponse);
  // GetTab returns a single tab so callers can resolve the worker
  // that owns it. Reads `workspace_tab_rendered`.
  rpc GetTab(GetTabRequest) returns (GetTabResponse);
  // LocateTab resolves a tab by (tab_type, tab_id) without requiring
  // workspace_id — the hub finds the tab across every
  // workspace the caller can access. Used by the `leapmux remote` CLI
  // to derive the spawning tab's context (workspace, tile,
  // worker) from a single env-injected anchor (LEAPMUX_REMOTE_TAB_ID
  // + LEAPMUX_REMOTE_TAB_TYPE). Reads `workspace_tab_rendered`.
  rpc LocateTab(LocateTabRequest) returns (LocateTabResponse);
  // LocateTile resolves a tile by tile_id without requiring
  // workspace_id. The hub walks the user's accessible CRDT state
  // (from the in-memory `crdt.Manager` for the user), finds
  // the workspace whose tile-tree contains the node, and verifies
  // the caller can read that workspace. Returns NotFound when the
  // tile isn't visible to the caller. Used by the `leapmux remote`
  // CLI universal resolver when a script knows only a tile id.
  rpc LocateTile(LocateTileRequest) returns (LocateTileResponse);
}

// --- Workspace CRUD ---

message CreateWorkspaceRequest {
  string title = 1;
}

message CreateWorkspaceResponse {
  string workspace_id = 1;
}

message ListWorkspacesRequest {
  PageRequest page = 1;
}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
  PageResponse page = 2;
}

message GetWorkspaceRequest {
  string workspace_id = 1;
}

message GetWorkspaceResponse {
  Workspace workspace = 1;
}

message Workspace {
  string id = 1;
  string created_by = 2;
  string title = 3;
  string created_at = 4;
}

// --- Workspace Rename & Delete ---

message RenameWorkspaceRequest {
  string workspace_id = 1;
  string title = 2;
}

message RenameWorkspaceResponse {}

message DeleteWorkspaceRequest {
  string workspace_id = 1;
}

message DeleteWorkspaceResponse {
  // Workers that hosted tabs at delete time, and the tabs each one must tear
  // down. Read from the workspace_tab_owned TABLE inside the delete transaction, so the
  // worker set and the per-worker tab list are one atomic snapshot of the
  // authoritative projection -- including tabs hidden by projection-repair.
  //
  // The Worker stores no workspace id, so a cleanup call has to name its tabs
  // explicitly. Returning them here rather than making each caller resolve its
  // own list is what removes three failure modes: a tab a peer opened between
  // the caller's read and the delete, a read whose error degraded to "close
  // nothing", and the fact that both callers read workspace_tab_rendered -- a
  // strict SUBSET of the owned projection -- so a projection-hidden tab was
  // structurally unreachable rather than merely reclaimed late.
  repeated WorkerTabs worker_tabs = 1;
}

// WorkerTabs groups one worker's tabs for a fan-out.
message WorkerTabs {
  string worker_id = 1;
  repeated TabRef tabs = 2;
}

// --- Workspace Tabs (read-only views; mutations via UserCRDT) ---

message WorkspaceTab {
  TabType tab_type = 1;
  string tab_id = 2;
  string position = 3;
  string tile_id = 4;
  string worker_id = 5;
  string workspace_id = 6;
}

message ListTabsRequest {
  // Workspaces to fetch tabs for. Empty = every workspace
  // the caller can read. Unknown / inaccessible IDs are silently
  // dropped so stale sidebar state doesn't produce errors.
  repeated string workspace_ids = 1;
}

message ListTabsResponse {
  repeated WorkspaceTab tabs = 1;
}

// --- Tiling Layout shared types ---

// SplitDirection names the orientation of the divider line between
// the two children of a SPLIT node. The convention matches tmux and
// the `tile split --direction` CLI flag:
//   HORIZONTAL = a horizontal divider (-) between two stacked panes.
//   VERTICAL   = a vertical divider (|) between two side-by-side panes.
enum SplitDirection {
  SPLIT_DIRECTION_UNSPECIFIED = 0;
  SPLIT_DIRECTION_HORIZONTAL = 1;
  SPLIT_DIRECTION_VERTICAL = 2;
}

// --- Worker Inner RPCs ---

// TabRef names one tab by type and id -- the pair that identifies a tab
// wherever the workspace is not part of the address. A Worker stores no
// workspace id, so this is the only tab address it understands.
message TabRef {
  TabType tab_type = 1;
  string tab_id = 2;
}

// CleanupWorkspaceRequest names the tabs a just-deleted workspace held on
// the receiving Worker, so it can stop their processes and release their
// worktrees.
//
// The Worker cannot derive the set itself: it tracks no workspace id. The set
// comes from DeleteWorkspaceResponse.worker_tabs, which the Hub reads INSIDE the
// delete transaction -- see the note there for why a caller must not resolve its
// own list from workspace_tab_rendered instead. The Worker's orphan reconciler
// still converges anything left over against workspace_tab_owned on its next
// pass, so a dropped RPC costs latency rather than correctness.
message CleanupWorkspaceRequest {
  repeated TabRef tabs = 1;
}

message CleanupWorkspaceResponse {
  // Deliberately empty. It carried a repeated WorktreeInfo that no worker ever
  // populated -- handleCleanupWorkspace returns a zero-value response -- while
  // the CLI read it and emitted a `worktrees` key that could never appear.
  // Worktree reclamation happens through the orphan reconciler, which reports
  // nothing back on this call.
}

// --- Event Streaming (per-agent / per-terminal) ---

// WatchMode selects how much of an entity's traffic this channel receives.
enum WatchMode {
  // Treated as NOTIFY: an entry that says nothing about how much it wants gets
  // the cheap half, never the expensive one.
  WATCH_MODE_UNSPECIFIED = 0;
  // Notification-class events only -- status changes, control requests and
  // cancels, agent turn ends, terminal bells / notifications / titles /
  // progress, terminal exits. Enough to keep a badge, a spinner, a title and a
  // sound honest for a tab nobody is looking at, with none of the traffic only
  // a rendered tab can use.
  WATCH_MODE_NOTIFY = 1;
  // Everything NOTIFY carries plus the entity's content: chat messages, stream
  // deltas, to-do snapshots, terminal bytes -- and, on the transition INTO this
  // mode, a catch-up replay.
  WATCH_MODE_FULL = 2;
}

// WatchEventsRequest states the channel's WHOLE current interest, not an
// increment. Entities the request omits are unsubscribed.
//
// The opening InnerRpcRequest carries the first one; every revision after that
// rides an InnerStreamRequest on the SAME stream, so changing the set never
// tears the subscription down and never re-replays entities that did not
// change. The stream is retired by an InnerStreamRequest{cancel: true} or by
// the channel closing -- an empty request now means "watching nothing" and
// leaves the stream open.
//
// Revisions COALESCE: each states the whole interest, so the worker may apply
// only the newest of a burst. A client waiting on revision N therefore accepts
// any WatchUpdateAck with update_id >= N.
message WatchEventsRequest {
  repeated WatchAgentEntry agents = 1;
  repeated WatchTerminalEntry terminals = 2;
  // Echoed on WatchUpdateAck. Client-chosen, monotonic per stream; 0 is fine
  // for a client that does not track revisions.
  uint64 update_id = 3;
}

message WatchAgentEntry {
  string agent_id = 1;
  // Which history to replay when this entry TRANSITIONS into WATCH_MODE_FULL.
  // Ignored while the entry is already FULL (no replay is owed) or NOTIFY.
  WatchReplayMode replay = 2;
  // Exclusive lower bound for AFTER_CURSOR replay (replay seq > cursor_seq);
  // ignored for LATEST / while not transitioning into FULL.
  int64 cursor_seq = 3;
  WatchMode mode = 4;
}

message WatchTerminalEntry {
  string terminal_id = 1;
  // Resume cursor for the screen replay owed on the transition into
  // WATCH_MODE_FULL. Ignored otherwise.
  int64 after_offset = 2;
  WatchMode mode = 3;
}

message WatchEventsResponse {
  oneof event {
    AgentEvent agent_event = 1;
    TerminalEvent terminal_event = 2;
    WatchUpdateAck update_ack = 3;
  }
}

// WatchRejectionReason says WHY one entity in a WatchEventsRequest was not
// subscribed. Modelled on ChannelOpenErrorCode (channel.proto) rather than on a
// bare ConnectRPC code: what the client has to decide is settle-vs-retry, and a
// status code loses that distinction the moment two causes map onto one code.
enum WatchRejectionReason {
  // Never sent. Present so an unrecognized reason is read as "unknown", which
  // clients treat as DURABLE -- the safe direction, since a wrongly-settled
  // entry is re-stated by the next real tab change while a wrongly-retried one
  // loops forever.
  WATCH_REJECTION_REASON_UNSPECIFIED = 0;
  // DURABLE. This worker holds no live row with that id: closed, never created
  // here, or living on a different worker. The client stops asking.
  WATCH_REJECTION_REASON_NOT_FOUND = 1;
  // TRANSIENT. The worker could not resolve the id at all, so this says
  // NOTHING about whether the entity exists. Whatever the channel already had
  // registered for it was left untouched. The client retries.
  WATCH_REJECTION_REASON_LOOKUP_FAILED = 2;
}

// WatchRejection names one entity the worker did not subscribe, and why.
message WatchRejection {
  string entity_id = 1;
  WatchRejectionReason reason = 2;
}

// WatchUpdateAck reports what one WatchEventsRequest actually subscribed. It is
// sent for EVERY request, applied cleanly or not, and it never ends the stream.
//
// It is what makes a partial rejection recoverable. Registration is
// replace-semantics, so an entity the worker cannot resolve is left
// unsubscribed; without an ack that outcome was indistinguishable from success
// and nothing ever retried it (issue #314). Carrying a REASON per entity --
// rather than a bare id list plus a whole-request flag -- is what lets the
// client settle a closed agent while retrying a transient fault, which is the
// loop-vs-silence trade-off that kept #314 open. It also means a future per-id
// or chunked lookup, the exact "transient rejection" #314 warns about, needs no
// protocol change: it is already just another entity carrying LOOKUP_FAILED.
message WatchUpdateAck {
  uint64 update_id = 1;
  repeated WatchRejection rejected_agents = 2;
  repeated WatchRejection rejected_terminals = 3;
}

message AgentEvent {
  string agent_id = 1;
  oneof event {
    AgentChatMessage agent_message = 2;
    AgentStreamChunk stream_chunk = 3;
    AgentStreamEnd stream_end = 4;
    AgentStatusChange status_change = 5;
    AgentControlRequest control_request = 6;
    AgentControlCancelRequest control_cancel = 7;
    AgentMessageError message_error = 8;
    AgentMessageDeleted message_deleted = 9;
    CatchUpComplete catch_up_complete = 10;
    AgentTodosChanged todos_changed = 11;
    CatchUpStart catch_up_start = 12;
    AgentTurnEnd turn_end = 13;
  }
}

// AgentTurnEnd fires when the agent finishes a turn. NOTIFY-class, so a tab
// nobody is looking at still rings and still badges -- which the turn-end
// divider it accompanies cannot do, being a chat message only a rendered tab
// receives.
message AgentTurnEnd {
  // Tool calls in the finished turn, when the provider reports one. Clients
  // suppress the turn-end sound for a zero-tool turn, so a provider that cannot
  // say leaves this UNSET rather than sending 0.
  optional int32 num_tool_uses = 1;
}

// CatchUpStart is broadcast at the START of a WatchEvents (re)subscribe, BEFORE the
// message replay burst, carrying the agent's authoritative live-tail seq. A windowed
// client that was disconnected reconciles against it FIRST -- dropping any loaded row
// whose seq exceeds latest_seq (a tail deletion it missed while away) and clamping its
// recorded live-tail -- so phantom rows are gone before the replay renders rather than
// flashing until CatchUpComplete. CatchUpComplete repeats the reconcile as the final
// authority after the burst.
message CatchUpStart {
  // The agent's authoritative live-tail seq at the moment replay began. Explicit
  // presence: UNSET = the worker couldn't determine it (a DB error) and the client skips
  // reconciliation; present 0 = the agent genuinely has no messages; present >0 = the
  // authoritative MAX(seq).
  optional int64 latest_seq = 1;
}

message CatchUpComplete {
  // The agent's authoritative live-tail seq at the moment replay completed. A windowed
  // client that was disconnected never receives the AgentMessageDeleted for rows
  // deleted meanwhile, so it reconciles here: it drops any loaded row whose seq exceeds
  // latest_seq (a tail deletion it missed) and clamps its recorded live-tail to this
  // value, so its "new messages below" affordance can't stay stuck past a now-shorter
  // history. Explicit presence: UNSET = the worker couldn't determine it (a DB error) and
  // the client skips reconciliation; present 0 = the agent genuinely has no messages;
  // present >0 = the authoritative MAX(seq).
  optional int64 latest_seq = 1;
  // The live-tail seq at the moment replay BEGAN (== CatchUpStart.latest_seq), repeated
  // here so the reconcile can tell a deleted-during-replay phantom from a live arrival.
  // The worker registers the watcher BEFORE reading latest_seq, so a message created and
  // broadcast during catch-up can reach the client BEFORE this frame -- and its seq is
  // necessarily ABOVE start_tail_seq (it didn't exist when replay began), while a
  // deleted-during-replay phantom sits at-or-below it. So the client reaps only the
  // (latest_seq, start_tail_seq] band and EXEMPTS rows above start_tail_seq (genuine live
  // arrivals), instead of reaping everything above latest_seq (which would wrongly drop
  // them). Same explicit presence as latest_seq; UNSET disables the band exemption (the
  // client falls back to reaping above latest_seq, matching the pre-field behavior).
  optional int64 start_tail_seq = 2;
}

message TerminalEvent {
  string terminal_id = 1;
  oneof event {
    TerminalData data = 2;
    TerminalClosed closed = 3;
    TerminalStatusChange status_change = 4;
    TerminalBell bell = 5;
    TerminalNotification notification = 6;
    TerminalTitleChanged title_changed = 7;
    TerminalProgress progress = 8;
  }
}

// --- GetTab (single-tab worker resolution) ---

message GetTabRequest {
  string workspace_id = 1;
  string tab_id = 2;
  TabType tab_type = 3;
}

message GetTabResponse {
  WorkspaceTab tab = 1;
}

// --- LocateTab (cross-workspace single-tab lookup) ---
//
// Like GetTab but without a workspace_id filter: the hub looks for
// the tab across every workspace the caller owns. Used when only the
// tab id is known — `leapmux remote` derives workspace / tile /
// worker from this single hop. Returns NotFound when no accessible
// workspace contains the tab.

message LocateTabRequest {
  TabType tab_type = 1;
  string  tab_id   = 2;
}

message LocateTabResponse {
  WorkspaceTab tab = 1;
}

// --- LocateTile (cross-workspace tile lookup) ---

message LocateTileRequest {
  string tile_id = 1;
}

message LocateTileResponse {
  string workspace_id = 1;
}

// --- Workspace lifecycle events (broadcast on `/ws/userevents`) ---

message WorkspaceRenamed {
  string workspace_id = 1;
  string title = 2;
}

message WorkspaceDeleted {
  string workspace_id = 1;
  repeated string worker_ids = 2;
}
