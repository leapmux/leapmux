syntax = "proto3";
package leapmux.v1;

import "google/protobuf/timestamp.proto";
import "leapmux/v1/access.proto";

// AuthService handles user authentication.
// Called by Frontend on Hub via ConnectRPC.
//
// Almost all of it bootstraps a session, so it is public. The two that need
// a caller are classified on what they do WITH one.
service AuthService {
  option (leapmux.v1.host) = SERVICE_HOST_HUB;
  // Authenticate with username and password.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (leapmux.v1.access) = { public: {} };
  }
  // Set the first password for the solo account and create an elevated
  // session. This is the only protected setup action available to a TCP
  // caller before the solo account has a usable password.
  rpc SetInitialSoloPassword(SetInitialSoloPasswordRequest) returns (SetInitialSoloPasswordResponse) {
    option (leapmux.v1.access) = { public: {} };
  }
  // Invalidate the current session.
  //
  // A bearer holds no session, so there is nothing here for an app to end.
  // It ends its own credential through RFC 7009 /oauth/revoke instead.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_NEVER };
  }
  // Get the currently authenticated user.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_ACCOUNT_READ };
  }
  // Register a new account. SignUp creates a session even when email
  // verification is required, so the new user can authenticate to
  // UserService.VerifyEmail with the code from their email.
  rpc SignUp(SignUpRequest) returns (SignUpResponse) {
    option (leapmux.v1.access) = { public: {} };
  }
  // List enabled OAuth providers (no auth required).
  rpc GetOAuthProviders(GetOAuthProvidersRequest) returns (GetOAuthProvidersResponse) {
    option (leapmux.v1.access) = { public: {} };
  }
  // Get pre-filled data for a pending OAuth signup (no auth required).
  rpc GetPendingOAuthSignup(GetPendingOAuthSignupRequest) returns (GetPendingOAuthSignupResponse) {
    option (leapmux.v1.access) = { public: {} };
  }
  // Complete OAuth signup by choosing a username (no auth required).
  rpc CompleteOAuthSignup(CompleteOAuthSignupRequest) returns (CompleteOAuthSignupResponse) {
    option (leapmux.v1.access) = { public: {} };
  }
  // Issue a fresh ALTCHA proof-of-work challenge (no auth required).
  // Called by the frontend captcha widget before Login/SignUp-family
  // submissions when GetSystemInfo reports captcha_enabled with the
  // altcha provider. Empty when the selected provider is external
  // (recaptcha_v3 / turnstile) or captcha is disabled.
  //
  // Public by design: ALTCHA challenges carry no secret and must be
  // fetchable before login. The captcha interceptor guards the
  // procedures that consume solutions, not the one that issues
  // challenges.
  rpc GetAltchaChallenge(GetAltchaChallengeRequest) returns (GetAltchaChallengeResponse) {
    option (leapmux.v1.access) = { public: {} };
  }
  // Begin/finish passkey login.
  rpc BeginPasskeyLogin(BeginPasskeyLoginRequest) returns (BeginPasskeyLoginResponse) {
    option (leapmux.v1.access) = { public: {} };
  }
  rpc FinishPasskeyLogin(FinishPasskeyLoginRequest) returns (FinishPasskeyLoginResponse) {
    option (leapmux.v1.access) = { public: {} };
  }
  // Begin/finish passkey signup (passkey-only, no password).
  rpc BeginPasskeySignUp(BeginPasskeySignUpRequest) returns (BeginPasskeySignUpResponse) {
    option (leapmux.v1.access) = { public: {} };
  }
  rpc FinishPasskeySignUp(FinishPasskeySignUpRequest) returns (FinishPasskeySignUpResponse) {
    option (leapmux.v1.access) = { public: {} };
  }
  // Self-service account recovery (break-glass; revokes passkeys and signs
  // out every session). Works for every account with a verified email
  // regardless of how it signs in — password, passkey, linked provider, or
  // any mix — because the emailed link proves the address, not the method
  // the user lost. Completing it spends the token on a replacement factor:
  // a new password (the account's first one if it never had one), or a new
  // passkey (which also clears the password). Linked providers stay.
  // Either way every existing passkey is revoked.
  rpc RequestAccountRecovery(RequestAccountRecoveryRequest) returns (RequestAccountRecoveryResponse) {
    option (leapmux.v1.access) = { public: {} };
  }
  // Password completion of account recovery: spends the emailed token on a
  // new password (the account's first one if it never had one) and revokes
  // every existing passkey. Linked providers stay. The passkey twin is
  // Begin/FinishAccountRecoveryPasskey.
  rpc CompleteAccountRecoveryPassword(CompleteAccountRecoveryPasswordRequest) returns (CompleteAccountRecoveryPasswordResponse) {
    option (leapmux.v1.access) = { public: {} };
  }
  // Begin/finish the passkey path of account recovery: the recovery token
  // replaces the authenticated session as the ceremony's authorization, so
  // a signed-out visitor holding the emailed link can enroll a replacement
  // passkey. Finish clears the password and revokes every other passkey.
  //
  // The passkey path of recovery: authorized by the emailed recovery token
  // (attempt-capped at the handler), not by a session, so both procedures
  // are public like the passkey signup pair above.
  rpc BeginAccountRecoveryPasskey(BeginAccountRecoveryPasskeyRequest) returns (BeginAccountRecoveryPasskeyResponse) {
    option (leapmux.v1.access) = { public: {} };
  }
  rpc FinishAccountRecoveryPasskey(FinishAccountRecoveryPasskeyRequest) returns (FinishAccountRecoveryPasskeyResponse) {
    option (leapmux.v1.access) = { public: {} };
  }
}

// The proof that a client passed the hub's captcha, carried by every
// unauthenticated credential request the captcha protects.
message CaptchaProof {
  // Provider token proving the client passed the hub's captcha: a base64
  // ALTCHA payload (altcha provider), a reCAPTCHA v3 token, or a Turnstile
  // token. Required when the hub reports captcha_enabled.
  string payload = 1;
  // Value of the hidden anti-bot honeypot field rendered alongside the
  // captcha. Must be empty; a non-empty value fails verification.
  string honeypot = 2;
}

// The first half of a WebAuthn ceremony: the hub's options for the browser,
// and the ceremony session that the second half names.
message WebAuthnChallenge {
  string session_id = 1;
  string options_json = 2; // The PublicKeyCredential options, as JSON.
}

// The second half of a WebAuthn ceremony: the browser's credential for the
// ceremony session that the first half opened. The hub refuses an empty
// session id or credential with InvalidArgument.
message WebAuthnCredential {
  string session_id = 1;
  string credential_json = 2; // The PublicKeyCredential, as JSON.
}

message LoginRequest {
  string username = 1;
  string password = 2;
  CaptchaProof captcha = 3; // Required when the hub reports captcha_enabled.
}

// Email-verification outcome shared by every login and sign-up response.
// One message, one contract: a fourth field or a sixth flow touches this
// message alone instead of five response shapes.
message EmailVerificationStatus {
  // True when the hub requires this account to verify an email address
  // before it is fully active.
  bool verification_required = 1;
  // True when the hub sent the verification email. Sign-up is
  // fail-closed: when verification is required and the hub cannot send
  // mail, the RPC fails and no account remains. On resend paths, false
  // means the send failed and the frontend should surface a "couldn't
  // send, try again" message; the hub cleared the pending row, so the
  // client may retry immediately.
  bool verification_email_sent = 2;
  // Earliest time the client may request another verification email. The
  // hub sets it only after a successful send.
  google.protobuf.Timestamp next_resend_available_at = 3;
}

// The session a sign-in established, or the one GetCurrentUser reports. Not
// named AuthState: the frontend's AuthContext already exports that name.
message SessionReport {
  // The complete account projection, linked providers and the step-up rule
  // included. Absent from a SUCCESSFUL sign-in response when that projection
  // could not be read; the client then reads GetCurrentUser.
  User user = 1;
  EmailVerificationStatus email_verification = 2;
  // When the session's step-up elevation lapses; unset when the session is
  // not elevated. A timestamp rather than a boolean, for the reason
  // ElevateSessionResponse.elevation_expires_at gives: a boolean decided at
  // bootstrap is wrong for the rest of the page's life.
  google.protobuf.Timestamp elevation_expires_at = 3;
}

message LoginResponse {
  // A fresh sign-in carries no elevation.
  SessionReport session_report = 1;
}

message SetInitialSoloPasswordRequest {
  string password = 1;
}

message SetInitialSoloPasswordResponse {
  // Carries the elevation deadline this call granted.
  //
  // The transaction that stores the password also creates the session AND
  // elevates it, so this caller is elevated the moment it reads the reply. The
  // deadline travels WITH that reply because the client's elevation state must
  // derive from the answer that created it. Recovering it from a following
  // GetCurrentUser makes the one-transaction design depend on a second round
  // trip: a client that adopts this user clears its elevation mirror, and a
  // transient failure on that second call then prompts the operator for the
  // password they typed a moment earlier.
  SessionReport session_report = 1;
}

message LogoutRequest {}

message LogoutResponse {}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  // The same report the sign-in responses carry, with the session's current
  // elevation.
  //
  // Its email verification status matters here: this is the ONLY response
  // the /verify-email page's own bootstrap reads, so without it a hard
  // reload of that page starts with the resend cooldown unset: the countdown
  // restarts at zero, the button re-enables, and the click gets
  // ResourceExhausted with no timestamp to restart from. Carrying it here
  // makes the cooldown derivable at every render instead of surviving
  // exactly one navigation.
  SessionReport session_report = 1;
}

message SignUpRequest {
  string username = 1;
  string password = 2;
  string display_name = 3;
  string email = 4;
  CaptchaProof captcha = 5;
}

message SignUpResponse {
  SessionReport session_report = 1;
}

message User {
  string id = 1;
  string username = 2;
  string display_name = 3;
  bool is_admin = 4;
  string email = 5;
  bool email_verified = 6;
  string pending_email = 7;
  repeated LinkedOAuthProvider oauth_providers = 8;
  // True when this account holds a password that can sign in.
  //
  // The stored hash decides it, never the users.password_set column. That
  // column is a claim the creating flow makes, and the solo bootstrap makes
  // it with an empty hash, so a client that read the claim would offer a
  // solo owner "Change Password" for the first password on the hub.
  bool password_set = 9;
  int32 passkey_count = 10;
  // Whether the hub accepts a step-up from one of this account's linked
  // providers.
  //
  // ACCOUNT-level, and here rather than on each link, because the rule reads
  // the account: a provider may prove a step-up exactly when the account
  // holds no password and no passkey, so the provider is its sign-in
  // credential. Reported per link, one boolean became N copies a client had
  // to agree with itself about, and a test already pinned a mixture the hub
  // cannot emit.
  //
  // The hub decides it because the hub ENFORCES it, at both legs of the OAuth
  // re-authentication flow. A client that spelled the same rule out was a
  // second source of truth for an authorization decision, and the two drifted
  // apart at the first change to either side.
  bool may_elevate_through_a_provider = 11;
}

message LinkedOAuthProvider {
  string id = 1;
  string name = 2;
  // Whether an administrator enables this provider.
  //
  // The hub still reports a DISABLED provider's link, and that is the
  // point. The link survives an administrator who disables the provider,
  // and the owner must still be able to see it and detach it -- this list
  // is the only feed for the Linked Accounts section, so filtering a
  // disabled row out of it left an account holding a login method the user
  // could neither use nor remove, while UnlinkOAuthProvider's own
  // last-login-method guard still counted it.
  //
  // A disabled link must NOT appear as a step-up option: both OAuth legs
  // answer "provider disabled" with a 403, so offering it sends the
  // browser out of the app to a bare refusal. The verification screen
  // therefore requires BOTH this flag and
  // User.may_elevate_through_a_provider.
  bool enabled = 3;
}

message GetOAuthProvidersRequest {}

message GetOAuthProvidersResponse {
  repeated OAuthProviderInfo providers = 1;
}

message OAuthProviderInfo {
  string id = 1;
  string name = 2;
  string provider_type = 3; // "oidc" or "github"
  string login_url = 4;     // full URL to /auth/idp/{id}/login
}

message GetPendingOAuthSignupRequest {
  string signup_token = 1;
}

message GetPendingOAuthSignupResponse {
  string email = 1;
  string display_name = 2;
  string provider_name = 3;
}

message CompleteOAuthSignupRequest {
  string signup_token = 1;
  string username = 2;
  string display_name = 3;
  string email = 4;
  CaptchaProof captcha = 5;
}

message GetAltchaChallengeRequest {}

message GetAltchaChallengeResponse {
  // The ALTCHA v2 Challenge serialized as JSON by the server library,
  // passed through to the widget's configure({challenge}) API verbatim.
  // Kept as an opaque string (rather than mirrored as typed proto fields)
  // so the interchange stays byte-exact with the widget regardless of how
  // ALTCHA evolves the challenge schema. Empty when captcha is disabled or
  // the selected provider is not altcha.
  string challenge_json = 1;
}

message CompleteOAuthSignupResponse {
  SessionReport session_report = 1;
}

message BeginPasskeyLoginRequest {
  string username = 1;
  CaptchaProof captcha = 2;
}

message BeginPasskeyLoginResponse {
  WebAuthnChallenge challenge = 1;
}

message FinishPasskeyLoginRequest {
  WebAuthnCredential credential = 1;
}

message FinishPasskeyLoginResponse {
  SessionReport session_report = 1;
}

message BeginPasskeySignUpRequest {
  string username = 1;
  string display_name = 2;
  string email = 3;
  CaptchaProof captcha = 4;
}

message BeginPasskeySignUpResponse {
  WebAuthnChallenge challenge = 1;
}

message FinishPasskeySignUpRequest {
  WebAuthnCredential credential = 1;
}

message FinishPasskeySignUpResponse {
  SessionReport session_report = 1;
}

message RequestAccountRecoveryRequest {
  string identifier = 1; // email or username
  CaptchaProof captcha = 2;
}

// Empty on purpose: identical on every path — known account, unknown
// identifier, unverified email, resend cooldown — so the response cannot
// enumerate which identifiers hold accounts.
message RequestAccountRecoveryResponse {}

message CompleteAccountRecoveryPasswordRequest {
  string token = 1;
  string new_password = 2;
  CaptchaProof captcha = 3;
}

// Empty on purpose: the caller is an anonymous bearer of the recovery
// token, and the flow ends at the login screen. Returning no account data
// keeps the response free of information the token does not already carry.
message CompleteAccountRecoveryPasswordResponse {}

message BeginAccountRecoveryPasskeyRequest {
  // The recovery token from the emailed link; it authorizes the ceremony
  // the way an authenticated session authorizes BeginPasskeyRegistration.
  string token = 1;
  CaptchaProof captcha = 2;
}

message BeginAccountRecoveryPasskeyResponse {
  WebAuthnChallenge challenge = 1;
}

message FinishAccountRecoveryPasskeyRequest {
  // Re-checked at write time: a token spent on a concurrent recovery (or
  // burned by the attempt cap) fails this RPC even mid-ceremony.
  string token = 1;
  WebAuthnCredential credential = 2;
}

// Empty on purpose, like CompleteAccountRecoveryPasswordResponse: the caller is an
// anonymous bearer of the recovery token, and the flow ends at the login
// screen.
message FinishAccountRecoveryPasskeyResponse {}
