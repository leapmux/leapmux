syntax = "proto3";
package leapmux.v1;

import "google/protobuf/empty.proto";
import "leapmux/v1/common.proto";

// TabCreation identifies one immutable creation attempt. The fresh tab ID is
// also its idempotency key. Retrying it must not create another resource.
message TabCreation {
  string tab_id = 1;
  TabPlacement placement = 2;
  TabPresentation presentation = 3;
}

// Immutable public intent shared by publication, cancellation, and resolution.
message TabPublication {
  TabCreation creation = 1;
  TabType tab_type = 2;
}

// TabPlacement captures the client's intent before resource creation starts.
// The Hub resolves the destination and calculates the position when it commits.
message TabPlacement {
  string workspace_id = 1;
  oneof destination {
    string tile_id = 2;
    google.protobuf.Empty first_leaf = 3;
  }
  TabInsertion insertion = 4;
  string relative_tab_id = 5;
}

enum TabInsertion {
  TAB_INSERTION_UNSPECIFIED = 0;
  TAB_INSERTION_FIRST = 1;
  TAB_INSERTION_LAST = 2;
  TAB_INSERTION_BEFORE = 3;
  TAB_INSERTION_AFTER = 4;
}

enum TabDisplayMode {
  TAB_DISPLAY_MODE_UNSPECIFIED = 0;
  TAB_DISPLAY_MODE_RENDER = 1;
  TAB_DISPLAY_MODE_SOURCE = 2;
  TAB_DISPLAY_MODE_SPLIT = 3;
}

enum TabFileViewMode {
  TAB_FILE_VIEW_MODE_UNSPECIFIED = 0;
  TAB_FILE_VIEW_MODE_WORKING = 1;
  TAB_FILE_VIEW_MODE_HEAD = 2;
  TAB_FILE_VIEW_MODE_STAGED = 3;
  TAB_FILE_VIEW_MODE_UNIFIED_DIFF = 4;
  TAB_FILE_VIEW_MODE_SPLIT_DIFF = 5;
}

// TabPresentation contains only the initial registers the Hub already stores.
// File paths, image references, and resource configuration remain on the Worker.
message TabPresentation {
  optional TabDisplayMode display_mode = 1;
  optional TabFileViewMode file_view_mode = 2;
  optional string file_diff_base = 3;
}

// PublishedTab is the committed placement, retained for idempotent retries.
message PublishedTab {
  TabIdent tab = 1;
  string workspace_id = 2;
  string tile_id = 3;
  string position = 4;
}

// QuakeTerminalTarget requests a directory-owned shell without a Hub tab.
message QuakeTerminalTarget {}
