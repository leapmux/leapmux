syntax = "proto3";
package leapmux.v1;

import "leapmux/v1/common.proto";

// AgentProvider identifies the coding agent backend.
enum AgentProvider {
  AGENT_PROVIDER_UNSPECIFIED = 0;
  AGENT_PROVIDER_CLAUDE_CODE = 1;
  AGENT_PROVIDER_CODEX = 2;
  reserved 3; // removed provider
  AGENT_PROVIDER_CURSOR = 4;
  AGENT_PROVIDER_GITHUB_COPILOT = 5;
  AGENT_PROVIDER_KILO = 6;
  AGENT_PROVIDER_OPENCODE = 7;
  AGENT_PROVIDER_GOOSE = 8;
  AGENT_PROVIDER_PI = 9;
  AGENT_PROVIDER_REASONIX = 10;
  AGENT_PROVIDER_ZCODE = 11;
}

// AgentStatus tracks the lifecycle state of an agent.
enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_ACTIVE = 1;
  AGENT_STATUS_INACTIVE = 2;
  AGENT_STATUS_STARTING = 3;        // Subprocess launch in progress
  AGENT_STATUS_STARTUP_FAILED = 4;  // Subprocess launch failed; see startup_error
}

// MessageSource identifies which side of the transcript a chat row
// belongs to. This is a transcript-row classifier, not a strict
// provenance / "who produced the bytes" classifier.
enum MessageSource {
  MESSAGE_SOURCE_UNSPECIFIED = 0;

  // User-side transcript row. Includes:
  //   - Human-typed input.
  //   - Synthetic conversational prompts injected by LeapMux that are
  //     forwarded to the agent's stdin (auto-continue, plan-execution
  //     prompts).
  //   - Display-only synthetic rows that mirror a user-side action
  //     (control-response / approval feedback such as Claude permission
  //     decisions or Pi extension_ui_response display text; agent
  //     interrupt display rows that are persisted but not forwarded
  //     to stdin).
  //   - Provider transcripts that arrive with a `user` role on the
  //     wire but represent agent-internal echoes (e.g. Claude tool
  //     results returned to the agent under role:"user").
  MESSAGE_SOURCE_USER = 1;

  // Agent-side transcript row. Anything the agent process emits to
  // its output stream — assistant text, tool calls, thinking blocks,
  // system notifications (rate limits, compaction, status updates),
  // and turn-end dividers. The fine-grained per-provider semantics
  // (assistant vs. system notification vs. terminal envelope) are
  // recovered by classifying the inner JSON envelope, not by source.
  MESSAGE_SOURCE_AGENT = 2;

  // LeapMux-synthesized non-conversational platform notification.
  // These rows are produced by LeapMux itself (never by the agent or
  // the user) and never reach the agent's stdin. Examples:
  // settings_changed, plan_execution metadata, context_cleared
  // markers, interrupt-event metadata.
  MESSAGE_SOURCE_LEAPMUX = 3;
}

// MarkType classifies a message as a notable jump target for the chat scroll
// rail (teal dots the user clicks to jump). Set at write time by the worker so
// the rail can enumerate marked seqs without decompressing message content.
// Deliberately NOT user-scoped: future values may mark non-user messages worth
// jumping to (e.g. errors, turn dividers).
enum MarkType {
  MARK_TYPE_UNSPECIFIED = 0;      // Not a jump mark.
  MARK_TYPE_USER_MESSAGE = 1;     // A message the user typed and sent.
  MARK_TYPE_CONTROL_RESPONSE = 2; // The user's answer to a control request
                                  // (AskUserQuestion answers, ExitPlanMode
                                  // approval, permission decisions).
}

// ContentCompression identifies the compression algorithm used for message content.
enum ContentCompression {
  CONTENT_COMPRESSION_UNSPECIFIED = 0;
  CONTENT_COMPRESSION_NONE = 1;
  CONTENT_COMPRESSION_ZSTD = 2;
}

// --- Agent CRUD ---

message OpenAgentRequest {
  // Target: where the agent runs. No workspace_id -- a Worker stores none, and
  // which workspace the tab lands in is decided by the CRDT tile the client
  // places it on.
  string worker_id = 1;         // Target worker (required)
  string working_dir = 2;       // Working directory on the worker (required)

  // Agent configuration.
  AgentProvider agent_provider = 3; // Coding agent provider (default: CLAUDE_CODE)
  string title = 4;
  string agent_session_id = 5;  // If set, resume from this session ID
  // Initial option selections keyed by option-group id (e.g. "model", "effort",
  // "permissionMode", and provider-specific axes). Missing well-known ids are
  // filled with provider defaults server-side.
  map<string, string> options = 6;

  // Git worktree / branch selection (mutually exclusive modes).
  bool create_worktree = 7;         // If true, create a git worktree before starting
  string worktree_branch = 8;      // Branch name for the worktree
  string worktree_base_branch = 9; // Base branch for "Create new worktree" (default: current branch)
  string use_worktree_path = 10;    // "Use existing worktree" mode
  string checkout_branch = 11;      // "Switch to branch" mode
  string create_branch = 12;        // "Create new branch" mode -- branch name to create
  string create_branch_base = 13;   // Base branch for "Create new branch" (default: current branch)

  // True when `title` is the suggestion this client PRE-FILLED and the user
  // left alone, so nobody chose it. The worker records it, and plan mode then
  // replaces such a title with the plan's own.
  //
  // The client has to say so, because the worker cannot tell. A dialog
  // pre-fills `Agent <Name>` from the shared pool and SENDS it, so the value
  // that arrives is indistinguishable from one the user typed -- and it used to
  // be judged by a regex over the rendered string, which overwrote a typed
  // `Agent Bob` too.
  //
  // Default false, and that is the safe direction: a caller that says nothing
  // (the CLI, and any client that sends a title it did not generate) keeps the
  // title it sent. An empty `title` is auto-generated regardless -- the worker
  // picked that one itself.
  bool title_auto_generated = 14;
}

message OpenAgentResponse {
  AgentInfo agent = 1;
}

message CloseAgentRequest {
  string agent_id = 1;
  WorktreeAction worktree_action = 2;
}

// CloseAgentResponse reports the outcome of CloseAgent. See CloseTabResult
// for why partial failures are returned in-band rather than as RPC errors.
message CloseAgentResponse {
  CloseTabResult result = 1;
  // Every subagent BELOW the closed agent, at any depth, in NO particular
  // order. An agent id is also its tab id, so a client retires those tabs
  // alongside the one it closed.
  //
  // The worker answers because only it holds the parent chain: a child agent is
  // a transcript the parent's process feeds, so with the parent gone nothing can
  // add to it and the tab claims a lineage the user can no longer see. Read
  // BEFORE any teardown, and reported for a child close too -- that close is
  // UI-only, but the child's own subagents still go with it.
  //
  // A client that needs a bottom-up order must sort for itself: the query walks
  // the tree breadth-first and returns a parent BEFORE its own children. Order
  // does not matter to a tombstone, which is last-writer-wins per tab id.
  //
  // These are agent ROWS, and a row exists for every subagent the provider ever
  // spawned -- not only the ones someone opened a tab for. A client MUST retire
  // only the ids it holds a live tab record for; tombstoning an id the CRDT has
  // never seen is rejected, and it takes the whole batch with it.
  repeated string descendant_agent_ids = 2;
}

message ListAgentsRequest {
  repeated string tab_ids = 1;
}

message ListAgentsResponse {
  repeated AgentInfo agents = 1;
  // One entry per REQUESTED tab_id, so the caller can tell an omission
  // that is transient from one that is permanent. Empty when the request
  // named no tab_ids (the list-everything form).
  repeated TabHydrationVerdict verdicts = 2;
}

message RenameAgentRequest {
  string agent_id = 1;
  string title = 2;
}

message RenameAgentResponse {
  // The title the worker actually STORED, which is not always the title the
  // request carried. The worker strips the control characters and the
  // invisible format characters, folds each run of whitespace to one space,
  // trims both ends, and cuts what remains to 128 UTF-8 bytes -- IN THAT
  // ORDER. Visible punctuation survives, `"`, `\`, `$` and `%` included, and
  // the worker never refuses a title. A request whose title cleans to nothing
  // changes no row, and this field then reports the title the agent still
  // holds. A client that does not apply the same rule locally reads the
  // effective title from here instead of echoing what it sent.
  //
  // The order matters to a client that DOES apply the rule locally. A rule
  // that cut first returns the empty string for a title of 200 invisible
  // characters followed by "Plan", because the cut takes "Plan" with it.
  string title = 1;
}

message AgentInfo {
  // Identity. No workspace_id: the Worker does not know which workspace hosts
  // the tab -- the CRDT projection does, from the tab's tile.
  string id = 1;
  string title = 2;

  // Worker / location.
  string worker_id = 3;         // Worker this agent runs on
  string worker_name = 4;       // Human-readable worker name
  string working_dir = 5;       // Working directory on the worker
  string home_dir = 6;          // Worker's home directory for tilde path display

  // Agent configuration.
  AgentProvider agent_provider = 7; // Coding agent provider
  // All agent configuration axes (model, effort, permission mode, and every
  // provider-specific option) reported by the agent process, each with its
  // current value, default, mutability, and display order.
  repeated AvailableOptionGroup option_groups = 8;

  // Lifecycle / status.
  AgentStatus status = 9;
  string agent_session_id = 10; // Non-empty if agent session can be resumed
  string created_at = 11;
  string closed_at = 12;
  string startup_error = 13;    // Populated when status=AGENT_STATUS_STARTUP_FAILED
  string startup_message = 14;  // Populated when status=AGENT_STATUS_STARTING (e.g. "Checking Git status...")

  // Git.
  GitRepoStatus git_status = 15; // Git status for the agent's working directory

  // Subagent linkage. parent_agent_id is non-empty only for virtual child
  // agents (subagent transcripts fed by the parent provider's process); a
  // child never owns a process. spawn_span_id is the tool_use span in the
  // PARENT transcript that spawned this child (the tab/spawn correlation key).
  string parent_agent_id = 16;
  string spawn_span_id = 17;
  // Whether this agent accepts a user message sent directly to it. Roots:
  // always true. Children: true only when the feeding provider supports
  // steering a subagent conversation inside the same process (Codex); false
  // for read-only transcripts (Claude, ACP, Pi). The frontend gates the
  // composer on this.
  bool accepts_messages = 18;
  // The ROOT owner agent id (the top of the parent_agent_id chain). For a root
  // agent this equals its own id. The background-task registry and the root's
  // TodosChanged/BackgroundTasksChanged events are keyed by this id, so a child
  // tab resolves its registry owner and its NOTIFY subscription from this field
  // directly -- without walking a client-side parent chain that can be partially
  // hydrated and fall back to the wrong id.
  string root_agent_id = 19;
}

// AvailableOption describes a single selectable value within an option group
// (e.g. a model, a reasoning effort, or a permission-mode value).
message AvailableOption {
  string id = 1;             // Value stored/sent in requests (e.g. "opus", "high", "default")
  string name = 2;           // Human-readable label (e.g. "Opus 4.8", "High", "Default")
  string description = 3;    // Tooltip text shown on hover
  int64 context_window = 4;  // Context window size in tokens (0 = n/a); set only on "model" group options
  // sub_groups carries the option groups this value determines -- set only on
  // "model" group options, where each model carries its own model-dependent
  // groups: the reasoning "effort" tiers it supports, and Claude's "extended
  // thinking" group whose enabled label is "Adaptive" vs "On" per model. It lets
  // the frontend recompute those dependent groups the instant the model selection
  // changes, instead of waiting for the worker to re-emit them after a relaunch.
  repeated AvailableOptionGroup sub_groups = 5;
}

// AvailableOptionGroup is one axis of agent configuration. ALL agent options
// are represented uniformly by this message: model, effort, permission mode,
// primary agent, and every provider-specific axis (fast mode, sandbox policy,
// service tier, ...). Well-known ids ("model", "effort", "permissionMode",
// "primaryAgent") let callers fetch a specific axis; provider-specific axes use
// their own id.
message AvailableOptionGroup {
  string id = 1;                        // Well-known or provider-specific group id
  string label = 2;                     // Display label (e.g. "Model", "Permission Mode")
  repeated AvailableOption options = 3;  // The selectable values in this group
  string current_value = 4;             // Currently selected option id
  string default_value = 5;             // Provider default option id
  bool mutable = 6;                     // false => agent-controlled, render read-only
  int32 order = 7;                      // Ascending display order in the popover
}

// --- Agent Messaging ---

// Attachment represents a file attached to a user message.
message Attachment {
  string filename = 1;
  string mime_type = 2;
  bytes data = 3;  // Raw file bytes
}

message SendAgentMessageRequest {
  string agent_id = 1;
  string content = 2; // User message text
  repeated Attachment attachments = 3;
}

message SendAgentMessageResponse {}

message SendAgentRawMessageRequest {
  string agent_id = 1;
  string content = 2; // Raw provider input/control payload
}

message SendAgentRawMessageResponse {}

// AgentChatMessage represents a complete message in the conversation.
message AgentChatMessage {
  string id = 1;
  MessageSource source = 2;
  bytes content = 3; // JSON blob from Claude Code (may be compressed per content_compression)
  int64 seq = 4;
  string created_at = 5;
  string delivery_error = 6; // Non-empty if worker delivery failed
  ContentCompression content_compression = 7; // Compression algorithm used for content
  AgentProvider agent_provider = 8; // Provider that produced this message
  int32 depth = 9; // Nesting level: 0=main agent, 1=subagent, 2=nested subagent
  string parent_span_id = 10; // span_id of the parent Agent/SpawnAgent that spawned this scope (empty for main)
  string span_id = 11; // Links a tool invocation with its result (tool_use ↔ tool_result, item/started ↔ item/completed)
  string span_type = 12; // Tool name (e.g. "Grep", "Edit") or item type (e.g. "commandExecution") for span messages
  int32 span_color = 13; // Color index assigned to this span (−1 = no color)
  string span_lines = 14; // JSON array of active span lines at this message's position
  // TRANSIENT broadcast metadata: when > 0, this live broadcast is a MOVE of an
  // existing message id to a new (higher) seq -- a notification-thread consolidation
  // reseq -- and previous_seq is the seq it moved FROM. 0 means a brand-new message.
  // Only ever set on the live WatchEvents broadcast of a reseq; always 0 on a persisted
  // row, a ListAgentMessages page, and a resubscribe replay (the DB has no such column),
  // so a consumer can treat a replayed/listed row as a normal message at its current seq.
  // Lets every consumer recognize a move EXPLICITLY instead of inferring it (the CLI
  // follower has no id memory; the frontend no longer has to guess from a seq change).
  int64 previous_seq = 15;
  // Scroll-rail jump-mark classifier, set at write time. MARK_TYPE_UNSPECIFIED for
  // ordinary rows. Carried on persisted rows, ListAgentMessages pages, and replays.
  MarkType mark_type = 16;
}

message AgentStreamChunk {
  string message_id = 1;
  // The provider's own streamed delta. Codex sends plain text; an ACP provider
  // sends its extracted text. No provider sends a raw envelope: a chunk with no
  // span_id is appended verbatim to the chat's free-form streaming text, so an
  // unextracted line prints into the transcript as JSON.
  bytes delta = 2;
  AgentProvider agent_provider = 3; // Provider that produced this chunk
  string span_id = 4; // Optional target tool/item span for inline streaming
  string method = 5; // Original provider notification method for classifying the stream
}

// AgentStreamEnd signals that streaming for a message is complete.
message AgentStreamEnd {
  string message_id = 1;
  string span_id = 2; // Optional target tool/item span for inline streaming
}

// AgentStatusChange notifies of agent status transitions.
message AgentStatusChange {
  // Identity.
  string agent_id = 1;
  AgentProvider agent_provider = 2; // Provider for this agent

  // Lifecycle / status.
  AgentStatus status = 3;
  string agent_session_id = 4;  // Non-empty if agent session can be resumed
  bool worker_online = 5;       // Whether the worker hosting this agent is online
  string startup_error = 6;     // Populated when status=AGENT_STATUS_STARTUP_FAILED
  string startup_message = 7;   // Phase label shown in the startup panel while status=AGENT_STATUS_STARTING (e.g. "Checking Git status...")

  // Agent configuration: all axes reported by the agent (empty = don't update).
  repeated AvailableOptionGroup option_groups = 8;

  // Git.
  GitRepoStatus git_status = 9; // Git status for the agent's working directory
}

// AgentGitStatus was replaced by GitRepoStatus in leapmux/v1/common.proto.

// --- Message History ---

// Which page of an agent's message history ListAgentMessages returns.
// The response is ALWAYS ordered ascending by seq, regardless of anchor;
// has_more reports whether further messages exist in the page's direction.
enum MessagePageAnchor {
  // Unset/unknown. The handler resolves it to the LATEST page, so an unset
  // anchor still defaults to the most recent page (cold-start view).
  MESSAGE_PAGE_ANCHOR_UNSPECIFIED = 0;
  // Most recent page (cold-start view / jump-to-latest). cursor_seq is ignored.
  MESSAGE_PAGE_ANCHOR_LATEST = 1;
  // Earliest page (jump-to-first / Home). cursor_seq is ignored.
  MESSAGE_PAGE_ANCHOR_OLDEST = 2;
  // Page of messages older than cursor_seq (seq < cursor_seq) -- scroll-up.
  MESSAGE_PAGE_ANCHOR_BEFORE = 3;
  // Page of messages newer than cursor_seq (seq > cursor_seq) -- scroll-down / catch-up.
  MESSAGE_PAGE_ANCHOR_AFTER = 4;
}

// WatchReplayMode selects which history a WatchEvents subscriber replays before
// the live stream begins. Sibling of MessagePageAnchor, narrowed to the two modes
// a tail subscription actually supports -- so OLDEST/BEFORE (meaningless for a
// live tail) are simply unrepresentable rather than rejected at runtime.
enum WatchReplayMode {
  // Unset/unknown. The handler resolves it to LATEST (cold-start view).
  WATCH_REPLAY_MODE_UNSPECIFIED = 0;
  // Replay the most recent page, then stream live. cursor_seq is ignored. The
  // cold-start subscription, matching the windowing client's initial LATEST load
  // so the two dedup instead of tearing a gap into the loaded window.
  WATCH_REPLAY_MODE_LATEST = 1;
  // Replay every message after cursor_seq (seq > cursor_seq), then stream live.
  // The reconnect/resume subscription that bridges the disconnect gap.
  WATCH_REPLAY_MODE_AFTER_CURSOR = 2;
}

message ListAgentMessagesRequest {
  string agent_id = 1;
  MessagePageAnchor anchor = 2; // Which page to return; defaults to LATEST.
  int64 cursor_seq = 3;         // Exclusive seq bound for BEFORE/AFTER; ignored for LATEST/OLDEST.
  int32 limit = 4;              // Max messages to return (Hub enforces max 50).
}

message ListAgentMessagesResponse {
  repeated AgentChatMessage messages = 1;
  bool has_more = 2;
  // Authoritative provider-agnostic to-do list at the time the response is
  // served. Drives the sidebar without re-scanning message history; survives
  // page reloads and cross-client opens via the worker's agent_todos table.
  // Only meaningful when todos_loaded is true -- an empty repeated field is
  // indistinguishable on the wire from "the snapshot couldn't be loaded".
  repeated TodoItem todos = 3;
  // Whether `todos` carries an authoritative snapshot. True only on a latest
  // page whose LoadTodos succeeded; false on a non-latest page OR when the
  // LoadTodos query errored. The client overwrites its to-do list ONLY when
  // this is true, so a transient DB error can't wipe a populated list with an
  // empty array (protobuf-es always materializes the repeated field as [], so
  // [] alone can't signal "leave todos alone").
  bool todos_loaded = 4;
  // The agent's authoritative live-tail seq at the time the response is served. Lets
  // the `--follow` CLI resolve a resume point WITHOUT inferring it from the page's
  // content: when page 1 comes back empty it resumes after latest_seq instead of seq 0,
  // so a transient empty page on a populated agent can no longer collapse to the
  // "drain the entire history from OLDEST" path. Explicit presence (the shared convention
  // with CatchUpStart/Complete.latest_seq and AgentMessageDeleted.new_latest_seq): UNSET =
  // the worker couldn't determine it (a DB error) and the consumer skips reconciliation /
  // falls back to its loaded cursor; present 0 = the agent genuinely has no messages;
  // present >0 = the authoritative MAX(seq).
  optional int64 latest_seq = 5;
  // Authoritative provider-agnostic background-task registry at the time the
  // response is served. Drives the "Background tasks" sidebar section; survives
  // page reloads and cross-client opens via the worker's
  // agent_background_tasks table. Same explicit-presence contract as
  // todos/todos_loaded: only meaningful when background_tasks_loaded is true.
  repeated BackgroundTaskItem background_tasks = 6;
  // Whether `background_tasks` carries an authoritative snapshot. True only on
  // a latest page whose LoadBackgroundTasks succeeded; false otherwise. The
  // client overwrites its registry ONLY when this is true, so a transient DB
  // error can't wipe a populated list with an empty array.
  bool background_tasks_loaded = 7;
}

// GetAgentMessage fetches a SINGLE message by its per-agent seq. Used by the
// chat scroll rail to preview a marked message on dot-hover when that message
// is outside the loaded window (the rail spans the whole conversation, so the
// hovered mark is usually not loaded). The seq is agent-scoped; the worker
// verifies the caller may access the agent's workspace before reading, and the
// lookup is scoped to agent_id, so no cross-agent/cross-workspace read is
// possible.
message GetAgentMessageRequest {
  string agent_id = 1;
  int64 seq = 2;
}

message GetAgentMessageResponse {
  // The message at the requested seq, or unset when the agent has no message
  // with that seq (deleted/reseq'd since the mark was recorded, or a closed
  // agent). The client treats an unset message as "no preview available".
  AgentChatMessage message = 1;
}

// ListMessageMarks returns the seqs of every marked message (scroll-rail jump
// targets) plus the agent's whole-history seq range. Drives the chat scroll
// rail: dot positions (marked seqs) and the seq-space track extent
// (min_seq..max_seq). The frontend keeps the set updated incrementally from
// live events; this seeds it and heals it after a reconnect.
message ListMessageMarksRequest {
  string agent_id = 1;
}

message MessageMark {
  int64 seq = 1;
  MarkType type = 2;
}

message ListMessageMarksResponse {
  repeated MessageMark marks = 1; // Ascending by seq. May be empty.
  // Lowest / highest live message seq. Explicit presence, the shared convention with
  // ListAgentMessagesResponse.latest_seq: UNSET = the worker couldn't determine the
  // range (a DB error; the client keeps its current value), present 0 = the agent
  // genuinely has no messages, present >0 = the authoritative MIN/MAX(seq). Both are
  // set or unset together (they come from one seq-range query).
  optional int64 min_seq = 2;
  optional int64 max_seq = 3;
}

// TodoItem is the provider-neutral to-do row used by the sidebar list and
// inline TaskCreate/TaskUpdate/TaskList/TaskGet cards. Sources include
// Claude TodoWrite/Task*, Codex turn/plan/updated, and ACP sessionUpdate=plan.
message TodoItem {
  string id = 1;          // Claude Task* taskId; empty for snapshot-only providers
  string content = 2;     // Imperative title (e.g. "Run tests")
  TodoStatus status = 3;
  string active_form = 4; // Present-continuous label shown while in_progress
  string description = 5; // Claude Task* description; empty elsewhere
}

enum TodoStatus {
  TODO_STATUS_UNSPECIFIED = 0;
  TODO_STATUS_PENDING = 1;
  TODO_STATUS_IN_PROGRESS = 2;
  TODO_STATUS_COMPLETED = 3;
  TODO_STATUS_DELETED = 4;
}

// AgentTodosChanged is broadcast whenever a message mutates an agent's
// to-do list (after persistence). Recipients should replace the agent's
// list with todos verbatim — this event is authoritative.
message AgentTodosChanged {
  string agent_id = 1;
  repeated TodoItem todos = 2;
}

// BackgroundTaskItem is a row in the provider-neutral background-task registry
// that drives the "Background tasks" sidebar section. Sources include Claude
// Task*/Workflow events, Codex collab/subAgentActivity, ACP tool notifications
// (OpenCode/Kilo/Goose/Reasonix), and Pi tool-execution updates. Same security
// posture as TodoItem: content lives only in worker SQLite and travels only
// over the E2EE WatchEvents channel.
message BackgroundTaskItem {
  string id = 1;              // registry row_key (provider linkage key)
  BackgroundTaskKind kind = 2;
  string child_agent_id = 3;  // set when the task owns a transcript (openable tab)
  string parent_agent_id = 4; // immediate parent agent id ('' == the owner itself)
  string group_key = 5;       // workflow/phase grouping key ('' = ungrouped)
  string group_label = 6;     // human label for the group
  string title = 7;
  string description = 8;
  string active_form = 9;     // live activity text
  BackgroundTaskStatus status = 10;
  string created_at = 11;
  string updated_at = 12;
  string ended_at = 13;       // empty while active
  // Whether `title` is a verbatim shell command rather than prose, so the
  // client can set it as code. Only a provider that hands the command over
  // ITSELF can say: an ACP terminal/create carries the command and nothing
  // else, while Claude's task_started carries `description || command`, so a
  // Claude shell row's title is prose whenever the model wrote one and there is
  // no way to tell which it was. False is the safe answer -- prose in the
  // monospace face reads worse than a command in the normal one.
  bool title_is_command = 14;
}

enum BackgroundTaskKind {
  BACKGROUND_TASK_KIND_UNSPECIFIED = 0;
  BACKGROUND_TASK_KIND_SUBAGENT = 1;
  BACKGROUND_TASK_KIND_SHELL = 2;
}

enum BackgroundTaskStatus {
  BACKGROUND_TASK_STATUS_UNSPECIFIED = 0;
  BACKGROUND_TASK_STATUS_PENDING = 1;
  BACKGROUND_TASK_STATUS_RUNNING = 2;
  BACKGROUND_TASK_STATUS_COMPLETED = 3;
  BACKGROUND_TASK_STATUS_FAILED = 4;
  BACKGROUND_TASK_STATUS_STOPPED = 5;
  // The worker or the feeding agent process restarted and cut the task off.
  BACKGROUND_TASK_STATUS_INTERRUPTED = 6;
}

// AgentBackgroundTasksChanged is broadcast whenever a background-task registry
// row mutates (after persistence). agent_id is the ROOT owner agent id.
// Recipients should replace the agent's registry with tasks verbatim -- this
// event is authoritative.
message AgentBackgroundTasksChanged {
  string agent_id = 1;                       // ROOT owner agent id
  repeated BackgroundTaskItem tasks = 2;     // authoritative; replace wholesale
}

// --- Control Request/Response ---

// AgentControlRequest is sent when Claude Code needs user approval (e.g. ExitPlanMode, AskUserQuestion).
message AgentControlRequest {
  string agent_id = 1;
  string request_id = 2;
  bytes payload = 3;  // Full JSON of the control_request (verbatim)
  AgentProvider agent_provider = 4; // Provider for this agent
  // claim_token identifies this REQUEST INSTANCE. The worker mints a fresh token per
  // PersistControlRequest; the frontend echoes it in SendControlResponseRequest so a stale
  // duplicate answer to a PRIOR instance of a reused request_id (e.g. a Codex/ACP JSON-RPC
  // counter that reset across a plan-exec restart) cannot re-win the idempotency claim of the
  // current instance. Empty when the row predates the token (degrades to request_id-only dedup).
  string claim_token = 5;
}

// AgentControlCancelRequest is sent when Claude Code cancels a pending control request.
message AgentControlCancelRequest {
  string agent_id = 1;
  string request_id = 2;
}

// SendControlResponseRequest sends a control response back to the agent.
message SendControlResponseRequest {
  string agent_id = 1;
  bytes content = 2;  // Raw JSON control_response for Claude Code stdin
  // claim_token is the per-instance token the frontend echoes from the AgentControlRequest it is
  // answering (see AgentControlRequest.claim_token). The worker keys the idempotency claim on it so
  // a stale duplicate of a prior instance of a reused request_id cannot re-win. Empty falls back to
  // request_id-only dedup.
  string claim_token = 3;
}

message SendControlResponseResponse {}

// AgentMessageError notifies watchers of a message delivery failure.
message AgentMessageError {
  string agent_id = 1;
  string message_id = 2;
  string error = 3; // Non-empty = error, empty = cleared
}

// AgentMessageDeleted notifies watchers that a message was deleted.
message AgentMessageDeleted {
  string agent_id = 1;
  string message_id = 2;
  // The seq of the deleted row. Lets a windowed client whose loaded window lags
  // the live tail tell whether the deleted row was at or beyond its recorded
  // live-tail seq.
  int64 seq = 3;
  // The agent's authoritative MAX(seq) AFTER this deletion. When the deleted row was
  // the recorded live tail, a windowed client sets its live-tail seq to exactly this
  // value instead of guessing seq - 1 -- so a delete of an unloaded beyond-window tail
  // can't strand the recorded tail above the true server max, and the next forward-fill
  // resolves against the real tail rather than a conservative under-estimate. Explicit
  // presence (shared with latest_seq): UNSET = the worker couldn't determine it (a DB
  // error) and the client leaves its recorded tail unchanged; present 0 = no messages
  // remain; present >0 = the authoritative MAX(seq).
  optional int64 new_latest_seq = 4;
}

message DeleteAgentMessageRequest {
  string agent_id = 1;
  string message_id = 2;
}

message DeleteAgentMessageResponse {}

// AgentSettings holds option values to apply, keyed by option-group id
// (e.g. "model", "effort", "permissionMode", "sandbox_policy"). Sparse: only
// the included ids change; omitted ids are left untouched.
message AgentSettings {
  map<string, string> options = 1;
}

message UpdateAgentSettingsRequest {
  string agent_id = 1;
  AgentSettings settings = 2;
}

message UpdateAgentSettingsResponse {
  // The option values the agent settled on after applying the change -- e.g. the
  // concrete model an account-default sentinel resolved to, and the effort a model
  // switch reset to. The client reconciles its optimistic state against these rather
  // than a separately-broadcast catalog, removing a cross-channel ordering dependency.
  // ALWAYS populated: for an offline edit or a failed restart where no running agent
  // confirms anything, this echoes the requested values filled with provider defaults
  // (it is never empty). Reconcile only the model/effort axes against it -- a non-model
  // axis applied live (ACP set_config_option) may not echo its refreshed value here, so
  // the reply can lag the optimistic selection; that axis is corrected by the next
  // status push instead.
  map<string, string> confirmed_options = 1;
}

message ListAvailableProvidersRequest {}

message ListAvailableProvidersResponse {
  repeated AgentProvider providers = 1;
}

// ListAgentSessions offers the sessions a user can resume in one working
// directory, so the New Agent / New Workspace dialogs can present a list
// instead of asking the user to remember a session ID.
//
// The worker merges two sources: its OWN database, which holds every session
// LeapMux started, and the selected provider's on-disk session store, which
// holds sessions started outside LeapMux as well. A handle both sources carry
// appears once.
message ListAgentSessionsRequest {
  string worker_id = 1;
  // Which provider's sessions to list. A resume handle is only meaningful to
  // the CLI that issued it, so the answer is per-provider and changes with the
  // dialog's provider selector.
  AgentProvider agent_provider = 2;
  // The directory the sessions must have run in, matched exactly. Every
  // provider store records a session's working directory, and the sessions of
  // the directory where a user starts an agent are the relevant ones.
  string working_dir = 3;
}

message AgentSessionSummary {
  // The resume handle. Goes back on the wire verbatim as
  // OpenAgentRequest.agent_session_id.
  string session_id = 1;
  // A human-readable summary. MAY BE EMPTY: Pi stores no title, and a Claude
  // session has none until its title pass runs. A client shows the handle in
  // its place rather than inventing one.
  string title = 2;
  // Last activity, RFC3339. Empty when the store recorded none.
  string updated_at = 3;
}

message ListAgentSessionsResponse {
  // Newest first. Capped by the worker; a client does not ask for a count.
  repeated AgentSessionSummary sessions = 1;
}

// InterruptAgent asks the worker to abort the agent's current turn. The
// worker dispatches the appropriate provider-specific signal (SIGINT,
// stream-control payload, etc.); callers (frontend or CLI) never need to
// synthesize provider JSON.
message InterruptAgentRequest {
  string agent_id = 1;
  // Optional reason for audit/logging; not surfaced to the agent.
  string reason = 2;
}

message InterruptAgentResponse {}
