syntax = "proto3";
package leapmux.v1;

import "leapmux/v1/access.proto";
import "leapmux/v1/channel.proto";
import "leapmux/v1/common.proto";

// ControlIPCService is the local Unix-socket / npipe surface a worker
// exposes to processes it spawned (agents, opt-in terminals). The CLI
// running inside the spawned process speaks ConnectRPC over h2c to this
// service via LEAPMUX_CONTROL_SOCK; the LEAPMUX_CONTROL_TOKEN env var
// authenticates the caller.
//
// The service is intentionally a thin envelope around InnerRpcRequest /
// InnerStreamMessage so the worker can multiplex same-worker, cross-
// worker, and hub-side calls through a single dispatch layer without
// having to enumerate every method. The router chooses the destination from
// the method's namespace and target_worker_id alone, and never reads the
// payload: a "worker." method with an empty target_worker_id, or with this
// worker's id, dispatches locally; any other id goes over the cross-worker
// channel; a "hub." method goes to the hub.
service ControlIPCService {
  option (leapmux.v1.host) = SERVICE_HOST_WORKER_IPC;
  // CallInner dispatches a unary inner-RPC. A local failure comes back
  // in-band, in InnerRpcResponse.error; a cross-worker or hub failure comes
  // back as a ConnectRPC error.
  rpc CallInner(CallInnerRequest) returns (InnerRpcResponse);
  // StreamInner is the server-streaming counterpart for events / message
  // tails / WatchEvents-style RPCs.
  rpc StreamInner(StreamInnerRequest) returns (stream InnerStreamMessage);
  // Whoami returns the resolved identity of the calling process based on
  // the bearer token.
  rpc Whoami(WhoamiRequest) returns (WhoamiResponse);
  // UpdateStream delivers a follow-up request to an in-flight StreamInner
  // stream, or retires it, the cleartext-IPC counterpart of
  // InnerStreamRequest.
  rpc UpdateStream(UpdateStreamRequest) returns (UpdateStreamResponse);
}

message CallInnerRequest {
  // Namespaced method. Examples:
  //   "worker./leapmux.v1.WorkerAgentService/OpenAgent" — a worker
  //   procedure, dispatched on this worker or a sibling (see
  //   target_worker_id).
  //   "hub.WorkspaceService/ListWorkspaces" — hub-side ConnectRPC.
  string method = 1;
  bytes payload = 2;
  // The worker that serves a "worker." method. Empty or this worker's id
  // dispatches locally; any other id goes over the cross-worker channel. The
  // router never reads the payload to choose. A "hub." method ignores it.
  string target_worker_id = 3;
}

message StreamInnerRequest {
  string method = 1;
  bytes payload = 2;
  // As CallInnerRequest.target_worker_id.
  string target_worker_id = 3;
  // Client-assigned identifier, unique per stream across every client of
  // this worker, so UpdateStream can address this stream.
  string client_request_id = 4;
}

message WhoamiRequest {}

// WhoamiResponse describes the spawn context a `leapmux control` bearer was
// minted for. No workspace_id: the Worker stores none, and the workspace a tab
// lives in is derivable from the stable tab id below via a single hub LocateTab
// call -- so there is nothing here to go stale on a cross-workspace move.
message WhoamiResponse {
  string user_id = 1;
  string username = 2;
  string worker_id = 3;    // spawning worker
  string tab_id = 4;       // spawning tab id (agent or terminal)
  TabType tab_type = 5;    // matches the rest of the protos
}

message UpdateStreamRequest {
  string client_request_id = 1;
  bytes payload = 2; // Empty on a pure cancel.
  bool cancel = 3;   // The client is done; the router retires the stream.
}

message UpdateStreamResponse {}
