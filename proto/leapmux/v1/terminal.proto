syntax = "proto3";
package leapmux.v1;

import "leapmux/v1/access.proto";
import "leapmux/v1/common.proto";
import "leapmux/v1/git.proto";

// WorkerTerminalService opens, drives and reads terminals. Served by the Worker
// inside an E2EE channel.
service WorkerTerminalService {
  option (leapmux.v1.host) = SERVICE_HOST_WORKER;
  rpc OpenTerminal(OpenTerminalRequest) returns (OpenTerminalResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_TERMINAL_WRITE };
  }
  rpc RestartTerminal(RestartTerminalRequest) returns (RestartTerminalResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_TERMINAL_WRITE };
  }
  rpc SendInput(SendInputRequest) returns (SendInputResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_TERMINAL_WRITE };
  }
  rpc ResizeTerminal(ResizeTerminalRequest) returns (ResizeTerminalResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_TERMINAL_WRITE };
  }
  rpc RenameTerminal(RenameTerminalRequest) returns (RenameTerminalResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_TERMINAL_WRITE };
  }
  rpc ListTerminals(ListTerminalsRequest) returns (ListTerminalsResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_TERMINAL_READ };
  }
  rpc InspectTerminalProcesses(InspectTerminalProcessesRequest) returns (InspectTerminalProcessesResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_TERMINAL_READ };
  }
  rpc ListAvailableShells(ListAvailableShellsRequest) returns (ListAvailableShellsResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_TERMINAL_READ };
  }
}

// TerminalStatus tracks the lifecycle state of a terminal PTY. The worker
// reports every value. A lost worker channel is a display state that only the
// client can observe, so it is no value here.
enum TerminalStatus {
  TERMINAL_STATUS_UNSPECIFIED = 0;
  TERMINAL_STATUS_STARTING = 1;        // PTY spawn in progress
  TERMINAL_STATUS_READY = 2;           // PTY spawned; xterm can mount
  TERMINAL_STATUS_STARTUP_FAILED = 3;  // PTY spawn failed; see startup_error
  TERMINAL_STATUS_EXITED = 4;          // The shell process exited.
}

message OpenTerminalRequest {
  string working_dir = 1;
  string shell = 2;
  string shell_start_dir = 3;
  uint32 cols = 4;
  uint32 rows = 5;
  // How to prepare the working directory. Absent = use it as it is.
  GitSetup git_setup = 6;

  // Tab title. Optional: an empty title (or one that cleaning empties) means
  // "you pick one", and the worker takes a random "Terminal <Name>" from the
  // shared pool. Never refused — the worker CLEANS whatever arrives, the same
  // rule RenameTerminal applies. Mirrors OpenAgentRequest.title.
  string title = 7;

  // When true, this terminal is the QUAKE terminal of `working_dir` rather than
  // a tab of its own. `working_dir` is the whole address: a quake terminal
  // belongs to a DIRECTORY on this worker, not to a tab, so every tab that
  // works in that directory reaches the same shell. Three consequences, all
  // owned by the worker:
  //
  //   - closing the last tab that works in that directory closes this terminal;
  //   - the orphan reconciler measures this row's liveness by whether any open
  //     tab still works in that directory, because a quake terminal has no CRDT
  //     tab the hub could ever list;
  //   - a second OpenTerminal that specifies the same directory returns the EXISTING
  //     terminal instead of spawning a second shell, so every device -- and
  //     every tab in that directory -- attaches to one PTY.
  //
  // A unique partial index over the open rows enforces the last point, so the
  // guarantee survives two devices racing.
  bool quake = 8;
}

message OpenTerminalResponse {
  string terminal_id = 1;
  // title is what the worker STORED: the cleaned form of the request's title,
  // or its auto-generated "Terminal <Name>" when the request supplied none.
  // Surfaced here so the frontend doesn't have to round-trip a separate
  // ListTerminals just to render the tab, and so a client that sent a title
  // renders the same text the worker persisted rather than its own raw input.
  // git_branch and git_origin_url used to live here but are now delivered
  // via the first TerminalStatusChange (gitStatus) after worktree creation
  // finishes on the async startup path.
  string title = 2;
}

// RestartTerminalRequest respawns the shell process for an exited
// terminal in place, reusing the tab's working_dir / shell / shell_start_dir
// and freshly minting LEAPMUX_CONTROL_* env vars. The screen buffer
// (including the "[Terminal process exited (N) - Press Enter to restart]"
// notice) is preserved so the new shell's prompt appears below it.
message RestartTerminalRequest {
  string terminal_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message RestartTerminalResponse {}

message SendInputRequest {
  string terminal_id = 1;
  bytes data = 2;
}

message SendInputResponse {}

message ResizeTerminalRequest {
  string terminal_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message ResizeTerminalResponse {}

message RenameTerminalRequest {
  string terminal_id = 1;
  string title = 2;
}

message RenameTerminalResponse {
  // The title the worker actually STORED. Same contract as
  // RenameAgentResponse.title: cleaned, never refused, and on a request that
  // cleans to nothing it reports the title the terminal still holds.
  string title = 1;
}

message ListTerminalsRequest {
  repeated string tab_ids = 1;
  // Resolve QUAKE terminals by their working directory instead of by tab id.
  // Unioned with tab_ids. `verdicts` still answers for tab_ids alone: a
  // directory with no quake terminal is an absence, not a failed hydration, so
  // it needs no verdict to distinguish the two.
  repeated string quake_working_dirs = 2;
}

message ListTerminalsResponse {
  repeated TerminalInfo terminals = 1;
  // One entry per REQUESTED tab_id, so the caller can tell an omission
  // that is transient from one that is permanent. Empty when the request
  // named no tab_ids (the list-everything form).
  repeated TabHydrationVerdict verdicts = 2;
}

message TerminalInfo {
  string terminal_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  bytes screen = 4;
  string working_dir = 5;       // Tab's working directory context
  string shell_start_dir = 6;   // Where the shell started
  string title = 7;             // User-visible tab title
  TerminalStatus status = 8;    // Lifecycle state (starting/ready/failed/exited)
  string startup_error = 9;     // Populated when status=TERMINAL_STATUS_STARTUP_FAILED
  string startup_message = 10;  // Populated when status=TERMINAL_STATUS_STARTING (e.g. "Starting zsh…")
  GitRepoStatus git_status = 11;
  // Cumulative PTY byte offset at the end of `screen`. It counts PTY
  // bytes only, and `screen` leads with the synthesized escape sequences
  // that restore the sticky xterm modes. `screen` is therefore longer
  // than this offset before the ring wraps, and shorter once old bytes
  // start to fall off the retained window. Client seeds its WatchEvents
  // `after_offset` from this so a resubscribe picks up exactly where
  // the snapshot left off instead of replaying `screen`.
  int64 screen_end_offset = 12;
  // False for an ordinary terminal tab. True for the quake terminal of
  // `working_dir` — see OpenTerminalRequest.quake.
  bool quake = 13;
}

message TerminalData {
  bytes data = 1;
  // True when `data` replaces the entire screen state — the client must
  // reset its terminal buffer before writing. Set when the subscribing
  // client's after_offset is behind the backend's retention window, or
  // on a cold subscribe. Live-data chunks set this to false.
  bool is_snapshot = 2;
  // Cumulative byte offset at the end of `data`. Monotonically
  // increases within a single PTY session and resets when the PTY is
  // recreated. Clients persist the highest value they have observed
  // and echo it back as WatchTerminalEntry.after_offset on resubscribe.
  int64 end_offset = 3;
}

message TerminalClosed {
  int32 exit_code = 1;
}

// The four messages below all report escape sequences the WORKER interpreted.
// The client used to do it from xterm callbacks, which only fire for a terminal
// it is rendering -- so a hidden pane had no bell, no notification and a frozen
// title, exactly when those matter most. All four are NOTIFY-class.

// TerminalBell reports BEL (0x07) emitted as a bell rather than as an OSC
// string terminator. Coalesced worker-side: at most one per terminal per
// bellCoalesceWindow, because a program can emit BEL per keystroke.
message TerminalBell {}

// TerminalNotification reports a desktop notification the program asked for:
// OSC 9 (iTerm2/WezTerm/foot, body only), OSC 777;notify (urxvt/foot, title +
// body) or OSC 99 (kitty, chunked).
message TerminalNotification {
  string title = 1;  // Empty for OSC 9, which carries no title.
  string body = 2;
}

// TerminalTitleChanged reports OSC 0 (icon + title) or OSC 2 (title). OSC 1
// (icon only) is ignored. Emitted only when the value actually changes.
//
// This replaces a client round trip from xterm's onTitleChange to a rename
// RPC, which fired once per shell prompt on most setups.
message TerminalTitleChanged {
  string title = 1;
}

// TerminalProgress reports the ConEmu / Windows Terminal progress protocol,
// OSC 9;4;<state>;<percent>.
message TerminalProgress {
  enum State {
    STATE_UNSPECIFIED = 0;  // 0 -- clear any progress affordance.
    STATE_NORMAL = 1;
    STATE_ERROR = 2;
    STATE_INDETERMINATE = 3;
    STATE_PAUSED = 4;
  }
  State state = 1;
  // 0..100. Meaningless for INDETERMINATE and for STATE_UNSPECIFIED.
  int32 percent = 2;
}

// TerminalStatusChange notifies watchers of terminal lifecycle transitions,
// in particular STARTING → READY or STARTING → STARTUP_FAILED during the
// window between OpenTerminal returning and the PTY being ready for input.
// TerminalEvent.terminal_id identifies the terminal.
message TerminalStatusChange {
  TerminalStatus status = 1;
  string startup_error = 2;   // Populated when status=TERMINAL_STATUS_STARTUP_FAILED
  string startup_message = 3; // Populated when status=TERMINAL_STATUS_STARTING (e.g. "Starting zsh…")
  GitRepoStatus git_status = 4;
}

message ListAvailableShellsRequest {

}

message ListAvailableShellsResponse {
  repeated string shells = 1;       // Available shell paths, e.g., ["/bin/sh", "/bin/bash", "/bin/zsh"]
  string default_shell = 2;         // The default shell ($SHELL or /bin/sh)
}

// InspectTerminalProcessesRequest asks what is running inside each named
// terminal, so a client can state the reason before it closes one. Batched:
// closing a tile asks about every terminal it holds in one round trip.
message InspectTerminalProcessesRequest {
  repeated string terminal_ids = 1;
}

// TerminalProcess is one process running beneath a terminal's login shell.
message TerminalProcess {
  int32 pid = 1;
  // Executable name only -- no path, no arguments. CAN BE EMPTY: macOS resolves
  // a name longer than 14 characters through a second syscall that fails for
  // another user's process, and the Worker reports the pid rather than dropping
  // the process. Render a placeholder; do not assume non-empty.
  string name = 2;
}

// TerminalProcesses reports one terminal's running work: what the USER started,
// at ANY depth -- a `make` and the `cc` it spawned both appear.
//
// Two things are always absent. The login shell itself, which the Worker spawned
// and always tears down with the tab. And the shell's OWN work: a prompt hook, a
// completion helper, a theme shelling out for git state. A shell puts every job
// it runs in a process group of its own and keeps its own bookkeeping in the
// group it already has, and the Worker reports only the first kind -- otherwise
// `mise activate zsh`, which forks before every prompt, made an idle terminal
// look busy.
//
// Breadth-first, so the shell's own children lead and the processes a user
// recognises are the ones that survive the cap.
message TerminalProcesses {
  string terminal_id = 1;
  repeated TerminalProcess processes = 2;
  // Every process found beneath the shell, INCLUDING the ones the cap dropped.
  // A dialog says "and N more" from total_count - len(processes). This is the
  // only truncation signal: a second boolean could disagree with it.
  int32 total_count = 3;
}

// InspectTerminalProcessesResponse holds an entry only for a terminal that is
// running something. A close guard treats four situations alike, because they
// mean the same thing to it -- nothing to warn about: the shell sits idle at its
// prompt, the shell exited, the PTY has not spawned yet (a close landing during
// async startup), or the Worker restarted and no longer holds the id.
message InspectTerminalProcessesResponse {
  repeated TerminalProcesses terminals = 1;
}
