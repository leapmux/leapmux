syntax = "proto3";
package leapmux.v1;

import "google/protobuf/timestamp.proto";
import "leapmux/v1/user_crdt.proto";
import "leapmux/v1/workspace.proto";

// UserCRDT carries unary CRDT mutations + presence heartbeats for the
// authenticated user. The user-scoped event subscription is delivered
// exclusively over the `/ws/userevents` WebSocket endpoint (see
// `backend/internal/hub/service/ws_userevents.go`); there is no
// streaming RPC here. Workspace lifecycle (create / rename / delete)
// stays on WorkspaceService.
service UserCRDT {
  rpc SubmitOps(SubmitOpsRequest) returns (SubmitOpsResponse);
  rpc UpdatePresence(UpdatePresenceRequest) returns (UpdatePresenceResponse);
  // GetMaterialized returns a one-shot CRDT bootstrap snapshot for
  // callers that only need the initial UserMaterialized event (CLI
  // commands that submit one batch and exit). Skips the WS handshake
  // + first-event-await dance the streaming `/ws/userevents` path
  // requires per invocation.
  rpc GetMaterialized(GetMaterializedRequest) returns (GetMaterializedResponse);
}

// CrdtOp is the wire envelope for a single CRDT op. Each body is a
// single LWW register write or a tombstone — every op type
// commutes with every other op when canonical HLCs are assigned by
// the hub.
message CrdtOp {
  string op_id            = 1;  // 48-char nanoid; dedup key
  string origin_client_id = 2;  // hub-overwritten on commit (auth basis)
  HLC    client_hlc       = 3;  // advisory hint; hub assigns canonical_hlc on commit
  HLC    canonical_hlc    = 4;  // populated on commit / echo
  oneof body {
    SetNodeRegisterOp           set_node_register             = 10;
    TombstoneNodeOp             tombstone_node                = 11;
    SetTabRegisterOp            set_tab_register              = 12;
    TombstoneTabOp              tombstone_tab                 = 13;
    SetFloatingWindowRegisterOp set_floating_window_register  = 14;
    TombstoneFloatingWindowOp   tombstone_floating_window     = 15;
    SetWorkspaceRootNodeOp      set_workspace_root_node       = 16;
    SetWorkspaceRegisterOp      set_workspace_register        = 17;
    TombstoneWorkspaceOp        tombstone_workspace           = 18;
    ReviveTabOp                 revive_tab                    = 19;
  }
}

// SetNodeRegisterOp writes exactly one register on a node. parent_id
// writes are only valid for nodes that don't yet exist in the
// pre-batch state (the validator rejects parent_id writes to existing
// nodes — set-once enforcement).
message SetNodeRegisterOp {
  string node_id = 1;
  oneof field {
    NodeKind       kind        = 10;
    string         parent_id   = 11;  // creation-only
    string         position    = 12;
    SplitDirection direction   = 13;
    DoubleList     ratios      = 14;
    uint32         rows        = 15;
    uint32         cols        = 16;
    DoubleList     row_ratios  = 17;
    DoubleList     col_ratios  = 18;
  }
}
message TombstoneNodeOp { string node_id = 1; }

// SetTabRegisterOp writes exactly one register on a tab. tile_id
// writes implicitly carry the tab to a new workspace if the new
// tile's ancestor chain resolves to a different workspace.
message SetTabRegisterOp {
  TabType tab_type = 1;
  string  tab_id   = 2;
  oneof field {
    string tile_id        = 10;
    string position       = 11;
    string worker_id      = 12;
    int32  display_mode   = 13;  // FILE only
    int32  file_view_mode = 14;  // FILE only
    string file_diff_base = 15;  // FILE only
  }
}
message TombstoneTabOp { TabType tab_type = 1; string tab_id = 2; }

// ReviveTabOp clears a tab's tombstone so a CLOSED tab can re-open. Required
// because tab ids are never reused and tombstones are permanent: a subagent
// tab whose id == the child agent id could never re-open after a close
// without this op. The revive is itself an LWW register write on the
// tombstone register: it applies (clears tombstone_at) only when its HLC is
// strictly newer than the tombstone; an older-than-tombstone revive is a
// no-op (remove-wins for concurrent set-vs-tombstone stays). A revived tab
// must be re-completed by the SAME batch (revive + SetTab* registers
// together), enforced by validate_tab. Carries a TabRef only -- no content
// reaches the hub.
message ReviveTabOp { TabRef tab = 1; }

// SetFloatingWindowRegisterOp writes exactly one register on a
// floating window. root_node_id writes are creation-only (set-once);
// workspace_id writes move the window between workspaces (only
// allowed when the inner subtree has no non-root descendants).
message SetFloatingWindowRegisterOp {
  string window_id = 1;
  oneof field {
    string workspace_id = 9;
    double x            = 10;
    double y            = 11;
    double width        = 12;
    double height       = 13;
    double opacity      = 14;
    string root_node_id = 15;  // creation-only
  }
}
message TombstoneFloatingWindowOp { string window_id = 1; }

// SetWorkspaceRootNodeOp seeds the (set-once) root_node_id slot on a
// WorkspaceContentsRecord. Hub-only — submitted exclusively via the
// internal lifecycle path (CreateWorkspace seeding); rejected as
// hub_only_op when sent by a client.
message SetWorkspaceRootNodeOp {
  string workspace_id = 1;
  string root_node_id = 2;
}

// SetWorkspaceRegisterOp seeds the WorkspaceContentsRecord map entry for a
// freshly created workspace (root_node_id empty). Hub-only — submitted
// exclusively via the internal lifecycle create path (the first op in the
// create seed batch, so the record exists when the accompanying
// SetWorkspaceRootNodeOp applies); rejected as hub_only_op when sent by a
// client. Idempotent: re-applying on a workspace that already exists is a
// no-op (it never overwrites an existing record, so a rooted workspace is
// never clobbered).
message SetWorkspaceRegisterOp {
  string workspace_id = 1;
}

// TombstoneWorkspaceOp removes the WorkspaceContentsRecord map entry for a
// deleted workspace. Hub-only — submitted exclusively via the internal
// lifecycle delete path (appended to the workspace's tombstone batch, so
// the record is removed in the same atomic batch as its contents);
// rejected as hub_only_op when sent by a client. Idempotent: deleting an
// already-absent workspace is a no-op.
message TombstoneWorkspaceOp {
  string workspace_id = 1;
}

// SubmitOpsRequest groups one or more atomic OpBatches in a single
// request. Each OpBatch commits atomically (all ops or none); batches
// are independent — a rejected batch never poisons sibling batches.
// The authenticated session implies the user; no user_id on the request.
message SubmitOpsRequest {
  // REQUIRED. Must equal the current_epoch from the most recent
  // UserMaterialized this client received over `/ws/userevents`. epoch
  // == 0 is rejected as epoch_required (clients must bootstrap first);
  // epoch < current_epoch - 1 is rejected as stale_epoch.
  int64            epoch   = 1;
  repeated OpBatch batches = 2;
}

message OpBatch {
  string          batch_id = 1;  // client-minted; per-batch result correlation
  repeated CrdtOp ops      = 2;
}

message SubmitOpsResponse {
  // One result per batch in request.batches, in the same order.
  repeated BatchResult results = 1;
}

message BatchResult {
  string batch_id = 1;
  oneof outcome {
    BatchCommitted committed = 2;
    BatchRejection rejected  = 3;
  }
}

message BatchCommitted {
  repeated CommittedOp committed = 1;
  HLC                  max_hlc   = 2;
  int64                epoch     = 3;
}

message CommittedOp {
  string op_id         = 1;
  HLC    canonical_hlc = 2;
}

enum BatchRejectionReason {
  BATCH_REJECTION_UNSPECIFIED                       = 0;
  BATCH_REJECTION_EPOCH_REQUIRED                    = 1;
  BATCH_REJECTION_STALE_EPOCH                       = 2;
  BATCH_REJECTION_FORBIDDEN_WORKSPACE               = 3;
  BATCH_REJECTION_UNKNOWN_WORKSPACE                 = 4;
  BATCH_REJECTION_TOMBSTONED_TARGET                 = 5;
  BATCH_REJECTION_OP_ID_COLLISION                   = 6;
  BATCH_REJECTION_OP_ID_COLLISION_UNAUTHORIZED      = 7;
  BATCH_REJECTION_HUB_ONLY_OP                       = 8;
  BATCH_REJECTION_TAB_PLACEMENT_INVALID             = 9;
  BATCH_REJECTION_INCOMPLETE_RECORD                 = 10;
  BATCH_REJECTION_ROOT_NODE_PROTECTED               = 11;
  BATCH_REJECTION_ROOT_NODE_NOT_UNIQUE              = 12;
  BATCH_REJECTION_FLOATING_MOVE_WITH_DESCENDANTS    = 13;
  BATCH_REJECTION_VALUE_DOMAIN                      = 14;
  BATCH_REJECTION_PARENT_IMMUTABLE                  = 15;
  BATCH_REJECTION_ROOT_IMMUTABLE                    = 16;
  BATCH_REJECTION_TAB_ID_COLLISION_ACROSS_TYPES     = 17;
  // SetTabRegisterOp.worker_id refers to a worker the principal cannot
  // use (either no such worker exists or the principal has no
  // access grant). Caught at SubmitOps so a CRDT batch can't pin a
  // tab to a worker the user couldn't reach.
  BATCH_REJECTION_INVALID_WORKER_REF                = 18;
}

message BatchRejection {
  BatchRejectionReason reason          = 1;
  string               offending_op_id = 2;
}

// WatchUserRequest carries the per-user subscription parameters for the
// `/ws/userevents` WebSocket (and the local-IPC `hub.WatchUser` tunnel
// that proxies into it). The hub always sends UserMaterialized as the
// first event; reconnects re-bootstrap and clients dedup echoed
// batches by batch_id. The authenticated session implies the user.
message WatchUserRequest {
  // Subscribe filter — empty means "every workspace caller can read".
  //
  // Ids the caller cannot read are DROPPED SILENTLY, not rejected: the filter
  // is resolved through the per-user ACL, which keeps the readable subset and
  // skips the rest. A request naming only unreadable ids therefore yields a
  // successful subscription with an empty filter, never an error. The one
  // up-front rejection is a delegation bearer naming a workspace outside its
  // pinned scope.
  repeated string workspace_ids = 1;
}

// GetMaterializedRequest mirrors WatchUserRequest but for the one-shot
// unary path: returns the post-filter UserMaterialized snapshot
// without subscribing to subsequent events. It shares WatchUser's filter
// semantics exactly, silent drop included: an id the caller cannot read is
// omitted from the projection, so the RPC answers 200 with an empty snapshot
// rather than reporting "no such workspace". The authenticated session implies
// the user.
message GetMaterializedRequest {
  repeated string workspace_ids = 1;
}

message GetMaterializedResponse {
  UserMaterialized state = 1;
}

message WatchUserEvent {
  oneof event {
    UserMaterialized     initial             = 1;  // ALWAYS first
    OpBatch              batch               = 2;  // canonical-HLC-tagged; whole batch as one event
    EntityMaterialized   entity_materialized = 3;  // visibility entry
    EntityRemoved        entity_removed      = 4;  // visibility exit
    PresenceUpdate       presence            = 5;
    WorkspaceRenamed     renamed             = 6;
    WorkspaceCreated     created             = 7;
    WorkspaceDeleted     deleted             = 8;
    // Sent instead of `initial` when a reconnect's resume cursor is still
    // within the hub's op-retention window (see ResumeDelta). Either
    // `initial` or `delta` is the first frame; never both.
    ResumeDelta          delta               = 9;
    // Terminates one committed batch's catch-up sequence. See BatchEnd.
    BatchEnd             batch_end           = 10;
  }
}

// BatchEnd closes the frame sequence a single committed batch produces, so a
// client can tell "I have all of batch B" from "I have some of batch B".
//
// One batch fans out as up to three separate frames -- entity_materialized*,
// then batch, then entity_removed* -- and every one of them carries the SAME
// at_hlc (the batch's last-op canonical HLC). A client that advanced its resume
// watermark on each frame therefore reached the batch's max HLC as soon as the
// FIRST frame landed. If the socket then dropped mid-sequence, the persisted
// cursor sat above ops that were never applied, and because the resume scan is
// strictly-greater the hub would never re-send them: a silent, permanent
// divergence (now also written into the client's IndexedDB checkpoint).
//
// So the watermark advances HERE and nowhere else. A drop mid-sequence leaves
// the cursor at the previous batch, and the whole batch is re-sent on resume --
// harmless, because every op re-applies under the same canonical HLC and the
// client's LWW compare is strictly-greater.
//
// Emitted for EVERY batch a subscriber is sent, including one whose ops are all
// filtered out of that subscriber's view. That is deliberate: it lets a
// narrowly-filtered subscriber advance past traffic it cannot see instead of
// re-scanning the same journal tail on every reconnect. It is safe because an
// entity that later becomes visible arrives as a full EntityMaterialized
// record, never as its historical ops.
message BatchEnd {
  HLC at_hlc = 1;  // the batch's last-op canonical HLC; the client's new watermark
}

// ResumeDelta is the resume counterpart to UserMaterialized: the post-cursor
// op tail a reconnecting client needs to catch up, rather than the full
// materialized snapshot. Sent as the first (and only bootstrap) frame on a
// successful resume (see Manager.SubscribeWithACL). max_hlc is the max HLC the
// client adopts as its new watermark -- the max over every emitted frame's own
// HLC (visible-op canonical HLCs AND the at_hlc of each materialized/removed
// transition frame), NOT the live state max, so the watermark is always an HLC
// the client genuinely received. The client MUST advance its resume watermark
// to max_hlc (in addition to observing it into the HLC clock), matching how
// bootstrap adopts UserMaterialized.max_hlc.
//
// frames carries the ordered stream the subscriber missed as WatchUserEvent
// values — the SAME envelope live Send uses (entity_materialized | batch |
// entity_removed | batch_end). For each tail batch, in commit order, the hub emits
// frames in the SAME materialized → batch → removed order a live broadcast
// uses (see emitCatchUpFrames), filtered by the SAME pre/post stable-
// visibility rule. The client dispatches each frame through the SAME handlers
// a live broadcast uses, so the two catch-up paths cannot drift. An entity
// that crossed IN arrives as entity_materialized carrying its BATCH-ERA full
// record (BatchTransition.record), not a live current-state clone.
message ResumeDelta {
  repeated WatchUserEvent frames = 1;  // ordered catch-up stream (entity_materialized|batch|entity_removed|batch_end)
  HLC              max_hlc     = 2;  // max HLC over every emitted frame (client's new watermark)
  int64            current_epoch = 3;  // for SubmitOps epoch echo
  // Hub-derived identity of THIS subscriber -- same value and purpose as
  // UserMaterialized.subscriber_client_id, carried here because a resume is now
  // the normal COLD-START path: the client hydrates confirmedState from its
  // IndexedDB checkpoint and resumes instead of bootstrapping, so a freshly
  // loaded page has no earlier `initial` frame to have learned it from.
  // Leaving it unset made the frontend's active-client gate compare against an
  // empty string, which disables the gate outright (every refreshed tab plays
  // the turn-end sound regardless of which client is active).
  string           subscriber_client_id = 4;
  // Owning tenant, mirroring UserMaterialized.user_id, so the client can refuse
  // a delta that is not its own.
  //
  // The `initial` arm has always fail-closed on this (applyMaterialized, the
  // client half of crdt.Manager.requireOwnState), and so does the cold-start
  // hydration path. A resume is now the NORMAL cold start, and was the only one
  // of the three that fails OPEN: with no tenant on the message the check was
  // not merely skipped, it was inexpressible, so a delta was adopted on the
  // strength of the socket alone -- and, via the op-log observer, written into
  // the device's IndexedDB checkpoint where it survives refreshes. The hub
  // cannot mis-route today (the manager is keyed by the authenticated user id),
  // which makes this defence in depth rather than a live bug; it is here so all
  // three adoption points answer "is this mine?" the same way.
  string           user_id = 5;
}

// BatchTransitions is the per-batch, per-entity workspace-transition log the
// hub persists alongside each OpBatch so the resume path can replay the SAME
// pre/post stable-visibility classification the live broadcast applies. It is
// the wire encoding of ValidationResult.AffectedEntities
// (map[EntityRef]EntityWorkspaceTransition): one entry per entity the batch
// touched, each carrying its pre- and post-batch owning workspace. This is a
// STORAGE-ONLY message: it never crosses a client-facing wire surface.
message BatchTransitions {
  repeated BatchTransition entries = 1;
}

// BatchTransition is one entity's pre/post-batch workspace. Exactly one
// identity arm is set (a oneof, so multi-kind rows are unrepresentable), and
// its arm implies the EntityKind (Node / Tab / FloatingWindow / WorkspaceRoot)
// -- mirroring the EntityKind the Go-side EntityRef carries. The optional
// `record` oneof carries the entity's POST-batch record snapshot, captured at
// commit time when Pre != Post (a visibility-crossing candidate), so the
// resume path can build a materialized frame from the batch-era record instead
// of reading CURRENT live state (which a later tail batch may have
// edited/tombstoned). Only set for entity kinds that have a materialized frame
// (Node / Tab / FloatingWindow); absent for WorkspaceRoot (no
// EntityMaterialized variant), stable-visibility edits (Pre == Post), and
// tombstoned records (a tombstone is projection-ignored, so no frame is
// materialized for it -- matching live buildEntityMaterializedEvent).
message BatchTransition {
  oneof identity {
    string node_id      = 1;  // EntityKindNode
    TabIdent tab        = 2;  // EntityKindTab
    string window_id    = 3;  // EntityKindFloatingWindow
    string workspace_id = 4;  // EntityKindWorkspaceRoot
  }
  string pre_workspace  = 5;
  string post_workspace = 6;
  oneof record {              // post-batch record snapshot (omitted => no materialized frame for this entry)
    NodeRecord           node_record           = 7;
    TabRecord            tab_record            = 8;
    FloatingWindowRecord floating_window_record = 9;
  }
}

// EntityMaterialized is sent when an entity ENTERS a subscriber's
// allowed set (as a result of a workspace move). The full record
// replaces the subscriber's local copy; raw move ops are NOT
// broadcast to becoming-visible subscribers because they would carry
// pre-state from a workspace the subscriber can't see.
message EntityMaterialized {
  HLC at_hlc = 1;
  oneof entity {
    TabRecord            tab             = 2;
    FloatingWindowRecord floating_window = 3;
    NodeRecord           node            = 4;
  }
}

// EntityRemoved is sent when an entity LEAVES a subscriber's allowed
// set. Carries only the entity id — no destination workspace
// information — to prevent leaking the destination to source-only
// subscribers.
message EntityRemoved {
  HLC at_hlc = 1;
  oneof entity {
    TabIdent tab        = 2;
    string   window_id  = 3;
    string   node_id    = 4;
  }
}

message TabIdent {
  TabType tab_type = 1;
  string  tab_id   = 2;
}

message WorkspaceCreated {
  string workspace_id = 1;
  string title        = 2;
  string root_node_id = 3;
}

// UpdatePresenceRequest signals that the caller's client just had
// input. The hub records its own receive time; client_id comes from
// the authenticated session (NOT from the request body). The
// authenticated session implies the user.
message UpdatePresenceRequest {
  string workspace_id = 1;
}

message UpdatePresenceResponse {}

// PresenceUpdate identifies the active client (if any) for a
// workspace. The active client is the one whose last input timestamp
// is strictly ahead of every other currently-connected client.
// active_client_id == "" means either no connected client has
// reported input yet or two clients share the most-recent timestamp
// (no clear leader). The hub clears a client's entries when its WS
// subscription drops (after a short grace window for reconnects).
message PresenceUpdate {
  string                    workspace_id     = 1;
  string                    active_client_id = 2;
  google.protobuf.Timestamp updated_at       = 3;
}
