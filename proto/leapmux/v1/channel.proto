syntax = "proto3";
package leapmux.v1;

import "leapmux/v1/access.proto";
import "leapmux/v1/scope.proto";

// ChannelService manages end-to-end encrypted channels between Frontend and Worker.
// Hub acts purely as an authenticated relay -- it cannot read channel traffic.
//
// Opening the channel is worker:read for all three methods. What the app may
// then CALL inside the Noise tunnel is enforced by the worker, from the grant
// the hub puts in the handshake; see channel.Caller.
service ChannelService {
  option (leapmux.v1.host) = SERVICE_HOST_HUB;
  // Get everything needed to start a Noise_NK handshake with a Worker: the
  // public keys and the encryption mode, both from the WorkerHello of the
  // worker's live connection. The caller always needs both together, so
  // bundling them avoids a back-to-back RPC pair before every OpenChannel.
  rpc GetWorkerHandshakeParams(GetWorkerHandshakeParamsRequest) returns (GetWorkerHandshakeParamsResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_WORKER_READ };
  }
  // Open an encrypted channel to a Worker (triggers Noise_NK handshake via relay).
  rpc OpenChannel(OpenChannelRequest) returns (OpenChannelResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_WORKER_READ };
  }
  // Close an encrypted channel.
  rpc CloseChannel(CloseChannelRequest) returns (CloseChannelResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_WORKER_READ };
  }
}

// --- ChannelService RPC messages ---

message GetWorkerHandshakeParamsRequest {
  string worker_id = 1;
}

// WorkerPublicKeys is the key material a client needs to open a Noise_NK
// channel to a worker. The worker announces it in its WorkerHello
// (worker.proto).
message WorkerPublicKeys {
  bytes x25519 = 1; // Static X25519 key for Noise_NK.
  bytes mlkem = 2;  // ML-KEM-1024 key for post-quantum encapsulation.
  bytes slhdsa = 3; // SLH-DSA-SHAKE-256f key for post-quantum authentication.
}

// GetWorkerHandshakeParamsResponse carries the keys and the encryption mode of
// ONE worker connection: the one the hub holds when it answers. Both come from
// that connection's WorkerHello, so they can never belong to two different
// connections. A successful response therefore guarantees the worker is online
// and ready for OpenChannel.
message GetWorkerHandshakeParamsResponse {
  WorkerPublicKeys keys = 1;
  EncryptionMode encryption_mode = 2;
}

// EncryptionMode specifies which E2EE handshake protocol the Worker uses.
enum EncryptionMode {
  ENCRYPTION_MODE_UNSPECIFIED = 0;    // Never valid: the hub refuses a WorkerHello that carries it
  ENCRYPTION_MODE_CLASSIC = 1;        // Classical Noise_NK (X25519 only)
  ENCRYPTION_MODE_POST_QUANTUM = 2;   // Hybrid PQ Noise_NK (X25519 + ML-KEM + SLH-DSA)
}

message OpenChannelRequest {
  string worker_id = 1;
  bytes handshake_payload = 2; // Noise_NK handshake message 1
}

message OpenChannelResponse {
  string channel_id = 1;
  bytes handshake_payload = 2; // Noise_NK handshake message 2
  string user_id = 3; // Authenticated identity the Worker received from the Hub
  // Negotiated application payload budget (bytes). Effective =
  // min(hub max_message_size, worker max_message_size). Clients adopt this
  // and derive the reassembled ceiling as max_message_size + envelope headroom.
  uint64 max_message_size = 4;
}

message CloseChannelRequest {
  string channel_id = 1;
}

message CloseChannelResponse {}

// --- Channel relay messages (used between Hub and Worker via bidi stream) ---

// Hub -> Worker: request to open a new channel.
//
// The Hub announces no workspace set. A Worker belongs to exactly one user
// and stores no workspace id, so every row it holds is the channel user's;
// there is nothing for a per-channel workspace list to narrow.
message ChannelOpenRequest {
  string channel_id = 1;
  string user_id = 2; // Hub tells Worker who opened the channel
  bytes handshake_payload = 3;
  // Hub's resolved max_message_size (application payload budget). Worker
  // takes min(this, its own config) as the effective per-channel budget.
  uint64 max_message_size = 4;
  // What the credential that opened this channel was GRANTED.
  //
  // The Worker enforces it on every inner method. Without it the Worker
  // restricted each method to `is this the registrant` alone -- one bit -- so a bearer
  // that could open a channel reached ReadFile, SendInput, PushBranch and
  // OpenTunnelConn alike, and a hub-side scope check would hand a
  // read-only app a shell.
  //
  // It trusts nothing new, and the argument is the one InnerMessage already
  // makes below: the client's identity is established by the Hub, and a claim
  // carried inside the channel could only restate it. A hub-supplied scope set
  // is structurally identical to the hub-supplied user_id -- it arrives over
  // the authenticated Hub-to-Worker stream, not from the E2EE client.
  //
  // AN EMPTY LIST IS A REFUSAL, not a default. It means the Hub failed to say,
  // exactly as an empty user_id does, and the Worker refuses the open the same
  // way. A first-party credential sends the explicit [SCOPE_ALL], so a Hub that
  // DROPS this field opens no channel at all rather than silently promoting a
  // narrow app to full authority: the failure is loud and immediate, and the
  // alternative is silent and total.
  repeated Scope granted_scopes = 5;
}

// Worker -> Hub: response to channel open request.
message ChannelOpenResponse {
  string channel_id = 1;
  bytes handshake_payload = 2;
  string error = 3;
  // Effective max_message_size (= min(hub, worker)) when open succeeds.
  uint64 max_message_size = 4;
  // Structured reason when error is set. Hub maps known codes via
  // channelwire.ConnectCodeFromChannelOpenError (e.g. INVALID_MAX_MESSAGE_SIZE
  // → InvalidArgument, CHANNEL_ALREADY_ACTIVE → FailedPrecondition) so clients
  // fail fast instead of retrying non-transient rejects as Internal.
  ChannelOpenErrorCode error_code = 5;
}

// ChannelOpenErrorCode classifies worker-side ChannelOpenResponse failures.
// The Hub maps these to Connect statuses via channelwire.ConnectCodeFromChannelOpenError
// so clients fail fast on non-transient open rejects instead of treating them
// as Internal (retryable-looking) faults.
enum ChannelOpenErrorCode {
  CHANNEL_OPEN_ERROR_CODE_UNSPECIFIED = 0;
  // Hub announced a missing or out-of-range max_message_size (config / version skew).
  CHANNEL_OPEN_ERROR_CODE_INVALID_MAX_MESSAGE_SIZE = 1;
  // Channel id is already active on this Worker; Hub must Close before re-open.
  CHANNEL_OPEN_ERROR_CODE_CHANNEL_ALREADY_ACTIVE = 2;
  // Hub omitted a usable authenticated user id on ChannelOpenRequest.
  CHANNEL_OPEN_ERROR_CODE_NO_AUTHENTICATED_USER = 3;
  // Noise handshake failed (bad payload, key mismatch, crypto error).
  CHANNEL_OPEN_ERROR_CODE_HANDSHAKE_FAILED = 4;
}

// Hub -> Worker: notification that a channel was closed.
message ChannelCloseNotification {
  string channel_id = 1;
}

// ChannelMessageFlags controls chunking and close semantics for channel messages.
enum ChannelMessageFlags {
  CHANNEL_MESSAGE_FLAGS_UNSPECIFIED = 0; // Final chunk (or single non-chunked message)
  CHANNEL_MESSAGE_FLAGS_MORE = 1;        // More chunks follow for this logical message
  CHANNEL_MESSAGE_FLAGS_CLOSE = 2;       // Channel close sentinel
}

// ChannelMessage is the outer envelope for all encrypted channel traffic.
// Hub reads only the channel_id for routing; ciphertext is opaque.
message ChannelMessage {
  string channel_id = 1;
  // 64-bit so the id space cannot wrap. A correct client never reuses a live id,
  // but a 32-bit counter WOULD eventually wrap onto one: a tunnel burns an id per
  // 32 KiB write and per credit grant, and a desktop channel (whose cookie session
  // slides, unlike the 1h bearer-scoped ones) is long-lived and multiplexes every
  // tunnel to a worker. On wrap, a late response for a RETIRED id -- one whose
  // caller timed out and unregistered -- is delivered to whatever request now holds
  // that id, misrouted in a way the duplicate-response guard cannot detect. At 2^64
  // the wrap is unreachable rather than merely improbable.
  uint64 correlation_id = 2;
  ChannelMessageFlags flags = 3;
  bytes ciphertext = 4;
}

// --- Inner RPC protocol (serialized inside encrypted channel) ---

// InnerMessage wraps all post-handshake encrypted payloads with type-safe routing.
//
// There is deliberately no client identity claim here. The client's identity is
// established by the Hub, which authenticates the OpenChannel caller and tells
// both sides: the client learns it from OpenChannelResponse.user_id and the
// Worker from ChannelOpenRequest.user_id. A claim carried inside the channel could
// only ever restate what the Hub already said -- Noise_NK leaves the initiator
// unauthenticated, so the claim was an unsigned string any peer could send, and
// the Worker verified it by comparing it against the Hub's own value. Removing it
// deletes a reserved correlation id, a bespoke claim timeout, and a per-session
// verified state machine that together protected nothing.
message InnerMessage {
  oneof kind {
    InnerRpcRequest request = 1;
    InnerRpcResponse response = 2;
    InnerStreamMessage stream = 3;
    // In-band Noise CipherState rekey (preserves the channel and multiplexed
    // conns). Client initiates; Worker accepts or rate-limit-rejects. See
    // channelwire SessionKeyMaxAge / MinRekeyInterval.
    RekeyRequest rekey_request = 4;
    RekeyAck rekey_ack = 5;
    RekeyReject rekey_reject = 6;
    // Client -> Worker frame on an already-open stream (see InnerStreamRequest).
    InnerStreamRequest stream_request = 7;
  }
}

// RekeyRequest asks the peer to rotate receive keys after this frame. The
// initiator keeps encrypting under the current key until RekeyAck or
// RekeyReject arrives (the send barrier is released across the round trip, not
// held across it), so traffic keeps flowing during the rekey. dh_pub and
// mlkem_ct carry the initiator's fresh ephemeral X25519 public key and
// ML-KEM-1024 ciphertext (encapsulated under the worker's static ML-KEM key),
// so the next epoch mixes fresh DH + PQ entropy instead of HKDF(k) alone.
// mlkem_ct is empty on classical-mode channels. The whole frame rides inside
// the AEAD-encrypted InnerMessage, so the key material is authenticated by the
// current cipher and needs no separate signature.
message RekeyRequest {
  // Fresh X25519 ephemeral public key (32 bytes).
  bytes dh_pub = 1;
  // ML-KEM-1024 ciphertext encapsulated under the worker's static ML-KEM key
  // (1568 bytes); empty in classical mode.
  bytes mlkem_ct = 2;
}

// RekeyAck commits the rekey: sender rotated receive, will rotate send
// after this frame; receiver rotates both directions on receipt. dh_pub carries
// the responder's fresh ephemeral X25519 public key, which the initiator pairs
// with its own ephemeral private key to complete the DH agreement.
message RekeyAck {
  // Fresh X25519 ephemeral public key (32 bytes).
  bytes dh_pub = 1;
}

// RekeyReject refuses the rekey (rate limit). Neither side rotates CipherState.
// retry_after_ms is how long the initiator should wait before an age-only retry;
// soft-nonce retries are never rejected. Zero means "unspecified" (legacy peers /
// older binaries): initiators fall back to a one-minute backoff.
message RekeyReject {
  int64 retry_after_ms = 1;
}

// Request from Frontend to Worker (encrypted).
message InnerRpcRequest {
  string method = 1;  // The procedure path, e.g. "/leapmux.v1.WorkerAgentInputService/EnqueueAgentInput"
  bytes payload = 2;  // Serialized protobuf for the specific method
}

// The error an inner RPC answered with. `code` is a google.rpc.Code value;
// gRPC and ConnectRPC share that numbering.
message RpcError {
  int32 code = 1;
  string message = 2;
}

// Unary response from Worker to Frontend (encrypted). A present `error` means
// the call failed, and `payload` is then empty.
message InnerRpcResponse {
  bytes payload = 1;  // Serialized protobuf response
  RpcError error = 2;
}

// Streaming response from Worker to Frontend (agent output, terminal I/O, watch
// events). A present `error` fails the stream and ends it.
message InnerStreamMessage {
  bytes payload = 1;  // Serialized protobuf for the specific event
  bool end = 2;       // Marks end of stream
  RpcError error = 3;
}

// InnerStreamRequest is a Client -> Worker frame addressed to an ALREADY-OPEN
// stream's correlation id. It is what makes a channel stream bidirectional: a
// client can revise or retire a subscription without tearing the stream down
// and re-issuing it.
//
// Before this existed a stream close was purely client-local -- no frame
// reached the worker -- so a subscription could only be retired by closing the
// channel, or by a method-specific "whole current interest" re-request that
// also forced a full replay.
message InnerStreamRequest {
  // Method-specific follow-up, in the same encoding the opening
  // InnerRpcRequest.payload used. Empty on a pure cancel frame.
  bytes payload = 1;
  // The client is done. The worker releases the stream and answers with a
  // terminal InnerStreamMessage{end: true}. No further client frames follow.
  bool cancel = 2;
}
