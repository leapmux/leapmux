syntax = "proto3";
package leapmux.v1;

import "leapmux/v1/settings.proto";
import "leapmux/v1/auth.proto";

// UserService manages user profile and preferences.
// Called by Frontend on Hub via ConnectRPC.
service UserService {
  // Update the current user's profile (username and display name only).
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // Request an email address change. May require verification.
  rpc RequestEmailChange(RequestEmailChangeRequest) returns (RequestEmailChangeResponse);
  // Verify a pending email — the same RPC handles both signup verification
  // and email-change verification. Authenticated; the session user must own
  // the pending email row identified by `verification_token`. The token is
  // the 6-character display code (with or without hyphen) the user
  // received in their verification email.
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  // Re-issue the verification email for the current user's pending
  // address. Authenticated; requires a pending verification to exist
  // (FailedPrecondition otherwise). The previous code is invalidated —
  // a fresh 6-character code with a new 30-minute TTL replaces it. Use
  // this when the original mail was lost / never arrived, or when
  // SignUpResponse.verification_email_sent came back false.
  rpc ResendVerificationEmail(ResendVerificationEmailRequest) returns (ResendVerificationEmailResponse);
  // Change the current user's password. When password_set is false (OAuth-only
  // users), current_password may be empty.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // Unlink an OAuth provider from the current user's account.
  rpc UnlinkOAuthProvider(UnlinkOAuthProviderRequest) returns (UnlinkOAuthProviderResponse);
  // List the current user's account settings: one descriptor per declared
  // key plus its stored value. Same shape as AdminSettingsService's
  // hub-scope listing, so one client widget layer renders both.
  rpc ListUserSettings(ListUserSettingsRequest) returns (ListUserSettingsResponse);
  // Merge a partial JSON document onto ONE account setting's current
  // value. Per-key (not whole-blob) so two devices editing different
  // settings never overwrite each other.
  rpc UpdateUserSetting(UpdateUserSettingRequest) returns (UpdateUserSettingResponse);
  // Remove one account setting's stored value, returning it to its
  // default.
  rpc ResetUserSetting(ResetUserSettingRequest) returns (ResetUserSettingResponse);
  // Get the current timeout configuration.
  rpc GetTimeouts(GetTimeoutsRequest) returns (GetTimeoutsResponse);
}

message UpdateProfileRequest {
  string username = 1;
  string display_name = 2;
  reserved 3; // was: email (use RequestEmailChange instead)
}

message UpdateProfileResponse {
  string username = 1;
  string display_name = 2;
  string email = 3;
  string pending_email = 4;
}

message RequestEmailChangeRequest {
  string new_email = 1;
}

message RequestEmailChangeResponse {
  bool verification_required = 1;
}

message VerifyEmailRequest {
  string verification_token = 1;
}

message VerifyEmailResponse {
  User user = 1;
}

message ResendVerificationEmailRequest {}

message ResendVerificationEmailResponse {
  // True iff the verification email was successfully dispatched. False
  // means the row was refreshed but the mail backend failed; the
  // frontend should surface a "couldn't send, try again" message.
  bool email_sent = 1;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message UnlinkOAuthProviderRequest {
  string provider_id = 1;
}

message UnlinkOAuthProviderResponse {}

message ListUserSettingsRequest {}

message ListUserSettingsResponse {
  repeated SettingDescriptor descriptors = 1;
  repeated SettingValue values = 2;
}

message UpdateUserSettingRequest {
  string key = 1;
  string partial_json = 2;
}

message UpdateUserSettingResponse {
  SettingValue value = 1;
}

message ResetUserSettingRequest {
  string key = 1;
}

message ResetUserSettingResponse {
  SettingValue value = 1;
}

message GetTimeoutsRequest {}

message GetTimeoutsResponse {
  int32 api_timeout_seconds = 1;
  int32 agent_startup_timeout_seconds = 2;
  int32 worktree_create_timeout_seconds = 3;
}
