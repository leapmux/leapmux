syntax = "proto3";
package leapmux.v1;

import "google/protobuf/timestamp.proto";
import "leapmux/v1/settings.proto";
import "leapmux/v1/auth.proto";

// UserService manages user profile and preferences.
// Called by Frontend on Hub via ConnectRPC.
service UserService {
  // Update the current user's profile (username and display name only).
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // Request an email address change. May require verification.
  rpc RequestEmailChange(RequestEmailChangeRequest) returns (RequestEmailChangeResponse);
  // Verify a pending email — the same RPC handles both signup verification
  // and email-change verification. Authenticated; the session user must own
  // the pending email row identified by `verification_token`. The token is
  // the 6-character display code (with or without hyphen) the user
  // received in their verification email.
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  // Re-issue the verification email for the current user's pending
  // address. Authenticated; requires a pending verification to exist
  // (FailedPrecondition otherwise). The RPC invalidates the previous code
  // — a fresh 6-character code with a new 30-minute TTL replaces it. Use
  // this when the original mail was lost or never arrived.
  rpc ResendVerificationEmail(ResendVerificationEmailRequest) returns (ResendVerificationEmailResponse);
  // Change the current user's password. Requires an elevated session,
  // except on an account that has neither a password nor a passkey -- that
  // account has nothing to elevate WITH, so it falls to the
  // first-credential rule instead (a recent sign-in plus a durable
  // identity).
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // Unlink an OAuth provider from the current user's account.
  rpc UnlinkOAuthProvider(UnlinkOAuthProviderRequest) returns (UnlinkOAuthProviderResponse);
  // List the current user's account settings: one descriptor per declared
  // key plus its stored value. Same shape as AdminSettingsService's
  // hub-scope listing, so one client widget layer renders both.
  rpc ListUserSettings(ListUserSettingsRequest) returns (ListUserSettingsResponse);
  // Merge a partial JSON document onto ONE account setting's current
  // value. Per-key (not whole-blob) so two devices editing different
  // settings never overwrite each other.
  rpc UpdateUserSetting(UpdateUserSettingRequest) returns (UpdateUserSettingResponse);
  // Remove one account setting's stored value, returning it to its
  // default.
  rpc ResetUserSetting(ResetUserSettingRequest) returns (ResetUserSettingResponse);
  // Get the current timeout configuration.
  rpc GetTimeouts(GetTimeoutsRequest) returns (GetTimeoutsResponse);
  // Session elevation ("sudo mode"). One proven factor admits every
  // sensitive action for a window, and each successful action slides that
  // window forward, so an uninterrupted work session answers one prompt.
  // A handler that needs elevation and does not have it answers
  // FailedPrecondition -- never Unauthenticated, which the frontend reads
  // as "signed out".
  //
  // ElevateSession proves a password. BeginPasskeyElevation /
  // FinishPasskeyElevation prove a passkey; both paths answer with the SAME
  // field, elevation_expires_at, so a client has one success shape. (The
  // two response messages are separate because a proto response type may
  // serve only one RPC.) An OAuth-only account elevates through the OAuth
  // re-authentication stage at /auth/idp/<provider>/reauth, which is a
  // browser redirect rather than an RPC.
  rpc ElevateSession(ElevateSessionRequest) returns (ElevateSessionResponse);
  rpc BeginPasskeyElevation(BeginPasskeyElevationRequest) returns (BeginPasskeyElevationResponse);
  rpc FinishPasskeyElevation(FinishPasskeyElevationRequest) returns (FinishPasskeyElevationResponse);
  // End the elevation immediately, without waiting for the window.
  rpc DropElevation(DropElevationRequest) returns (DropElevationResponse);
  // Passkey management
  rpc BeginPasskeyRegistration(BeginPasskeyRegistrationRequest) returns (BeginPasskeyRegistrationResponse);
  rpc FinishPasskeyRegistration(FinishPasskeyRegistrationRequest) returns (FinishPasskeyRegistrationResponse);
  rpc ListPasskeys(ListPasskeysRequest) returns (ListPasskeysResponse);
  rpc RenamePasskey(RenamePasskeyRequest) returns (RenamePasskeyResponse);
  rpc DeletePasskey(DeletePasskeyRequest) returns (DeletePasskeyResponse);
  rpc DeactivatePasskeyAuth(DeactivatePasskeyAuthRequest) returns (DeactivatePasskeyAuthResponse);
  // The caller's own CONNECTIONS: which apps hold access to this account, and
  // how to end that access.
  //
  // TWO verbs, because they answer different questions. DisconnectApp ends the
  // account's whole authorization of one app; RevokeMyAPIToken ends ONE
  // installation of it, which is how somebody signs a single laptop out and
  // keeps the rest working. An app-level end that offered only the second
  // would leave a credential live on every other machine, which is precisely
  // the outcome that somebody who stopped trusting an app tries to prevent.
  //
  // NONE requires an elevated session, deliberately. Listing returns metadata
  // only, and both endings can only REDUCE access -- demanding a fresh factor
  // from somebody who believes a token is stolen is the wrong failure mode.
  rpc ListMyAPITokens(ListMyAPITokensRequest) returns (ListMyAPITokensResponse);
  rpc DisconnectApp(DisconnectAppRequest) returns (DisconnectAppResponse);
  rpc RevokeMyAPIToken(RevokeMyAPITokenRequest) returns (RevokeMyAPITokenResponse);
}

message UpdateProfileRequest {
  string username = 1;
  string display_name = 2;
}

message UpdateProfileResponse {
  string username = 1;
  string display_name = 2;
  string email = 3;
  string pending_email = 4;
}

message RequestEmailChangeRequest {
  string new_email = 1;
}

message RequestEmailChangeResponse {
  bool verification_required = 1;
}

message VerifyEmailRequest {
  string verification_token = 1;
}

message VerifyEmailResponse {
  User user = 1;
}

message ResendVerificationEmailRequest {}

message ResendVerificationEmailResponse {
  // True iff the hub sent the verification email successfully. False
  // means the hub refreshed the row but the mail backend failed; the
  // frontend should surface a "couldn't send, try again" message.
  bool email_sent = 1;
  google.protobuf.Timestamp next_resend_available_at = 2;
}

message ChangePasswordRequest {
  string new_password = 1;
}

message ChangePasswordResponse {}

message UnlinkOAuthProviderRequest {
  string provider_id = 1;
}

message UnlinkOAuthProviderResponse {}

message ListUserSettingsRequest {}

message ListUserSettingsResponse {
  repeated SettingDescriptor descriptors = 1;
  repeated SettingValue values = 2;
}

message UpdateUserSettingRequest {
  string key = 1;
  string partial_json = 2;
}

message UpdateUserSettingResponse {
  SettingValue value = 1;
}

message ResetUserSettingRequest {
  string key = 1;
}

message ResetUserSettingResponse {
  SettingValue value = 1;
}

message GetTimeoutsRequest {}

message GetTimeoutsResponse {
  int32 api_timeout_seconds = 1;
  int32 agent_startup_timeout_seconds = 2;
  int32 worktree_create_timeout_seconds = 3;
}

message BeginPasskeyRegistrationRequest {}

message BeginPasskeyRegistrationResponse {
  string session_id = 1;
  string options_json = 2;
  // Relying party ID for this ceremony's origin; echo it in Signal API calls.
  string rp_id = 3;
}

message FinishPasskeyRegistrationRequest {
  string session_id = 1;
  string credential_json = 2;
  string friendly_name = 3;
}

message FinishPasskeyRegistrationResponse {
  PasskeyInfo passkey = 1;
}

message ElevateSessionRequest {
  string current_password = 1;
}

message ElevateSessionResponse {
  // When the elevation lapses. Always set on success.
  //
  // A timestamp, not a boolean: a client that received "elevated: true"
  // could not tell whether the window already closed, so it would either
  // re-prompt on every render or let the user start an action the hub is
  // about to refuse.
  google.protobuf.Timestamp elevation_expires_at = 1;
}

message BeginPasskeyElevationRequest {}

message BeginPasskeyElevationResponse {
  string session_id = 1;
  string options_json = 2;
  // Relying party ID for this ceremony's origin; echo it in Signal API calls.
  string rp_id = 3;
}

message FinishPasskeyElevationRequest {
  string session_id = 1;
  string credential_json = 2;
}

message FinishPasskeyElevationResponse {
  // The same field ElevateSessionResponse carries, with the same meaning:
  // one success shape for both factor paths.
  google.protobuf.Timestamp elevation_expires_at = 1;
}

message DropElevationRequest {}

message DropElevationResponse {}

message ListPasskeysRequest {}

message ListPasskeysResponse {
  repeated PasskeyInfo passkeys = 1;
  // Relying party ID for passkey management on this hub; echo it in Signal
  // API calls (the delete/deactivate flows have no Begin response).
  string rp_id = 2;
}

message PasskeyInfo {
  string id = 1;
  string friendly_name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp last_used_at = 4;
  repeated string transports = 5;
  // Base64url-encoded WebAuthn credential id (plaintext lookup key). Used by
  // the browser Signal API after delete; not a secret.
  string credential_id = 6;
}

message RenamePasskeyRequest {
  string id = 1;
  string friendly_name = 2;
}

message RenamePasskeyResponse {
  PasskeyInfo passkey = 1;
}

message DeletePasskeyRequest {
  string id = 1;
  // Required only when this is the account's last passkey and it has no
  // password: removing it would otherwise leave no way to sign in.
  string new_password = 2;
}

message DeletePasskeyResponse {}

message DeactivatePasskeyAuthRequest {
  // Required only on a passkey-only account; see DeletePasskeyRequest.
  string new_password = 1;
}

message DeactivatePasskeyAuthResponse {}

// MyAPIToken is one of the caller's own CLI credentials. It carries
// metadata only -- no secret and no hash ever leaves the store layer.
message MyAPIToken {
  string id = 1;
  // Which APP holds this credential, and which INSTALLATION of it.
  string client_id = 2;
  string installation_name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_used_at = 5;
  // When the token stops being able to refresh itself, which is when the
  // device must sign in again. The hub does not report the shorter
  // access-token expiry: it renews itself and would read as "expiring
  // today" on a credential with months left.
  google.protobuf.Timestamp refresh_expires_at = 6;
  // The permissions this credential was granted, as canonical scope tokens.
  // The account's connected-app list renders them, so a person can see what
  // each app can actually do.
  repeated string granted_scopes = 7;
  // True for the credential making THIS call, so a client can warn before
  // the user revokes the device they are on. Always false when the caller
  // is a browser session.
  bool current = 8;
  // When a credential that does NOT renew itself stops authenticating.
  //
  // The hub sets it only when refresh_expires_at is absent: the two kinds
  // are exclusive, so exactly one deadline exists for each credential. A
  // credential minted with an explicit lifetime -- the command
  // `admin api-token issue --ttl <n>` -- carries no refresh deadline, so
  // without this field it appeared in the account's own listing and in
  // `leapmux control auth credentials` with no deadline at all, and a
  // reader could not tell a one-year service credential from one that
  // never expires. The hub never sets it for a renewing credential, where
  // the access expiry moves at every rotation and would read as "expiring
  // today" on a credential with months left.
  google.protobuf.Timestamp expires_at = 9;
  // The app's registered display name, so the list can group by app rather
  // than by installation.
  string client_name = 10;
  // Whether an administrator vouched for the app. An unverified one is
  // labelled in the list, exactly as it is on the consent screen.
  bool client_verified = 11;
}

message ListMyAPITokensRequest {
  int64 limit = 1;
  string cursor = 2;
}

message ListMyAPITokensResponse {
  repeated MyAPIToken tokens = 1;
  string next_cursor = 2;
}

message RevokeMyAPITokenRequest {
  string id = 1;
}

message RevokeMyAPITokenResponse {}

// DisconnectAppRequest ends this account's whole authorization of one app.
message DisconnectAppRequest {
  // Which app. The cascade is scoped to the CALLER's own credentials, so this
  // never reaches another account's -- see RevokeAPITokensForOAuthClient.
  string client_id = 1;
}

message DisconnectAppResponse {
  // How many credentials the disconnect retired, so the surface can say what
  // it did rather than only that it succeeded. Zero means the account held
  // none, which is not an error: the caller's goal already holds.
  int64 revoked_credential_count = 1;
}
