syntax = "proto3";
package leapmux.v1;

import "leapmux/v1/access.proto";
// SectionService manages per-user sidebar sections.
// Called by Frontend on Hub via ConnectRPC. Moving a WORKSPACE between
// sections is WorkspaceService.MoveWorkspace, because the destination section
// decides whether the workspace is archived.
service SectionService {
  option (leapmux.v1.host) = SERVICE_HOST_HUB;
  // List all sections and workspace assignments for the current user.
  // Read-only: the default sections are seeded when the user is created.
  rpc ListSections(ListSectionsRequest) returns (ListSectionsResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_WORKSPACE_READ };
  }
  // Create a new custom section.
  rpc CreateSection(CreateSectionRequest) returns (CreateSectionResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_WORKSPACE_WRITE };
  }
  // Rename a custom section.
  rpc RenameSection(RenameSectionRequest) returns (RenameSectionResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_WORKSPACE_WRITE };
  }
  // Delete a custom section (moves its workspaces to "In progress").
  rpc DeleteSection(DeleteSectionRequest) returns (DeleteSectionResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_WORKSPACE_WRITE };
  }
  // Move a section to a different sidebar and/or position.
  rpc MoveSection(MoveSectionRequest) returns (MoveSectionResponse) {
    option (leapmux.v1.access) = { scope: SCOPE_WORKSPACE_WRITE };
  }
}

// SectionType distinguishes built-in from user-created sections.
enum SectionType {
  SECTION_TYPE_UNSPECIFIED = 0;
  SECTION_TYPE_WORKSPACES_CUSTOM = 1;
  SECTION_TYPE_WORKSPACES_IN_PROGRESS = 2;
  SECTION_TYPE_WORKSPACES_ARCHIVED = 3;
  SECTION_TYPE_FILES = 4;
  SECTION_TYPE_TODOS = 5;
  SECTION_TYPE_WORKERS = 6;
  SECTION_TYPE_BACKGROUND_TASKS = 7;
}

// Sidebar indicates which sidebar a section belongs to.
enum Sidebar {
  SIDEBAR_UNSPECIFIED = 0;
  SIDEBAR_LEFT = 1;
  SIDEBAR_RIGHT = 2;
}

// Section represents a user's sidebar section.
message Section {
  string id = 1;
  string name = 2;
  string position = 3;
  SectionType section_type = 4;
  Sidebar sidebar = 5;
}

// SectionItem represents a workspace's assignment to a section.
message SectionItem {
  string workspace_id = 1;
  string section_id = 2;
  string position = 3;
}

message ListSectionsRequest {
}

message ListSectionsResponse {
  repeated Section sections = 1;
  repeated SectionItem items = 2;
}

message CreateSectionRequest {
  string name = 1;
  // Which sidebar the new section belongs to. Must be LEFT or RIGHT --
  // MoveSection applies the same rule, so a section cannot be created into a
  // sidebar it could not be moved to.
  Sidebar sidebar = 2;
}

message CreateSectionResponse {
  // The created section, complete. The SERVER computes the lexorank position,
  // so a response carrying only the id would leave the client either
  // duplicating that rule -- a second source of truth for section order -- or
  // refetching the whole list to learn where its own section landed.
  Section section = 1;
}

message RenameSectionRequest {
  string section_id = 1;
  string name = 2;
}

message RenameSectionResponse {}

message DeleteSectionRequest {
  string section_id = 1;
}

message DeleteSectionResponse {}

message MoveSectionRequest {
  string section_id = 1;
  Sidebar sidebar = 2;
  string position = 3;
}

message MoveSectionResponse {}

