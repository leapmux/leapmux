# /etc/traefik/dynamic/leapmux.yml

http:
  routers:
    # The web app, API calls, and all WebSocket upgrades.
    # Exclude /metrics so unauthenticated Prometheus metrics stay host-local.
    leapmux:
      rule: Host(`hub.example.com`) && !Path(`/metrics`)
      entryPoints: [websecure]
      middlewares: [strip-forwarded]
      service: leapmux
      tls: {}

  middlewares:
    strip-forwarded:
      headers:
        customRequestHeaders:
          Forwarded: ""

  services:
    leapmux:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:4327

tls:
  certificates:
    - certFile: /etc/traefik/certs/hub.example.com.crt
      keyFile: /etc/traefik/certs/hub.example.com.key
