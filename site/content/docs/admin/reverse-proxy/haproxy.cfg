# /etc/haproxy/haproxy.cfg

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    # The Hub pings each WebSocket, the Worker's stream included, every
    # 10 seconds. One minute of silence therefore means a dead peer.
    timeout client 1m
    timeout server 1m
    timeout tunnel 1m

frontend leapmux-public
    bind :80
    bind :443 ssl crt /etc/haproxy/certs/hub.example.com.pem alpn h2,http/1.1
    http-request redirect scheme https code 301 unless { ssl_fc }
    http-request set-header X-Forwarded-Proto https
    option forwardfor

    # The web app, API calls, and all WebSocket upgrades.
    default_backend leapmux-hub

backend leapmux-hub
    server hub 127.0.0.1:4327
