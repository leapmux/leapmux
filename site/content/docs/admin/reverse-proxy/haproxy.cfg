# /etc/haproxy/haproxy.cfg

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    # The Worker and the Hub exchange a message every few seconds, and the
    # Hub probes each WebSocket every 30 seconds. One minute of silence
    # therefore means a dead peer.
    timeout client 1m
    timeout server 1m
    timeout tunnel 1m

frontend leapmux-public
    bind :80
    bind :443 ssl crt /etc/haproxy/certs/hub.example.com.pem alpn h2,http/1.1
    http-request redirect scheme https code 301 unless { ssl_fc }
    http-request set-header X-Forwarded-Proto https
    option forwardfor

    # The Worker's stream: HTTP/2 to the Hub, without buffering.
    use_backend leapmux-hub-h2c if { path_beg /leapmux.v1.WorkerConnectorService/ }
    # Everything else: the web app, its API calls, and WebSocket upgrades.
    default_backend leapmux-hub

backend leapmux-hub-h2c
    server hub 127.0.0.1:4327 proto h2

backend leapmux-hub
    server hub 127.0.0.1:4327
