# /etc/nginx/conf.d/leapmux.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name hub.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hub.example.com;

    ssl_certificate     /etc/letsencrypt/live/hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.com/privkey.pem;

    # The Hub limits the size of each request itself. nginx counts every
    # byte that a Worker sends on its long-lived stream as one request body,
    # so the default limit of 1 MiB would end that stream.
    client_max_body_size 0;

    # The Worker's stream: HTTP/2 to the Hub, without buffering.
    location /leapmux.v1.WorkerConnectorService/ {
        grpc_pass grpc://127.0.0.1:4327;
        grpc_set_header Host $host;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: the web app, its API calls, and WebSocket upgrades.
    location / {
        proxy_pass http://127.0.0.1:4327;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
