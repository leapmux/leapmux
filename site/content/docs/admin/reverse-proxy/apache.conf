# /etc/apache2/sites-available/leapmux.conf
# Required modules: ssl http2 proxy proxy_http headers

<VirtualHost *:80>
    ServerName hub.example.com
    Redirect permanent / https://hub.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName hub.example.com
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/hub.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hub.example.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # The web app, API calls, and all WebSocket upgrades.
    ProxyPass / http://127.0.0.1:4327/ upgrade=websocket
</VirtualHost>
