# /etc/apache2/sites-available/leapmux.conf
# Required modules: ssl http2 proxy proxy_http proxy_http2 headers

<VirtualHost *:80>
    ServerName hub.example.com
    Redirect permanent / https://hub.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName hub.example.com
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/hub.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hub.example.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # The Worker's stream: HTTP/2 to the Hub, without buffering.
    ProxyPass /leapmux.v1.WorkerConnectorService/ h2c://127.0.0.1:4327/leapmux.v1.WorkerConnectorService/

    # Everything else: the web app, its API calls, and WebSocket upgrades.
    ProxyPass / http://127.0.0.1:4327/ upgrade=websocket
</VirtualHost>
