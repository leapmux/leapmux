{{- $providers := partialCached "agent-providers.html" . -}}
<div class="provider-logos">
  {{- range $provider := $providers -}}
    <a class="provider-link" href="{{ $provider.url }}">
      {{- partial "provider-icon.html" (dict "provider" $provider "size" 64 "alt" $provider.label) -}}
      <span class="provider-hover-label" aria-hidden="true">{{ $provider.label }}</span>
    </a>
  {{- end -}}
</div>
