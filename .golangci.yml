version: "2"

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - exhaustive
    - depguard
  settings:
    depguard:
      rules:
        # storetest.SQLContainer is the one place that starts a container. It
        # calls testutil.RequireDocker, which skips the test when
        # LEAPMUX_TEST_SKIP_DOCKER is set. A container that starts elsewhere
        # fails each run that sets it, such as the macOS and Windows CI jobs.
        containers:
          files:
            - $all
            - "!**/internal/hub/store/storetest/container.go"
          deny:
            - pkg: github.com/testcontainers/testcontainers-go
              desc: start a container with storetest.SQLContainer, which skips the test when LEAPMUX_TEST_SKIP_DOCKER is set
    exhaustive:
      # An explicit `default` IS the handling for the remaining members, so a
      # switch that has one is exhaustive. Without this the linter demands every
      # member of THIRD-PARTY enums be enumerated -- all 16 `connect.Code`s, all
      # ~26 `reflect.Kind`s -- which is both noise and a landmine, since the list
      # grows on a dependency bump and breaks the build for no defect.
      #
      # The tripwire is preserved where it earns its keep: a switch over one of
      # our own domain enums written WITHOUT a default stays fully checked, so
      # adding an enum member turns every such switch red. Prefer that shape for
      # a switch that must handle every case (see BuildTabSync).
      default-signifies-exhaustive: true

formatters:
  enable:
    - gofmt
    - goimports
