[package]
name = "leapmux-desktop"
version = "0.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
prost-build = "0.14"

[dependencies]
base64 = "0.23"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# `tray-icon` is optional and off by default. The tray-icon crate itself is
# already in Cargo.lock through tauri's own optional edge, so enabling the
# feature adds no new package.
#
# No `image-png`: the tray images go through `tauri::include_image!`, which
# decodes the PNG at COMPILE time into OUT_DIR. Only `Image::from_bytes` and
# `Image::from_path` need that feature, and both would move the decode into
# startup for no gain.
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
dirs = "6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "net"] }

[target.'cfg(unix)'.dependencies]
# For getuid(2): the dev-sidecar connect compares the socket peer's kernel-reported
# uid against our own before adopting it (see require_same_user_peer). Already in the
# tree transitively via Tauri; named explicitly because we call it directly.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri 2 already pulls these in transitively (it returns
# `gtk::ApplicationWindow` from `WebviewWindow::gtk_window()`).
# We name them explicitly so `tabfix_linux.rs` can install a GTK-level
# Tab key-press handler, and `tray/minimize_linux.rs` a window-state handler.
gtk = "0.18"
gdk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# The runtime subclass that overrides `-[NSWindow miniaturize:]`; see
# `tray/minimize_macos.rs`. Tauri 2 emits no Minimized window event and tao
# tracks the state without reporting it, so the shell calls AppKit itself. It
# overrides that method rather than answering
# NSWindowDidMiniaturizeNotification, because a miniaturize cannot be undone
# once AppKit performs it.
#
# `objc2` alone: the override needs the class builder, `msg_send!` and `sel!`,
# and none of the AppKit or Foundation types. Tauri re-exports objc2 only under
# `target_os = "ios"`, so this file must list it itself. It is already in
# Cargo.lock at this version through tao/muda/tray-icon, so the entry adds a
# direct edge and no new package.
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
# Only the SID lookup that ACLs the named pipe, and the pipe's own error codes,
# still need raw Win32 -- the force-kill path that used OpenProcess/TerminateProcess
# is gone. The named-pipe transport itself is delegated to tokio's overlapped-I/O
# client (see desktop/rust/src/main.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
