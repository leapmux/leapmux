version: '3'

run: once
method: checksum

# versions.env supplies tool and image versions through Task's dotenv support.
# Each entry supplies a template variable ({{.KEY}}) and a shell variable ($KEY).
# An existing environment variable takes precedence, such as VERSION=1.2.3 task build.
dotenv: ['versions.env']

vars:
  SPINNERS_CACHE_DIR:
    sh: echo "${HOME:-$USERPROFILE}/.cache/awesome-claude-spinners"
  GO_CONTEXT:
    sh: go env -json GOOS GOARCH GOAMD64 GOARM GOARM64 GOEXPERIMENT GO386 GOPPC64 GOMIPS GOMIPS64 GORISCV64 GOWASM CGO_ENABLED CGO_CFLAGS CGO_CPPFLAGS CGO_CXXFLAGS CGO_FFLAGS CGO_LDFLAGS CC CXX GOFLAGS GOTOOLCHAIN GOVERSION GOWORK
  JS_CONTEXT:
    sh: bun --version && node --version
  # Use VERSION from the environment when set, including CI overrides.
  # Otherwise, use the value from versions.env. Task's dotenv supplies command shells.
  # Quote the dotenv default before the shell evaluates the environment fallback.
  VERSION:
    sh: |
      task_default_version={{.VERSION | shellQuote}}
      printf '%s' "${VERSION:-$task_default_version}"
  COMMIT_HASH:
    sh: printf '%s' "${COMMIT_HASH:-$(git rev-parse --short HEAD 2>/dev/null)}"
  COMMIT_TIME:
    sh: printf '%s' "${COMMIT_TIME:-$(git log -1 --format=%cI 2>/dev/null)}"
  BUILD_TIME:
    sh: printf '%s' "${BUILD_TIME:-}"
  EFFECTIVE_BUILD_TIME: '{{.BUILD_TIME | default (dateInZone "2006-01-02T15:04:05Z" now "UTC")}}'
  # The version banner and AboutDialog show the embedded Git branch.
  # Use the environment override first, then the current branch.
  # Detached checkouts, including tag builds, leave this empty. The version package hides an empty branch.
  BRANCH:
    sh: printf '%s' "${BRANCH:-$(git symbolic-ref --short HEAD 2>/dev/null)}"
  BUILD_CONTEXT: '{{dict "version" .VERSION "commit" .COMMIT_HASH "commitTime" .COMMIT_TIME "branch" .BRANCH "buildTime" .BUILD_TIME | toJson}}'
  VERSION_LDFLAGS: >-
    -X github.com/leapmux/leapmux/util/version.Value={{.VERSION}}
    -X github.com/leapmux/leapmux/util/version.CommitHash={{.COMMIT_HASH}}
    -X github.com/leapmux/leapmux/util/version.CommitTime={{.COMMIT_TIME}}
    -X github.com/leapmux/leapmux/util/version.BuildTime={{.EFFECTIVE_BUILD_TIME}}
    -X github.com/leapmux/leapmux/util/version.Branch={{.BRANCH}}
  # macOS bundles use arm64/x86_64. Task uses Go's arm64/amd64 architecture values.
  # Both Darwin build and notarization tasks need the same disk-image filename.
  # Go server archives retain Go's architecture values.
  DMG_ARCH: '{{if eq ARCH "amd64"}}x86_64{{else}}{{ARCH}}{{end}}'

# --- Code Generation ---

tasks:
  generate:
    desc: Generate all code
    # Proto, contracts, and spinners can run concurrently because they do not read each other's output.
    # Contracts runs its own local buf build and requires the frontend dependency installation for ajv.
    # SQL generation requires the generated proto files. Each task declares its prerequisites.
    deps:
      - generate-proto
      - generate-contracts
      - generate-spinners
    cmds:
      - task: generate-sqlc

  sync-versions:
    desc: Rewrite documented tool versions from versions.env
    # Task, workflows, and Docker read versions.env directly.
    # Documentation and go.mod directives require literal values, so this task rewrites those values.
    # lint-versions rejects a value that differs from versions.env.
    #
    # Always run this repair. A checksum on the script alone would miss an edited destination file.
    # A sources list without generates previously marked the repair current while lint still failed.
    cmds:
      - bun scripts/sync-versions.mjs

  generate-proto:
    desc: Generate Protocol Buffer code
    sources:
      - versions.env
      - scripts/task-state.mjs
      - proto/**/*
      - buf.gen.yaml
      - buf.yaml
      - scripts/sync-generated.mjs
    vars:
      BUF_CONTEXT:
        sh: buf --version
      CACHE_CONTEXT: '{{.BUF_CONTEXT}}'
      OUTPUTS: &outputs_generate_proto
        - backend/generated/proto/**/*
        - frontend/src/generated/proto/**/*
    generates: *outputs_generate_proto
    # Task checks source bytes. The shared status check validates the recipe and outputs.
    # Forget the previous result before execution. Record a result only after success.
    status: &artifact_status
      - bun scripts/task-state.mjs check {{.TASK | shellQuote}} {{.OUTPUTS | toJson | shellQuote}} {{.CACHE_CONTEXT | default "" | sha256sum | shellQuote}}
    cmds:
      - &forget_artifacts bun scripts/task-state.mjs forget {{.TASK | shellQuote}}
      # Old checkouts can retain generated/leapmux beside generated/proto.
      # sync-generated prunes only its output roots, so remove the old tree before TypeScript and ESLint scan it.
      - rm -rf frontend/src/generated/leapmux
      # Generate into a private staging directory and publish through scripts/sync-generated.mjs.
      # Identical files retain their modification times, so Vite does not reload unchanged frontend sources.
      # Buf's -o prefixes every plugin output directory. Both output trees then reside below {STAGING}.
      - >-
        bun scripts/sync-generated.mjs
        --out backend/generated/proto backend/generated/proto
        --out frontend/src/generated/proto frontend/src/generated/proto
        -- buf generate -o {STAGING}
      - &record_artifacts bun scripts/task-state.mjs record {{.TASK | shellQuote}} {{.OUTPUTS | toJson | shellQuote}} {{.CACHE_CONTEXT | default "" | sha256sum | shellQuote}}

  generate-contracts:
    desc: Generate Go and TS constants from contracts/*.json
    # contracts/ supplies shared values across language boundaries.
    # The generator validates each contract against its sibling JSON Schema before it writes output.
    # It also checks enum domains against descriptors from a local buf build.
    # Every registered domain requires contracts/<name>.json. A missing file must fail generation.
    # The proto sources affect the enum checks. validate-json.mjs supplies validation, and sync-generated.mjs publishes the output.
    sources:
      - frontend/bunfig.toml
      - frontend/.npmrc
      - frontend/patches/**/*
      - versions.env
      - scripts/task-state.mjs
      - buf.yaml
      - proto/**/*.proto
      - frontend/package.json
      - frontend/bun.lock
      - contracts/**/*
      - scripts/generate-contracts.mjs
      - scripts/validate-json.mjs
      - scripts/sync-generated.mjs
    vars:
      BUF_CONTEXT:
        sh: buf --version
      CACHE_CONTEXT: '{{.BUF_CONTEXT}}/{{.JS_CONTEXT}}/{{OS}}/{{ARCH}}'
      OUTPUTS: &outputs_generate_contracts
        - backend/generated/contracts/**/*
        - frontend/src/generated/contracts/**/*
        - desktop/rust/src/generated/**/*
    generates: *outputs_generate_contracts
    deps: [install-frontend-deps] # the generator resolves ajv from frontend/node_modules
    status: *artifact_status
    cmds:
      - *forget_artifacts
      # Preserve modification times when generated content stays identical, as generate-proto does.
      # This prevents a Vite reload for unchanged output.
      - >-
        bun scripts/sync-generated.mjs
        --out backend/generated/contracts backend/generated/contracts
        --out frontend/src/generated/contracts frontend/src/generated/contracts
        --out desktop/rust/src/generated desktop/rust/src/generated
        -- bun scripts/generate-contracts.mjs --staging {STAGING}
      - *record_artifacts

  generate-conformance-corpus:
    desc: Regenerate the differential CRDT conformance corpus (deliberate; not part of test runs)
    deps: [generate-proto]
    cmds:
      # Do not run this task from generate or a test target.
      # The corpus records the Go projection's expected results. Automatic regeneration would accept the change that the tests must detect.
      # Run this task only after changing the generator. Review the changed expectations.
      - cd backend && go run ./internal/hub/crdt/internal/genconformance ../testdata/crdt_projection_corpus.json

  generate-sqlc:
    desc: Generate all type-safe SQL code
    deps: [generate-sqlc-hub, generate-sqlc-worker]

  generate-sqlc-hub:
    desc: Generate type-safe SQL code for Hub
    deps: [generate-proto]
    vars:
      CACHE_CONTEXT: '{{.GO_CONTEXT}}'
      OUTPUTS: &outputs_generate_sqlc_hub
        - backend/internal/hub/store/*/generated/db/**/*
      BACKENDS: sqlite postgres mysql
    sources:
      - go.work.sum
      - desktop/go/go.mod
      - desktop/go/go.sum
      - versions.env
      - scripts/task-state.mjs
      - go.work
      - backend/go.mod
      - backend/go.sum
      - scripts/sync-generated.mjs
      - backend/generated/proto/**/*
      - backend/internal/hub/store/*/sqlc.yaml
      - backend/internal/hub/store/*/db/**/*.sql
    generates: *outputs_generate_sqlc_hub
    status: *artifact_status
    cmds:
      - *forget_artifacts
      # Generate below backend/ and publish through scripts/sync-generated.mjs.
      # Identical files retain their modification times. Deleted queries also remove their obsolete generated files.
      # go tool must resolve sqlc inside the module, and sqlc has no output-directory override.
      # Copy the configuration and database inputs into staging. --cwd-staging makes sqlc write its relative output there.
      - for: { var: BACKENDS }
        cmd: >-
          bun scripts/sync-generated.mjs --base backend --cwd-staging
          --copy backend/internal/hub/store/{{.ITEM}}/sqlc.yaml sqlc.yaml
          --copy backend/internal/hub/store/{{.ITEM}}/db db
          --out generated/db backend/internal/hub/store/{{.ITEM}}/generated/db
          -- go tool sqlc generate
      - *record_artifacts

  generate-sqlc-worker:
    desc: Generate type-safe SQL code for Worker
    deps: [generate-proto]
    sources:
      - go.work.sum
      - desktop/go/go.mod
      - desktop/go/go.sum
      - versions.env
      - scripts/task-state.mjs
      - go.work
      - backend/go.mod
      - backend/go.sum
      - scripts/sync-generated.mjs
      - backend/generated/proto/**/*
      - backend/internal/worker/sqlc.yaml
      - backend/internal/worker/db/**/*.sql
    vars:
      CACHE_CONTEXT: '{{.GO_CONTEXT}}'
      OUTPUTS: &outputs_generate_sqlc_worker
        - backend/internal/worker/generated/db/**/*
    generates: *outputs_generate_sqlc_worker
    status: *artifact_status
    cmds:
      - *forget_artifacts
      # See generate-sqlc-hub for the staging rationale.
      - >-
        bun scripts/sync-generated.mjs --base backend --cwd-staging
        --copy backend/internal/worker/sqlc.yaml sqlc.yaml
        --copy backend/internal/worker/db db
        --out generated/db backend/internal/worker/generated/db
        -- go tool sqlc generate
      - *record_artifacts

  fetch-spinners:
    desc: Obtain the spinner sources
    internal: true
    status:
      - test -d "{{.SPINNERS_CACHE_DIR}}/spinners"
    cmds:
      - |
        if [ -d "{{.SPINNERS_CACHE_DIR}}/.git" ]; then
          bun scripts/sync-generated.mjs --out repository/spinners "{{.SPINNERS_CACHE_DIR}}/spinners" -- git clone --local --no-hardlinks "{{.SPINNERS_CACHE_DIR}}" {STAGING}/repository
        else
          git clone --depth 1 https://github.com/AlexPl292/awesome-claude-spinners "{{.SPINNERS_CACHE_DIR}}"
        fi

  generate-spinners:
    desc: Copy spinner verb JSON files from awesome-claude-spinners
    deps: [fetch-spinners]
    vars:
      OUTPUTS: &outputs_generate_spinners
        - frontend/src/spinners/**/*
    sources:
      - versions.env
      - scripts/task-state.mjs
      - scripts/sync-generated.mjs
      - "{{.SPINNERS_CACHE_DIR}}/spinners/**/*"
    generates: *outputs_generate_spinners
    status: *artifact_status
    cmds:
      - *forget_artifacts
      # Publish cached spinners through scripts/sync-generated.mjs.
      # Identical files retain their modification times, which prevents a development-server reload.
      # Remove outputs for deleted spinners. --copy supplies the files without a generator.
      # Quote CACHE_DIR because Windows paths contain backslashes that Task's POSIX shell would otherwise remove.
      - >-
        bun scripts/sync-generated.mjs
        --copy "{{.SPINNERS_CACHE_DIR}}/spinners" spinners
        --out spinners frontend/src/spinners
      - *record_artifacts

  # --- Preparation ---

  prepare:
    desc: Prepare all modules for builds
    cmds:
      - task: prepare-frontend
      - task: prepare-backend
      - task: prepare-desktop

  # Scripts that need frontend/node_modules depend on this installation task.
  # They do not need the full frontend preparation. A contract validation must not render icons.
  install-frontend-deps:
    desc: Install frontend node modules
    sources:
      - versions.env
      - scripts/task-state.mjs
      - frontend/.npmrc
      - frontend/bunfig.toml
      - frontend/patches/**/*
      - frontend/scripts/only-bun.mjs
      - frontend/package.json
      - frontend/bun.lock
    vars:
      CACHE_CONTEXT: '{{.JS_CONTEXT}}/{{OS}}/{{ARCH}}'
      OUTPUTS: &outputs_install_frontend_deps
        - frontend/node_modules/**/*
        # prepare-dmg-tools owns the native macOS build directory.
        - exclude: frontend/node_modules/macos-alias/build/**/*
        - exclude: frontend/node_modules/.cache/**/*
        - exclude: frontend/node_modules/.vite/**/*
        - exclude: frontend/node_modules/.vite-temp/**/*
        # The frontend build owns TanStack's generated server-function manifests.
        - exclude: frontend/node_modules/.tanstack-start/**/*
    generates: *outputs_install_frontend_deps
    status: *artifact_status
    cmds:
      - *forget_artifacts
      - cd frontend && bun install --force --frozen-lockfile
      - *record_artifacts

  prepare-frontend:
    desc: Prepare frontend for builds
    deps: [generate-proto, generate-contracts, generate-spinners, generate-frontend-icons, copy-frontend-notice]

  generate-frontend-icons:
    desc: Generate web icons
    deps: [install-frontend-deps]
    sources:
      - frontend/bunfig.toml
      - frontend/.npmrc
      - frontend/patches/**/*
      - versions.env
      - scripts/task-state.mjs
      - icons/leapmux-icon.svg
      - icons/leapmux-icon-square.svg
      - frontend/scripts/generate-icons.mjs
      - scripts/build-ico.mjs
      - scripts/render-icon.mjs
      - scripts/icon-corners.mjs
      - frontend/package.json
      - frontend/bun.lock
    vars:
      CACHE_CONTEXT: '{{.JS_CONTEXT}}/{{OS}}/{{ARCH}}'
      OUTPUTS: &outputs_generate_frontend_icons
        - frontend/public/icons/leapmux-icon.ico
        - frontend/public/icons/leapmux-icon.svg
        - frontend/public/icons/leapmux-icon-192.png
        - frontend/public/icons/leapmux-icon-512.png
        - frontend/public/icons/leapmux-icon-maskable-512.png
        - frontend/public/icons/leapmux-icon-square-apple-touch.png
    generates: *outputs_generate_frontend_icons
    status: *artifact_status
    cmds:
      - *forget_artifacts
      - NODE_PATH=frontend/node_modules bun frontend/scripts/generate-icons.mjs icons/leapmux-icon.svg icons/leapmux-icon-square.svg frontend/public
      - *record_artifacts

  copy-frontend-notice:
    desc: Copy the third-party license notice into the frontend
    sources:
      - versions.env
      - scripts/task-state.mjs
      - NOTICE.html
    vars:
      OUTPUTS: &outputs_copy_frontend_notice
        - frontend/public/NOTICE.html
    generates: *outputs_copy_frontend_notice
    status: *artifact_status
    cmds:
      - *forget_artifacts
      - mkdir -p frontend/public
      - cp NOTICE.html frontend/public/NOTICE.html
      - *record_artifacts

  prepare-backend:
    desc: Prepare backend for builds
    deps: [generate-proto, generate-contracts, generate-sqlc, embed-frontend]

  embed-frontend:
    desc: Embed frontend assets in the backend
    deps: [build-frontend]
    sources:
      - versions.env
      - scripts/task-state.mjs
      - backend/internal/hub/frontend.embed
      - frontend/.output/public/**/*
      - scripts/sync-generated.mjs
    vars:
      OUTPUTS: &outputs_embed_frontend
        - backend/internal/hub/generated/frontend/embed.go
        - backend/internal/hub/generated/frontend/public/**/*
    generates: *outputs_embed_frontend
    status: *artifact_status
    cmds:
      - *forget_artifacts
      # Preserve identical files so Go and development servers see only real changes.
      - >-
        bun scripts/sync-generated.mjs
        --copy backend/internal/hub/frontend.embed frontend/embed.go
        --copy frontend/.output/public frontend/public
        --out frontend backend/internal/hub/generated/frontend
      - *record_artifacts

  prepare-desktop:
    desc: Prepare desktop for builds
    deps: [prepare-backend, generate-desktop-icons]

  generate-desktop-icons:
    desc: Generate desktop and tray icons
    deps: [install-frontend-deps]
    preconditions:
      - sh: '[ "{{OS}}" = "darwin" ] || [ "{{OS}}" = "linux" ] || [ "{{OS}}" = "windows" ]'
        msg: "Unsupported OS: {{OS}}. Desktop builds require macOS, Linux, or Windows."
    sources:
      - frontend/bunfig.toml
      - frontend/.npmrc
      - frontend/patches/**/*
      - versions.env
      - scripts/task-state.mjs
      - icons/leapmux-icon-square.svg
      - icons/leapmux-icon.svg
      - icons/leapmux-icon-mono.svg
      - desktop/rust/scripts/generate-icons.mjs
      - desktop/rust/scripts/icon-set.mjs
      - scripts/build-ico.mjs
      - scripts/render-icon.mjs
      - scripts/icon-corners.mjs
      - frontend/package.json
      - frontend/bun.lock
    vars:
      CACHE_CONTEXT: '{{.JS_CONTEXT}}/{{OS}}/{{ARCH}}'
      OUTPUTS: &outputs_generate_desktop_icons
        # Include both platform sets and the tray icons from icon-set.mjs.
        - desktop/rust/icons/*.png
        - desktop/rust/icons/icon.ico
    generates: *outputs_generate_desktop_icons
    status: *artifact_status
    cmds:
      - *forget_artifacts
      # macOS applies its own mask. The square source prevents a second rounded corner.
      # Linux and Windows use the rounded source. All platforms share the tray silhouette.
      - cmd: NODE_PATH=frontend/node_modules bun desktop/rust/scripts/generate-icons.mjs icons/leapmux-icon-square.svg icons/leapmux-icon.svg icons/leapmux-icon-mono.svg desktop/rust/icons opaque
        if: '[ "{{OS}}" = "darwin" ]'
      - cmd: NODE_PATH=frontend/node_modules bun desktop/rust/scripts/generate-icons.mjs icons/leapmux-icon.svg icons/leapmux-icon.svg icons/leapmux-icon-mono.svg desktop/rust/icons transparent
        if: '[ "{{OS}}" = "linux" ] || [ "{{OS}}" = "windows" ]'
      - *record_artifacts

  # --- Build ---

  build:
    desc: Build all modules
    cmds:
      - task: build-frontend
      - task: build-backend
      - task: build-desktop

  check-build-cache:
    desc: Fail if an unchanged native build runs any commands
    summary: |
      Run task build first, then run task check-build-cache with the same environment.
      This task executes the build again and requires every build command to stay cached.
      It retains complete logs under .tmp/ and prints them if the check fails.
      It detects unnecessary rebuilds. It cannot discover undeclared build inputs.
    cmds:
      - bun scripts/check-build-cache.mjs {{.TASK_EXE | shellQuote}}

  build-frontend:
    desc: Build frontend
    deps: [prepare-frontend]
    sources:
      - frontend/bunfig.toml
      - frontend/.npmrc
      - versions.env
      - scripts/task-state.mjs
      - frontend/package.json
      - frontend/bun.lock
      - frontend/app.config.ts
      - frontend/tsconfig.json
      - frontend/.env*
      - frontend/src/**/*
      - exclude: frontend/src/**/*.test.*
      - exclude: frontend/src/**/*.testkit.*
      - exclude: frontend/src/test-support/**/*
      - frontend/patches/**/*
      - frontend/public/**/*
    env:
      LEAPMUX_DEV: '{{.LEAPMUX_DEV | default ""}}'
    vars:
      CACHE_CONTEXT: '{{.BUILD_CONTEXT}}/{{.JS_CONTEXT}}/{{.LEAPMUX_DEV | default ""}}/{{.NODE_ENV | default ""}}'
      OUTPUTS: &outputs_build_frontend
        - frontend/.output/**/*
    generates: *outputs_build_frontend
    status: *artifact_status
    cmds:
      - *forget_artifacts
      - cd frontend && LEAPMUX_VERSION={{.VERSION | shellQuote}} LEAPMUX_COMMIT_HASH={{.COMMIT_HASH | shellQuote}} LEAPMUX_COMMIT_TIME={{.COMMIT_TIME | shellQuote}} LEAPMUX_BUILD_TIME={{.EFFECTIVE_BUILD_TIME | shellQuote}} LEAPMUX_BRANCH={{.BRANCH | shellQuote}} bun run build
      - *record_artifacts

  build-backend:
    desc: Build backend
    deps: [prepare-backend]
    sources:
      - go.work.sum
      - versions.env
      - scripts/task-state.mjs
      - desktop/go/go.mod
      - desktop/go/go.sum
      - go.work
      - backend/internal/hub/store/*/db/migrations/*.sql
      - backend/internal/worker/db/migrations/*.sql
      - backend/internal/hub/generated/frontend/public/**/*
      - proto/**/*
      - buf.gen.yaml
      - buf.yaml
      - backend/go.mod
      - backend/go.sum
      - backend/**/*.{go,s,S,c,cc,cpp,cxx,h,hpp,f,F,f90,syso}
      - exclude: backend/**/*_test.go
    vars:
      CACHE_CONTEXT: '{{.BUILD_CONTEXT}}/{{.GO_CONTEXT}}/{{.GOOS | default ""}}/{{.GOARCH | default ""}}'
      OUTPUTS: &outputs_build_backend
        - leapmux{{if eq OS "windows"}}.exe{{end}}
    generates: *outputs_build_backend
    status: *artifact_status
    cmds:
      - *forget_artifacts
      - cd backend && go build -ldflags {{.VERSION_LDFLAGS | shellQuote}} -o ../leapmux{{if eq OS "windows"}}.exe{{end}} ./cmd/leapmux
      - *record_artifacts

  build-backend-docker:
    desc: Build backend for Docker images
    deps: [prepare-backend]
    sources:
      - go.work.sum
      - versions.env
      - scripts/task-state.mjs
      - desktop/go/go.mod
      - desktop/go/go.sum
      - go.work
      - backend/internal/hub/store/*/db/migrations/*.sql
      - backend/internal/worker/db/migrations/*.sql
      - backend/internal/hub/generated/frontend/public/**/*
      - backend/go.mod
      - backend/go.sum
      - backend/**/*.{go,s,S,c,cc,cpp,cxx,h,hpp,f,F,f90,syso}
      - exclude: backend/**/*_test.go
    vars:
      CACHE_CONTEXT: '{{.BUILD_CONTEXT}}/{{.GO_CONTEXT}}/{{.GOOS | default ""}}/{{.GOARCH | default ""}}'
      OUTPUTS: &outputs_build_backend_docker
        - leapmux
    generates: *outputs_build_backend_docker
    status: *artifact_status
    cmds:
      - *forget_artifacts
      - |
        export CGO_ENABLED=0
        export GOOS={{.GOOS | default "linux" | shellQuote}} GOARCH={{.GOARCH | default "amd64" | shellQuote}}
        cd backend && go build -ldflags {{printf "-s -w %s" .VERSION_LDFLAGS | shellQuote}} -o ../leapmux ./cmd/leapmux
      - *record_artifacts

  build-desktop:
    desc: Build desktop
    preconditions:
      - sh: '[ "{{OS}}" = "darwin" ] || [ "{{OS}}" = "linux" ] || [ "{{OS}}" = "windows" ]'
        msg: "Unsupported OS: {{OS}}. Desktop builds require macOS, Linux, or Windows."
    cmds:
      - task: build-desktop-darwin
        if: '[ "{{OS}}" = "darwin" ]'
      - task: build-desktop-linux
        if: '[ "{{OS}}" = "linux" ]'
      - task: build-desktop-windows
        if: '[ "{{OS}}" = "windows" ]'

  prepare-dmg-tools:
    desc: Build the native module for macOS disk image metadata
    deps: [install-frontend-deps]
    sources:
      - versions.env
      - scripts/task-state.mjs
      - frontend/node_modules/macos-alias/package.json
      - frontend/node_modules/macos-alias/binding.gyp
      - frontend/node_modules/macos-alias/src/**/*
      - frontend/node_modules/nan/**/*
    vars:
      SDK_CONTEXT:
        sh: xcrun clang --version && xcrun --show-sdk-version
      CACHE_CONTEXT: '{{.JS_CONTEXT}}/{{.SDK_CONTEXT}}/{{.MACOSX_DEPLOYMENT_TARGET | default ""}}'
      OUTPUTS: &outputs_prepare_dmg_tools
        - frontend/node_modules/macos-alias/build/**/*
    generates: *outputs_prepare_dmg_tools
    status: *artifact_status
    cmds:
      - *forget_artifacts
      - cd frontend/node_modules/macos-alias && bunx node-gyp@{{.NODE_GYP_VERSION}} rebuild
      - *record_artifacts

  build-desktop-darwin:
    desc: Build desktop for macOS
    deps: [build-backend, prepare-desktop, build-desktop-sidecar, prepare-dmg-tools]
    sources:
      - .cargo/**/*
      - desktop/rust/.cargo/**/*
      - desktop/rust/rust-toolchain*
      - versions.env
      - scripts/task-state.mjs
      - backend/go.mod
      - backend/go.sum
      - backend/**/*.go
      - desktop/go/go.mod
      - desktop/go/go.sum
      - desktop/go/**/*.go
      - exclude: desktop/go/bin/**/*
      - desktop/rust/*.rs
      - desktop/rust/src/**/*
      - desktop/rust/Cargo.*
      - desktop/rust/capabilities/**/*
      - desktop/rust/tauri.conf.json
      - desktop/rust/entitlements.plist
      - desktop/rust/icons/*
      - desktop/rust/scripts/**/*
      - frontend/.output/**/*
      - backend/internal/hub/generated/frontend/public/**/*
      - leapmux
    vars:
      RUST_CONTEXT:
        sh: cd desktop/rust && rustc -vV && cargo --version
      CACHE_CONTEXT: '{{.BUILD_CONTEXT}}/{{.GO_CONTEXT}}/{{OS}}/{{ARCH}}/{{.RUST_CONTEXT}}/{{.RUSTFLAGS | default ""}}/{{.CARGO_ENCODED_RUSTFLAGS | default ""}}/{{.CARGO_BUILD_TARGET | default ""}}/{{.MACOS_CODESIGN_IDENTITY | default ""}}'
      OUTPUTS: &outputs_build_desktop_darwin
        - "LeapMux Desktop.app/**/*"
        - "LeapMuxDesktop_{{.VERSION}}_{{.DMG_ARCH}}.dmg"
    generates: *outputs_build_desktop_darwin
    status: *artifact_status
    cmds:
      - *forget_artifacts
      # The build-backend dependency supplies the CLI that this bundle embeds.
      - cd desktop/rust && ../../frontend/node_modules/.bin/tauri build --bundles app --config '{"version":"{{.VERSION}}"}'
      # Move sidecar from Resources/_up_/go/bin/ to MacOS/ for a cleaner bundle layout.
      - mv "desktop/rust/target/release/bundle/macos/LeapMux Desktop.app/Contents/Resources/_up_/go/bin/"* "desktop/rust/target/release/bundle/macos/LeapMux Desktop.app/Contents/MacOS/"
      - rm -rf "desktop/rust/target/release/bundle/macos/LeapMux Desktop.app/Contents/Resources/_up_"
      # Embed the CLI in Contents/MacOS/.
      # sign-macos.sh discovers this Mach-O binary and applies the same signing policy as the sidecar.
      # The sidecar finds the CLI beside os.Executable() at startup.
      - cp leapmux "desktop/rust/target/release/bundle/macos/LeapMux Desktop.app/Contents/MacOS/leapmux"
      - chmod 0755 "desktop/rust/target/release/bundle/macos/LeapMux Desktop.app/Contents/MacOS/leapmux"
      # With MACOS_CODESIGN_IDENTITY, sign nested Mach-O code before the outer app.
      # Apply Developer ID, hardened runtime, and entitlements. Otherwise, use ad-hoc signing for local development.
      # The release notarization task signs again with the same identity.
      - MACOS_ENTITLEMENTS_PATH="$(pwd)/desktop/rust/entitlements.plist" desktop/rust/scripts/sign-macos.sh "desktop/rust/target/release/bundle/macos/LeapMux Desktop.app"
      - rsync -a --delete "desktop/rust/target/release/bundle/macos/LeapMux Desktop.app/" "LeapMux Desktop.app/"
      - mkdir -p desktop/rust/target/release/bundle/dmg
      - >-
        desktop/rust/scripts/create-dmg.sh
        "{{.VERSION}}"
        "desktop/rust/target/release/bundle/macos/LeapMux Desktop.app"
        "desktop/rust/target/release/bundle/dmg/LeapMuxDesktop_{{.VERSION}}_{{.DMG_ARCH}}.dmg"
      - cp -f "desktop/rust/target/release/bundle/dmg/LeapMuxDesktop_{{.VERSION}}_{{.DMG_ARCH}}.dmg" "LeapMuxDesktop_{{.VERSION}}_{{.DMG_ARCH}}.dmg"
      - *record_artifacts

  sign-and-notarize-darwin-app:
    desc: Re-sign with Developer ID, notarize the .app and the .dmg, staple both.
    preconditions:
      - sh: '[ -n "${MACOS_CODESIGN_IDENTITY:-}" ]'
        msg: "MACOS_CODESIGN_IDENTITY must be set"
      - sh: '[ -n "${APPLE_API_KEY_P8_PATH:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_KEY_ISSUER_ID:-}" ]'
        msg: "APPLE_API_KEY_P8_PATH, APPLE_API_KEY_ID, and APPLE_API_KEY_ISSUER_ID must be set"
    vars:
      APP_PATH: '"LeapMux Desktop.app"'
      DMG_PATH: 'LeapMuxDesktop_{{.VERSION}}_{{.DMG_ARCH}}.dmg'
    cmds:
      # Re-sign every Mach-O inside the .app with Developer ID (replaces the
      # ad-hoc signature applied during build-desktop-darwin).
      - MACOS_ENTITLEMENTS_PATH="$(pwd)/desktop/rust/entitlements.plist" desktop/rust/scripts/sign-macos.sh {{.APP_PATH}}
      # notarytool requires a flat archive, but stapler cannot attach a ticket to a ZIP file.
      # Submit with --no-staple, then staple the app bundle.
      - rm -f notarize-app.zip
      - ditto -c -k --keepParent {{.APP_PATH}} notarize-app.zip
      - desktop/rust/scripts/notarize-macos.sh --no-staple notarize-app.zip
      - xcrun stapler staple {{.APP_PATH}}
      - xcrun stapler validate {{.APP_PATH}}
      - rm -f notarize-app.zip
      # Verify the embedded CLI signature separately. A discovery error in sign-macos.sh must not leave the CLI unsigned.
      # codesign --verify --strict rejects an unsigned or modified inner binary.
      # Gatekeeper assesses bundles. Its ticket belongs to the app, so spctl on the inner binary reports that it is not an app.
      # The spctl command below checks the outer app.
      # APP_PATH already includes quotes. Do not add quotes around a concatenated suffix.
      # Extra quotes split "LeapMux Desktop.app" into separate shell arguments.
      - codesign --verify --strict --verbose=2 {{.APP_PATH}}/Contents/MacOS/leapmux
      # Confirm Gatekeeper accepts the now-stapled .app before we wrap it.
      - spctl --assess --verbose --type exec {{.APP_PATH}}
      # Rebuild the DMG from the stapled .app, then sign + notarize + staple
      # the DMG itself so a downloaded image passes Gatekeeper offline.
      - desktop/rust/scripts/create-dmg.sh "{{.VERSION}}" {{.APP_PATH}} {{.DMG_PATH}}
      - codesign --force --timestamp --sign "${MACOS_CODESIGN_IDENTITY}" {{.DMG_PATH}}
      - desktop/rust/scripts/notarize-macos.sh {{.DMG_PATH}}
      - spctl --assess --verbose --type install {{.DMG_PATH}}

  sign-and-notarize-darwin-cli:
    desc: Re-sign the leapmux CLI with Developer ID, notarize, and produce the release tarball.
    preconditions:
      - sh: '[ -n "${MACOS_CODESIGN_IDENTITY:-}" ]'
        msg: "MACOS_CODESIGN_IDENTITY must be set"
      - sh: '[ -n "${APPLE_API_KEY_P8_PATH:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_KEY_ISSUER_ID:-}" ]'
        msg: "APPLE_API_KEY_P8_PATH, APPLE_API_KEY_ID, and APPLE_API_KEY_ISSUER_ID must be set"
    vars:
      BIN: leapmux
      DIR: 'leapmux_{{.VERSION}}_darwin_{{ARCH}}'
      TARBALL: 'leapmux_{{.VERSION}}_darwin_{{ARCH}}.tar.gz'
    cmds:
      # Sign the bare binary with Developer ID + hardened runtime. No
      # entitlements: the CLI server doesn't need JIT or unsigned-mem
      # like the WKWebView desktop app does.
      - codesign --force --options runtime --timestamp --sign "${MACOS_CODESIGN_IDENTITY}" {{.BIN}}
      - codesign --verify --strict --verbose=2 {{.BIN}}
      # notarytool requires a flat archive. stapler cannot attach a ticket to a raw Mach-O binary, so use --no-staple.
      # Apple stores the binary hash, and Gatekeeper checks it online on first launch.
      # A first launch offline requires a verification prompt. Only app, pkg, and dmg bundles can hold stapled tickets.
      - rm -f notarize-cli.zip
      - ditto -c -k {{.BIN}} notarize-cli.zip
      - desktop/rust/scripts/notarize-macos.sh --no-staple notarize-cli.zip
      - rm -f notarize-cli.zip
      # Package the signed binary in the release archive.
      # Set mode 0755 explicitly before tar, so signing or artifact transfer cannot leave the downloaded CLI without execute permission.
      - rm -rf dist/{{.DIR}}
      - mkdir -p dist/{{.DIR}}
      - cp {{.BIN}} LICENSE.md NOTICE.md dist/{{.DIR}}/
      - chmod 0755 dist/{{.DIR}}/{{.BIN}}
      - tar -czf {{.TARBALL}} -C dist {{.DIR}}

  build-desktop-linux:
    desc: Build desktop for Linux
    deps: [build-backend, prepare-desktop, build-desktop-sidecar]
    sources:
      - .cargo/**/*
      - desktop/rust/.cargo/**/*
      - desktop/rust/rust-toolchain*
      - versions.env
      - scripts/task-state.mjs
      - backend/go.mod
      - backend/go.sum
      - backend/**/*.go
      - desktop/go/go.mod
      - desktop/go/go.sum
      - desktop/go/**/*.go
      - exclude: desktop/go/bin/**/*
      - desktop/rust/*.rs
      - desktop/rust/src/**/*
      - desktop/rust/Cargo.*
      - desktop/rust/capabilities/**/*
      - desktop/rust/tauri.conf.json
      - desktop/rust/tauri.linux.conf.json
      - desktop/rust/desktop-template.desktop
      - desktop/rust/icons/*
      - desktop/rust/scripts/**/*
      - frontend/.output/**/*
      - backend/internal/hub/generated/frontend/public/**/*
      - leapmux
    vars:
      RUST_CONTEXT:
        sh: cd desktop/rust && rustc -vV && cargo --version
      CACHE_CONTEXT: '{{.BUILD_CONTEXT}}/{{.GO_CONTEXT}}/{{OS}}/{{ARCH}}/{{.RUST_CONTEXT}}/{{.RUSTFLAGS | default ""}}/{{.CARGO_ENCODED_RUSTFLAGS | default ""}}/{{.CARGO_BUILD_TARGET | default ""}}'
      OUTPUTS: &outputs_build_desktop_linux
        - leapmux-desktop
        - leapmux-desktop-service-*
        - leapmux-desktop*.deb
        - leapmux-desktop*.AppImage
    generates: *outputs_build_desktop_linux
    status: *artifact_status
    cmds:
      - *forget_artifacts
      # The build-backend dependency supplies ../../leapmux for tauri.linux.conf.json's deb.files entry.
      - desktop/rust/scripts/patch-linuxdeploy.sh
      - cd desktop/rust && ../../frontend/node_modules/.bin/tauri build --config '{"version":"{{.VERSION}}"}'
      # Place the AppImage binary beside the sidecar in /usr/lib/leapmux-desktop/, as the Debian package does.
      # Tauri starts with the Debian data tree, which places the app in usr/bin and the sidecar in usr/lib/leapmux-desktop/.
      # Move the app so leapmux-desktop stays outside the launcher's PATH.
      #
      # linuxdeploy's AppRun searches a fixed PATH that excludes usr/lib. An absolute Exec value instead resolves against the host filesystem.
      # Prepend the private app directory inside AppRun. AppRun.wrapped appends the inherited PATH.
      # The shared Exec=leapmux-desktop then resolves correctly, and /proc/self/exe identifies the real directory for sidecar discovery.
      # Repack the AppDir with Tauri's cached linuxdeploy plugin and replace the original AppImage.
      #
      # The grep checks must fail if linuxdeploy changes the AppRun command or the shared template changes Exec.
      # Otherwise, the substitutions could do nothing without an error.
      - |
        set -euo pipefail
        appdir="desktop/rust/target/release/bundle/appimage/leapmux-desktop.AppDir"
        src="$(ls desktop/rust/target/release/bundle/appimage/leapmux-desktop_*.AppImage)"
        # Use uname-style architecture values: x86_64/aarch64, as appimagetool and linuxdeploy do.
        # Tauri uses amd64/aarch64, so only x86 requires a filename change.
        # Debian packages retain amd64/arm64, as dpkg requires.
        img="${src%_*.AppImage}_$(uname -m).AppImage"
        grep -q '^Exec=leapmux-desktop$' "$appdir"/*.desktop
        grep -q '^exec "$this_dir"/AppRun.wrapped' "$appdir/AppRun"
        mv "$appdir/usr/bin/leapmux-desktop" "$appdir/usr/lib/leapmux-desktop/leapmux-desktop"
        sed -i 's|^exec "$this_dir"/AppRun\.wrapped|export PATH="$this_dir/usr/lib/leapmux-desktop:$PATH"  # leapmux: app binary relocated under usr/lib for .deb parity\nexec "$this_dir"/AppRun.wrapped|' "$appdir/AppRun"
        test -x "$appdir/usr/lib/leapmux-desktop/leapmux-desktop"
        test ! -e "$appdir/usr/bin/leapmux-desktop"
        grep -q 'usr/lib/leapmux-desktop:\$PATH' "$appdir/AppRun"
        plugin="${HOME}/.cache/tauri/linuxdeploy-plugin-appimage.AppImage"
        test -x "$plugin"
        # Drop Tauri's original (Debian-named on x86); repack to the uname name.
        rm -f "$src"
        ( cd "$(dirname "$img")" && ARCH="$(uname -m)" NO_APPSTREAM=1 APPIMAGE_EXTRACT_AND_RUN=1 OUTPUT="$(basename "$img")" "$plugin" --appdir leapmux-desktop.AppDir )
        test -f "$img"
      - cp -f desktop/rust/target/release/leapmux-desktop .
      - cp -f desktop/go/bin/leapmux-desktop-service-* .
      - cp -f desktop/rust/target/release/bundle/deb/leapmux-desktop*.deb .
      - cp -f desktop/rust/target/release/bundle/appimage/leapmux-desktop*.AppImage .
      # Tauri fixes the Debian app location at /usr/bin/<mainBinaryName> and offers no configuration override.
      # Move the app to /usr/lib/ so /usr/bin/leapmux remains the only CLI on PATH.
      # Change the desktop Exec entry to the absolute relocated path, because the system launcher cannot find it through PATH.
      # AppImage reaches the same layout through its private AppRun PATH because linuxdeploy resolves that Exec entry.
      # dpkg-deb -R/-b regenerates md5sums. The grep check rejects an unchanged Exec entry if the substitution stops matching.
      - |
        set -euo pipefail
        for deb in leapmux-desktop_*.deb; do
          work="$(mktemp -d)"
          dpkg-deb -R "$deb" "$work"
          mkdir -p "$work/usr/lib/leapmux-desktop"
          mv "$work/usr/bin/leapmux-desktop" "$work/usr/lib/leapmux-desktop/leapmux-desktop"
          sed -i 's#^Exec=leapmux-desktop$#Exec=/usr/lib/leapmux-desktop/leapmux-desktop#' \
            "$work/usr/share/applications/"*.desktop
          grep -q '^Exec=/usr/lib/leapmux-desktop/leapmux-desktop$' \
            "$work/usr/share/applications/"*.desktop
          dpkg-deb -b "$work" "$deb"
          rm -rf "$work"
        done
      # Read the icons back out of the repacked .deb. tauri-bundler derives each
      # destination from the PNG header and the `@2x` suffix, so a size that no
      # icon theme declares installs without an error and leaves the app with no
      # icon anywhere -- the failure that shipped as issue #387.
      - bun desktop/rust/scripts/verify-deb-icons.mjs leapmux-desktop_*.deb
      - *record_artifacts

  build-desktop-windows:
    desc: Build desktop for Windows
    deps: [build-backend, prepare-desktop, build-desktop-sidecar]
    sources:
      - .cargo/**/*
      - desktop/rust/.cargo/**/*
      - desktop/rust/rust-toolchain*
      - versions.env
      - scripts/task-state.mjs
      - backend/go.mod
      - backend/go.sum
      - backend/**/*.go
      - desktop/go/go.mod
      - desktop/go/go.sum
      - desktop/go/**/*.go
      - exclude: desktop/go/bin/**/*
      - desktop/rust/*.rs
      - desktop/rust/src/**/*
      - desktop/rust/Cargo.*
      - desktop/rust/capabilities/**/*
      - desktop/rust/tauri.conf.json
      - desktop/rust/tauri.windows.conf.json
      - desktop/rust/windows/**/*
      - desktop/rust/icons/*
      - desktop/rust/scripts/**/*
      - frontend/.output/**/*
      - backend/internal/hub/generated/frontend/public/**/*
      - leapmux.exe
    vars:
      RUST_CONTEXT:
        sh: cd desktop/rust && rustc -vV && cargo --version
      CACHE_CONTEXT: '{{.BUILD_CONTEXT}}/{{.GO_CONTEXT}}/{{OS}}/{{ARCH}}/{{.RUST_CONTEXT}}/{{.RUSTFLAGS | default ""}}/{{.CARGO_ENCODED_RUSTFLAGS | default ""}}/{{.CARGO_BUILD_TARGET | default ""}}'
      OUTPUTS: &outputs_build_desktop_windows
        - LeapMuxDesktop*.msi
        - leapmux-desktop-service-*.exe
        # run-desktop starts this executable directly.
        - desktop/rust/target/release/LeapMuxDesktop.exe
    generates: *outputs_build_desktop_windows
    status: *artifact_status
    cmds:
      - *forget_artifacts
      # The build-backend dependency supplies the CLI for the custom WiX template in desktop/rust/windows/main.wxs.
      # The template reads TAURI_LEAPMUX_CLI_PATH and TAURI_LEAPMUX_SIDECAR_PATH through WiX's environment preprocessor.
      # Tauri clears candle.exe's environment except SYSTEMROOT/TMP/TEMP and variables whose uppercase keys start with TAURI.
      # Keep that prefix, or WiX cannot resolve the paths.
      #
      # Windows CI builds only amd64, so the sidecar path uses x86_64-pc-windows-msvc.
      # Support for another architecture requires the same selection as build-desktop-sidecar.
      # Build MSI only. WiX supplies the Environment element for the per-user PATH entry.
      # Use --verbose to retain candle/light diagnostics. Without it, Tauri reports only the compiler failure.
      - |
        export TAURI_LEAPMUX_CLI_PATH="$(pwd)/leapmux.exe"
        export TAURI_LEAPMUX_SIDECAR_PATH="$(pwd)/desktop/go/bin/leapmux-desktop-service-x86_64-pc-windows-msvc.exe"
        cd desktop/rust && ../../frontend/node_modules/.bin/tauri build \
          --verbose \
          --bundles msi \
          --config '{"version":"{{.VERSION | replace "-dev" ""}}"}'
      - cp -f desktop/go/bin/leapmux-desktop-service-*.exe .
      # Tauri uses productName ("LeapMux Desktop") for the installer and appends _en-US.
      # Remove the space and locale suffix from the published filename.
      # WiX ProductVersion rejects prerelease tags, so the internal version omits -dev.
      # Restore the full VERSION in the filename to match the other platform artifacts.
      # Change to the bundle directory before expanding the glob.
      # On Windows, mvdan/sh otherwise produces paths with backslashes, and suffix removal with ${##*/} differs between parent shells.
      - |
        repo_root="$(pwd)"
        cd desktop/rust/target/release/bundle/msi
        for src in LeapMux*_en-US.msi; do
          [ -e "$src" ] || continue
          dest="${src// /}"
          dest="${dest/_en-US/}"
          dest="${dest/_{{.VERSION | replace "-dev" ""}}_/_{{.VERSION}}_}"
          cp -f "$src" "$repo_root/$dest"
        done
      - *record_artifacts

  run-desktop:
    desc: Build and run the desktop app
    preconditions:
      - sh: '[ "{{OS}}" = "darwin" ] || [ "{{OS}}" = "linux" ] || [ "{{OS}}" = "windows" ]'
        msg: "Unsupported OS: {{OS}}. Desktop runs require macOS, Linux, or Windows."
    cmds:
      - task: build-desktop
      - cmd: '"./LeapMux Desktop.app/Contents/MacOS/LeapMux Desktop" {{.CLI_ARGS}}'
        if: '[ "{{OS}}" = "darwin" ]'
      - cmd: ./leapmux-desktop {{.CLI_ARGS}}
        if: '[ "{{OS}}" = "linux" ]'
      - cmd: ./desktop/rust/target/release/LeapMuxDesktop.exe {{.CLI_ARGS}}
        if: '[ "{{OS}}" = "windows" ]'

  # --- Testing ---

  test:
    desc: Run all tests
    cmds:
      # Run schema validation first. CI has no separate lint job.
      # Every test runner must validate the schemas.
      - task: validate-json
      - task: test-scripts
      - task: test-frontend
      - task: test-backend
      - task: test-desktop

  test-scripts:
    desc: Test repository scripts
    # Bun tests repository and desktop build scripts outside the frontend Vitest project.
    # Always run these tests. They read inputs beyond their own scripts, including tool versions and license metadata.
    # They also read Tauri configuration. A partial source list could skip a required test.
    # Allow 30 seconds per test for subprocess startup and file operations on CI runners.
    cmds:
      - bun test --timeout 30000 ./scripts/ ./desktop/rust/scripts/

  test-frontend:
    desc: Run frontend tests
    cmds:
      - task: prepare-frontend
      - task: lint-frontend
      - cd frontend && bun run test {{.CLI_ARGS}}

  test-backend:
    desc: Run backend tests
    cmds:
      - task: prepare-backend
      - task: lint-backend
      - cd backend && go tool gotestsum --format pkgname-and-test-fails -- -tags integration {{.CLI_ARGS | default "./..."}}

  test-backend-race:
    desc: Run backend tests under the race detector (defaults to the CRDT + hub service packages)
    cmds:
      - task: prepare-backend
      # The race detector verifies the CRDT manager's shared generations and lock-free readers.
      # It also verifies fallback snapshots and compaction of private clones.
      # TestFallbackBaselineRacesCompaction detects in-place pruning only under -race.
      # Without the detector, that test can pass despite the race.
      - cd backend && go tool gotestsum --format pkgname-and-test-fails -- -race -count=1 {{.CLI_ARGS | default "./internal/hub/crdt/... ./internal/hub/service/..."}}

  test-backend-no-docker:
    desc: Run backend tests, excluding Docker-backed storage backends
    cmds:
      - task: prepare-backend
      - task: lint-backend
      - cd backend && go tool gotestsum --format pkgname-and-test-fails -- -tags integration $(go list -tags integration ./... | grep -vE 'internal/hub/store/(cockroachdb|mysql|postgres|tidb|yugabytedb)(/|$)')

  test-desktop:
    desc: Run desktop tests
    cmds:
      - task: prepare-desktop
      - task: lint-desktop
      - cd desktop/go && go tool gotestsum --format pkgname-and-test-fails -- -tags integration {{.CLI_ARGS | default "./..."}}
      - cd desktop/rust && cargo test

  test-no-docker:
    desc: Run all tests except Docker-backed storage backends
    cmds:
      # Exclude only storage tests that require Docker. Repository script tests require no Docker daemon.
      # Run schema validation first, as the test target does.
      - task: validate-json
      - task: test-scripts
      - task: test-frontend
      - task: test-backend-no-docker
      - task: test-desktop

  test-e2e:
    desc: Run end-to-end tests
    cmds:
      - task: prepare-frontend
      - task: lint-frontend
      - cd frontend && bun run test:e2e {{.CLI_ARGS}}

  bench-backend:
    desc: Run backend benchmarks (defaults to the CRDT package)
    cmds:
      - task: prepare-backend
      - cd backend && go test -run '^$' -bench . -benchmem {{.CLI_ARGS | default "./internal/hub/crdt/"}}

  # --- Linting ---

  lint:
    desc: Run all linters
    cmds:
      - task: lint-versions
      - task: lint-scripts
      - task: validate-json
      - task: lint-proto
      - task: lint-frontend
      - task: lint-backend
      - task: lint-desktop

  validate-json:
    desc: Validate every project-written JSON file against its schema
    # Every file that scripts/validate-json.mjs selects must resolve to a schema and conform to it.
    # The schema can be a sibling file or the shared schema that its rule specifies.
    # The selection covers contracts, test fixtures, syntax themes, and license metadata.
    # Tool-owned package files, configuration files, and lockfiles remain excluded.
    deps: [install-frontend-deps] # ajv lives in frontend/node_modules
    sources:
      - frontend/bunfig.toml
      - frontend/.npmrc
      - frontend/patches/**/*
      - versions.env
      - scripts/task-state.mjs
      - frontend/package.json
      - frontend/bun.lock
      - contracts/**/*
      - testdata/**/*
      - backend/**/testdata/**/*
      - frontend/src/lib/syntaxThemes/**/*
      - scripts/license-overrides/**/*
      - scripts/validate-json.mjs
    vars:
      OUTPUTS: []
      CACHE_CONTEXT: '{{.JS_CONTEXT}}'
    status: *artifact_status
    cmds:
      - *forget_artifacts
      - bun scripts/validate-json.mjs
      - *record_artifacts

  lint-scripts:
    desc: Lint the repository build scripts
    # The root ESLint configuration includes scripts outside frontend/.
    # It resolves the shared configuration from frontend/node_modules, so no second root package.json is necessary.
    # Running ESLint only from frontend/ would exclude these scripts as outside its base path.
    deps: [install-frontend-deps]
    sources:
      - frontend/bunfig.toml
      - frontend/.npmrc
      - frontend/patches/**/*
      - versions.env
      - scripts/task-state.mjs
      - frontend/package.json
      - frontend/bun.lock
      - scripts/*.mjs
      - desktop/rust/scripts/*.mjs
      - eslint.config.mjs
      - frontend/eslint.config.ts
    vars:
      OUTPUTS: []
      CACHE_CONTEXT: '{{.JS_CONTEXT}}'
    status: *artifact_status
    cmds:
      - *forget_artifacts
      - ./frontend/node_modules/.bin/eslint --cache --cache-strategy content --cache-location frontend/node_modules/.cache/eslint/scripts scripts/ desktop/rust/scripts/
      - *record_artifacts

  lint-versions:
    desc: Check documented tool versions against versions.env
    sources:
      - versions.env
      - scripts/task-state.mjs
      - scripts/sync-versions.mjs
      - README.md
      - site/content/docs/getting-started/installation.md
      - go.work
      - backend/go.mod
      - desktop/go/go.mod
      - site/go.mod
    vars:
      OUTPUTS: []
      CACHE_CONTEXT: '{{.JS_CONTEXT}}'
    status: *artifact_status
    cmds:
      - *forget_artifacts
      - bun scripts/sync-versions.mjs --check
      - *record_artifacts

  lint-proto:
    desc: Lint Protocol Buffer definitions
    sources:
      - versions.env
      - scripts/task-state.mjs
      - proto/**/*.proto
      - buf.yaml
    vars:
      BUF_CONTEXT:
        sh: buf --version
      OUTPUTS: []
      CACHE_CONTEXT: '{{.BUF_CONTEXT}}/{{.JS_CONTEXT}}'
    status: *artifact_status
    cmds:
      - *forget_artifacts
      - buf lint
      - *record_artifacts

  lint-frontend:
    desc: Lint frontend code
    deps: [prepare-frontend]
    sources:
      - frontend/bunfig.toml
      - frontend/.npmrc
      - versions.env
      - scripts/task-state.mjs
      - frontend/package.json
      - frontend/bun.lock
      - frontend/*config*
      - frontend/vitest*.ts
      - frontend/scripts/**/*
      - frontend/src/**/*
      - frontend/tests/**/*
      - frontend/patches/**/*
      - frontend/public/**/*
    vars:
      OUTPUTS: []
      CACHE_CONTEXT: '{{.JS_CONTEXT}}'
    status: *artifact_status
    cmds:
      - *forget_artifacts
      - cd frontend && bun run typecheck
      - cd frontend && bun run lint
      - *record_artifacts

  lint-backend:
    desc: Lint Go code
    deps: [prepare-backend]
    sources:
      - go.work.sum
      - desktop/go/go.mod
      - desktop/go/go.sum
      - versions.env
      - scripts/task-state.mjs
      - go.work
      - backend/internal/hub/store/*/db/migrations/*.sql
      - backend/internal/worker/db/migrations/*.sql
      - backend/internal/hub/generated/frontend/public/**/*
      - .golangci.yml
      - backend/go.mod
      - backend/go.sum
      - backend/**/*.go
    vars:
      OUTPUTS: []
      CACHE_CONTEXT: '{{.GO_CONTEXT}}'
    status: *artifact_status
    cmds:
      - *forget_artifacts
      - cd backend && go tool golangci-lint run ./...
      # golangci-lint checks only the host build configuration.
      # An untagged caller can compile here but fail on Windows if its callee exists only in a Unix-tagged file.
      # Cross-platform go vet checks test files also. go build omits _test.go files and cannot detect that failure.
      - cd backend && GOOS=windows go vet -tags integration ./...
      - cd backend && GOOS=linux go vet -tags integration ./...
      - cd backend && GOOS=darwin go vet -tags integration ./...
      - *record_artifacts

  lint-desktop:
    desc: Lint desktop sidecar and Tauri shell code
    deps: [prepare-desktop, build-desktop-sidecar]
    sources:
      - go.work.sum
      - backend/go.mod
      - backend/go.sum
      - .cargo/**/*
      - desktop/rust/.cargo/**/*
      - desktop/rust/rust-toolchain*
      - versions.env
      - scripts/task-state.mjs
      - backend/**/*.go
      - desktop/go/go.mod
      - desktop/go/go.sum
      - desktop/rust/tauri*.conf.json
      - desktop/rust/capabilities/**/*
      - proto/**/*
      - go.work
      - backend/internal/hub/store/*/db/migrations/*.sql
      - backend/internal/worker/db/migrations/*.sql
      - backend/internal/hub/generated/frontend/public/**/*
      - .golangci.yml
      - desktop/**/*.go
      - exclude: desktop/go/bin/**/*
      - desktop/rust/Cargo.toml
      - desktop/rust/Cargo.lock
      - desktop/rust/*.rs
      - desktop/rust/src/**/*.rs
      - exclude: desktop/rust/target/**/*
    vars:
      RUST_CONTEXT:
        sh: cd desktop/rust && rustc -vV && cargo --version
      OUTPUTS: []
      CACHE_CONTEXT: '{{.GO_CONTEXT}}/{{.RUST_CONTEXT}}/{{.RUSTFLAGS | default ""}}/{{.CARGO_ENCODED_RUSTFLAGS | default ""}}/{{.CARGO_BUILD_TARGET | default ""}}'
    status: *artifact_status
    cmds:
      - *forget_artifacts
      - cd desktop/go && go tool golangci-lint run ./...
      # Check the desktop's platform-specific files, including tests, as lint-backend does.
      - cd desktop/go && GOOS=windows go vet -tags integration ./...
      - cd desktop/go && GOOS=linux go vet -tags integration ./...
      - cd desktop/go && GOOS=darwin go vet -tags integration ./...
      - cd desktop/rust && cargo clippy --all-targets -- -D warnings
      - *record_artifacts

  lint-fix:
    desc: Auto-fix lint violations
    cmds:
      - task: lint-fix-frontend
      - task: lint-fix-backend
      - task: lint-fix-desktop

  lint-fix-frontend:
    desc: Auto-fix frontend lint violations
    cmds:
      - task: prepare-frontend
      - cd frontend && bun run lint:fix

  lint-fix-backend:
    desc: Auto-fix backend lint violations
    cmds:
      - task: prepare-backend
      - cd backend && go tool golangci-lint run --fix ./...

  lint-fix-desktop:
    desc: Auto-fix desktop lint violations
    cmds:
      - task: prepare-desktop
      - cd desktop/go && go tool golangci-lint run --fix ./...
      - cd desktop/rust && cargo clippy --fix --all-targets

  # --- Development ---

  dev:
    desc: Start all services for development
    cmds:
      - task: generate
      - task: build-backend
      - mprocs

  dev-solo:
    desc: Start solo mode for development
    cmds:
      - task: generate
      - task: build-backend
      - mprocs --config mprocs-solo.yaml

  dev-desktop:
    desc: Start desktop app for development
    cmds:
      - task: generate
      - task: build-backend
      - task: prepare-desktop
      - task: build-desktop-sidecar
      - mprocs --config mprocs-desktop.yaml

  dev-site:
    desc: Start the documentation site dev server with live reload (http://localhost:1313)
    cmds:
      # Live-reloading Hugo server via the go tool dependency (see site/go.mod).
      # GOWORK=off isolates the site module from the root go.work, and hugo
      # server overrides baseURL with the local address so links work locally.
      - cd site && GOWORK=off go tool hugo server --buildDrafts

  build-desktop-sidecar:
    desc: Build desktop sidecar binary
    deps: [prepare-backend]
    sources:
      - go.work.sum
      - versions.env
      - scripts/task-state.mjs
      - desktop/go/go.mod
      - desktop/go/go.sum
      - go.work
      - backend/internal/hub/store/*/db/migrations/*.sql
      - backend/internal/worker/db/migrations/*.sql
      - backend/internal/hub/generated/frontend/public/**/*
      - backend/go.mod
      - backend/go.sum
      - backend/**/*.{go,s,S,c,cc,cpp,cxx,h,hpp,f,F,f90,syso}
      - exclude: backend/**/*_test.go
      - desktop/go/**/*.{go,s,S,c,cc,cpp,cxx,h,hpp,f,F,f90,syso}
      - exclude: desktop/go/**/*_test.go
      - exclude: desktop/go/bin/**/*
    vars:
      SIDECAR_LDFLAGS: '{{.VERSION_LDFLAGS}}{{if eq OS "windows"}} -H=windowsgui{{end}}'
      CACHE_CONTEXT: '{{.BUILD_CONTEXT}}/{{.GO_CONTEXT}}/{{.GOOS | default ""}}/{{.GOARCH | default ""}}'
      OUTPUTS: &outputs_build_desktop_sidecar
        - desktop/go/bin/leapmux-desktop-service-*
    generates: *outputs_build_desktop_sidecar
    status: *artifact_status
    cmds:
      - *forget_artifacts
      - mkdir -p desktop/go/bin
      - |
        TARGET="{{if eq OS "darwin"}}{{if eq ARCH "arm64"}}aarch64{{else}}x86_64{{end}}-apple-darwin{{else if eq OS "linux"}}{{if eq ARCH "arm64"}}aarch64{{else}}x86_64{{end}}-unknown-linux-gnu{{else}}x86_64-pc-windows-msvc{{end}}"
        BIN="./bin/leapmux-desktop-service-${TARGET}{{if eq OS "windows"}}.exe{{end}}"
        # -H=windowsgui selects the Windows GUI subsystem, so a sidecar launch does not open a console.
        # -buildmode=pie on Linux produces an ELF layout that patchelf can modify safely.
        # linuxdeploy runs patchelf on every ELF in the AppDir.
        # For a non-PIE Go binary on aarch64, that step can remove .note.go.buildid.
        # Then ldd exits with status 1 and no diagnostic, which makes linuxdeploy fail.
        cd desktop/go && go build {{if eq OS "linux"}}-buildmode=pie {{end}}-ldflags {{.SIDECAR_LDFLAGS | shellQuote}} -o "${BIN}" .
      - *record_artifacts

  # --- Docker ---

  docker-build:
    desc: Build all Docker images
    cmds:
      - task: docker-build-alpine
      - task: docker-build-ubuntu

  docker-build-alpine:
    desc: Build Alpine Docker image
    vars:
      PLATFORM: '{{.PLATFORM | default "linux/amd64,linux/arm64"}}'
      TAG: '{{.TAG | default "leapmux:latest"}}'
    cmds:
      - >-
        docker buildx build
        --platform {{.PLATFORM}}
        --build-arg BASE_IMAGE={{.ALPINE_IMAGE}}
        --build-arg BUF_VERSION={{.BUF_VERSION}}
        --build-arg TASK_VERSION={{.TASK_VERSION}}
        --build-arg S6_OVERLAY_VERSION={{.S6_OVERLAY_VERSION}}
        --build-arg BUN_VERSION={{.BUN_VERSION}}
        --build-arg NODE_VERSION={{.NODE_VERSION}}
        --build-arg GOLANG_VERSION={{.GOLANG_VERSION}}
        --build-arg VERSION={{.VERSION}}
        --build-arg COMMIT_HASH={{.COMMIT_HASH}}
        --build-arg COMMIT_TIME={{.COMMIT_TIME}}
        -f docker/Dockerfile
        -t {{.TAG}}
        .

  docker-build-ubuntu:
    desc: Build Ubuntu Docker image
    vars:
      PLATFORM: '{{.PLATFORM | default "linux/amd64,linux/arm64"}}'
      TAG: '{{.TAG | default "leapmux:ubuntu"}}'
    cmds:
      - >-
        docker buildx build
        --platform {{.PLATFORM}}
        --build-arg BASE_IMAGE={{.UBUNTU_IMAGE}}
        --build-arg BUF_VERSION={{.BUF_VERSION}}
        --build-arg TASK_VERSION={{.TASK_VERSION}}
        --build-arg S6_OVERLAY_VERSION={{.S6_OVERLAY_VERSION}}
        --build-arg BUN_VERSION={{.BUN_VERSION}}
        --build-arg NODE_VERSION={{.NODE_VERSION}}
        --build-arg GOLANG_VERSION={{.GOLANG_VERSION}}
        --build-arg VERSION={{.VERSION}}
        --build-arg COMMIT_HASH={{.COMMIT_HASH}}
        --build-arg COMMIT_TIME={{.COMMIT_TIME}}
        -f docker/Dockerfile
        -t {{.TAG}}
        .

  # --- Notice ---

  generate-notice:
    desc: Generate third-party license notice
    # collectGoDeps runs go list -deps -test ./..., which loads every package.
    # It requires the generated SQL code and embedded frontend assets.
    # Without prepare-backend, a clean checkout fails on a missing generated package or the absent public directory for go:embed.
    # This dependency also builds the frontend. The CI path filter limits that cost to relevant changes.
    deps: [prepare-backend]
    sources:
      - frontend/bunfig.toml
      - frontend/.npmrc
      - frontend/patches/**/*
      - versions.env
      - scripts/task-state.mjs
      - scripts/generate-notice.mjs
      - scripts/license-overrides/**/*
      # The generator reads go.work's use list and runs go list -m -json all across those modules.
      # Adding or removing a module changes the licenses in NOTICE.
      - go.work
      - go.work.sum
      - backend/go.mod
      - backend/go.sum
      - desktop/go/go.mod
      - desktop/go/go.sum
      - desktop/rust/Cargo.toml
      - desktop/rust/Cargo.lock
      - frontend/package.json
      - frontend/bun.lock
    vars:
      OUTPUTS: &outputs_generate_notice
        - NOTICE.md
        - NOTICE.html
    generates: *outputs_generate_notice
    status: *artifact_status
    cmds:
      - *forget_artifacts
      - bun scripts/generate-notice.mjs
      - *record_artifacts

  # --- Documentation site ---

  site:
    desc: Generate the static documentation web site (Hugo + Hextra)
    sources:
      - versions.env
      - scripts/task-state.mjs
      - site/go.sum
      - site/archetypes/**/*
      - site/data/**/*
      - site/config/**/*
      - site/hugo.yaml
      - site/go.mod
      - site/content/**/*
      - site/static/**/*
      - site/layouts/**/*
      - site/assets/**/*
      - site/i18n/**/*
    vars:
      HUGO_CONTEXT:
        sh: >-
          bun -e 'console.log(JSON.stringify(Object.fromEntries(Object.entries(process.env).filter(([key]) => key.startsWith("HUGO_")).sort(([a], [b]) => a.localeCompare(b)))))'
      CACHE_CONTEXT: '{{.GO_CONTEXT}}/{{.HUGO_CONTEXT}}'
      OUTPUTS: &outputs_site
        - site/public/**/*
    generates: *outputs_site
    status: *artifact_status
    cmds:
      - *forget_artifacts
      # Run Hugo through the tool dependency in site/go.mod.
      # GOWORK=off keeps the site's dependency graph outside the root workspace.
      # --cleanDestinationDir removes obsolete assets whose content hashes changed.
      - cd site && GOWORK=off go tool hugo --gc --minify --cleanDestinationDir
      - *record_artifacts

  # --- Clean ---

  clean:
    desc: Remove all build artifacts
    cmds:
      - task: clean-desktop
      - task: clean-backend
      - task: clean-frontend
      - rm -f *.log */*.log
      - rm -rf .task/

  clean-frontend:
    desc: Remove frontend build artifacts
    cmds:
      - rm -rf frontend/.output/
      - rm -rf frontend/.vinxi/
      - rm -f  frontend/public/NOTICE.html
      - rm -rf frontend/public/icons/
      - rm -rf frontend/src/spinners/
      - rm -rf frontend/node_modules/
      - rm -rf frontend/generated/
      - rm -rf frontend/*/generated/
      - rm -rf frontend/*/*/generated/
      - rm -rf frontend/*/*/*/generated/
      - rm -rf frontend/*/*/*/*/generated/

  clean-backend:
    desc: Remove backend build artifacts
    cmds:
      - rm -f  leapmux leapmux.exe
      - rm -f  backend/leapmux backend/leapmux.exe
      - rm -rf backend/generated/
      - rm -rf backend/*/generated/
      - rm -rf backend/*/*/generated/
      - rm -rf backend/*/*/*/generated/
      - rm -rf backend/*/*/*/*/generated/

  clean-desktop:
    desc: Remove desktop build artifacts
    cmds:
      - rm -f  LeapMux*.dmg
      - rm -rf LeapMux*.app
      - rm -f  leapmux-desktop
      - rm -f  leapmux-desktop-service-*
      - rm -f  leapmux-desktop*.deb
      - rm -f  leapmux-desktop*.AppImage
      - rm -f  LeapMux*.msi
      - rm -f  desktop/go/leapmux-desktop desktop/go/leapmux-desktop.exe
      - rm -rf desktop/go/bin/
      - rm -rf desktop/rust/gen/
      - rm -rf desktop/rust/icons/
      - rm -rf desktop/rust/src/generated/
      - rm -rf desktop/rust/target/
