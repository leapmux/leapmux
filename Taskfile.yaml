version: '3'

run: once

# Tool and image versions are centralized in versions.env. Task's dotenv
# support exposes each KEY=VALUE both as a template variable ({{.KEY}})
# and as a shell environment variable ($KEY). Existing environment
# variables take precedence over the file, so e.g. `VERSION=1.2.3 task
# build` still overrides the pinned release version.
dotenv: ['versions.env']

vars:
  # Respect VERSION from the environment when set (for CI overrides),
  # otherwise fall back to the value loaded from versions.env. Task's
  # dotenv only propagates into command shells, so we have to bounce
  # through a shell here and let {{.VERSION}} expand to the dotenv
  # default before the parameter expansion runs.
  VERSION:
    sh: echo "${VERSION:-{{.VERSION}}}"
  COMMIT_HASH:
    sh: echo "${COMMIT_HASH:-$(git rev-parse --short HEAD 2>/dev/null)}"
  COMMIT_TIME:
    sh: echo "${COMMIT_TIME:-$(git log -1 --format=%cI 2>/dev/null)}"
  BUILD_TIME:
    sh: echo "${BUILD_TIME:-{{dateInZone `2006-01-02T15:04:05Z` now `UTC`}}}"
  # BRANCH is the git branch name embedded in the binary so the version
  # banner / AboutDialog can show which dev build is running. Prefer an
  # environment override (CI can pass github.head_ref, etc.); fall back
  # to the current branch; leave empty for detached HEAD (tag builds,
  # ad-hoc SHA checkouts). The version package hides an empty branch,
  # so detached / release builds get a clean banner.
  BRANCH:
    sh: echo "${BRANCH:-$(git symbolic-ref --short HEAD 2>/dev/null)}"
  VERSION_LDFLAGS: >-
    -X github.com/leapmux/leapmux/util/version.Value={{.VERSION}}
    -X github.com/leapmux/leapmux/util/version.CommitHash={{.COMMIT_HASH}}
    -X github.com/leapmux/leapmux/util/version.CommitTime={{.COMMIT_TIME}}
    -X github.com/leapmux/leapmux/util/version.BuildTime={{.BUILD_TIME}}
    -X github.com/leapmux/leapmux/util/version.Branch={{.BRANCH}}
  # macOS .app/.dmg bundles use Apple's arch names (arm64 / x86_64), while
  # Task's built-in {{ARCH}} is Go-style (arm64 / amd64); remap the x86 token
  # for the bundle filename (arm64 is identical under both). Defined globally
  # because both build-desktop-darwin and sign-and-notarize-darwin-app
  # reference the DMG by name. The Go server tarball keeps {{ARCH}} -- a Go
  # CLI archive follows Go's convention, not Apple's.
  DMG_ARCH: '{{if eq ARCH "amd64"}}x86_64{{else}}{{ARCH}}{{end}}'

# --- Code Generation ---

tasks:
  generate:
    desc: Generate all code
    # proto, contracts, and spinners read no each other's OUTPUT (contracts
    # runs its own local `buf build` from proto/ and reads no proto output),
    # so they run as parallel deps; sqlc needs generate-proto's output and
    # declares that dep itself. generate-contracts also resolves ajv from
    # frontend/node_modules and carries that install dep itself.
    deps:
      - generate-proto
      - generate-contracts
      - generate-spinners
    cmds:
      - task: generate-sqlc

  sync-versions:
    desc: Rewrite documented tool versions from versions.env
    # Everything that can read versions.env already does (this file's dotenv,
    # the workflows' $GITHUB_ENV splat, the Dockerfile's ARGs). Prose in
    # README.md and the docs site, and the `go` directive in each go.mod, have
    # nowhere to put a variable -- so they are rewritten from it instead, and
    # `lint-versions` fails the build if one drifts.
    #
    # Deliberately NOT fingerprinted. This is the remediation `lint-versions`
    # prints, and it rewrites files that are not its own sources: with
    # `sources:` and no `generates:`, hand-editing a claim site left the target
    # "up to date", so the one command that fixes the drift refused to run
    # while lint stayed red. It is a bun script over six small files.
    cmds:
      - bun scripts/sync-versions.mjs

  generate-proto:
    desc: Generate Protocol Buffer code
    sources:
      - proto/**/*
      - buf.gen.yaml
      - buf.yaml
      - scripts/sync-generated.mjs
    generates:
      - backend/generated/proto/**/*
      - frontend/src/generated/**/*
    cmds:
      # The proto tree moved from frontend/src/generated/leapmux/ to
      # frontend/src/generated/proto/; sync-generated prunes only inside its
      # --out roots, so a checkout built before the move keeps a stale
      # duplicate that tsconfig and eslint still scan. Delete it here until
      # no such checkout remains.
      - rm -rf frontend/src/generated/leapmux
      # Regenerate into a throwaway staging dir, then publish with
      # scripts/sync-generated.mjs so byte-identical files keep their mtime and a
      # running Vite dev server (which watches frontend/src/**) does not
      # hard-refresh. buf's -o prepends the staging path to each plugin `out:`
      # dir (see buf.gen.yaml), so both output trees are mirrored under {STAGING}.
      - >-
        bun scripts/sync-generated.mjs
        --out backend/generated/proto backend/generated/proto
        --out frontend/src/generated/proto frontend/src/generated/proto
        -- buf generate -o {STAGING}

  generate-contracts:
    desc: Generate Go and TS constants from contracts/*.json
    # contracts/ is the single source of truth for every value consumed on
    # both sides of a language boundary (channelwire limits, HTTP headers,
    # retry policies, enum-keyed catalogs). The generator validates each
    # contract against its sibling JSON Schema and cross-checks enum-keyed
    # domains against the buf descriptors BEFORE emitting, so drift fails
    # generation instead of surviving to a pin test. Every registered domain
    # must ship its contracts/<name>.json: a missing file fails generation
    # loudly (the migration is complete; a skip would orphan outputs).
    # The proto files are sources because the enum cross-checks read them;
    # buf itself is invoked by the generator (local build only, no plugins).
    # validate-json.mjs is a source because the generator imports it (the
    # pre-emit schema validation); sync-generated.mjs because the cmd runs it.
    sources:
      - contracts/**/*
      - scripts/generate-contracts.mjs
      - scripts/validate-json.mjs
      - scripts/sync-generated.mjs
      - proto/leapmux/v1/agent.proto
      - proto/leapmux/v1/scope.proto
    generates:
      - backend/generated/contracts/**/*
      - frontend/src/generated/contracts/**/*
      - desktop/rust/src/generated/**/*
    deps: [install-frontend-deps] # the generator resolves ajv from frontend/node_modules
    cmds:
      # Same staging/publish pattern as generate-proto: mtime-preserving so a
      # running Vite dev server does not hard-refresh on identical output.
      - >-
        bun scripts/sync-generated.mjs
        --out backend/generated/contracts backend/generated/contracts
        --out frontend/src/generated/contracts frontend/src/generated/contracts
        --out desktop/rust/src/generated desktop/rust/src/generated
        -- bun scripts/generate-contracts.mjs --staging {STAGING}

  generate-conformance-corpus:
    desc: Regenerate the differential CRDT conformance corpus (deliberate; not part of test runs)
    deps: [generate-proto]
    cmds:
      # Deliberately NOT wired into `generate` or any test target. The corpus
      # records the Go projection's answers, so regenerating it as a side effect
      # of running tests would rubber-stamp exactly the drift it exists to catch.
      # Run this only when you have changed the generator, and review the
      # resulting expectation diff.
      - cd backend && go run ./internal/hub/crdt/internal/genconformance ../testdata/crdt_projection_corpus.json

  generate-sqlc:
    desc: Generate all type-safe SQL code
    deps: [generate-sqlc-hub, generate-sqlc-worker]

  generate-sqlc-hub:
    desc: Generate type-safe SQL code for Hub
    deps: [generate-proto]
    vars:
      BACKENDS: sqlite postgres mysql
    sources:
      - backend/generated/proto/**/*
      - backend/internal/hub/store/*/sqlc.yaml
      - backend/internal/hub/store/*/db/**/*.sql
    generates:
      - backend/internal/hub/store/*/generated/db/**/*
    cmds:
      # Regenerate into a staging dir under backend/, then publish via
      # scripts/sync-generated.mjs so unchanged files keep their mtime and
      # orphaned files (from a deleted query .sql) are still pruned. sqlc must
      # run inside the Go module for `go tool` to resolve it and has no
      # output-dir override, so staging lives under backend/ (--base, --cwd-staging)
      # and we copy the config + db inputs in so its relative `out: generated/db`
      # lands there.
      - for: { var: BACKENDS }
        cmd: >-
          bun scripts/sync-generated.mjs --base backend --cwd-staging
          --copy backend/internal/hub/store/{{.ITEM}}/sqlc.yaml sqlc.yaml
          --copy backend/internal/hub/store/{{.ITEM}}/db db
          --out generated/db backend/internal/hub/store/{{.ITEM}}/generated/db
          -- go tool sqlc generate

  generate-sqlc-worker:
    desc: Generate type-safe SQL code for Worker
    deps: [generate-proto]
    sources:
      - backend/generated/proto/**/*
      - backend/internal/worker/sqlc.yaml
      - backend/internal/worker/db/**/*.sql
    generates:
      - backend/internal/worker/generated/db/**/*
    cmds:
      # See generate-sqlc-hub for the staging rationale.
      - >-
        bun scripts/sync-generated.mjs --base backend --cwd-staging
        --copy backend/internal/worker/sqlc.yaml sqlc.yaml
        --copy backend/internal/worker/db db
        --out generated/db backend/internal/worker/generated/db
        -- go tool sqlc generate

  generate-spinners:
    desc: Download spinner verb JSON files from awesome-claude-spinners
    vars:
      CACHE_DIR:
        sh: echo "${HOME:-$USERPROFILE}/.cache/awesome-claude-spinners"
    generates:
      - frontend/src/spinners/**/*
    status:
      - test -d frontend/src/spinners
    cmds:
      - |
        if [ ! -d "{{.CACHE_DIR}}" ]; then
          git clone --depth 1 https://github.com/AlexPl292/awesome-claude-spinners "{{.CACHE_DIR}}"
        fi
      # Publish via scripts/sync-generated.mjs so unchanged spinner files keep
      # their mtime (no dev-server reload) and removed spinners are pruned,
      # instead of deleting and re-copying the whole tree every run. There is no
      # generator here: --copy stages the cached spinners and --out publishes them.
      # CACHE_DIR is an absolute Windows path (backslashes from $HOME); quote it
      # so Task's POSIX shell does not strip the backslashes as escape chars.
      - >-
        bun scripts/sync-generated.mjs
        --copy "{{.CACHE_DIR}}/spinners" spinners
        --out spinners frontend/src/spinners

  # --- Preparation ---

  prepare:
    desc: Prepare all modules for builds
    cmds:
      - task: prepare-frontend
      - task: prepare-backend
      - task: prepare-desktop

  # Install-only slice of prepare-frontend: scripts that resolve tooling from
  # frontend/node_modules (validate-json's ajv, lint-scripts' eslint) dep on
  # THIS, not the whole prepare chain -- a contract edit must not re-run icon
  # rendering before a 0.1s validation.
  install-frontend-deps:
    desc: Install frontend node modules
    sources:
      - frontend/package.json
      - frontend/bun.lock
    generates:
      - frontend/node_modules/**/*
    cmds:
      - cd frontend && bun install

  prepare-frontend:
    desc: Prepare frontend for builds
    sources:
      - proto/**/*
      - buf.gen.yaml
      - buf.yaml
      - contracts/**/*
      - scripts/generate-contracts.mjs
      - scripts/validate-json.mjs
      - scripts/sync-generated.mjs
      - NOTICE.html
      - icons/leapmux-icon.svg
      - icons/leapmux-icon-square.svg
      - frontend/package.json
      - frontend/bun.lock
      - frontend/scripts/**/*
      - scripts/build-ico.mjs
      - scripts/render-icon.mjs
      - scripts/icon-corners.mjs
      - frontend/src/generated/**/*
    generates:
      - frontend/node_modules/**/*
      - frontend/public/NOTICE.html
      - frontend/public/icons/leapmux-icon.ico
      - frontend/public/icons/leapmux-icon.svg
      - frontend/public/icons/leapmux-icon-192.png
      - frontend/public/icons/leapmux-icon-512.png
      - frontend/public/icons/leapmux-icon-maskable-512.png
      - frontend/public/icons/leapmux-icon-square-apple-touch.png
    cmds:
      - task: generate-proto
      - task: generate-contracts
      - task: generate-spinners
      - cd frontend && bun install
      - NODE_PATH=frontend/node_modules bun frontend/scripts/generate-icons.mjs icons/leapmux-icon.svg icons/leapmux-icon-square.svg frontend/public
      - "[ -a NOTICE.html ] && cp NOTICE.html frontend/public/NOTICE.html || true"

  prepare-backend:
    desc: Prepare backend for builds
    sources:
      - proto/**/*
      - buf.gen.yaml
      - buf.yaml
      - contracts/**/*
      - scripts/generate-contracts.mjs
      - scripts/validate-json.mjs
      - scripts/sync-generated.mjs
      - backend/internal/hub/frontend.embed
      - frontend/.output/public/**/*
      - backend/generated/proto/**/*
      - backend/internal/hub/store/*/generated/db/**/*
      - backend/internal/worker/generated/db/**/*
    generates:
      - backend/internal/hub/generated/frontend/embed.go
      - backend/internal/hub/generated/frontend/public/**/*
    cmds:
      - task: generate-proto
      - task: generate-contracts
      - task: generate-sqlc
      - task: build-frontend
      - rm -rf backend/internal/hub/generated/frontend/public
      - mkdir -p backend/internal/hub/generated/frontend/public
      - cp backend/internal/hub/frontend.embed backend/internal/hub/generated/frontend/embed.go
      - cp -r frontend/.output/public/. backend/internal/hub/generated/frontend/public/

  prepare-desktop:
    desc: Prepare desktop for builds
    preconditions:
      - sh: '[ "{{OS}}" = "darwin" ] || [ "{{OS}}" = "linux" ] || [ "{{OS}}" = "windows" ]'
        msg: "Unsupported OS: {{OS}}. Desktop builds require macOS, Linux, or Windows."
    sources:
      - proto/**/*
      - buf.gen.yaml
      - buf.yaml
      - contracts/**/*
      - scripts/generate-contracts.mjs
      - scripts/validate-json.mjs
      - scripts/sync-generated.mjs
      - icons/leapmux-icon-square.svg
      - icons/leapmux-icon.svg
      - desktop/rust/scripts/**/*
      - scripts/build-ico.mjs
      - scripts/render-icon.mjs
      - scripts/icon-corners.mjs
      - frontend/.output/**/*
      - backend/internal/hub/generated/frontend/public/**/*
    generates:
      # The set that desktop/rust/scripts/icon-set.mjs defines.
      - desktop/rust/icons/*.png
      - desktop/rust/icons/icon.ico
    cmds:
      - task: generate-proto
      # The Rust shell include!'s the generated contracts module at compile
      # time, so the desktop build needs it on disk before cargo runs.
      - task: generate-contracts
      - task: build-frontend
      - task: prepare-backend
      # macOS renders the square source, because the system applies its own mask
      # and a rounded icon would show the corner twice. Linux and Windows draw
      # the icon as authored, so they render the rounded source.
      - cmd: NODE_PATH=frontend/node_modules bun desktop/rust/scripts/generate-icons.mjs icons/leapmux-icon-square.svg icons/leapmux-icon.svg desktop/rust/icons opaque
        if: '[ "{{OS}}" = "darwin" ]'
      - cmd: NODE_PATH=frontend/node_modules bun desktop/rust/scripts/generate-icons.mjs icons/leapmux-icon.svg icons/leapmux-icon.svg desktop/rust/icons transparent
        if: '[ "{{OS}}" = "linux" ] || [ "{{OS}}" = "windows" ]'

  # --- Build ---

  build:
    desc: Build all modules
    cmds:
      - task: build-frontend
      - task: build-backend
      - task: build-desktop

  build-frontend:
    desc: Build frontend
    sources:
      - proto/**/*
      - buf.gen.yaml
      - buf.yaml
      - frontend/package.json
      - frontend/bun.lock
      - frontend/*config*
      - frontend/scripts/**/*
      - frontend/src/**/*
      - frontend/tests/**/*
      - frontend/patches/**/*
      - frontend/public/**/*
    generates:
      - frontend/.output/**/*
      - frontend/.vinxi/**/*
    cmds:
      - task: prepare-frontend
      - cd frontend && LEAPMUX_VERSION={{.VERSION}} LEAPMUX_COMMIT_HASH={{.COMMIT_HASH}} LEAPMUX_COMMIT_TIME={{.COMMIT_TIME}} LEAPMUX_BUILD_TIME={{.BUILD_TIME}} LEAPMUX_BRANCH={{.BRANCH}} bun run build

  build-backend:
    desc: Build backend
    sources:
      - proto/**/*
      - buf.gen.yaml
      - buf.yaml
      - backend/go.mod
      - backend/go.sum
      - backend/**/*.go
      - backend/internal/hub/generated/frontend/public/**/*
    generates:
      - leapmux{{if eq OS "windows"}}.exe{{end}}
    cmds:
      - task: prepare-backend
      - cd backend && go build -ldflags "{{.VERSION_LDFLAGS}}" -o ../leapmux{{if eq OS "windows"}}.exe{{end}} ./cmd/leapmux

  build-backend-docker:
    desc: Build backend for Docker images
    sources:
      - backend/go.mod
      - backend/go.sum
      - backend/**/*.go
      - backend/internal/hub/generated/frontend/public/**/*
    generates:
      - leapmux
    cmds:
      - task: prepare-backend
      - |
        CGO_ENABLED=0
        GOOS={{.GOOS | default "linux"}} GOARCH={{.GOARCH | default "amd64"}}
        cd backend && go build -ldflags "-s -w {{.VERSION_LDFLAGS}}" -o ../leapmux ./cmd/leapmux

  build-desktop:
    desc: Build desktop
    preconditions:
      - sh: '[ "{{OS}}" = "darwin" ] || [ "{{OS}}" = "linux" ] || [ "{{OS}}" = "windows" ]'
        msg: "Unsupported OS: {{OS}}. Desktop builds require macOS, Linux, or Windows."
    cmds:
      - task: build-desktop-darwin
        if: '[ "{{OS}}" = "darwin" ]'
      - task: build-desktop-linux
        if: '[ "{{OS}}" = "linux" ]'
      - task: build-desktop-windows
        if: '[ "{{OS}}" = "windows" ]'

  build-desktop-darwin:
    desc: Build desktop for macOS
    sources:
      - backend/go.mod
      - backend/go.sum
      - backend/**/*.go
      - desktop/go/go.mod
      - desktop/go/go.sum
      - desktop/go/**/*.go
      - exclude: desktop/go/bin/**/*
      - desktop/rust/*.rs
      - desktop/rust/src/**/*
      - desktop/rust/Cargo.*
      - desktop/rust/capabilities/**/*
      - desktop/rust/tauri.conf.json
      - desktop/rust/entitlements.plist
      - desktop/rust/icons/*
      - desktop/rust/scripts/**/*
      - frontend/.output/**/*
      - backend/internal/hub/generated/frontend/public/**/*
      - leapmux
    generates:
      - "LeapMux Desktop.app/**/*"
      - "LeapMuxDesktop_{{.VERSION}}_{{.DMG_ARCH}}.dmg"
    cmds:
      # build-backend isn't implied by build-desktop-darwin on its own (only
      # by the top-level `task build`), but the cp step below embeds the CLI
      # into the .app bundle, so leapmux must exist at the repo root first.
      - task: build-backend
      - task: prepare-desktop
      - task: build-desktop-sidecar
      - cd desktop/rust && ../../frontend/node_modules/.bin/tauri build --bundles app --config '{"version":"{{.VERSION}}"}'
      # Move sidecar from Resources/_up_/go/bin/ to MacOS/ for a cleaner bundle layout.
      - mv "desktop/rust/target/release/bundle/macos/LeapMux Desktop.app/Contents/Resources/_up_/go/bin/"* "desktop/rust/target/release/bundle/macos/LeapMux Desktop.app/Contents/MacOS/"
      - rm -rf "desktop/rust/target/release/bundle/macos/LeapMux Desktop.app/Contents/Resources/_up_"
      # Embed the leapmux CLI inside Contents/MacOS/. The inside-out
      # signing sweep in sign-macos.sh discovers it as a Mach-O and applies
      # Developer ID + hardened runtime alongside the sidecar; the runtime
      # PATH check in the Go sidecar resolves it via
      # filepath.Join(filepath.Dir(os.Executable()), "leapmux") at startup.
      - cp leapmux "desktop/rust/target/release/bundle/macos/LeapMux Desktop.app/Contents/MacOS/leapmux"
      - chmod 0755 "desktop/rust/target/release/bundle/macos/LeapMux Desktop.app/Contents/MacOS/leapmux"
      # Sign the .app. With MACOS_CODESIGN_IDENTITY set, sign-macos.sh applies
      # Developer ID + hardened runtime + entitlements to nested Mach-O code
      # inside-out; without it, falls back to ad-hoc signing for local dev.
      # `sign-and-notarize-darwin-app` re-runs this with the same identity later
      # when notarizing for release.
      - MACOS_ENTITLEMENTS_PATH="$(pwd)/desktop/rust/entitlements.plist" desktop/rust/scripts/sign-macos.sh "desktop/rust/target/release/bundle/macos/LeapMux Desktop.app"
      - rsync -a --delete "desktop/rust/target/release/bundle/macos/LeapMux Desktop.app/" "LeapMux Desktop.app/"
      - cd frontend/node_modules/macos-alias && npx --yes node-gyp rebuild 2>/dev/null || true
      - mkdir -p desktop/rust/target/release/bundle/dmg
      - >-
        desktop/rust/scripts/create-dmg.sh
        "{{.VERSION}}"
        "desktop/rust/target/release/bundle/macos/LeapMux Desktop.app"
        "desktop/rust/target/release/bundle/dmg/LeapMuxDesktop_{{.VERSION}}_{{.DMG_ARCH}}.dmg"
      - cp -f "desktop/rust/target/release/bundle/dmg/LeapMuxDesktop_{{.VERSION}}_{{.DMG_ARCH}}.dmg" "LeapMuxDesktop_{{.VERSION}}_{{.DMG_ARCH}}.dmg"

  sign-and-notarize-darwin-app:
    desc: Re-sign with Developer ID, notarize the .app and the .dmg, staple both.
    preconditions:
      - sh: '[ -n "${MACOS_CODESIGN_IDENTITY:-}" ]'
        msg: "MACOS_CODESIGN_IDENTITY must be set"
      - sh: '[ -n "${APPLE_API_KEY_P8_PATH:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_KEY_ISSUER_ID:-}" ]'
        msg: "APPLE_API_KEY_P8_PATH, APPLE_API_KEY_ID, and APPLE_API_KEY_ISSUER_ID must be set"
    vars:
      APP_PATH: '"LeapMux Desktop.app"'
      DMG_PATH: 'LeapMuxDesktop_{{.VERSION}}_{{.DMG_ARCH}}.dmg'
    cmds:
      # Re-sign every Mach-O inside the .app with Developer ID (replaces the
      # ad-hoc signature applied during build-desktop-darwin).
      - MACOS_ENTITLEMENTS_PATH="$(pwd)/desktop/rust/entitlements.plist" desktop/rust/scripts/sign-macos.sh {{.APP_PATH}}
      # Notarize the .app: notarytool submit needs a flat archive, but
      # `stapler` cannot staple a .zip — it has to staple the .app itself.
      # So submit with --no-staple, then staple the bundle directly.
      - rm -f notarize-app.zip
      - ditto -c -k --keepParent {{.APP_PATH}} notarize-app.zip
      - desktop/rust/scripts/notarize-macos.sh --no-staple notarize-app.zip
      - xcrun stapler staple {{.APP_PATH}}
      - xcrun stapler validate {{.APP_PATH}}
      - rm -f notarize-app.zip
      # Explicit assertion that the inside-out signer actually picked up the
      # embedded leapmux CLI binary. Without this check, a regression in
      # sign-macos.sh's Mach-O discovery could silently ship an unsigned
      # CLI inside an otherwise-notarized .app. `codesign --verify --strict`
      # fails if the inner binary is unsigned or tampered with, so it's the
      # right tool here; an `spctl --assess --type exec` on the inner Mach-O
      # would instead fail with "the code is valid but does not seem to be
      # an app" because Gatekeeper's assessment is bundle-scoped and the
      # notarization staple lives on the .app, not on individual inner
      # binaries — the outer `spctl --assess` below covers that.
      # APP_PATH already wraps the bundle name in quotes (see vars: above),
      # so concatenating a literal path tail must NOT re-wrap in quotes —
      # `"{{.APP_PATH}}/...` would expand to `""LeapMux Desktop.app"/...`,
      # which the shell parses as two arguments (`LeapMux` and the rest).
      - codesign --verify --strict --verbose=2 {{.APP_PATH}}/Contents/MacOS/leapmux
      # Confirm Gatekeeper accepts the now-stapled .app before we wrap it.
      - spctl --assess --verbose --type exec {{.APP_PATH}}
      # Rebuild the DMG from the stapled .app, then sign + notarize + staple
      # the DMG itself so a downloaded image passes Gatekeeper offline.
      - desktop/rust/scripts/create-dmg.sh "{{.VERSION}}" {{.APP_PATH}} {{.DMG_PATH}}
      - codesign --force --timestamp --sign "${MACOS_CODESIGN_IDENTITY}" {{.DMG_PATH}}
      - desktop/rust/scripts/notarize-macos.sh {{.DMG_PATH}}
      - spctl --assess --verbose --type install {{.DMG_PATH}}

  sign-and-notarize-darwin-cli:
    desc: Re-sign the leapmux CLI with Developer ID, notarize, and produce the release tarball.
    preconditions:
      - sh: '[ -n "${MACOS_CODESIGN_IDENTITY:-}" ]'
        msg: "MACOS_CODESIGN_IDENTITY must be set"
      - sh: '[ -n "${APPLE_API_KEY_P8_PATH:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_KEY_ISSUER_ID:-}" ]'
        msg: "APPLE_API_KEY_P8_PATH, APPLE_API_KEY_ID, and APPLE_API_KEY_ISSUER_ID must be set"
    vars:
      BIN: leapmux
      DIR: 'leapmux_{{.VERSION}}_darwin_{{ARCH}}'
      TARBALL: 'leapmux_{{.VERSION}}_darwin_{{ARCH}}.tar.gz'
    cmds:
      # Sign the bare binary with Developer ID + hardened runtime. No
      # entitlements: the CLI server doesn't need JIT or unsigned-mem
      # like the WKWebView desktop app does.
      - codesign --force --options runtime --timestamp --sign "${MACOS_CODESIGN_IDENTITY}" {{.BIN}}
      - codesign --verify --strict --verbose=2 {{.BIN}}
      # Notarize. notarytool needs a flat archive; `stapler` does not
      # support raw Mach-O binaries, so we always pass --no-staple.
      # Apple's notary database registers the binary's hash and
      # Gatekeeper looks it up online at first launch; offline first
      # launch shows a one-time verify prompt (unavoidable for raw
      # binaries — only .app/.pkg/.dmg can carry stapled tickets).
      - rm -f notarize-cli.zip
      - ditto -c -k {{.BIN}} notarize-cli.zip
      - desktop/rust/scripts/notarize-macos.sh --no-staple notarize-cli.zip
      - rm -f notarize-cli.zip
      # Re-package the signed binary into the release tarball. Explicit
      # `chmod 0755` is belt-and-braces: codesign / ditto / artifact
      # round-trips should all preserve the executable bit, but assert
      # it before tar so the downloaded tarball always launches.
      - rm -rf dist/{{.DIR}}
      - mkdir -p dist/{{.DIR}}
      - cp {{.BIN}} LICENSE.md NOTICE.md dist/{{.DIR}}/
      - chmod 0755 dist/{{.DIR}}/{{.BIN}}
      - tar -czf {{.TARBALL}} -C dist {{.DIR}}

  build-desktop-linux:
    desc: Build desktop for Linux
    sources:
      - backend/go.mod
      - backend/go.sum
      - backend/**/*.go
      - desktop/go/go.mod
      - desktop/go/go.sum
      - desktop/go/**/*.go
      - exclude: desktop/go/bin/**/*
      - desktop/rust/*.rs
      - desktop/rust/src/**/*
      - desktop/rust/Cargo.*
      - desktop/rust/capabilities/**/*
      - desktop/rust/tauri.conf.json
      - desktop/rust/tauri.linux.conf.json
      - desktop/rust/desktop-template.desktop
      - desktop/rust/icons/*
      - desktop/rust/scripts/**/*
      - frontend/.output/**/*
      - backend/internal/hub/generated/frontend/public/**/*
      - leapmux
    generates:
      - leapmux-desktop
      - leapmux-desktop-service-*
      - leapmux-desktop*.deb
      - leapmux-desktop*.AppImage
    cmds:
      # build-backend is not implied by build-desktop-linux on its own (only by
      # the top-level `task build`), but tauri.linux.conf.json's `deb.files`
      # references ../../leapmux, so the CLI must exist before tauri build.
      - task: build-backend
      - task: prepare-desktop
      - task: build-desktop-sidecar
      - desktop/rust/scripts/patch-linuxdeploy.sh
      - cd desktop/rust && ../../frontend/node_modules/.bin/tauri build --config '{"version":"{{.VERSION}}"}'
      # Relocate the AppImage's app binary to /usr/lib/leapmux-desktop/ for
      # layout parity with the .deb: the binary and the sidecar then live
      # together under /usr/lib/, and nothing named leapmux-desktop sits on the
      # launcher PATH. Tauri's AppImage bundler reuses the deb data tree, so the
      # binary starts at usr/bin/leapmux-desktop; move it beside the sidecar,
      # which is already in usr/lib/leapmux-desktop/ via the resources glob.
      #
      # linuxdeploy's AppRun resolves the desktop Exec by searching a fixed PATH
      # (usr/bin, usr/sbin, ...) that excludes usr/lib, and an absolute Exec is
      # execvp'd as a literal host path (the bug that broke launch before). So
      # instead of leaving a usr/bin symlink, prepend usr/lib/leapmux-desktop to
      # PATH inside the AppRun script: AppRun.wrapped appends the inherited PATH,
      # so the shared template's bare `Exec=leapmux-desktop` resolves to the
      # relocated binary, and /proc/self/exe reports the real usr/lib path so the
      # Go sidecar resolves "next to exe" exactly like the deb. Then repack the
      # AppDir with the linuxdeploy appimage plugin Tauri already cached,
      # overwriting Tauri's AppImage (which still had the binary in usr/bin).
      #
      # The greps are tripwires: they fail the build loudly if a future
      # linuxdeploy changes the AppRun exec line (so the PATH injection would
      # silently no-op) or if the shared template stops emitting the bare Exec.
      - |
        set -euo pipefail
        appdir="desktop/rust/target/release/bundle/appimage/leapmux-desktop.AppDir"
        src="$(ls desktop/rust/target/release/bundle/appimage/leapmux-desktop_*.AppImage)"
        # Publish the AppImage under its conventional `uname -m` architecture
        # (x86_64 / aarch64) -- the names appimagetool's ARCH env var and
        # linuxdeploy's own release assets use. Tauri's AppImage bundler
        # instead emits Debian's `amd64` for x86_64 while keeping GNU's
        # `aarch64` for ARM, so the x86 build is the lone Debian-styled
        # outlier; repack under the uname name so both arches are
        # consistently GNU-named. (The .deb stays amd64/arm64 -- that is
        # dpkg's own convention.) On arm64 this is a no-op: Tauri already
        # named it aarch64, which equals `uname -m`.
        img="${src%_*.AppImage}_$(uname -m).AppImage"
        grep -q '^Exec=leapmux-desktop$' "$appdir"/*.desktop
        grep -q '^exec "$this_dir"/AppRun.wrapped' "$appdir/AppRun"
        mv "$appdir/usr/bin/leapmux-desktop" "$appdir/usr/lib/leapmux-desktop/leapmux-desktop"
        sed -i 's|^exec "$this_dir"/AppRun\.wrapped|export PATH="$this_dir/usr/lib/leapmux-desktop:$PATH"  # leapmux: app binary relocated under usr/lib for .deb parity\nexec "$this_dir"/AppRun.wrapped|' "$appdir/AppRun"
        test -x "$appdir/usr/lib/leapmux-desktop/leapmux-desktop"
        test ! -e "$appdir/usr/bin/leapmux-desktop"
        grep -q 'usr/lib/leapmux-desktop:\$PATH' "$appdir/AppRun"
        plugin="${HOME}/.cache/tauri/linuxdeploy-plugin-appimage.AppImage"
        test -x "$plugin"
        # Drop Tauri's original (Debian-named on x86); repack to the uname name.
        rm -f "$src"
        ( cd "$(dirname "$img")" && ARCH="$(uname -m)" NO_APPSTREAM=1 APPIMAGE_EXTRACT_AND_RUN=1 OUTPUT="$(basename "$img")" "$plugin" --appdir leapmux-desktop.AppDir )
        test -f "$img"
      - cp -f desktop/rust/target/release/leapmux-desktop .
      - cp -f desktop/go/bin/leapmux-desktop-service-* .
      - cp -f desktop/rust/target/release/bundle/deb/leapmux-desktop*.deb .
      - cp -f desktop/rust/target/release/bundle/appimage/leapmux-desktop*.AppImage .
      # Tauri's deb bundler hardcodes /usr/bin/<mainBinaryName> for the app
      # binary; there's no config knob to relocate it. Post-process the .deb
      # so `leapmux-desktop` lands under /usr/lib/ (off PATH) while
      # /usr/bin/leapmux (added via deb.files) stays as the only CLI on PATH.
      # The .desktop Exec must follow the binary, so rewrite the template's
      # bare `Exec=leapmux-desktop` to the absolute relocated path — under
      # /usr/lib/ the bare name would no longer resolve for the system launcher.
      # (The AppImage reaches the same /usr/lib layout differently — via a
      # PATH-injected AppRun — because its Exec is resolved by linuxdeploy, not
      # the system launcher; see the AppImage step above.) dpkg-deb -R/-b is
      # round-tripped by Debian itself — md5sums regenerate automatically. The
      # grep -q is a tripwire: if the sed ever stops matching (e.g. the
      # template's Exec changes), the rewrite silently no-ops and we want a loud
      # failure rather than a .desktop pointing off PATH.
      - |
        set -euo pipefail
        for deb in leapmux-desktop_*.deb; do
          work="$(mktemp -d)"
          dpkg-deb -R "$deb" "$work"
          mkdir -p "$work/usr/lib/leapmux-desktop"
          mv "$work/usr/bin/leapmux-desktop" "$work/usr/lib/leapmux-desktop/leapmux-desktop"
          sed -i 's#^Exec=leapmux-desktop$#Exec=/usr/lib/leapmux-desktop/leapmux-desktop#' \
            "$work/usr/share/applications/"*.desktop
          grep -q '^Exec=/usr/lib/leapmux-desktop/leapmux-desktop$' \
            "$work/usr/share/applications/"*.desktop
          dpkg-deb -b "$work" "$deb"
          rm -rf "$work"
        done
      # Read the icons back out of the repacked .deb. tauri-bundler derives each
      # destination from the PNG header and the `@2x` suffix, so a size that no
      # icon theme declares installs without an error and leaves the app with no
      # icon anywhere -- the failure that shipped as issue #387.
      - bun desktop/rust/scripts/verify-deb-icons.mjs leapmux-desktop_*.deb

  build-desktop-windows:
    desc: Build desktop for Windows
    sources:
      - backend/go.mod
      - backend/go.sum
      - backend/**/*.go
      - desktop/go/go.mod
      - desktop/go/go.sum
      - desktop/go/**/*.go
      - exclude: desktop/go/bin/**/*
      - desktop/rust/*.rs
      - desktop/rust/src/**/*
      - desktop/rust/Cargo.*
      - desktop/rust/capabilities/**/*
      - desktop/rust/tauri.conf.json
      - desktop/rust/tauri.windows.conf.json
      - desktop/rust/windows/**/*
      - desktop/rust/icons/*
      - desktop/rust/scripts/**/*
      - frontend/.output/**/*
      - backend/internal/hub/generated/frontend/public/**/*
      - leapmux.exe
    generates:
      - LeapMuxDesktop*.msi
      - leapmux-desktop-service-*.exe
    cmds:
      # build-backend isn't implied by build-desktop-windows on its own; only
      # the top-level `task build` calls it first. Our custom main.wxs
      # template (desktop/rust/windows/main.wxs) references
      # $(env.TAURI_LEAPMUX_CLI_PATH) and $(env.TAURI_LEAPMUX_SIDECAR_PATH),
      # which we point at the CLI and Go sidecar built right here.
      - task: build-backend
      - task: prepare-desktop
      - task: build-desktop-sidecar
      # TAURI_LEAPMUX_CLI_PATH and TAURI_LEAPMUX_SIDECAR_PATH are consumed
      # by desktop/rust/windows/main.wxs via WiX's $(env.NAME)
      # preprocessor. The TAURI_ prefix is load-bearing: tauri-bundler's
      # clear_env_for_wix() wipes the candle.exe environment and only
      # restores SYSTEMROOT/TMP/TEMP plus variables whose uppercased name
      # starts with "TAURI", so a plain LEAPMUX_CLI_PATH would be invisible
      # to candle and the preprocessor would fail.
      # The sidecar path is hardcoded to the x86_64-pc-windows-msvc binary
      # name because Windows CI only ever builds amd64. If we add a second
      # Windows arch later, this needs to switch on {{ARCH}} the way
      # build-desktop-sidecar does.
      # --bundles msi drops Tauri's default NSIS .exe — we ship MSI only
      # because only WiX exposes the `<Environment>` machinery we use for
      # the scoped HKCU PATH append.
      # --verbose makes tauri-bundler log candle/light stdout+stderr at
      # debug level. Without it, both compilers' output is captured but
      # discarded and you only see "failed to run candle.exe" / "failed
      # to run light.exe" with no detail — a particularly painful
      # debugging experience for WiX since the toolset's error messages
      # are usually precise.
      - |
        export TAURI_LEAPMUX_CLI_PATH="$(pwd)/leapmux.exe"
        export TAURI_LEAPMUX_SIDECAR_PATH="$(pwd)/desktop/go/bin/leapmux-desktop-service-x86_64-pc-windows-msvc.exe"
        cd desktop/rust && ../../frontend/node_modules/.bin/tauri build \
          --verbose \
          --bundles msi \
          --config '{"version":"{{.VERSION | replace "-dev" ""}}"}'
      - cp -f desktop/go/bin/leapmux-desktop-service-*.exe .
      # Tauri's WiX bundler names the installer after productName ("LeapMux
      # Desktop" — with a space) regardless of mainBinaryName, and appends
      # "_en-US" before the extension. Strip both for the published filename.
      # Tauri also embeds whatever version we passed to `tauri build` —
      # {{.VERSION}} with "-dev" stripped, since WiX's ProductVersion rejects
      # semver prerelease tags — so we re-insert the full {{.VERSION}} in the
      # output filename to match the .deb/.dmg artifacts. The MSI's internal
      # ProductVersion stays at the stripped form; that's a Windows Installer
      # limitation we can't work around, but the filename is what users
      # download. We cd into the bundle dir first so the glob expands to bare
      # filenames: on Windows, mvdan/sh expands globs with directory segments
      # to native backslash paths and `${##*/}` then varies with the parent
      # shell (bash vs PowerShell).
      - |
        repo_root="$(pwd)"
        cd desktop/rust/target/release/bundle/msi
        for src in LeapMux*_en-US.msi; do
          [ -e "$src" ] || continue
          dest="${src// /}"
          dest="${dest/_en-US/}"
          dest="${dest/_{{.VERSION | replace "-dev" ""}}_/_{{.VERSION}}_}"
          cp -f "$src" "$repo_root/$dest"
        done

  run-desktop:
    desc: Build and run the desktop app
    preconditions:
      - sh: '[ "{{OS}}" = "darwin" ] || [ "{{OS}}" = "linux" ] || [ "{{OS}}" = "windows" ]'
        msg: "Unsupported OS: {{OS}}. Desktop runs require macOS, Linux, or Windows."
    cmds:
      - task: build-desktop
      - cmd: '"./LeapMux Desktop.app/Contents/MacOS/LeapMux Desktop" {{.CLI_ARGS}}'
        if: '[ "{{OS}}" = "darwin" ]'
      - cmd: ./leapmux-desktop {{.CLI_ARGS}}
        if: '[ "{{OS}}" = "linux" ]'
      - cmd: ./desktop/rust/target/release/LeapMuxDesktop.exe {{.CLI_ARGS}}
        if: '[ "{{OS}}" = "windows" ]'

  # --- Testing ---

  test:
    desc: Run all tests
    cmds:
      # validate-json first: CI has no standalone lint job, so this is what
      # puts schema validation on every test runner (all three OSes).
      - task: validate-json
      - task: test-scripts
      - task: test-frontend
      - task: test-backend
      - task: test-desktop

  test-scripts:
    desc: Test repository scripts
    # `bun test` rather than vitest: these are build scripts outside frontend/
    # and its vitest project (whose root is frontend/ and whose co-location rule
    # covers frontend/src only). desktop/rust/scripts/ holds the desktop build's
    # own Bun scripts and joins them here for the same reason.
    #
    # Deliberately NOT fingerprinted. The suites read beyond their own *.mjs --
    # versions.env, scripts/license-overrides/spdx/ through the real vendored
    # path, and the Tauri configs next to desktop/rust/scripts/ -- so a
    # `sources:` list narrow enough to be worth having would go stale and skip
    # the run that mattered. It takes ~40 ms.
    cmds:
      - bun test scripts/ desktop/rust/scripts/

  test-frontend:
    desc: Run frontend tests
    cmds:
      - task: prepare-frontend
      - task: lint-frontend
      - cd frontend && bun run test {{.CLI_ARGS}}

  test-backend:
    desc: Run backend tests
    cmds:
      - task: prepare-backend
      - task: lint-backend
      - cd backend && go tool gotestsum --format pkgname-and-test-fails -- -tags integration {{.CLI_ARGS | default "./..."}}

  test-backend-race:
    desc: Run backend tests under the race detector (defaults to the CRDT + hub service packages)
    cmds:
      - task: prepare-backend
      # The CRDT manager's whole concurrency story -- published generations that
      # readers walk lock-free, a fallback baseline built off the manager
      # goroutine, a compaction that prunes a private clone -- is only ASSERTED
      # by the detector. TestFallbackBaselineRacesCompaction in particular
      # exists to fail when an in-place prune is reinstated, and without -race
      # it passes no matter what, so a suite that never runs this target is a
      # suite where that test proves nothing.
      - cd backend && go tool gotestsum --format pkgname-and-test-fails -- -race -count=1 {{.CLI_ARGS | default "./internal/hub/crdt/... ./internal/hub/service/..."}}

  test-backend-no-docker:
    desc: Run backend tests, excluding Docker-backed storage backends
    cmds:
      - task: prepare-backend
      - task: lint-backend
      - cd backend && go tool gotestsum --format pkgname-and-test-fails -- -tags integration $(go list -tags integration ./... | grep -vE 'internal/hub/store/(cockroachdb|mysql|postgres|tidb|yugabytedb)(/|$)')

  test-desktop:
    desc: Run desktop tests
    cmds:
      - task: prepare-desktop
      - task: lint-desktop
      - cd desktop/go && go tool gotestsum --format pkgname-and-test-fails -- -tags integration {{.CLI_ARGS | default "./..."}}
      - cd desktop/rust && cargo test

  test-no-docker:
    desc: Run all tests except Docker-backed storage backends
    cmds:
      # Docker is the only thing this target drops. test-scripts needs none,
      # and leaving it out meant three of the four CI test jobs never ran it.
      # validate-json first, for the same reason as `test` above.
      - task: validate-json
      - task: test-scripts
      - task: test-frontend
      - task: test-backend-no-docker
      - task: test-desktop

  test-e2e:
    desc: Run end-to-end tests
    cmds:
      - task: prepare-frontend
      - task: lint-frontend
      - cd frontend && bun run test:e2e {{.CLI_ARGS}}

  bench-backend:
    desc: Run backend benchmarks (defaults to the CRDT package)
    cmds:
      - task: prepare-backend
      - cd backend && go test -run '^$' -bench . -benchmem {{.CLI_ARGS | default "./internal/hub/crdt/"}}

  # --- Linting ---

  lint:
    desc: Run all linters
    cmds:
      - task: lint-versions
      - task: lint-scripts
      - task: validate-json
      - task: lint-proto
      - task: lint-frontend
      - task: lint-backend
      - task: lint-desktop

  validate-json:
    desc: Validate every project-written JSON file against its schema
    # The no-schemaless-JSON rule: any JSON an include pattern in
    # scripts/validate-json.mjs matches must resolve to a schema (a sibling
    # <name>.schema.json, or a shared one named on the rule) and conform to
    # it. Covers contracts/, testdata/ fixtures, the vendored syntax themes,
    # and the license-override metadata; tool-owned JSON (package.json,
    # tsconfig, tauri configs, lockfiles) stays out on purpose.
    deps: [install-frontend-deps] # ajv lives in frontend/node_modules
    sources:
      - contracts/**/*
      - testdata/**/*
      - backend/**/testdata/**/*
      - frontend/src/lib/syntaxThemes/**/*
      - scripts/license-overrides/**/*
      - scripts/validate-json.mjs
    cmds:
      - bun scripts/validate-json.mjs

  lint-scripts:
    desc: Lint the repository build scripts
    # These were unlinted until now: the only eslint config lives in frontend/,
    # and `eslint .` runs with cwd=frontend, so scripts/ came back as "outside
    # of base path". eslint.config.mjs at the root fixes that, resolving the
    # shared @antfu config out of frontend/node_modules rather than duplicating
    # the toolchain in a root package.json the repo does not otherwise need.
    deps: [install-frontend-deps]
    sources:
      - scripts/*.mjs
      - desktop/rust/scripts/*.mjs
      - eslint.config.mjs
      - frontend/eslint.config.ts
    cmds:
      - ./frontend/node_modules/.bin/eslint scripts/ desktop/rust/scripts/

  lint-versions:
    desc: Check documented tool versions against versions.env
    sources:
      - versions.env
      - scripts/sync-versions.mjs
      - README.md
      - site/content/docs/getting-started/installation.md
      - go.work
      - backend/go.mod
      - desktop/go/go.mod
      - site/go.mod
    cmds:
      - bun scripts/sync-versions.mjs --check

  lint-proto:
    desc: Lint Protocol Buffer definitions
    sources:
      - proto/**/*.proto
      - buf.yaml
    cmds:
      - buf lint

  lint-frontend:
    desc: Lint frontend code
    deps: [prepare-frontend]
    sources:
      - frontend/package.json
      - frontend/bun.lock
      - frontend/*config*
      - frontend/scripts/**/*
      - frontend/src/**/*
      - frontend/tests/**/*
      - frontend/patches/**/*
      - frontend/public/**/*
    cmds:
      - cd frontend && bun run typecheck
      - cd frontend && bun run lint .

  lint-backend:
    desc: Lint Go code
    deps: [prepare-backend]
    sources:
      - .golangci.yml
      - backend/go.mod
      - backend/go.sum
      - backend/**/*.go
    cmds:
      - cd backend && go tool golangci-lint run ./...
      # golangci-lint only sees the HOST build configuration, so a file behind
      # `//go:build unix` (38 files under backend/, 20 of them _test.go) is
      # invisible to it on every other platform -- and an untagged file that
      # references a symbol defined only in one typechecks fine here and fails
      # the Windows CI job minutes later. `go vet` is the check that catches
      # it; `go build` does NOT, because it skips _test.go files.
      - cd backend && GOOS=windows go vet -tags integration ./...
      - cd backend && GOOS=linux go vet -tags integration ./...
      - cd backend && GOOS=darwin go vet -tags integration ./...

  lint-desktop:
    desc: Lint desktop sidecar and Tauri shell code
    sources:
      - .golangci.yml
      - desktop/go.mod
      - desktop/go.sum
      - desktop/**/*.go
      - exclude: desktop/go/bin/**/*
      - desktop/rust/Cargo.toml
      - desktop/rust/Cargo.lock
      - desktop/rust/*.rs
      - desktop/rust/src/**/*.rs
      - exclude: desktop/rust/target/**/*
    cmds:
      - task: prepare-desktop
      - task: build-desktop-sidecar
      - cd desktop/go && go tool golangci-lint run ./...
      # Same blind spot as lint-backend: desktop/go carries 10 OS-tagged files,
      # including _test.go ones. See the comment there.
      - cd desktop/go && GOOS=windows go vet -tags integration ./...
      - cd desktop/go && GOOS=linux go vet -tags integration ./...
      - cd desktop/go && GOOS=darwin go vet -tags integration ./...
      - cd desktop/rust && cargo clippy --all-targets -- -D warnings

  lint-fix:
    desc: Auto-fix lint violations
    cmds:
      - task: lint-fix-frontend
      - task: lint-fix-backend
      - task: lint-fix-desktop

  lint-fix-frontend:
    desc: Auto-fix frontend lint violations
    cmds:
      - task: prepare-frontend
      - cd frontend && bun run lint . --fix

  lint-fix-backend:
    desc: Auto-fix backend lint violations
    cmds:
      - task: prepare-backend
      - cd backend && go tool golangci-lint run --fix ./...

  lint-fix-desktop:
    desc: Auto-fix desktop lint violations
    cmds:
      - task: prepare-desktop
      - cd desktop/go && go tool golangci-lint run --fix ./...
      - cd desktop/rust && cargo clippy --fix --all-targets

  # --- Development ---

  dev:
    desc: Start all services for development
    cmds:
      - task: generate
      - task: build-backend
      - mprocs

  dev-solo:
    desc: Start solo mode for development
    cmds:
      - task: generate
      - task: build-backend
      - mprocs --config mprocs-solo.yaml

  dev-desktop:
    desc: Start desktop app for development
    cmds:
      - task: generate
      - task: build-backend
      - task: prepare-desktop
      - task: build-desktop-sidecar
      - mprocs --config mprocs-desktop.yaml

  dev-site:
    desc: Start the documentation site dev server with live reload (http://localhost:1313)
    cmds:
      # Live-reloading Hugo server via the go tool dependency (see site/go.mod).
      # GOWORK=off isolates the site module from the root go.work, and hugo
      # server overrides baseURL with the local address so links work locally.
      - cd site && GOWORK=off go tool hugo server --buildDrafts

  build-desktop-sidecar:
    desc: Build desktop sidecar binary
    sources:
      - backend/go.mod
      - backend/go.sum
      - backend/**/*.go
      - desktop/go/go.mod
      - desktop/go/go.sum
      - desktop/go/**/*.go
      - exclude: desktop/go/bin/**/*
    generates:
      - desktop/go/bin/leapmux-desktop-service-*
    cmds:
      - mkdir -p desktop/go/bin
      - |
        TARGET="{{if eq OS "darwin"}}{{if eq ARCH "arm64"}}aarch64{{else}}x86_64{{end}}-apple-darwin{{else if eq OS "linux"}}{{if eq ARCH "arm64"}}aarch64{{else}}x86_64{{end}}-unknown-linux-gnu{{else}}x86_64-pc-windows-msvc{{end}}"
        BIN="./bin/leapmux-desktop-service-${TARGET}{{if eq OS "windows"}}.exe{{end}}"
        # -H=windowsgui links the sidecar for the Windows GUI subsystem so
        # spawning it from the Tauri shell doesn't pop up a console window.
        # -buildmode=pie on Linux produces a shared-object-style ELF whose
        # layout patchelf (run by linuxdeploy against every ELF in the
        # AppDir) can rewrite without corruption. Non-PIE Go binaries get
        # subtly mangled on aarch64 — the .note.go.buildid section gets
        # dropped and ldd then exits 1 silently, which linuxdeploy treats
        # as a hard failure ("Failed to run ldd: exited with code 1").
        cd desktop/go && go build {{if eq OS "linux"}}-buildmode=pie {{end}}-ldflags "{{.VERSION_LDFLAGS}}{{if eq OS "windows"}} -H=windowsgui{{end}}" -o "${BIN}" .

  # --- Docker ---

  docker-build:
    desc: Build all Docker images
    cmds:
      - task: docker-build-alpine
      - task: docker-build-ubuntu

  docker-build-alpine:
    desc: Build Alpine Docker image
    vars:
      PLATFORM: '{{.PLATFORM | default "linux/amd64,linux/arm64"}}'
      TAG: '{{.TAG | default "leapmux:latest"}}'
    cmds:
      - >-
        docker buildx build
        --platform {{.PLATFORM}}
        --build-arg BASE_IMAGE={{.ALPINE_IMAGE}}
        --build-arg BUF_VERSION={{.BUF_VERSION}}
        --build-arg TASK_VERSION={{.TASK_VERSION}}
        --build-arg S6_OVERLAY_VERSION={{.S6_OVERLAY_VERSION}}
        --build-arg BUN_VERSION={{.BUN_VERSION}}
        --build-arg NODE_VERSION={{.NODE_VERSION}}
        --build-arg GOLANG_VERSION={{.GOLANG_VERSION}}
        --build-arg VERSION={{.VERSION}}
        --build-arg COMMIT_HASH={{.COMMIT_HASH}}
        --build-arg COMMIT_TIME={{.COMMIT_TIME}}
        -f docker/Dockerfile
        -t {{.TAG}}
        .

  docker-build-ubuntu:
    desc: Build Ubuntu Docker image
    vars:
      PLATFORM: '{{.PLATFORM | default "linux/amd64,linux/arm64"}}'
      TAG: '{{.TAG | default "leapmux:ubuntu"}}'
    cmds:
      - >-
        docker buildx build
        --platform {{.PLATFORM}}
        --build-arg BASE_IMAGE={{.UBUNTU_IMAGE}}
        --build-arg BUF_VERSION={{.BUF_VERSION}}
        --build-arg TASK_VERSION={{.TASK_VERSION}}
        --build-arg S6_OVERLAY_VERSION={{.S6_OVERLAY_VERSION}}
        --build-arg BUN_VERSION={{.BUN_VERSION}}
        --build-arg NODE_VERSION={{.NODE_VERSION}}
        --build-arg GOLANG_VERSION={{.GOLANG_VERSION}}
        --build-arg VERSION={{.VERSION}}
        --build-arg COMMIT_HASH={{.COMMIT_HASH}}
        --build-arg COMMIT_TIME={{.COMMIT_TIME}}
        -f docker/Dockerfile
        -t {{.TAG}}
        .

  # --- Notice ---

  generate-notice:
    desc: Generate third-party license notice
    # prepare-backend, not just prepare-frontend: collectGoDeps runs
    # `go list -deps -test ./...`, which has to LOAD every package in the
    # module, and two generated trees it needs are gitignored -- the sqlc
    # output under internal/hub/store/*/generated/ and the embed package under
    # internal/hub/generated/frontend/, whose //go:embed of public/ fails when
    # the directory is absent. In a tree that has built before, both are
    # already there and this looks redundant; in a clean checkout the run dies
    # with "no required module provides package .../generated/db".
    #
    # prepare-backend pulls in a frontend build, which is why the NOTICE gate
    # is worth its path filter: this is not a check to run on every push.
    deps: [prepare-backend]
    sources:
      - scripts/generate-notice.mjs
      - scripts/license-overrides/**/*
      # go.work decides which modules the generator walks: it reads the
      # `use (...)` list and runs `go list -m -json all` workspace-wide, so
      # adding or dropping a member changes the licenses NOTICE describes.
      - go.work
      - go.work.sum
      - backend/go.mod
      - backend/go.sum
      - desktop/go/go.mod
      - desktop/go/go.sum
      - desktop/rust/Cargo.toml
      - desktop/rust/Cargo.lock
      - frontend/package.json
      - frontend/bun.lock
    generates:
      - NOTICE.md
      - NOTICE.html
    cmds:
      - bun scripts/generate-notice.mjs

  # --- Documentation site ---

  site:
    desc: Generate the static documentation web site (Hugo + Hextra)
    sources:
      - site/hugo.yaml
      - site/go.mod
      - site/content/**/*
      - site/static/**/*
      - site/layouts/**/*
      - site/assets/**/*
      - site/i18n/**/*
    generates:
      - site/public/**/*
    cmds:
      # Hugo ships as a Go tool dependency (see site/go.mod) and is invoked via
      # `go tool hugo` -- the same pattern as `go tool sqlc`. GOWORK=off keeps
      # the site module's large dependency graph out of the root go.work.
      # --cleanDestinationDir wipes public/ so old fingerprinted assets (whose
      # hashed filenames change on every edit) don't accumulate as orphans.
      - cd site && GOWORK=off go tool hugo --gc --minify --cleanDestinationDir

  # --- Clean ---

  clean:
    desc: Remove all build artifacts
    cmds:
      - task: clean-desktop
      - task: clean-backend
      - task: clean-frontend
      - rm -f *.log */*.log
      - rm -rf .task/

  clean-frontend:
    desc: Remove frontend build artifacts
    cmds:
      - rm -rf frontend/.output/
      - rm -rf frontend/.vinxi/
      - rm -f  frontend/public/NOTICE.html
      - rm -rf frontend/public/icons/
      - rm -rf frontend/src/spinners/
      - rm -rf frontend/node_modules/
      - rm -rf frontend/generated/
      - rm -rf frontend/*/generated/
      - rm -rf frontend/*/*/generated/
      - rm -rf frontend/*/*/*/generated/
      - rm -rf frontend/*/*/*/*/generated/

  clean-backend:
    desc: Remove backend build artifacts
    cmds:
      - rm -f  leapmux leapmux.exe
      - rm -f  backend/leapmux backend/leapmux.exe
      - rm -rf backend/generated/
      - rm -rf backend/*/generated/
      - rm -rf backend/*/*/generated/
      - rm -rf backend/*/*/*/generated/
      - rm -rf backend/*/*/*/*/generated/

  clean-desktop:
    desc: Remove desktop build artifacts
    cmds:
      - rm -f  LeapMux*.dmg
      - rm -rf LeapMux*.app
      - rm -f  leapmux-desktop
      - rm -f  leapmux-desktop-service-*
      - rm -f  leapmux-desktop*.deb
      - rm -f  leapmux-desktop*.AppImage
      - rm -f  LeapMux*.msi
      - rm -f  desktop/go/leapmux-desktop desktop/go/leapmux-desktop.exe
      - rm -rf desktop/go/bin/
      - rm -rf desktop/rust/gen/
      - rm -rf desktop/rust/icons/
      - rm -rf desktop/rust/src/generated/
      - rm -rf desktop/rust/target/
